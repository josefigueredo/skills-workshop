name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the episode scripts
        run: python3 build.py validate
      - name: Check that the committed dist is up to date
        run: python3 -m unittest tests.test_bundle
