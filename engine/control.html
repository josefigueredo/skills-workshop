<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control del taller</title>
<!-- Template: build inlines tokens.css + screens.css at CSS (for the mini preview), every
     episode as <script type="application/json" id="episodes">[…]</script> at EPISODES,
     and nav.js, render.js, animate.js, control.js at JS. No external references. -->
<!--CSS-->
<style>
  html, body { margin: 0; background: #0f1014; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif; color: #e8e8ee; }
  [hidden] { display: none !important; }
  .top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-size: 13px; }
  .top h1 { font-size: 14px; margin: 0; font-weight: 600; flex: 1; }
  .btn { font: inherit; color: #e8e8ee; background: #23242c; border: 1px solid #33343e; border-radius: 9px; padding: 7px 12px; cursor: pointer; }
  .btn.primary { background: #2d6cdf; border-color: #2d6cdf; font-weight: 700; color: #fff; }
  .banner { margin: 0 16px 10px; padding: 10px 14px; border-radius: 9px; background: #4a2a12; border: 1px solid #a8641f; display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .banner span { flex: 1; font-weight: 600; }
  .ctl { background: #16171c; border-radius: 12px; margin: 0 16px 16px; padding: 16px; display: grid; grid-template-columns: 240px 1fr 280px; gap: 14px; font-size: 12px; }
  .ctl .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .ctl .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #8b8b98; }
  .ctl .ch { padding: 6px 8px; border-radius: 7px; color: #b9b9c6; display: flex; justify-content: space-between; gap: 6px; cursor: pointer; }
  .ctl .ch.done { color: #6f6f7c; }
  .ctl .ch.on { background: #2d6cdf; color: #fff; }
  .ctl .ch small { opacity: .7; white-space: nowrap; }
  .ctl .stp { padding: 3px 8px 3px 22px; color: #8b8b98; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctl .stp.on { color: #fff; }
  .ctl .stp.on:before { content: "▶ "; margin-left: -12px; color: #7ee787; }
  .ctl .stage { border: 1px solid #2c2d35; border-radius: 9px; overflow: hidden; }
  .ctl .stage .t { font-size: 10px; color: #8b8b98; padding: 5px 8px; background: #1d1e24; display: flex; justify-content: space-between; }
  .ctl .stage .live { color: #ff6b6b; }
  .ctl .stage .off { color: #8b8b98; }
  /* mini preview: the real 1600x900 render, scaled down by control.js */
  .ctl .mini { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .ctl #mini-canvas { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; pointer-events: none; }
  .ctl .mini-black { position: absolute; inset: 0; background: rgba(0, 0, 0, .85); color: #8b8b98; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .ctl .next { min-height: 56px; border-radius: 7px; background: linear-gradient(135deg, #2d6cdf, #7a4fe0); display: flex; align-items: center; padding: 0 12px; font-weight: 700; font-size: 13px; }
  .ctl .btns { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
  .ctl .b { font: inherit; color: #e8e8ee; background: #23242c; border: 1px solid #33343e; border-radius: 9px; padding: 9px 12px; text-align: center; min-width: 64px; cursor: pointer; }
  .ctl .b.big { background: #2d6cdf; border-color: #2d6cdf; min-width: 90px; font-weight: 700; }
  .ctl .b.big.on { background: #1f8f4e; border-color: #1f8f4e; }
  .ctl .b kbd { display: block; font: 10px Menlo, monospace; color: #8b8b98; margin-top: 3px; }
  .ctl .b.big kbd { color: #cfe0ff; }
  .ctl .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #8b8b98; font-size: 11px; flex-wrap: wrap; }
  .ctl .meta select, .ctl .jump select { font: inherit; color: #e8e8ee; background: #23242c; border: 1px solid #33343e; border-radius: 6px; padding: 2px 4px; }
  .ctl .meta .b { min-width: 0; padding: 4px 8px; }
  .ctl .meta .b.on { background: #000; border-color: #ff6b6b; color: #ff6b6b; }
  .ctl .jump { display: flex; flex-direction: column; gap: 6px; }
  .ctl .jump select { width: 100%; }
  .ctl .notes { background: #1d1e24; border-radius: 9px; padding: 10px; line-height: 1.55; color: #d9d9e2; white-space: pre-wrap; }
  .ctl .src { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: #8b8b98; font-size: 11px; }
  .ctl .pill { display: inline-block; background: #23242c; border: 1px solid #33343e; border-radius: 99px; padding: 2px 8px; font-size: 10.5px; }
  .ctl .pill.src-real { border-color: #1f8f4e; color: #7ee787; }
  .ctl .pill.src-inferido { border-color: #a8641f; color: #f0b072; }
  .ctl .q { background: #1d1e24; border-radius: 9px; padding: 10px; color: #b9b9c6; line-height: 1.5; }
  .ctl .q b { color: #e8e8ee; font-weight: 600; }
</style>
</head>
<body>
<div id="ws-control">
  <div class="top">
    <h1>Control del taller · esta ventana no se comparte</h1>
    <span id="estimate"></span>
    <button class="btn primary" id="open-stage" type="button">Abrir escenario</button>
  </div>
  <div class="banner" id="banner" hidden>
    <span id="banner-text"></span>
    <button class="btn primary" id="reopen-stage" type="button" hidden>Reabrir</button>
  </div>

  <div class="ctl">
    <div class="col">
      <div class="lbl" id="episode-label"></div>
      <div id="chapters"></div>
      <div class="lbl" style="margin-top:6px">Saltar a</div>
      <div class="jump">
        <select id="episode-select" aria-label="Episodio"></select>
        <select id="chapter-select" aria-label="Capítulo"></select>
      </div>
    </div>

    <div class="col">
      <div class="stage">
        <div class="t"><span>Escenario · lo que ve la gente</span><span id="live" class="off"></span></div>
        <div class="mini" id="mini">
          <div id="mini-canvas"></div>
          <div class="mini-black" id="mini-black" hidden>Pantalla en negro</div>
        </div>
      </div>
      <div class="lbl">Lo que viene</div>
      <div class="next" id="next"></div>
      <div class="btns">
        <button class="b" type="button" data-key="ArrowLeft" data-shift>⏮<kbd>⇧ ←</kbd>capítulo</button>
        <button class="b" type="button" data-key="ArrowLeft">◀<kbd>←</kbd>atrás 1</button>
        <button class="b big" type="button" id="play" data-key=" ">⏯<kbd>espacio</kbd>play / pausa</button>
        <button class="b" type="button" data-key="ArrowRight">▶<kbd>→</kbd>adelante 1</button>
        <button class="b" type="button" data-key="ArrowRight" data-shift>⏭<kbd>⇧ →</kbd>capítulo</button>
      </div>
      <div class="meta">
        <label>Velocidad del tipeo:
          <select id="speed-select">
            <option value="0.5">0.5×</option>
            <option value="1">1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <span id="clock"></span>
        <button class="b" type="button" id="blackout" data-key="b">B: pantalla en negro</button>
      </div>
    </div>

    <div class="col">
      <div class="lbl">Notas para decir (no se ven)</div>
      <div class="notes" id="notes-text"></div>
      <div class="src"><span>Fuente:</span><span class="pill" id="notes-source"></span><span id="notes-skill"></span></div>
      <div class="lbl">Preguntas que suelen salir</div>
      <div id="faq" class="col"></div>
    </div>
  </div>
</div>
<!--EPISODES-->
<!--JS-->
</body>
</html>
