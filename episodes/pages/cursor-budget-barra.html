<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Cursor — barra de estado</title><style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fbfbfc;color:#1f1f1f;
 font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100%}
.editor{flex:1;display:flex}
.side{width:240px;background:#f3f3f5;border-right:1px solid #e3e3e6;padding:16px 14px;color:#4b4b52;font-size:13px;line-height:2}
.code{flex:1;padding:22px 30px;font:13px/1.8 Menlo,monospace;color:#6b6b72}
.code b{color:#7a3fbf;font-weight:400}.code i{color:#2f6fb3;font-style:normal}
.legend{position:absolute;right:36px;bottom:70px;width:470px;background:#fff;border:1px solid #e3e3e6;border-radius:10px;padding:14px 16px;font-size:13px;color:#4b4b52;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.legend div{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.status{height:28px;background:#f0f0f2;border-top:1px solid #dcdce0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12.5px;color:#4b4b52}
.status span{padding:2px 8px;border-radius:4px;margin-left:4px}
.item{background:#e3e3e8;color:#1d1d1f;font-weight:500}.warn{background:#f5c542;color:#2b2200}.err{background:#d64545;color:#fff}
</style></head><body><div class="app">
<div class="editor"><div class="side">mi-servicio<br>▸ api<br>▸ web<br>▸ docs<br>README.md</div>
<div class="code"><b>export</b> <b>async function</b> <i>reembolsar</i>(pedido) {<br>&nbsp;&nbsp;…<br>}</div></div>
<div class="legend"><div><span>Pasaste un aviso</span><span class="warn">∿ hoy $9.10 de $15 · ciclo $96 de $150</span></div>
<div><span>Llegaste a un bloqueo</span><span class="err">∿ hoy $15.20 de $15 · ciclo $102 de $150</span></div></div>
<div class="status"><div>⑂ main &nbsp; ⊗ 0 ⚠ 0</div><div><span>Ln 12, Col 4</span><span>TypeScript</span><span class="item" id="today">∿ hoy $0.56 de $15 · ciclo $85 de $150</span></div></div>
</div></body></html>
