#252529; margin: 16px 0 8px 0; }\n.md h2 { font-size: 17px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 18px 0 6px 0; }\n.md h3 { font-size: 15px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 14px 0 4px 0; }\n.md h4 { font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 10px 0 4px 0; }\n.md .item { margin: 0 0 3px 14px; }\n.md .item.d2 { margin-left: 28px; }\n.md .item.d3 { margin-left: 42px; }\n.md table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 6px 0 12px 0; border: 1px solid #eaeaeb;\n             border-radius: 8px; overflow: hidden; }\n.md th { background: #f0f0f2; color: #252529; font-weight: 600; text-align: left; border-bottom: 1px solid #eaeaeb; padding: 6px 10px; }\n.md td { color: #252529; border-bottom: 1px solid #eaeaeb; padding: 6px 10px; font-size: 12.5px; vertical-align: top; }\n.md tr:last-child td { border-bottom: 0; }\n.md blockquote { color: #6c6c78; border-left: 3px solid #00a06d; background: #ecfdf5; margin: 8px 0; padding: 4px 12px; border-radius: 0 6px 6px 0; }\n.md pre { background: #f0f0f2; border: 1px solid #eaeaeb; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }\n.md code { font: 12px ui-monospace, \"SF Mono\", Menlo, monospace; color: #252529; background: #f0f0f2; border-radius: 4px; padding: 0 3px; }\n.md hr { border: 0; border-top: 1px solid #d8d8de; margin: 14px 0; }\n.md a { color: #0052CC; }\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003cdiv class=\"eyebrow\"\u003eProduct Brain · pbmcp pide tu aprobación\u003c/div\u003e\n\u003ch1\u003eArrancar el workflow «Autogestión de devoluciones» y crear «Autogestión de devoluciones»\u003c/h1\u003e\n\u003cp class=\"meta\"\u003eProyecto p-devoluciones · Tipo PRD · tus cambios: +1 −1 líneas\u003c/p\u003e\n\u003csection class=\"card\"\u003e\n\u003ch2\u003eTus cambios\u003c/h2\u003e\n\u003cdiv class=\"diff\"\u003e\u003cdiv class=\"diff-line del\"\u003e- Objetivo de la primera entrega: {{pendiente}}\u003c/div\u003e\u003cdiv class=\"diff-line add\"\u003e+ Objetivo de la primera entrega: web en la 1.ª entrega, app en la 2.ª\u003c/div\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"card\"\u003e\n\u003ch2\u003eContenido\u003c/h2\u003e\n\u003cp\u003eCompletitud al escribir: 88 % · parcial: riesgos, dependencias\u003c/p\u003e\n\u003c/section\u003e\n\u003cp class=\"foot\"\u003eAprobás con un clic en Aprobar. Escape o Cancelar no escriben nada. Se cancela sola a los 100 s.\u003c/p\u003e\n\u003c/body\u003e\u003c/html\u003e"},{"type":"tool","label":"Ran · document(action=\"create\")","source":"inferido","notes":"Con tu clic, el servidor escribe. Un borrador se usa una sola vez: después deja de valer, así que reintentar no escribe dos veces."},{"type":"worked","seconds":41,"source":"inferido","notes":"El tiempo del agente, sin contar lo que tardaste vos en editar y aprobar."},{"type":"say","md":"Listo: el **PRD está escrito** y el workflow arrancó.\n\n#### Qué quedó\n- **Completitud:** **94%**; lo que pediste (web primero, app en la segunda entrega) ya está en el documento\n- **Parciales:** los **riesgos** y las **dependencias**\n- **Siguiente paso:** completar esos dos campos, y después el RFC con el mismo camino: borrador, tu «listo» y tu clic\n\n¿Completamos los riesgos y las dependencias?","source":"inferido","notes":"Cerrá con lo que queda: el documento escrito, su completitud y lo que falta de verdad. Mirá que el hueco de la web y la app ya no está: lo resolviste vos en el borrador.","pause":true}]},{"id":"otro-caso","title":"Otro caso","subtitle":"Exportar una épica a Jira, con el chequeo previo y la ventana","screen":"cursor-agent","faq":[{"q":"¿Qué hace falta para exportar?","a":"Que la integración de Atlassian esté conectada en los ajustes de integraciones de la plataforma. Eso lo hacés vos ahí, no el agente."},{"q":"¿Qué es el aviso de la ventana?","a":"Si un campo quedó como {{pendiente}}, a Jira ese texto llega literal. La ventana te dice cuántos issues lo llevarían. Avisa, no bloquea: cancelás vos y completás el campo antes."},{"q":"¿Se puede deshacer una exportación?","a":"No. La herramienta no tiene acciones para borrar ni deshacer: lo que se crea en Jira se crea de verdad. Por eso el chequeo previo y la ventana."},{"q":"¿Y si solo quiero saber cómo viene la iniciativa?","a":"Pedilo así: «¿Cómo viene la iniciativa?». Una sola lectura arma una tabla con cada documento, su completitud y lo que le falta, sin escribir nada."}],"steps":[{"type":"ask","text":"Exportá la épica «Portal de devoluciones» a Jira, proyecto PLAT.","source":"inferido","notes":"Otro pedido típico, y mucho más delicado: acá se crean issues de verdad. Fijate que no le decís cómo ni con qué."},{"type":"tool","label":"Ran · jira(action=\"status\")","source":"inferido","notes":"Primero mira que Atlassian esté conectado. Es solo lectura. Si no lo está, te manda a las integraciones y no sigue."},{"type":"tool","label":"Ran · jira(action=\"preflight\")","source":"inferido","notes":"El chequeo previo: qué le falta a la épica para exportarse bien, como componentes, prioridades o campos obligatorios. Solo lectura. Es la regla de la skill: nunca exporta sin mostrarte esto y resolverlo con vos."},{"type":"say","md":"A la épica le falta el **componente** de dos historias. Eso lo completás **vos** en el sistema (no lo edito yo): cuando lo tengas, decime y vuelvo a revisar antes de exportar.","source":"inferido","notes":"Acá el agente solo pregunta y señala el hueco; arreglarlo es una escritura sobre la épica y queda en tus manos. No exporta nada hasta que el chequeo previo salga limpio: es la regla de la skill."},{"type":"ask","text":"Ya les puse el componente.","source":"inferido","notes":"Lo resolviste vos, fuera del chat."},{"type":"tool","label":"Ran · jira(action=\"preflight\")","source":"inferido","notes":"Vuelve a correr el chequeo, y ahora no tiene huecos."},{"type":"say","md":"Sin huecos. Ahora la exportación: **se abre una ventana** con los issues que se crearían, **Cancelar** y **Aprobar**. Yo no puedo hacer ese clic.","source":"inferido","notes":"El aviso previo de siempre, antes de la escritura que crea issues de verdad.","pause":true},{"type":"tool","label":"Ran · jira(action=\"preview\")","source":"inferido","notes":"Pide la vista previa de lo que se crearía. Todavía no escribe: el export vuelve a pedir una vista fresca justo antes de abrir la ventana, para que lo que ves sea lo que se crea."},{"type":"approve","title":"Exportar a Jira","button":"Aprobar","source":"inferido","notes":"La ventana del export muestra los issues que se crearían, no un resumen. Mirá la línea de avisos: si un campo quedó pendiente, dice cuántos issues llevarían ese texto a Jira, y lo sano es cancelar y completarlo. Formato real, datos de ejemplo.","pause":true,"window":"Product Brain (pbmcp)","width":600,"height":349,"html":"\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n* { box-sizing: border-box; }\nhtml, body { margin: 0; background: #f7f7f8; }\nbody { font: 13px/1.5 -apple-system, \"SF Pro Text\", \"Helvetica Neue\", sans-serif; color: #252529; padding: 18px 20px 14px;\n        -webkit-font-smoothing: antialiased; cursor: default; }\n.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #00a06d; }\nh1 { font-size: 18px; line-height: 1.3; font-weight: 650; margin: 3px 0 4px 0; }\nh2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #6c6c78; margin: 0 0 8px 0; }\np { margin: 0 0 6px 0; }\n.card h2:not(:first-child) { margin-top: 14px; }\n.meta { color: #6c6c78; margin: 0 0 14px 0; }\n.card { background: #fff; border: 1px solid #e6e6ea; border-radius: 12px; padding: 12px 14px; margin: 0 0 10px 0;\n         box-shadow: 0 1px 2px rgba(20, 20, 30, 0.04); }\n.chip { display: inline-block; border-radius: 999px; padding: 0 8px; margin-left: 4px; font-size: 11px; line-height: 1.6;\n         vertical-align: 1px; white-space: nowrap; }\nh1 .chip { vertical-align: 3px; }\n.prio { vertical-align: -1px; margin: 0 3px; }\n.items, .sub { margin: 0; padding-left: 18px; }\n.items \u003e li { margin: 0 0 4px 0; }\n.sub { color: #6c6c78; margin-top: 2px; }\n.diff { font: 12px/1.45 ui-monospace, \"SF Mono\", Menlo, monospace; border-radius: 8px; overflow: hidden; }\n.diff-line { padding: 1px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }\n.diff-line.add { background: #ecfdf5; color: #065f46; }\n.diff-line.del { background: #fef2f2; color: #991b1b; }\n.diff-line.more { color: #6c6c78; font-style: italic; padding-top: 4px; }\n.foot { color: #6c6c78; font-size: 11.5px; margin: 12px 2px 0 2px; }\n.desc { color: #6c6c78; margin: 2px 0 8px 0; }\n.row { margin: 0 0 5px 0; }\n.task { margin: 0 0 4px 22px; }\n.key { color: #0052CC; font-weight: 600; }\n.md { background: #fff; border: 1px solid #e6e6ea; border-radius: 12px; padding: 4px 18px 12px; margin: 0 0 10px 0; }\n.md h1 { font-size: 19px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 16px 0 8px 0; }\n.md h2 { font-size: 17px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 18px 0 6px 0; }\n.md h3 { font-size: 15px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 14px 0 4px 0; }\n.md h4 { font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 10px 0 4px 0; }\n.md .item { margin: 0 0 3px 14px; }\n.md .item.d2 { margin-left: 28px; }\n.md .item.d3 { margin-left: 42px; }\n.md table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 6px 0 12px 0; border: 1px solid #eaeaeb;\n             border-radius: 8px; overflow: hidden; }\n.md th { background: #f0f0f2; color: #252529; font-weight: 600; text-align: left; border-bottom: 1px solid #eaeaeb; padding: 6px 10px; }\n.md td { color: #252529; border-bottom: 1px solid #eaeaeb; padding: 6px 10px; font-size: 12.5px; vertical-align: top; }\n.md tr:last-child td { border-bottom: 0; }\n.md blockquote { color: #6c6c78; border-left: 3px solid #00a06d; background: #ecfdf5; margin: 8px 0; padding: 4px 12px; border-radius: 0 6px 6px 0; }\n.md pre { background: #f0f0f2; border: 1px solid #eaeaeb; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }\n.md code { font: 12px ui-monospace, \"SF Mono\", Menlo, monospace; color: #252529; background: #f0f0f2; border-radius: 4px; padding: 0 3px; }\n.md hr { border: 0; border-top: 1px solid #d8d8de; margin: 14px 0; }\n.md a { color: #0052CC; }\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003cdiv class=\"eyebrow\"\u003eProduct Brain · pbmcp pide tu aprobación\u003c/div\u003e\n\u003ch1\u003eExportar «Portal de devoluciones» a Jira PLAT\u003c/h1\u003e\n\u003cp class=\"meta\"\u003e1 Epic, 3 Story\u003c/p\u003e\n\u003csection class=\"card\"\u003e\n\u003ch2\u003eIssues (4)\u003c/h2\u003e\n\u003cul class=\"items\"\u003e\n\u003cli\u003e\u003cb\u003eEpic\u003c/b\u003e — Portal de devoluciones\u003c/li\u003e\n\u003cli\u003e\u003cb\u003eStory\u003c/b\u003e — Iniciar una devolución desde la web\u003c/li\u003e\n\u003cli\u003e\u003cb\u003eStory\u003c/b\u003e — Seguir el estado de la devolución\u003c/li\u003e\n\u003cli\u003e\u003cb\u003eStory\u003c/b\u003e — Iniciar una devolución desde la app\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/section\u003e\n\u003cp class=\"foot\"\u003eAprobás con un clic en Aprobar. Escape o Cancelar no escriben nada. Se cancela sola a los 100 s.\u003c/p\u003e\n\u003c/body\u003e\u003c/html\u003e"},{"type":"tool","label":"Ran · jira(action=\"export\")","source":"inferido","notes":"Con tu clic se crean los issues, a través del servidor product-brain-mcp y con tu usuario. Si cancelás, no se exporta nada y el agente te pregunta."},{"type":"say","md":"Listo: se crearon **4 issues** en el proyecto **PLAT**.\n\n#### Qué quedó\n- **Épica:** `PLAT-123`\n- **Historias:** `PLAT-124`, `PLAT-125` y `PLAT-126`\n\nTodo quedó a tu nombre. No hay forma de deshacerlo desde acá: si algo no va, se corrige en Jira.","source":"inferido","notes":"Cerrá con lo que se creó y con una advertencia honesta: no hay deshacer. Las claves son inventadas para la demo. Es la razón de tanto chequeo antes.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores más comunes y cómo salir","screen":"terminal","faq":[{"q":"El servidor aparece con error en Cursor.","a":"Casi siempre es la ruta de --project en el mcp.json: si moviste o volviste a clonar el repo, quedó vieja y el instalador no la actualiza. Corregila a mano, o probá el comando en una terminal."},{"q":"La ventana de aprobación no aparece.","a":"Es una ventana nativa de macOS: sin macOS o sin sesión gráfica no hay forma de aprobar, y el servidor no escribe. Es una barrera, no un error."},{"q":"«declined». ¿Qué pasó?","a":"No aprobaste: cancelaste, cerraste la ventana o pasaron 100 segundos. No se escribió nada. Pedile al agente que siga: no reintenta solo."},{"q":"«duplicate». ¿Se escribió dos veces?","a":"No: el documento ya existe, porque una llamada cortada pudo haberlo escrito. El agente lo lee en vez de crearlo otra vez."}],"steps":[{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': True, 'valid': False, 'minutes_left': None, 'warn': True, 'error': 'token_permissions: ~/.config/product-brain/token must be readable only by you: chmod 600 ~/.config/product-brain/token'}"],"source":"inferido","cwd":"~","notes":"El primer error típico: el archivo del token tiene permisos de más y la herramienta lo rechaza a propósito, porque un secreto no tiene que poder leerlo otra persona. La salida dice el comando: chmod 600. Inferido: necesita uv y un token."},{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': False, 'valid': False, 'minutes_left': None, 'warn': True, 'error': 'token_missing: no token at ~/.config/product-brain/token; copy the token and run: pbmcp token paste'}"],"source":"inferido","cwd":"~","notes":"El segundo: no hay token o venció, y dura unas 8 horas. Se repite el paso de copiarlo del navegador y pegarlo con token paste. No hay forma de renovarlo desde el agente, y es a propósito. Si el error dice token_expired es lo mismo. Inferido."},{"type":"term","cmd":"# lo que ve el agente al escribir en un proyecto fuera de la lista","out":["project proj-demo-0002 is not in ~/.config/product-brain/allowed_projects; add its id there to let pbmcp write to it"],"source":"inferido","cwd":"~","notes":"Este es el error en sí: not_allowed, con el id que falta. Es un texto de la herramienta, inferido; el comando de abajo es la lista de verdad."},{"type":"term","cmd":"cat ~/.config/product-brain/allowed_projects","out":["proj-demo-0001"],"source":"real","cwd":"~","notes":"El tercero es not_allowed: el proyecto no está en esta lista, un id por línea, y el error dice qué id agregar. Lo agregás vos con un editor; no se le pide al agente.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Tengo que instalar la skill y el servidor por separado?","a":"No: el mismo ./install.sh deja las dos piezas. Y solo andan juntas: la skill no escribe por sí sola, usa las herramientas del servidor."},{"q":"¿Qué tan seguro es esto?","a":"La ventana frena al agente, pero no es una frontera de seguridad total: el token sirve para todo lo que tu usuario puede hacer. Lo que sí limita la herramienta es dónde escribe, con la lista de proyectos permitidos."},{"q":"¿Qué sigue?","a":"El episodio 5: auditing-repos, para revisar un repo y convertir los hallazgos en issues y pull requests, con Jira como vínculo opcional."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Una conversación en vez de cien campos:** el agente arma el documento entero, vos lo revisás en tu editor y los datos que no se saben quedan `{{pendiente}}`, no escondidos.\n- **Nada se escribe sin tu clic:** el agente avisa que se abre la ventana, vos aprobás, y si cancelás no insiste.\n- **El token es tuyo:** lo guardás vos, dura unas 8 horas y nunca pasa por el chat.\n\n#### Próximo episodio: auditing-repos\nCómo pedirle al agente que revise un repo, mida su calidad y su seguridad, y convierta los hallazgos en issues y pull requests, que podés vincular a un ticket de Jira.","source":"inferido","notes":"Las tres ideas son el producto: una conversación guiada, tu clic como única puerta y un secreto que no sale de tu máquina. Anticipá el próximo en una frase: cambiamos de plano, de armar un documento a mirar un repo que ya existe y ordenar lo que está mal.","pause":true}]}]},{"id":"auditing-repos","series":"cursor","order":5,"title":"auditing-repos","pitch":{"ask":"Auditá este repo","does":"Analiza ocho dimensiones, verifica ejecutando cada hallazgo y escribe un informe local con su nivel de confianza. Frena y espera tu respuesta: recién entonces publica un issue por hallazgo y los pull requests que los cierran."},"skill":{"repo":"teamwayofwork","commit":"a0bc150","date":"2026-10-17"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: clonar, enlazar y autenticar gh","screen":"terminal","faq":[{"q":"¿Por qué enlazar y no copiar?","a":"Porque así hay una sola fuente de verdad: tu clon. Cuando lo actualizás, la skill se actualiza sola. Una copia se queda vieja en silencio."},{"q":"¿Qué son ~/.agents y ~/.claude?","a":"Son las carpetas donde cada agente busca skills. Cursor lee la primera; Claude Code lee la segunda, por eso hay dos ":"real","cwd":"~","notes":"El segundo enlace es solo para Claude Code. Fijate que es relativo y apunta al primero: así hay un único origen. Si usás solo Cursor, podés saltearlo."},{"type":"term","cmd":"head -3 ~/.claude/skills/auditing-repos/SKILL.md","out":["---","name: auditing-repos","description: Use when asked to review, audit, or assess a local repository for code quality, architecture, testability, coverage, security, documentation or resilience — especially when the findings should become GitHub issues and pull requests, or be tracked on a Jira board."],"source":"real","cwd":"~","notes":"La prueba de que quedó bien: leemos el encabezado del SKILL.md pasando por los dos enlaces. Si lo ves, el agente también lo va a ver. Abrí una sesión nueva del agente: una abierta antes no se entera."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/test-attribution-pattern.sh | tail -3","out":["  ✓ ignored: refactor: rename the codex_parser module","","passed=22 failed=0"],"source":"inferido","cwd":"~","notes":"Una comprobación que viene con la skill: prueba que el detector de atribución dispara en los casos malos y no se confunde con los legítimos. Tiene que terminar en passed=22 failed=0. Inferido: usa rg, que no está en el entorno de la captura."},{"type":"term","cmd":"gh auth login","out":["? What account do you want to log into? GitHub.com","✓ Logged in as \u003ctu-usuario\u003e"],"source":"inferido","cwd":"~","notes":"Esto lo hacés vos, en tu terminal, y es a propósito: es un flujo interactivo con tu cuenta de GitHub, y el agente no debe hacerlo por vos. Sin gh autenticado la skill solo escribe el informe local. Salida inferida.","pause":true},{"type":"term","cmd":"open -e ~/.zshrc","out":[],"source":"inferido","cwd":"~","notes":"Jira es opcional. Si lo querés, abrís tu ~/.zshrc con un editor y agregás JIRA_BASE_URL, JIRA_EMAIL y JIRA_API_TOKEN. Son un secreto: nunca las pegues en el chat. Después reiniciá Cursor. Si falta alguna, Jira se saltea y todo lo demás sigue andando."}]},{"id":"caso-principal","title":"Caso principal","subtitle":"Auditar un repo y frenar en la compuerta","screen":"cursor-full","faq":[{"q":"¿Por qué verifica ejecutando y no solo leyendo?","a":"Porque leer el código y que algo «parezca mal» es una hipótesis, no un hallazgo. Un hallazgo equivocado le cuesta una tarde a una compañera y la confianza en todos los demás."},{"q":"¿Qué es la compuerta?","a":"Es el momento en que la skill frena con el informe y te pregunta qué publicar. Hasta que contestás, no toca GitHub ni Jira. Ojo: es una instrucción de la skill, no un bloqueo técnico."},{"q":"¿Qué pasa con lo que no se pudo verificar?","a":"Se reporta, con su confianza en «unverified», pero no se publica. Así lo ves vos y decidís, sin que le llegue ruido a nadie."},{"q":"¿Por qué agrega AUDIT-REPORT.md al .gitignore?","a":"Porque el informe tiene hallazgos de seguridad y es un borrador hasta que lo aprobás. Con un git add -A se subiría al historial antes de la compuerta."}],"steps":[{"type":"ask","text":"Auditá este repo","source":"inferido","notes":"Dos palabras alcanzan. Lo que cambia con esta skill es que no hace falta explicarle el método: se activa sola con «auditá», «revisá este código» o «chequeá seguridad». Parado en el repo que querés revisar, no en el de la skill."},{"type":"tool","label":"Read · ~/.agents/skills/auditing-repos/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue un orden fijo: preflight, analizar, verificar, informe local, compuerta, publicar, responder la review. También lee dos referencias obligatorias: verificación y atribución."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/preflight.sh","out":["── repository ──","git repo                   yes (main)","working tree               clean","default branch             unknown","","── github ──","gh auth                    yes","repo permission            WRITE","issues enabled             true","","── jira (optional) ──","jira                       skipped (missing: JIRA_BASE_URL JIRA_EMAIL JIRA_API_TOKEN)","","── audit report safety ──","AUDIT-REPORT.md            NOT IGNORED in this repo","  →                      the report holds detailed security findings and is a draft until","                           approved. A git add -A would publish it to history before the gate.","  fix                      echo 'AUDIT-REPORT.md' \u003e\u003e .gitignore   (or write to the scratchpad)","","── verification tooling ──","docker                     no — some claims cannot be verified by running them","uv                         yes","rg                         yes","fd                         yes","","ok=1 warnings=2 blocking=0"],"source":"inferido","cwd":"~/mi-servicio","notes":"Primero el preflight: qué hay y qué falta. No escribe nada. Fijate en dos cosas. Una, el aviso de AUDIT-REPORT.md: el informe es un borrador con hallazgos de seguridad y hay que evitar que un git add -A lo suba. Dos, docker en «no»: un faltante opcional no frena la auditoría, pero cambia lo que el agente puede afirmar; sin docker no dirá nada sobre una imagen. Inferido: usa rg, que no está en la captura; la salida sigue la de la documentación."},{"type":"say","md":"Hay git, el árbol está limpio y `gh` está autenticado. Dos avisos:\n- `AUDIT-REPORT.md` no está en el `.gitignore`: lo agrego antes de escribirlo.\n- No hay `docker`: no voy a afirmar nada sobre imágenes.\n\nNo hay `CLAUDE.md`, `AGENTS.md` ni configuración de CI para leer. Sigo con el análisis.","source":"inferido","notes":"El agente no calla lo que no puede hacer: lo dice. Y no se lanza a analizar sin mirar antes el CI y las instrucciones del repo; acá no hay, y lo informa. Es donde más fallan las auditorías: afirmar cosas que el CI privado desmiente."},{"type":"term","cmd":"echo 'AUDIT-REPORT.md' \u003e\u003e .gitignore","out":[],"source":"real","cwd":"~/mi-servicio","notes":"Esto es lo que dice la skill: confirmar que el informe no se pueda commitear antes de escribirlo. Una línea al .gitignore, y listo."},{"type":"tool","label":"Ran · análisis de ocho dimensiones · api/ y web/","source":"inferido","notes":"El agente recorre las ocho dimensiones: código limpio, arquitectura, testabilidad, cobertura, seguridad, cadena de suministro, resiliencia y documentación. Anota hallazgos, todavía no publica nada."},{"type":"say","md":"Encontré **tres candidatos**. Ninguno es un hallazgo todavía: los verifico ejecutando.\n- Un descuento mayor al 100% en `orders.py`\n- La paginación de `stats.py`\n- El contador de `counter.py`","source":"inferido","notes":"Remarcá la palabra «candidatos». Un hallazgo sin verificar es una suposición con una cita; hasta que algo lo ejecuta, no pasa a ser hallazgo.","pause":true},{"type":"term","cmd":"python3 -c \"from mi_servicio import orders; orders.create_order('A1', [(100, 1)]); print(orders.order_total('A1', discount_pct=150))\"","out":["-50.0"],"source":"real","cwd":"~/mi-servicio/api","notes":"Primer candidato, probado de verdad: un pedido de 100 con 150% de descuento. Fijate el resultado: da menos 50. El total queda negativo; esto sí es un hallazgo, con evidencia que cualquiera puede repetir."},{"type":"term","cmd":"python3 -c \"from mi_servicio import stats; print(stats.paginate([1, 2, 3, 4], 1, 2))\"","out":["[3, 4]"],"source":"real","cwd":"~/mi-servicio/api","notes":"Segundo candidato: el docstring dice que las páginas empiezan en 1, pero pedir la página 1 devuelve la segunda, 3 y 4. Otra vez, evidencia ejecutada, no opinión."},{"type":"tool","label":"Ran · counter.hit() desde 8 hilos · el total dio lo esperado","source":"inferido","notes":"Del tercer candidato, la carrera del contador, el agente intentó reproducirla y no pudo. Eso no lo descarta, pero tampoco lo deja pasar como cierto: va al informe como «unverified». Esta es la honestidad que buscamos."},{"type":"tool","label":"Write · AUDIT-REPORT.md","source":"inferido","notes":"Un archivo local, que ya bio que se puede mergear y revertir solo. Acá F-01 y F-02 tocan archivos distintos, así que son dos PRs. Si compartieran archivo, irían juntos. Los arreglos van en una rama por PR; no se muestran."},{"type":"say","md":"#### Listo\n- **Issues:** #21 (F-01) y #22 (F-02), uno por hallazgo.\n- **PRs:** #23 cierra #21 y #24 cierra #22; cada uno abre con `Closes #…` y nombra los archivos que comparte con el otro, o que no comparte ninguno.\n- **F-03** quedó en el informe, sin publicar.\n- Nada de lo que escribí menciona que lo hizo un asistente: todo sale a tu nombre.","source":"inferido","notes":"Leé el cierre: cuántos issues y PRs, y qué quedó afuera. Remarcá la última línea: la regla de atribución es absoluta; no hay pie de página ni trailer de co-autor en nada. Eso ya está decidido por la skill y no se discute en cada corrida.","pause":true}]},{"id":"el-sweep","title":"Otro caso: el sweep","subtitle":"Antes de pushear, chequeos que cuestan menos que descubrirlos en CI","screen":"cursor-agent","faq":[{"q":"¿Por qué marca un nombre de test como secreto?","a":"Porque el detector de TruffleHog toma cualquier palabra de 40 caracteres alfanuméricos como un secreto verificado y rompe el CI. Hay nombres de test que justo miden 40."},{"q":"¿Qué es el tooling local?","a":"Carpetas de herramientas del editor o del agente, como .serena o .idea. Un git add -A las mete en el PR de otra persona sin que te des cuenta."},{"q":"¿Cuándo dice «limpio»?","a":"Solo cuando pudo comparar y no encontró nada. Si no puede comparar, por ejemplo con una rama base que no existe, se niega a decir limpio."},{"q":"¿Puedo correrlo yo, sin el agente?","a":"Sí: son scripts sueltos. Parado en tu repo, corrés sweep.sh con la rama base. Lo mismo con check-attribution.sh."}],"steps":[{"type":"ask","text":"Voy a pushear: pasá el sweep y chequeá que nada indique que lo hizo un LLM","source":"inferido","notes":"Dos pedidos en una frase. La skill los resuelve con dos scripts: el sweep y el chequeo de atribución chequear, no que se chequeó y estaba bien. La skill distingue las dos cosas a propósito."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/check-attribution.sh main","out":["── attribution sweep: fix/descuento-sin-tope vs main ──","✓ commits clean (author, committer, body, trailers)","✓ diff contents clean","✓ branch name clean","✓ GitHub clean (4 items, 0 with own comments)","· skipped Jira (env vars not set)","","no attribution found on any reachable surface","# exit 0"],"source":"inferido","cwd":"~/mi-servicio","notes":"El segundo pedido: que nada indique que lo hizo un asistente. Mira los commits, el diff, la rama, los PRs y issues de GitHub y, si hay credenciales, Jira. Fijate la última línea: dice «en cualquier superficie alcanzable», no «sin atribución». Lo que no pudo leer figura como salteado con un punto, nunca como limpio."}]},{"id":"jira-y-review","title":"Otro caso: Jira y la review","subtitle":"Vincular los PRs a un ticket y contestar al revisor automático","screen":"cursor-agent","faq":[{"q":"¿Crea tickets en Jira por cada hallazgo?","a":"No. Los hallazgos van a issues de GitHub. Con Jira la skill solo comenta en tickets que ya existen y vincula PRs."},{"q":"¿Por qué no renombra la rama?","a":"Porque, según la documentación de GitHub, si renombrás la rama de un PR abierto, el PR se cierra. Para PRs que ya existen, la clave va en el título."},{"q":"¿Por qué la clave va al final del título?","a":"Para no romper el prefijo de los conventional commits, como fix:. Jira escanea el título entero, así que lo encuentra igual. Y la clave va en mayúsculas."}],"steps":[{"type":"ask","text":"Vinculá estos PRs al ticket PLAT-123","source":"inferido","notes":"Un pedido corto. Jira vincula un PR cuando la clave aparece en el nombre de la rama, en un commit o en el título del PR."},{"type":"say","md":"Los PRs #23 y #24 ya existen, así que **no renombro sus ramas**: GitHub cierra un PR si se renombra su rama.\n\nLes agrego la clave al final del título: `fix: … (PLAT-123)`.","source":"inferido","notes":"Esta es la regla que más cuesta aprender a las malas. La rama de un PR abierto no se toca. El título sí, y es no destructivo. Si ya sabías el ticket antes de empezar, la clave se pone en el nombre de la rama desde el principio."},{"type":"tool","label":"Ran · gh pr edit 23 y gh pr edit 24 · título con (PLAT-123)","source":"inferido","notes":"Dos comandos, uno por PR. Escribe en GitHub, pero sobre PRs que la persona ya aprobó publicar en esta misma conversación."},{"type":"ask","text":"Contestá los comentarios del revisor automático","source":"inferido","notes":"Después de publicar, llegan los comentarios de un revisor automático. Son útiles, pero no tienen la última palabra."},{"type":"say","md":"Verifiqué cada comentario antes de contestar:\n- **Comentario 1: tiene razón.** El borde de la página 0 también falla; lo arreglo.\n- **Comentario 2: no tiene razón.** Muestro la prueba: el test pasa con el valor que él propone.\n\nRespondo en cada hilo con la evidencia, en las dos direcciones.","source":"inferido","notes":"Verificar en las dos direcciones es la idea: ni aceptar todo ni rechazar por reflejo. Si el comentario está mal por la razón que da pero bien en el efecto, la skill dice exactamente eso: es lo más útil para quien lee.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los tres tropiezos más comunes","screen":"terminal","faq":[{"q":"El agente no ofrece la skill, ¿qué hago?","a":"Casi siempre abriste la sesión antes de crear los enlaces. Abrí una sesión nueva y verificá a dónde apunta el enlace."},{"q":"¿Anda en Cursor pero no en Claude Code?","a":"Falta el segundo enlace, el de ~/.claude/skills. Pedile al agente que lo cree, o corrélo vos."},{"q":"¿Qué significa un 401 de Jira?","a":"Que el token venció o se revocó. No es un problema de permisos. Creá otro token y cambiá la variable."},{"q":"¿Se puede forzar la skill?","a":"Sí: escribí /auditing-repos en el chat. Pero normalmente se activa sola cuando pedís una auditoría."}],"steps":[{"type":"term","cmd":"readlink ~/.agents/skills/auditing-repos","out":["~/skills/teamwayofwork/skills/auditing-repos"],"source":"real","cwd":"~","notes":"Primer síntoma: el agente no ofrece la skill. Esto muestra a dónde apunta el enlace: tiene que ser la carpeta skills/auditing-repos de tu clon. Si no sale nada, el enlace no existe; si apunta a otro lado, el clon se movió. Y abrí una sesión nueva."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/sweep.sh nope","out":["✗ base ref 'nope' does not resolve — cannot diff, refusing to report clean","  available: main ","  pass one explicitly: sweep.sh \u003cbase-ref\u003e","# exit 2"],"source":"real","cwd":"~/mi-servicio","notes":"Segundo síntoma: la rama base no existe. El sweep se niega a decir limpio y sale con código 2. Muestra qué ramas hay y cómo pasarla explícita. Un chequeo que pasa en silencio cuando no pudo correr es peor que no tener chequeo."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/preflight.sh | grep -A2 '^jira auth'","out":["jira auth                  HTTP 401 — token expired or revoked, NOT a permissions problem","  note                     an unauthenticated Jira returns 404 for real tickets. Never conclude","                           'the ticket does not exist' from a 404 while /myself returns 401."],"source":"inferido","cwd":"~/mi-servicio","notes":"Tercer síntoma, con Jira: un 401 es un token vencido, no un tema de permisos. Lo importante es la nota: una Jira sin autenticar devuelve 404 para tickets que sí existen, así que jamás se concluye «el ticket no existe» mientras el 401 siga. Inferido: necesita credenciales y red."}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Cuándo la uso?","a":"Cuando vas a entregar un repo a otro equipo, antes de clonar una plantilla muchas veces, o cuando querés que los hallazgos terminen en issues y PRs."},{"q":"¿Sirve para revisar un PR?","a":"No. Para un diff puntual usá el revisor de tu host, por ejemplo /code-review. Esta skill es para un repositorio entero."},{"q":"¿Qué necesito para el próximo episodio?","a":"Lo mismo del episodio 0. Cada episodio empieza instalando su skill."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Un hallazgo sin verificar no es un hallazgo:** cada cosa que se publica salió de ejecutar algo, y lo que no, se reporta pero no sale.\n- **Una compuerta antes de publicar:** el agente frena con el informe y espera tu respuesta. Es una instrucción, no un candado: leé el informe.\n- **Nada indica que lo hizo un asistente:** ni en commits ni en issues ni en PRs, y el sweep lo comprueba.\n\n#### Próximo episodio: local-board-skill\nCómo mantener un tablero de trabajo en archivos Markdown, trazado contra los commits de Git, y sincronizarlo con Jira solo después de revisar un plan.","source":"inferido","notes":"Las tres ideas son el producto: verificar, frenar y no dejar firma. Anticipá el próximo en una frase: pasamos de auditar código a ordenar el trabajo, con un tablero que vive en tu repo y que solo llega a Jira cuando vos revisaste el plan.","pause":true}]}]},{"id":"local-board-skill","series":"cursor","order":6,"title":"local-board-skill","pitch":{"ask":"Armame un board local para este proyecto","does":"Crea un board de épicas, historias y tareas en archivos Markdown, lo traza contra los commits de Git y lo sincroniza con Jira solo después de que revisás un plan guardado: solo se escribe con un plan guardado que revisaste (o con --apply, en la limpieza de links)."},"skill":{"repo":"teamwayofwork","commit":"a0bc150","date":"2026-10-17"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: clonar y enlazar","screen":"terminal","faq":[{"q":"¿Qué necesito instalado?","a":"Solo python3 y git. Los scripts de la skill usan nada más que la biblioteca estándar de Python, así que no hay nada que instalar con pip."},{"q":"¿Por qué enlazar y no copiar?","a":"Porque así hay una sola fuente de verdad: tu clon. Cuando lo actualizás, la skill se actualiza sola. Una copia se queda vieja en silencio."},{"q":"¿Puedo instalarla sin enlaces?","a":"Sí: con npx skills add, desde tu clon, y necesitás Node. Pero instala una copia: no se actualiza con git pull, hay que repetir el comando. Y si ya la habías enlazado, te cambia el enlace por la copia."},{"q":"El clone dice «Permission denied», ¿qué hago?","a":"Falta acceso a este repo, que es de otra organización. Pedíselo al equipo dueño; la clave SSH del episodio 0 sirve en cuanto te lo den."}],"steps":[{"type":"term","cmd":"git clone \u003crepo\u003e ~/skills/teamwayofwork","out":["Cloning into '~/skills/teamwayofwork'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo del equipo. Ojo: es un repo con varias skills adentro, y la que vamos a usar vive en la carpeta skills/local-board-skill. En \u003crepo\u003e va la dirección que te da tu equipo. Necesita red y acceso por SSH. La clave SSH sale del episodio 0, pero el acceso a este repo, que es de otra organización, se lo pedís al equipo dueño: si no te lo dieron, git clone responde «Permission denied» y no es un error tuyo. Paso inferido."},{"type":"term","cmd":"mkdir -p ~/.agents/skills ~/.claude/skills","out":[],"source":"real","cwd":"~","notes":"Creamos las dos carpetas donde los agentes buscan skills, por si no existen. Si ya existen, no pasa nada: el -p lo tolera."},{"type":"term","cmd":"cd ~/skills/teamwayofwork \u0026\u0026 ln -s \"$PWD/skills/local-board-skill\" ~/.agents/skills/local-board-skill","out":[],"source":"real","cwd":"~","notes":"El enlace para Cursor. Es un acceso directo a la carpeta de la skill dentro de tu clon, no una copia. Cursor busca en ~/.agents/skills."},{"type":"term","cmd":"ln -s ../../.agents/skills/local-board-skill ~/.claude/skills/local-board-skill","out":[],"source":"real","cwd":"~","notes":"El segundo enlace es para Claude Code, que busca en ~/.claude/skills. Si solo usás Cursor podrías saltearlo, pero conviene dejarlo: es gratis y la serie siguiente usa Claude Code. Apunta al primer enlace, así hay un solo camino hasta tu clon."},{"type":"term","cmd":"head -4 ~/.claude/skills/local-board-skill/SKILL.md","out":["---","name: local-board-skill","description: \"Use when bootstrapping a local work board, analyzing commits since its last sync, relating specs and tickets, reconciling historical Git evidence, or preparing and applying an approved Jira sync.\"","compatibility: \"Requires python3 (standard library only) and git. Syncing with Jira also needs the JIRA_EMAIL and JIRA_API_TOKEN environment variables plus JIRA_BASE_URL or JIRA_CLOUD_ID.\""],"source":"real","cwd":"~","notes":"Comprobamos leyendo la cabecera del SKILL.md a través del enlace: si se ve, el enlace anda. Fijate en la línea compatibility: pide python3 y git, y avisa que las credenciales de Jira hacen falta solo para sincronizar. Todo lo demás es local."},{"type":"term","cmd":"python3 -m unittest discover -s ~/.agents/skills/local-board-skill/tests -p 'test*.py' 2\u003e\u00261 | grep -E '^(Ran |OK$|FAILED)'","out":["Ran 39 tests in 0.143s","OK"],"source":"real","cwd":"~","notes":"La comprobación que trae la skill: sus tests. Corren sin red y sin Jira, con Jira falso adentro. Tiene que terminar en OK. El número de tests puede cambiar entre versiones: lo que importa es el OK. Si ves FAILED, frená acá y no sigas: lo que venga después se apoya en esto. Las credenciales de Jira no se piden ahora: el archivo donde van lo crea la skill junto con el board, y lo vemos en el caso principal.","pause":true}]},{"id":"caso-principal","title":"Caso principal","subtitle":"Armar el board, traer la evidencia d/sync/state.json"],"source":"real","cwd":"~/mi-servicio","notes":"El resultado en disco: cada entidad es un archivo Markdown en una carpeta que respeta la jerarquía. Mirá sync/.env: ahí van las credenciales, y nace ignorado por git para que nadie lo suba por error."},{"type":"say","md":"#### Board armado\n- **Épica SRVE01**, **historia SRVS01** y **tarea SRVT01**, cada una en su archivo y colgando de su padre.\n- Los archivos nacen con secciones «Pendiente de completar». Antes de sincronizar las redacto con evidencia y sin inventar requisitos: lo que no sé lo marco como supuesto.\n\nSi querés, sigo con la evidencia de Git.","source":"inferido","notes":"Redactar no lo hace ningún script. La skill pide objetivo, alcance y criterios de aceptación verificables, y prohíbe inventar requisitos: lo dudoso se marca como supuesto. Estos cuerpos terminan como descripción en Jira, vale la pena revisarlos."},{"type":"ask","text":"Fijate qué commits hay desde el principio del repo y validá el grafo del board","source":"inferido","notes":"Otra pieza. Usamos el principio del repo como corte porque el board es nuevo; con uno que ya sincronizó, el corte sale del estado guardado, y eso lo vemos enseguida."},{"type":"term","cmd":"python3 ~/.agents/skills/local-board-skill/scripts/inventory_git.py --workspace . --board-dir board --since 2000-01-01","out":["Wrote ~/mi-servicio/board/sync/git-inventory.json: repositories=1 commits=3"],"source":"real","cwd":"~/mi-servicio","notes":"Inventaría los commits desde el corte y los guarda en un JSON. Es evidencia, solo eso: decidir a qué tarea corresponde cada commit exige leer el diff, y eso lo hace el agente, no el script."},{"type":"term","cmd":"python3 ~/.agents/skills/local-board-skill/scripts/render_git_inventory.py --board-dir board","out":["Wrote ~/mi-servicio/board/_meta/inventario-commits.md"],"source":"real","cwd":"~/mi-servicio","notes":"Genera el reporte legible en _meta. No lo edites a mano: se pisa."},{"type":"term","cmd":"python3 revisa que el YAML sea válido, que tenga secrets: inherit y que no quede ningún campo sin completar."},{"type":"tool","label":"Ran · git commit, git push -u origin chore/migrate-to-unified-ci, gh pr create","source":"inferido","notes":"Paso 6. Remarcalo: acá la skill commitea, pushea y abre el PR, sin preguntarte. Necesita gh instalado y con sesión iniciada. Es el momento que más tiene que ver con tu decisión de pedir la migración."},{"type":"tool","label":"Ran · gh run watch","source":"inferido","notes":"Paso 7: mira la corrida del pull request. Corre tests, Sonar y los escaneos de seguridad; no corre el deploy ni publica nada. Si falla por configuración, corrige y reintenta, hasta dos veces; si es deuda previa del repo, no la esconde."},{"type":"say","md":"#### Resumen de la migración\n- **Stack y herramientas:** Python con `pip` (`api/requirements.txt`)\n- **Entrypoint:** el workflow reutilizable de Python del CI unificado, llamado desde `ci.yml` con `secrets: inherit`\n- **Parámetros en `with:`:** `package-manager: pip`, `python-version: '3.11'`, `python-project-directory: 'api'` y `skip-platform: true`\n- **Borrado:** `test.yml`\n- **Conservado:** `lint.yml`\n- **CI:** `PR checks passed`. `deploy not exercised`: el deploy no corre en esta rama.\n- **Deuda previa:** ninguna detectada\n\nAgregué este resumen a la descripción del PR.","source":"inferido","notes":"Paso 8, el reporte, y es lo que tenés que leer. Fijate en la frase «deploy not exercised»: la skill nunca dice que el deploy «se verificó», porque en el run del PR no corre. Y el resumen también queda en la descripción del PR. Los parámetros salen de la plantilla de Python: gestor, versión y carpeta del proyecto, más el que apaga el deploy porque este repo no despliega. Respuesta inferida.","pause":true},{"type":"term","cmd":"gh pr view --web","out":["Opening github.com/\u003corg\u003e/mi-servicio/pull/12 in your browser."],"source":"inferido","notes":"Ahora te toca a vos: abrís el PR, leés el diff y el resumen, y mergeás si estás conforme. El merge es tuyo. Salida inferida; el número del PR es de ejemplo.","cwd":"~/mi-servicio","pause":true,"in":"zsh"}]},{"id":"frena-con-gaps","title":"Otro caso: evaluar sin tocar nada","subtitle":"Una evaluación termina en un reporte, y si hay gaps lo dice","screen":"cursor-agent","faq":[{"q":"¿Cuándo es una evaluación y cuándo una migración?","a":"Si pedís un juicio («¿puede adoptar el CI unificado?», «¿conviene migrar?») es evaluación. Si pedís instalar o migrar, es migración. La skill mira lo que pediste, no las palabras sueltas."},{"q":"¿Qué repos no entran?","a":"Los que despliegan directo a AWS o GCP, los que tienen matrices obligatorias en macOS o Windows, los que hacen migraciones de base de datos en el runner y los que mezclan dos lenguajes. Tampoco los lenguajes fuera del catálogo."},{"q":"¿Una evaluación deja algo cambiado?","a":"No. Termina con el reporte: no crea rama, no edita archivos y no abre un PR."}],"steps":[{"type":"ask","text":"Revisá si este repo puede usar el CI unificado.","source":"inferido","notes":"Mismo tema, pero otro pedido: acá no pedís cambiar nada, pedís un juicio. Por eso es una evaluación. Es el segundo ejemplo del README. Lo hacemos en otro repo del equipo, uno que despliega directo a la nube."},{"type":"say","md":"#### Unified CI evaluation\n- Stack: Python (`pyproject.toml` en la raíz)\n- Gate: Incompatible\n- Blockers: `.github/workflows/deploy-ecs.yml` (deploy directo a AWS ECS); `.github/workflows/test.yml` (matriz con macOS y Windows); `.github/workflows/migrate-db.yml` (migraciones de base de datos en el runner)\n- Would delete: none\n- Would keep: todos los workflows\n- Would write: none","source":"inferido","notes":"Este es el formato fijo de la skill para una evaluación: stack, gate, bloqueos con el archivo y la regla, qué borraría, qué conservaría y qué escribiría. Una lista vacía se escribe «none». Y la skill se detiene ahí: no ofrece aplicar. Es el principio «cero roturas»: prefiere decirte los gaps antes que romper el CI. En pantalla el título se ve con dos numerales. Respuesta inferida, con datos ficticios.","pause":true}]},{"id":"actualizar","title":"Otro caso: mantenerla al día","subtitle":"Volver a correr el instalador, con sus advertencias","screen":"cursor-agent","faq":[{"q":"¿Cada cuánto actualizo?","a":"Cuando el equipo te avise de un cambio, o si algo se comporta distinto. Como siempre baja main, correrlo de nuevo te deja en lo último."},{"q":"¿Puedo fijar una versión?","a":"No: el script siempre baja la rama main del repo de la skill. Si la skill cambia, cambia para vos sin aviso."},{"q":"¿Pierdo algo si la actualizo?","a":"Los cambios locales en la cache, sí: el script hace reset --hard. Si editaste algo ahí, copialo antes."}],"steps":[{"type":"ask","text":"Volvé a correr ./skills/install-unified-ci/scripts/install.sh para actualizar la skill.","source":"inferido","notes":"Actualizar es el mismo comando que instalar: se lo podés pedir al agente. Es el cuarto paso de la guía de instalación. Ojo: el script borra cosas (rm -rf), así que decidir si se lo dejás correr al agente es tuyo."},{"type":"tool","label":"Ran · ./skills/install-unified-ci/scripts/install.sh","source":"inferido","notes":"El script ve que la cache ya existe y toma otro camino: fetch y reset --hard, en lugar de clonar. Después rehace los enlaces."},{"type":"say","md":"Listo, actualicé la skill: traje lo último de `main` y rehice los enlaces.\n\n- **Ojo:** el script siempre baja `main` y no fija una versión.\n- **Y:** abrí una sesión nueva del agente para que tome la versión nueva.","source":"inferido","notes":"Dos cosas para llevarse. Una: sin versión fija, la skill puede cambiar sin avisarte. Dos: sesión nueva. Mensaje del agente inferido.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los tres tropiezos más comunes","screen":"terminal","faq":[{"q":"¿El script dejó algo a medias?","a":"Si falla el clon o el fetch, el script corta con set -e antes de enlazar nada. Si lo corrés de nuevo, rehace todo."},{"q":"¿Cómo recupero una copia mía que se borró?","a":"Desde tu respaldo o tu repo: el script no guarda copia de lo que borra. Por eso conviene leerlo antes y avisarle al agente si tenías una."},{"q":"¿Y si la skill misma se detiene al migrar?","a":"Tiene dos frenos comunes: el árbol de trabajo tiene cambios fuera de .github/workflows, o ya hay un PR abierto de la migración. En ambos casos no sigue y lo dice. Necesita además gh instalado y con sesión."},{"q":"¿Cómo sé que quedó bien instalada?","a":"Con el ls -l del SKILL.md. Si aparece, el agente lo va a encontrar en una sesión nueva."}],"steps":[{"type":"term","cmd":"cd ~/skills/teamwayofwork \u0026\u0026 ./skills/install-unified-ci/scripts/install.sh","out":["=== Instalador de skill: install-unified-ci ===","Obteniendo la skill desde https://github.com/\u003corg\u003e/core-architecture-gh-workflows.git (main)..."],"source":"inferido","notes":"Primer tropiezo: el script termina sin el mensaje de «instalada correctamente». Pasa cuando falla el clon o el fetch, casi siempre por acceso al repo de la skill. El script usa set -e, así que corta ahí sin enlazar nada. Git imprime su propio error; revisá tu acceso y corrélo de nuevo. Salida inferida.","cwd":"~"},{"type":"term","cmd":"cd ~/skills/teamwayofwork \u0026\u0026 ./skills/install-unified-ci/scripts/install.sh","out":["=== Instalador de skill: install-unified-ci ===","Obteniendo la skill desde https://github.com/\u003corg\u003e/core-architecture-gh-workflows.git (main)...","❌ Error: no se encontró un SKILL.md válido en ~/.cache/core-architecture-gh-workflows/skills/install-unified-ci."],"source":"inferido","notes":"Segundo tropiezo: la descarga llegó pero sin SKILL.md. El script lo valida antes de tocar los enlaces y sale con error: no se enlazó nada. Lo que corresponde es avisarle al equipo dueño del repo de la skill. Salida inferida.","cwd":"~"},{"type":"term","cmd":"ls -l ~/.agents/skills/install- ipo: ahí vas a trabajar de acá en adelante. Se commitea, por eso el token no puede vivir adentro. Inferido: necesita red.","cwd":"~"},{"type":"term","cmd":"~/.local/bin/arq init","out":["creado .arq/config.json","creado reviews/"],"source":"real","notes":"arq init crea la configuración y la carpeta de reviews; si ya existen, no los toca. Después se completa el canal del requirente en el config.json, un help desk de Software o Jira Service Management. Se lo pedís al agente en una frase.","cwd":"~/arq-reviews"},{"type":"term","cmd":"ls -l ~/.config/arq","out":["total 8","-rw-------  1 persona  staff  138 19 oct 09:00 .env"],"source":"inferido","notes":"Las tres variables de Jira (URL, email y token) viven en un .env fuera del repo de reviews. El token se crea con «Create API token» a secas, no «with scopes». Lo escribís vos con un editor, nunca por el chat. Salida inferida; los permisos 600 son una buena práctica nuestra.","cwd":"~","pause":true}]},{"id":"caso-principal","title":"Caso principal","subtitle":"De un pedido que llegó al Jira armado","screen":"cursor-full","faq":[{"q":"¿Por qué el agente no corre el --apply?","a":"Porque la skill lo prohíbe: lo que escribe en Jira siempre te lo da armado con un signo de exclamación para que lo corras vos. Tu control es el dry run que viste antes. Fijate que acá no aparece ninguna ventana de aprobación: es una diferencia con otras herramientas del taller."},{"q":"¿Quién contesta el triage?","a":"La persona que coordina, no el modelo. El agente propone sí o no citando la frase del pedido, y espera tu confirmación. Ante la duda, sí. Un solo sí da nivel complejo."},{"q":"¿Y si me equivoqué en el triage?","a":"Se puede repetir mientras no exista la épica. Con la épica creada, arq se niega, porque el nivel decide la estructura de Jira."},{"q":"¿Y si el Jira se corta a la mitad?","a":"Repetís el mismo comando. Cada issue lleva un ID estable, así que retoma sin duplicar, y renombrar algo a mano en Jira no rompe nada."}],"steps":[{"type":"ask","text":"Registrá el PRY-2026-0042. El pedido está en pedido.txt; contacto contacto@example.com y head head@example.com","source":"inferido","notes":"El pedido es una frase: el número, el texto y los dos mails. El contacto es el requirente y el head queda de participante. Datos inventados. En un caso real el pedido se transcribe tal cual: es evidencia."},{"type":"tool","label":"Read · ~/.agents/skills/arq-manager/SKILL.md","source":"inferido","notes":"Cursor carga arq-manager, la que coordina. Esta skill no emite juicio técnico, ni siquiera un «parece razonable»: eso es de la otra."},{"type":"term","cmd":"~/.local/bin/arq show PRY-2026-0042","out":["error: no existe ~/arq-reviews/reviews/PRY-2026-0042.md: correr `arq new PRY-2026-0042` primero","# exit 1"],"source":"real","notes":"Primero mirar si el review ya existe. No existe: el error es la respuesta correcta. El «exit 1» lo agrega la captura. Salida real.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq new PRY-2026-0042 --nombre \"Migración del servicio de reportes\" --pedido pedido.txt --contacto contacto@example.com --head head@example.com","out":["creado reviews/PRY-2026-0042.md (estado: recibido)"],"source":"real","notes":"Se crea el review en «recibido», con el pedido copiado entero. Todo queda en un archivo del repo de reviews: git es la fuente de verdad.","cwd":"~/arq-reviews"},{"type":"say","md":"#### Registrado. Triage: mi propuesta\nLeí `contract/triage.md`. Cada sí o no lleva la frase del pedido que lo justifica:\n- `multi_cuenta`: **sí**, «pasar a la cuenta de Datos» desde la de Producto\n- `migracion`: **sí**, «mover la base de reportes»\n- `fecha_comprometida`: **sí**, «comprometido con el cliente»\n- `otros_equipos`: **sí**, «Finanzas y Soporte consumen los reportes»\n- `datos_sensibles_o_ia`: **sí**, «incluye facturación de clientes»\n- `larga_o_productiva`: **sí**, «queda productivo»\n\nLas respuestas las confirmás vos, no yo. ¿Las dejo así?","source":"inferido","notes":"Cada propuesta cita el pedido: es evidencia, no opinión del modelo. Y termina en una pregunta: el agente se frena y espera a la persona que coordina. Contenido ilustrativo."},{"type":"ask","text":"Casi todo bien. En otros_equipos es no: Finanzas y Soporte solo leen los reportes, no participan.","source":"inferido","notes":"La persona corrige al agente, y eso es lo esperado. Con un solo sí el nivel ya es complejo."},{"type":"term","cmd":"~/.local/bin/arq triage PRY-2026-0042 --answers \"multi_cuenta=si,migracion=si,fecha_comprometida=si,otros_equipos=no,datos_sensibles_o_ia=si,larga_o_productiva=si\"","out":["nivel: complejo"],"source":"real","notes":"Con las respuestas confirmadas, el nivel queda fijado. Se puede repetir mientras no exista la épica. Salida real.","cwd":"~/arq-reviews"},{"type":"ask","text":"Armá el Jira del PRY-2026-0042","source":"inferido","notes":"Segundo pedido, el que más se usa: abrir la épica de la revisión y el ticket donde conversa el requirente."},{"type":"term","cmd":"~/.local/bin/arq jira PRY-2026-0042 --html ~/PRY-2026-0042.html","out":["épica     [PRY-2026-0042] Migración del servicio de reportes  [pry:2026-0042 nivel:complejo]","  story   Intake y triage","    sub-task Normalizar pedido  [track:coordinacion]","    sub-task Triage  [track:coordinacion]","    sub-task Abrir ticket del requirente y plazo  [track:coordinacion]","  story   Análisis y opciones","    sub-task Gap check de input mínimo  [track:tecnica]","    sub-task Análisis vs constraints  [track:tecnica]","    sub-task Opciones y recomendación  [track:tecnica]","  story   Decisión y comunicación","    sub-task Revisión y firma  [track:tecnica]","    sub-task Publicar devolución  [track:coordinacion]","vista previa: ~/PRY-2026-0042.html","dry run: no se escribió nada. Para ejecutarlo, el usuario corre el mismo comando con --apply (en Claude Code, con !)."],"source":"real","notes":"Es el dry run: muestra el árbol de lo que se crearía y deja una vista previa. No necesita red ni credenciales. Fijate en la última línea: no se escribió nada. Salida real.","cwd":"~/arq-reviews"},{"type":"say","md":"#### Esto es lo que se crearía\nNo escribí nada en Jira. Una **épica**, **tres historias** (intake y triage, análisis y opciones, decisión y comunicación) y **ocho sub-tasks**. Abrí `PRY-2026-0042.html` para verlo con su descripción.\n\nComo el nivel es `complejo`, te pregunto: ¿hace falta la historia opcional de **validación técnica**?","source":"inferido","notes":"El agente muestra y pregunta. Como es complejo, ofrece una cuarta historia opcional. No sigue sin un sí explícito."},{"type":"ask","text":"No hace falta. Seguí.","source":"inferido","notes":"El sí explícito que la skill espera antes de pasar a escribir."},{"type":"say","md":"#### El comando lo corrés vos\nPara crear la épica y el ticket del requirente (a su nombre, buscándolo por email), corré esto en la terminal de Cursor (sin el `!` del principio, que es de Claude Code):\n\n`set -a \u0026\u0026 source ~/.config/arq/.env \u0026\u0026 set +a \u0026\u0026 arq jira PRY-2026-0042 --apply`\n\nYo no lo corro: el `--apply` es tuyo. Si algo falla a mitad de camino, repetilo tal cual; retoma sin duplicar.","source":"inferido","notes":"El momento clave, decilo despacio: el agente nunca corre un --apply. Te lo deja armado, con el .env cargado en la misma línea porque arq lee el entorno, no el archivo. No hay ventana de aprobación: tu control es el dry run que ya viste y que el comando lo corrés vos."},{"type":"term","cmd":"set -a \u0026\u0026 source ~/.config/arq/.env \u0026\u0026 set +a \u0026\u0026 arq jira PRY-2026-0042 --apply","out":["épica: PLAT-123 (creados 12, existentes 0; descripciones actualizadas: 0; tareas movidas a Done: 2, a En curso: 1)","jsm: PLATHD-7 (creado; labels, participantes y link al día)"],"source":"inferido","notes":"La persona lo corre en la terminal de Cursor y escribe en Jira: inferido, nunca lo ejecutamos. Claves y números inventados; el formato sale del código. Se verifica el conteo «creados» y el ticket.","pause":true,"in":"zsh"},{"type":"tool","label":"Ran · git commit -m \"feat: PRY-2026-0042 registrado, triado y con Jira\"","source":"inferido","notes":"La skill commitea el repo de reviews tras cada paso que cambia el review o escribe en Jira. Es local; el push es de la persona."},{"type":"say","md":"#### Listo\nVerifiqué la salida: la épica **PLAT-123** con 12 issues creados y el ticket del requirente **PLATHD-7**. El review está `triado`, nivel `complejo`.\n\nCada vez que el review cambie (gap check, análisis, firma, cierre) te voy a volver a dar este mismo comando: así Jira muestra lo mismo que git. Las descripciones no se editan a mano en Jira, se pisan; las notas van en comentarios.\n\nSiguiente: la revisión técnica la hace `arq-architect`.","source":"inferido","notes":"Idea del ciclo: cada cambio del review vuelve a Jira con el mismo comando. Y ahora le toca a la otra skill. Los números son de ejemplo."}]},{"id":"gap-check","title":"Otro caso: el gap check","subtitle":"Qué falta del pedido, y cómo se lo pedimos al requirente","screen":"cursor-agent","faq":[{"q":"¿Cómo decide qué falta?","a":"Contrasta el pedido contra el input mínimo del nivel. El test es simple: cada afirmación tiene que apuntar a un número, un componente, un diagrama o una métrica. Si no, es prosa y cuenta como faltante."},{"q":"¿Por qué no da un veredicto todavía?","a":"Porque con input faltante el CLI se niega a registrarlo. Primero hay que pedir la información; recién con el input completo hay análisis y veredicto."},{"q":"¿Quién le escribe al requirente?","a":"arq-architect redacta el mensaje desde una plantilla, pero publicarlo le toca a arq-manager, con dry run y un comando que corrés vos."},{"q":"¿Y si el requirente no contesta?","a":"El plazo es de 10 días hábiles por defecto. Si vence en esperando-info, el camino es la propuesta de rechazo: el pedido se cierra como rechazado, pero el click en la plataforma lo hace una persona."}],"steps":[{"type":"ask","text":"Hacé el gap check del PRY-2026-0042","source":"inferido","notes":"Un pedido corto que se resuelve con otra skill. Fijate que no mencionamos a arq-architect: el pedido y el estado del review deciden qué skill actúa."},{"type":"tool","label":"Read · ~/.agents/skills/arq-architect/SKILL.md","source":"inferido","notes":"Se carga la skill técnica. Su regla de arranque: trabaja solo en triado, esperando-info o en-analisis. En otro estado lo dice y no avanza."},{"type":"term","cmd":"~/.local/bin/arq show PRY-2026-0042 | head -6","out":["pry: PRY-2026-0042","nombre: Migración del servicio de reportes","contacto: contacto@example.com","head: head@example.com","estado: triado","nivel: complejo"],"source":"real","notes":"Primero el estado: triado, nivel complejo. Es el estado donde le toca a la revisión técnica. Cortamos la salida a seis líneas, con lo que importa acá. Salida real.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq lint","out":["ok: ~/skills/arq-review/contract/constraints.md"],"source":"real","notes":"Antes de revisar, la skill se asegura de que el contrato de constraints sea válido. Esas constraints son las reglas de Arquitectura contra las que se analiza. El contrato lo mantiene Arquitectura: arq lo lee, nunca lo reescribe. Salida real.","cwd":"~/arq-reviews"},{"type":"say","md":"#### Gap check\nLeí el pedido, los documentos adjuntos y `minimum-input.md` del nivel `complejo`. **Faltan tres datos**:\n- `cuentas_entornos`: el pedido dice «Producto» y «Datos», pero no qué cuentas y entornos son\n- `flujos_datos`: no hay flujos ni clasificación de la facturación de clientes\n- `rollback`: no hay plan de vuelta atrás ni criterio para activarlo\n\nLo anoto y paso el review a `esperando-info`.","source":"inferido","notes":"Esto es juicio técnico, y por eso lo hace esta skill y no la que coordina. Cada faltante sale del input mínimo, con su ID. Contenido ilustrativo: depende del pedido."},{"type":"term","cmd":"~/.local/bin/arq set PRY-2026-0042 faltantes=cuentas_entornos,flujos_datos,rollback","out":["actualizado: faltantes"],"source":"real","notes":"Solo acepta IDs que existen en el nivel: uno inventado se rechaza y lista los válidos.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq state PRY-2026-0042 --to esperando-info","out":["estado: esperando-info"],"source":"real","notes":"El CLI controla las transiciones: no se puede saltear un estado. Este paso es válido desde triado.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq set PRY-2026-0042 componente_debil=datos senales=seguridad,cloud","out":["actualizado: componente_debil, senales"],"source":"real","notes":"Queda un análisis preliminar, sin veredicto: el componente más débil y las señales para otros sectores. Señales, no veredictos: sobre Cloud, Seguridad o FinOps esta skill nunca opina.","cwd":"~/arq-reviews"},{"type":"tool","label":"Write · reviews/PRY-2026-0042.jsm.md","source":"inferido","notes":"Redacta el mensaje para el requirente desde la plantilla jsm-pedido-info, completando solo los placeholders. Si toca el texto fijo, el CLI lo rechaza al publicar."},{"type":"say","md":"#### Pedido de información redactado\nPor cada faltante, una pregunta concreta para este pedido y por qué se pide:\n- **Cuentas y entornos:** ¿qué cuenta de Producto y qué cuenta de Datos, y en qué entornos se hace el corte?\n- **Flujos de datos:** ¿qué datos de facturación mueve el servicio y cómo están clasificados?\n- **Rollback:** ¿cómo se vuelve atrás si falla el corte del 30 de noviembre?\n\nPuse primero lo que bloquea esa fecha. El mensaje está en `reviews/PRY-2026-0042.jsm.md`. Publicarlo le toca a `arq-manager`; el plazo todavía no arrancó (`vence` vacío), pedile que lo fije.","source":"inferido","notes":"Cada pregunta es específica del pedido, nunca genérica, y van primero las que bloquean la fecha comprometida. El agente avisa que no publica: lo hace arq-manager, con dry run y un comando que corrés vos en la terminal de Cursor, sin el !, igual que el Jira."}]},{"id":"analisis","title":"Otro caso: el análisis","subtitle":"Con el input completo: opciones, señales y veredicto propuesto","screen":"cursor-agent","faq":[{"q":"¿Por qué solo dos opciones y solo para un componente?","a":"Porque si el original es viable, la Opción 0 es el original y las dos alternativas son solo para el componente más débil. No se reescribe todo el pedido. Si el original no es viable, sí hay dos alternativas completas."},{"q":"¿Puede el agente aprobar o rechazar?","a":"No. Propone un veredicto: aprobar, aprobar con condiciones o rechazar. Lo firma una persona, y el click de Aprobar o Rechazar en la plataforma también."},{"q":"¿Qué son las señales?","a":"Avisos para Cloud, Seguridad y FinOps, del estilo «FinOps podría observar tal cosa, porque tal otra». Nunca un veredicto sobre esos sectores."},{"q":"¿Y si quien firma pide cambios?","a":"El review vuelve a en-analisis, la firma se anula y hay que firmar de nuevo. El veredicto solo se puede cambiar desde en-analisis."}],"steps":[{"type":"ask","text":"El requirente respondió en su ticket con los tres datos. Revisá de nuevo y analizá el PRY-2026-0042","source":"inferido","notes":"Pasaron unos días. El requirente contestó en su ticket, y el agente retoma desde esperando-info, un estado desde el que la skill puede trabajar."},{"type":"term","cmd":"~/.local/bin/arq state PRY-2026-0042 --to en-analisis","out":["estado: en-analisis"],"source":"real","notes":"Con el input completo, el review pasa a en-analisis. Salida real.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq set PRY-2026-0042 faltantes=","out":["actualizado: faltantes"],"source":"real","notes":"Se deja la lista de faltantes vacía: ya no falta nada. Sin esto, el CLI no deja pasar a firma.","cwd":"~/arq-reviews"},{"type":"tool","label":"Edit · reviews/PRY-2026-0042.md","source":"inferido","notes":"Acá se escribe el análisis, siguiendo la plantilla de la skill. Es un archivo de texto del repo de reviews, y se puede leer completo antes de firmar."},{"type":"say","md":"#### Análisis completo\nSeguí el método de la skill. El original es **viable**: ninguna constraint bloqueante queda sin solución.\n- **Componente más débil:** `datos`. El cruce entre cuentas exige un rol asumible [C-IAM-02] y declarar la clasificación de la facturación [C-DAT-01]\n- **Opción 0:** el original, con corte en una ventana el 30 de noviembre\n- **Opción 1:** replicación continua hasta el corte, con ventana mínima y mayor costo\n- **Opción 2:** instantánea cifrada compartida entre cuentas, con ventana más larga y menos esfuerzo\n- **Recomendación:** Opción 1, con condiciones verificables\n- **Señales:** seguridad, cloud y finops, sin veredicto\n\nVeredicto propuesto: **aprobar con condiciones**.","source":"inferido","notes":"Cada afirmación del review lleva una etiqueta: [pedido], [C-XXX-NN] de la constraint, [supuesto] o [verificar]; ningún número sin etiqueta. Es la regla de evidencia de la skill. Contenido ilustrativo: el análisis real depende del pedido. Lo que sí es real es el método."},{"type":"term","cmd":"~/.local/bin/arq set PRY-2026-0042 componente_debil=datos senales=seguridad,cloud,finops veredicto=aprobar-con-condiciones","out":["actualizado: componente_debil, senales, veredicto"],"source":"real","notes":"Se registran el componente más débil, las señales y el veredicto propuesto. Si quedara input faltante, el CLI rechazaría el veredicto. Salida real.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq state PRY-2026-0042 --to en-firma","out":["estado: en-firma"],"source":"real","notes":"Pasa a firma. El CLI exige veredicto y nada faltante. Nótese que acá termina el trabajo del agente: no firma.","cwd":"~/arq-reviews"},{"type":"say","md":"#### Listo para firma\nEl review quedó en `en-firma`. Quien firma el nivel `complejo` (el Sr Expert) lo lee completo en `reviews/PRY-2026-0042.md`. Redacté también el mensaje de devolución y el comentario corto para pegar en la plataforma PRY.\n\nLas condiciones están en el review, una por bullet: `arq-manager` crea una sub-task de seguimiento por cada una.","source":"inferido","notes":"Cerrá con el límite: el agente prepara, una persona firma y una persona hace el click en la plataforma. Después, arq-manager publica la devolución con el mismo patrón de dry run y comando tuyo, y crea los seguimientos de las condiciones. No lo mostramos acá; está en el showcase de la skill."}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Las guardas de arq: errores que te protegen","screen":"terminal","faq":[{"q":"El agente dice que arq no existe, ¿qué hago?","a":"Es el PATH: ~/.local/bin no está. Pedile que lo agregue a tu ~/.zshrc y abrí una terminal nueva."},{"q":"Creé el token y no entra, ¿por qué?","a":"Casi seguro lo creaste con alcance. Creá otro con el botón «Create API token» a secas."},{"q":"Me dice «el help desk no tiene notas internas»","a":"Estás en el canal software: ahí todo comentario lo ve el requirente. El debate técnico va en la épica, no en el ticket."},{"q":"¿Puedo saltearme un estado para ir más rápido?","a":"No: la máquina de estados no lo permite, y es a propósito. El mensaje te lista las transiciones válidas."}],"steps":[{"type":"term","cmd":"~/.local/bin/arq show PRY-2026-0042","out":["error: no existe ~/reviews/PRY-2026-0042.md: correr `arq new PRY-2026-0042` primero","# exit 1"],"source":"real","notes":"El error más común: estás parado en otra carpeta. arq trabaja sobre la carpeta actual y busca ahí la carpeta de reviews. Se arregla parándote en el repo de reviews, o abriendo Cursor ahí. Salida real.","cwd":"~"},{"type":"term","cmd":"~/.local/bin/arq state PRY-2026-0042 --to cerrado --resultado aprobado","out":["error: transición inválida: en-firma → cerrado; válidas: en-analisis, publicado","# exit 1"],"source":"real","notes":"Saltearse un estado: del estado en que está el review no se puede cerrar. El mensaje lista las transiciones válidas. Pedile al agente arq show para que te diga en cuál está y qué sigue. Salida real.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq state PRY-2026-0042 --to publicado","out":["error: no se puede publicar sin firmante: una persona tiene que firmar la revisión","# exit 1"],"source":"real","notes":"Publicar sin firma: el CLI lo rechaza. Firmar es una decisión de una persona, no del agente. Salida real. El texto de la herramienta menciona Claude Code y el !; en Cursor el comando se pega en la terminal, sin el !.","cwd":"~/arq-reviews"},{"type":"term","cmd":"set -a \u0026\u0026 source ~/.config/arq/.env \u0026\u0026 set +a \u0026\u0026 arq jira PRY-2026-0042 --apply","out":["error: faltan variables de entorno: JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN"],"source":"inferido","notes":"Si falta alguna credencial, el comando no escribe nada y lo dice. Que existan las tres no prueba que entren: la prueba real es arq ver, que es de solo lectura, o el primer --apply. Salida inferida, tomada de la guía de instalación de la herramienta.","cwd":"~/arq-reviews"}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás y lo que sigue","screen":"cursor-agent","faq":[{"q":"¿Esto reemplaza a la plataforma PRY?","a":"No. La plataforma sigue siendo el lugar donde una persona aprueba o rechaza. arq-review lleva la revisión y deja todo en git y en Jira."},{"q":"¿Qué pasa con las skills que me quedaron de la serie?","a":"Siguen instaladas. La serie de Claude Code usa las mismas ideas, pero con otro cliente: lo vemos en el próximo episodio."},{"q":"¿Dónde veo el recorrido completo, con la firma y el cierre?","a":"En el showcase de la skill, que muestra cada etapa. En este episodio vimos las primeras etapas."}],"steps":[{"type":"ask","text":"¿Qué me llevo de arq-review y qué sigue?","source":"inferido","notes":"Cerramos la serie de Cursor. Es un cierre doble: el de este episodio y el de toda la serie."},{"type":"say","md":"#### Lo que te llevás\n- **Dos skills y un CLI:** `arq-manager` coordina (registro, triage, Jira, plazo, publicación) y `arq-architect` revisa lo técnico. Se instalan juntas y trabajan sobre tu repo de reviews.\n- **El `--apply` es tuyo:** el agente muestra el dry run y te da el comando para que lo corras vos. No hay ventana de aprobación: tu control es lo que ves antes.\n- **Decide una persona:** el triage, la firma y el click de Aprobar o Rechazar no son del agente.\n\n#### Fin de la serie de Cursor\nViste ocho herramientas con las mismas reglas: el agente prepara, vos aprobás.\n\n#### Próxima serie: Claude Code, episodio 1: wayofwork\nSiete skills que te guían para llevar una iniciativa de punta a punta, ahora desde Claude Code.","source":"inferido","notes":"Las tres ideas de hoy. Y el cierre de la serie: en todas las herramientas la regla se repite, el agente prepara y la persona aprueba, aunque cada una lo implementa distinto: con una ventana de macOS, con un comando tuyo, o con tu OK explícito en el chat antes de que el agente escriba. Anticipá la serie nueva en una frase: es el mismo trabajo, pero desde Claude Code, empezando por WayOfWork, que tiene siete skills.","pause":true}]}]}]</script>
<script>
// Pure navigation over an episode: the global index is the flattened list of
// (chapter card + its steps). No DOM, no state.
// keyAction(KeyboardEvent.key) -> "right" | "left" | "space" | "b" | null: the presenter
// keys, shared by the control and the stage. PageDown/PageUp act as the arrows because
// presentation clickers send them.
var Nav = (function () {
  function flatten(ep) {
    var out = [];
    (ep.chapters || []).forEach(function (ch, i) {
      out.push({chapter: i, step: -1, kind: "card"});
      (ch.steps || []).forEach(function (st, j) {
        out.push({chapter: i, step: j, kind: st.type});
      });
    });
    return out;
  }

  function clamp(ep, i) {
    var last = flatten(ep).length - 1;
    return Math.max(0, Math.min(Math.floor(i) || 0, Math.max(last, 0)));
  }

  function nextChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    for (var k = i + 1; k < flat.length; k++) {
      if (flat[k].step === -1) return k;
    }
    return Math.max(flat.length - 1, 0);
  }

  function prevChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var cur = i;
    while (cur > 0 && flat[cur].step !== -1) cur--;
    if (cur < i) return cur;
    for (var k = i - 1; k >= 0; k--) {
      if (flat[k].step === -1) return k;
    }
    return 0;
  }

  function keyAction(key) {
    if (key === "ArrowRight" || key === "PageDown") return "right";
    if (key === "ArrowLeft" || key === "PageUp") return "left";
    if (key === " " || key === "Spacebar") return "space";
    if (key === "b" || key === "B") return "b";
    return null;
  }

  function position(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var e = flat[i] || {chapter: 0, step: -1};
    var ch = (ep.chapters || [])[e.chapter] || {};
    return {chapter: e.chapter, step: e.step, total: flat.length, chapterTitle: ch.title};
  }

  return {flatten: flatten, clamp: clamp, nextChapter: nextChapter,
          prevChapter: prevChapter, position: position, keyAction: keyAction};
})();

</script>
<script>
// Static render of the stage: Render.step(container, episode, index) replaces the
// container's content with the FINISHED state of global index `index` (see nav.js).
// Pure function of (episode, index): nothing is kept between calls.
//
// Screens are laid out for a fixed 1600x900 canvas (.ws-screen); the stage scales it.
// All episode text goes through textContent / createTextNode; `say` markdown is parsed
// into DOM nodes, never assigned as HTML.
//
// Animation hooks (for animate.js, which renders the finished state, hides, reveals):
//   data-step="<j>"      on the root node of every applied step (j = index of the step
//                        inside its chapter). Nothing else carries data-step. Steps may
//                        live in different areas (a cursor-full term with `in: "zsh"`
//                        sits in the zsh panel, approve is an overlay at the end of the
//                        screen root), so document order is not step order: select by value.
//   data-anim="type"     the element holding exactly the text that gets typed
//                        (ask text, term command).
//   data-anim="line"     an output line, a say paragraph / heading / list item; revealed
//                        one at a time.
//   data-anim="node"     tool, worked and approve nodes (and the "▸ Ran · cmd" chip and
//                        the "⏺ Bash(cmd)" line); revealed whole.
//   hidden               an approve step that is not the current index keeps its node
//                        (so the step count holds) but is hidden: the window closed.
//   data-anim="idle"     the wrapper of the waiting prompt (prompt line + "❯ █") at the
//                        end of the terminal and of the cursor-full zsh panel. It is not
//                        a step: hide it while a term step animates, show it at the end.
//
// Prompt clock: every prompt shows Render.now() as HH:MM:SS (local time) in a
// .ws-time span. Render.now defaults to `new Date()`; tests and render-preview replace it
// with a fixed date so the output stays deterministic. The stage refreshes only the idle
// prompt's .ws-time every second (Stage.tickClock); steps are never re-rendered for it.
// Prompt icons (folder, house, clock) are inline SVG built with createElementNS.
// Unmarked descendants of a step root appear with the root; hooks inside one root are
// revealed in document order. Chapter cards carry no hooks and appear whole.
//
// Term placement on cursor-full: by default a term step is the agent's command and
// renders in the conversation exactly as on cursor-agent ("▸ Ran · cmd" chip + output
// block). With `in: "zsh"` it is a command the person types and renders in the
// integrated zsh (prompt, typed command, output lines).
// The first chapter card also shows the episode pitch («Le decís al agente…» /
// «Y la skill…») under its title; it is part of the card, not a separate index.
var Render = (function () {
  var USER = "Persona del equipo";
  var TEAM = "Equipo";
  var MODEL = "Sonnet 5.5";
  var BRANCH = "main";

  // ---- DOM helpers (text only) ----
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
