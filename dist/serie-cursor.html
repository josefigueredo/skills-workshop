an local."},"skill":{"repo":"jira-kanban","commit":"93a6126","date":"2026-10-19"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Tope al descuento en pedidos","age":"1h"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina, más tu token de Jira","screen":"terminal","faq":[{"q":"¿Puedo pedirle al agente que la instale?","a":"Sí. En Cursor decile «Instalá jira-team-kit: cloná el repo y corré ./install.sh --with-write» y hace lo mismo que ves acá. Lo mostramos en la terminal para que sepas qué deja en tu máquina."},{"q":"¿Qué es --with-write y por qué no es el comportamiento normal?","a":"Sin esa opción se instalan solo las dos skills de lectura. Con --with-write se suman las dos que pueden escribir en Jira. Escribir es una decisión explícita, no un efecto de instalar."},{"q":"¿Instala algo más, o toca mis archivos?","a":"No copia nada: deja enlaces a tu clon, así hay una sola fuente de verdad. Y nunca pisa un archivo real: si donde va un enlace ya hay un archivo, frena y te dice cuál mover."},{"q":"Me dice «add ~/.local/bin to PATH». ¿Qué hago?","a":"Es el aviso que ves acá: jtk quedó en ~/.local/bin y tu terminal todavía no mira esa carpeta. Agregás una línea a tu ~/.zshrc (o le pedís al agente que la agregue) y abrís una terminal nueva."},{"q":"¿Por qué el token lo creo yo y no se lo pido al agente?","a":"Porque es un secreto: se muestra una sola vez y nunca se pega en el chat. Lo creás vos y lo guardás vos, con un editor."}],"steps":[{"type":"term","cmd":"git clone git@github.com:josefigueredo/jira-team-kit.git skills/jira-kanban","out":["Cloning into 'skills/jira-kanban'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo, que trae las cuatro skills y el comando jtk. Es un git clone común. Necesitás Python 3.9 o más, git y acceso por SSH a la organización (el repo es privado); si hiciste el episodio 0 ya lo tenés. El nombre de la carpeta da igual: el instalador calcula dónde está. Paso inferido: necesita red."},{"type":"term","cmd":"~/skills/jira-kanban/install.sh --with-write","out":["skill: jira-standup (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-standup","skill: jira-em (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-em","skill: jira-team-kit (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban","skill: jira-em-ops (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-em-ops","cli: jtk -\u003e ~/skills/jira-kanban/jtk.py","note: add ~/.local/bin to PATH to use jtk"],"source":"real","cwd":"~","notes":"Esta es toda la instalación. Mirá las cuatro líneas «skill:»: dos de lectura (standup y em) y dos que escriben (jira-team-kit y jira-em-ops). Remarcá que no copia nada, son enlaces, y que se enlazan a la vez en Claude Code, Codex y Cursor. Y mirá el aviso del final: jtk existe, pero falta el PATH.","pause":true},{"type":"term","cmd":"echo 'export PATH=\"$HOME/.local/bin:$PATH\"' \u003e\u003e ~/.zshrc","out":[],"source":"real","cwd":"~","notes":"El aviso se arregla con una línea en tu ~/.zshrc. Después, abrís una terminal nueva. Si te trabás acá, es el error número uno: «el agente dice que jtk no existe»."},{"type":"term","cmd":"~/.local/bin/jtk --version","out":["jtk 93a6126 2026-10-14"],"source":"real","cwd":"~","notes":"Comprobamos que quedó andando. Imprime el commit y su fecha. Lo corremos con la ruta completa porque esta terminal todavía no tiene el PATH nuevo; en una terminal nueva alcanza con jtk --version. Todavía no tocamos Jira, ni hace falta."},{"type":"term","cmd":"open -e ~/.zshrc","out":[],"source":"inferido","cwd":"~","notes":"Ahora lo único que no hace el agente: las credenciales. Creás un token de API en id.atlassian.com, con el botón «Create API token» a secas, no el que dice «with scopes»: jtk entra por la URL de tu sitio y un token con alcance no funciona. Lo guardás vos, con un editor, en tres variables: JIRA_BASE_URL, JIRA_EMAIL y JIRA_API_TOKEN. Nunca por el chat. Después cerrás Cursor del todo y lo abrís de nuevo.","pause":true}]},{"id":"caso-principal","title":"Caso principal","subtitle":"De «creame una épica» a PLAT-123, con tu clic","screen":"cursor-full","faq":[{"q":"¿Puede el agente escribir en Jira sin que yo lo sepa?","a":"No. Todo comando que escribe necesita --apply, y --apply abre una ventana que solo responde a un clic tuyo en «Apruebo». El agente te avisa antes de lanzarla, pero no puede aprobar por vos."},{"q":"¿Y si aprieto Cancelar, o me voy a tomar un café?","a":"No se escribe nada. Cancelar, Escape, cerrar la ventana o esperar 100 segundos dan lo mismo: el comando sale sin crear y el agente no vuelve a intentarlo salvo que se lo pidas."},{"q":"¿Qué pasa si Jira rechaza una tarea a mitad de camino?","a":"Lo creado se conserva y jtk te dice las claves. Repetir el mismo comando retoma sin duplicar. Si solo falla un cambio de estado, no se repite el create: se termina con un push."},{"q":"¿Por qué «Vos · en curso» y «A decidir»?","a":"Lo que dijiste que estás haciendo se te asigna sin preguntar. Lo que todavía no empezó necesita tu respuesta: asignártelo o dejarlo sin dueño. jtk nunca lo decide por vos."},{"q":"¿Y el MCP de Atlassian que Cursor sugiere cuando escribo «jira»?","a":"No lo uses junto a esta skill. Sus herramientas de escritura no pasan por la ventana de aprobación. La skill le dice al agente que Jira va siempre por jtk."}],"steps":[{"type":"ask","text":"creame una épica para esto que estuvimos trabajando","source":"inferido","notes":"Una frase, como se la dirías a un compañero. Fijate el chat de la izquierda: veníamos hablando del tope al descuento. De ahí saca el contenido; nada de llenar formularios. Pedir así, al cerrar un trabajo, es el hábito que queremos instalar."},{"type":"tool","label":"Read · ~/.cursor/skills/jira-team-kit/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue pasos fijos, no improvisa. El primero: mirar antes de escribir."},{"type":"tool","label":"Ran · jtk update --check","source":"inferido","notes":"Una vez por conversación mira si hay una versión nueva del jtk. Es solo lectura, no toca Jira. Si todo está al día no dice nada, y acá no dice nada: ese es el comportamiento correcto."},{"type":"term","cmd":"~/.local/bin/jtk create --check --project .","out":["Check          Result  Detail","wow plan       no      no wow/plan/manifest.json","jira project   none    ask the person which project and pass --jira-project KEY","existing epic  none    none in specs/*/spec.md or the branch; a key in the conversation is not checked here"],"source":"real","cwd":"~/mi-servicio","notes":"Tres filas, sin red ni credenciales. «wow plan»: si el trabajo ya sale de un plan de WayOfWork, la épica la crea otra herramienta. «jira project»: no hay proyecto por defecto, así que hay que preguntarlo. «existing epic»: si ya existe una épica para esto, se pregunta antes de crear otra. Acá no hay ni plan ni épica. Falta el proyecto. Y una aclaración: el comando sale con la ruta completa, ~/.local/bin/jtk, porque la captura corre sin tu PATH; en tu terminal alcanza con escribir jtk.","pause":true},{"type":"say","md":"No hay plan de WayOfWork ni una épica previa para esto, pero no tengo un proyecto de Jira por defecto. **¿En qué proyecto la creo?**","source":"inferido","notes":"El agente se frena y pregunta, porque la skill dice que nunca se adivina el proyecto. Esta es una de las pocas preguntas obligatorias."},{"type":"ask","text":"En PLAT.","source":"inferido","notes":"Una palabra alcanza. Desde acá el agente pasa --jira-project PLAT en todos los comandos."},{"type":"tool","label":"Read · ~/.cursor/skills/jira-team-kit/references/spec.md","source":"inferido","notes":"Antes de redactar lee el formato del spec. Cada épica, tarea y subtarea necesita tres cosas: por qué, qué y hecho cuando. Si falta una, jtk se niega a seguir. Es lo que evita tickets de una línea que nadie entiende dentro de un mes."},{"type":"tool","label":"Write · ~/scratchpad/spec.json","source":"inferido","notes":"El spec es un JSON que el agente arma desde la conversación: una épica, una tarea con una subtarea, y otra tarea. Lo deja en su carpeta temporal, no en tu repo."},{"type":"term","cmd":"jtk create --spec ~/scratchpad/spec.json --jira-project PLAT --html ~/scratchpad/vista.html --project .","out":["Issue        Tipo      Estado       Asignado        Título","NUEVO-1      Epic      Backlog      A decidir       Tope de descuento","  NUEVO-2    Tarea     En progreso  Vos · en curso  [BE] Acotar el descuento","    NUEVO-3  Subtarea  Backlog      A decidir       Test del tope","  NUEVO-4    Tarea     Backlog      A decidir       [BE] Documentar el tope","preview: ~/scratchpad/vista.html","dry run: nothing created; --apply creates 4 issues in PLAT"],"source":"inferido","cwd":"~/mi-servicio","notes":"El dry run: lo que se crearía, sin escribir nada. La tabla y una página vista.html con forma de pantalla de Jira. Fijate «NUEVO-1»: todavía no hay claves reales. La tarea que decimos que estamos haciendo ya figura «En progreso» y «Vos · en curso»; el resto, «A decidir». Esta salida es inferida: sin credenciales de Jira el comando no corre en la captura, y el formato sale del showcase de la skill.","pause":true},{"type":"tool","label":"Ran · open ~/scratchpad/vista.html","source":"inferido","notes":"Abre la vista previa en el navegador: árbol a la izquierda, descripción con por qué, qué y hecho cuando. Revisala. Es el momento de corregir, no después."},{"type":"say","md":"Armé la épica con **1 tarea con una subtarea** y **1 tarea más**, en PLAT. Abrí `vista.html` para revisarla.\n\nUna decisión que es tuya:\n- la tarea del tope ya la estás haciendo, así que queda **En progreso y a tu nombre**\n- las otras dos están abiertas: **¿te las asigno a vos o las dejo sin asignar?**\n\nCuando me digas, creo todo. No escribo nada hasta tu respuesta.","source":"inferido","notes":"Dos cosas para remarcar. Una: la skill espera un sí explícito antes de escribir. Dos: pregunta por las asignaciones y no las supone. Es la diferencia entre una herramienta que ordena y una que decide por vos.","pause":true},{"type":"ask","text":"Asignámelas a mí y creala.","source":"inferido","notes":"Ese es el sí explícito, con la respuesta sobre las asignaciones incluida. Recién ahora el agente puede ir al comando que escribe."},{"type":"say","md":"Voy a correr el comando que **escribe en Jira**. **Se va a abrir una ventana** con las 4 issues que se crean en PLAT, quién las recibe y los botones **Cancelar** y **Apruebo 4**.\n\nLa aprobación es tu clic en esa ventana: mi pregunta de recién no cuenta, y yo no puedo tocarla. Si cancelás, no lo vuelvo a correr salvo que me lo pidas.","source":"inferido","notes":"Este aviso es parte de la regla de la skill: antes de lanzar un comando con --apply, el agente dice en el chat que se abre una ventana y qué va a aprobarse. Y que la persona tiene que estar presente. Por eso este momento no se apura: esperá a que cada quien lo lea.","pause":true},{"type":"approve","title":"Crear en PLAT","lines":["Epic · Tope de descuento · Crear · Asignado a: Persona del equipo","Tarea · [BE] Acotar el descuento · Crear y mover a En progreso · Asignado a: Persona del equipo","Subtarea · Test del tope · Crear · Asignado a: Persona del equipo","Tarea · [BE] Documentar el tope · Crear · Asignado a: Persona del equipo","Aprobás con un clic en Apruebo 4. Escape o Cancelar no escriben nada. Se cancela sola a los 100 s."],"button":"Apruebo 4","source":"inferido","notes":"La ventana nativa de macOS, con una tarjeta por issue: qué se hace y a quién queda. Mirá la tarea del tope: «Crear y mover a En progreso». Crear y mover son dos escrituras, y las dos figuran antes de aprobar. El número del botón es la cantidad de issues. Return no aprueba. Acá la persona hace el clic; el agente espera. Ventana inferida: la captura no tiene Jira ni macOS de verdad.","pause":true},{"type":"term","cmd":"jtk create --spec ~/scratchpad/spec.json --jira-project PLAT --apply --assign-open --project .","out":["Issue        Tipo      Estado       Asignado        Título","PLAT-123     Epic      Backlog      Vos             Tope de descuento","  PLAT-124   Tarea     En progreso  Vos · en curso  [BE] Acotar el descuento","    PLAT-125 Subtarea  Backlog      Vos             Test del tope","  PLAT-126   Tarea     Backlog      Vos             [BE] Documentar el tope","created PLAT-123; local kanban in .jira-team-kit/PLAT-123/"],"source":"inferido","cwd":"~/mi-servicio","notes":"Con el clic, el comando termina: ahora sí hay claves reales, PLAT-123 a PLAT-126. Y quedó el kanban local en .jira-team-kit, que se mantiene sincronizado en los dos sentidos con pull y push. Inferido: escribe en Jira, por eso nunca corre en la captura."},{"type":"worked","seconds":48,"source":"inferido","notes":"El tiempo que le llevó al agente, sin contar lo que tardaste vos en revisar y aprobar."},{"type":"say","md":"Listo: la épica es **PLAT-123**, con 3 issues debajo (PLAT-124 a PLAT-126).\n\n#### Qué quedó\n- **En Jira:** la épica, la tarea en progreso a tu nombre, la subtarea y la tarea abierta\n- **En tu repo:** el kanban local en `.jira-team-kit/PLAT-123/`; lo editás en archivos y lo subís con `jtk push`\n- **En un registro:** cada escritura queda en `.jira-team-kit/jira-writes.jsonl`","source":"inferido","notes":"Cerrá con las tres cosas que quedaron y por qué importan: Jira tiene lo que aprobaste, tu repo tiene un espejo editable, y hay un registro de cada escritura. Si alguien pregunta «¿y quién creó esto?», el registro responde.","pause":true}]},{"id":"otro-caso","title":"Otro caso","subtitle":"Cambiar varios tickets a la vez con jira-em-ops","screen":"cursor-agent","faq":[{"q":"¿Cuántos tickets puedo cambiar de una vez?","a":"Hasta 25 por plan, y hasta 200 si lo pedís con --max. Mover a «entregado» o «descartado» además exige confirmarlo expresamente."},{"q":"¿Qué pasa si alguien cambió un ticket entre el plan y el apply?","a":"Antes de cada escritura jtk vuelve a leer el issue. Si alguien lo movió o lo reasignó después de planificar, lo saltea y te lo informa. Aplicar el mismo plan dos veces es seguro."},{"q":"¿Se puede deshacer?","a":"Hay jtk plan revert con el plan inverso, pero no garantiza deshacer todo, y lo dice. Por eso el plan se revisa antes de aplicarlo."},{"q":"¿Por qué plan y apply son dos pasos?","a":"Porque planificar solo lee Jira y guarda un archivo: es seguro y lo hace el agente solo. Aplicar escribe, y abre la ventana. Separarlos te deja revisar exactamente qué se va a cambiar."}],"steps":[{"type":"ask","text":"Asigná a una compañera del equipo los tickets sin dueño del view plataforma","source":"inferido","notes":"Otro pedido típico: no es crear, es cambiar muchas cosas ya existentes. Esta vez es jira-em-ops, la hermana de jira-team-kit para operaciones en lote. Necesita que antes hayas guardado el view y el perfil de tus boards, una sola vez."},{"type":"tool","label":"Ran · jtk team status plataforma --list --unassigned","source":"inferido","notes":"Primero lista cuáles son, para que el plan trate exactamente de esos tickets y no de un número. La skill lo dice: si pedís «los 7 sin dueño», primero se listan."},{"type":"term","cmd":"jtk plan assign plataforma --unassigned --person \"Persona del equipo\"","out":["Plan 3f9a1c07b2de · assign · view plataforma · 3 issue(s)","  PLAT-131: unassigned -\u003e Persona del equipo","  PLAT-134: unassigned -\u003e Persona del equipo","  PLAT-140: unassigned -\u003e Persona del equipo","","Plan 3f9a1c07b2de saved in ~/.local/state/jtk/plans/3f9a1c07b2de.json. Nothing was written to Jira.","To apply it, run: jtk apply 3f9a1c07b2de","(a window shows the changes and a person clicks Apruebo; with no window, it asks for your approval in a terminal)"],"source":"inferido","notes":"jtk plan solo lee Jira y guarda un archivo con las claves, el estado de origen y el de destino. Fijate el cierre: «Nothing was written to Jira». Por eso esto lo corre el agente sin pedirte nada. Salida inferida: lee Jira, y en la captura no hay Jira.","pause":true},{"type":"say","md":"Armé el plan **3f9a1c07b2de**: asignar a **una compañera del equipo** los **3 tickets sin dueño** de plataforma (PLAT-131, PLAT-134 y PLAT-140). Hasta acá no escribí nada.\n\n¿Lo aplico?","source":"inferido","notes":"El agente muestra el plan tal cual salió y pregunta. Es el segundo punto de control: el primero es el plan, el segundo es tu sí, y el tercero, el clic."},{"type":"ask","text":"Sí, aplicalo.","source":"inferido","notes":"Un sí en el chat habilita al agente a lanzar el comando. No aprueba nada: eso es el clic."},{"type":"say","md":"Voy a correr `jtk apply 3f9a1c07b2de`. **Se abre una ventana** con los 3 cambios y los botones **Cancelar** y **Apruebo 3**. Tu clic es la aprobación; un «sí» en el chat no cuenta.","source":"inferido","notes":"Mismo aviso previo que en el caso principal. La regla de jira-em-ops es todavía más explícita: nunca hacer clic, teclear ni automatizar la ventana.","pause":true},{"type":"approve","title":"Aplicar el plan 3f9a1c07b2de","lines":["PLAT-131 · Sin asignar → Persona del equipo","PLAT-134 · Sin asignar → Persona del equipo","PLAT-140 · Sin asignar → Persona del equipo","Aprobás con un clic en Apruebo 3. Escape o Cancelar no escriben nada."],"button":"Apruebo 3","source":"inferido","notes":"Misma ventana, otro contenido: una fila por ticket, con el cambio de cada uno. Inferida, igual que la anterior.","pause":true},{"type":"term","cmd":"jtk apply 3f9a1c07b2de","out":["PLAT-131  applied","PLAT-134  applied","PLAT-140  applied"],"source":"inferido","notes":"Apply ejecuta exactamente ese plan, ticket por ticket, y dice qué pasó con cada uno. Si alguno hubiera cambiado mientras tanto, diría que lo saltea. Inferido: escribe en Jira."},{"type":"say","md":"Aplicado: los **3 tickets** son de la compañera ahora. Si querés ver cómo quedó el equipo, corro `jtk team status plataforma`; y si querés volver atrás, `jtk plan revert 3f9a1c07b2de` (no garantiza deshacer todo).","source":"inferido","notes":"Dos salidas después de aplicar: ver el resultado o planificar la inversa. Siempre ofrecidas, nunca hechas sin que lo pidas.","pause":true}]},{"id":"las-otras-skills","title":"Las otras skills","subtitle":"Las que solo leen Jira","screen":"cursor-agent","faq":[{"q":"¿Estas dos también necesitan la ventana?","a":"No. jira-standup y jira-em solo leen: nunca escriben en Jira. Por eso ni siquiera piden aprobación."},{"q":"¿Qué es un «view»?","a":"Una lista guardada de los boards y del equipo que seguís. La armás una sola vez con jtk team setup y después preguntás por «mi equipo» sin repetir nada."},{"q":"¿Puedo preguntar por otra persona?","a":"Sí, con su nombre. Si hay dos personas que coinciden, jtk lista a los candidatos con su email y te pregunta; nunca elige entre dos."}],"steps":[{"type":"ask","text":"¿Qué hice ayer?","source":"inferido","notes":"jira-standup. Tres preguntas personales: qué hiciste, qué podés hacer, en qué estás bloqueado. Más la carga de un compañero y tus métricas de entrega."},{"type":"tool","label":"Ran · jtk done --when yesterday","source":"inferido","notes":"El agente traduce «ayer» a un nombre de ventana y el CLI hace el calendario. Lee Jira en vivo y muestra la salida tal cual, como árbol de épica, tarea y subtarea."},{"type":"say","md":"Ayer pasaste **2 issues** a En progreso o Done: **PLAT-124** (el tope al descuento) y **PLAT-125**. La ventana fue ayer, de lunes a domingo en la zona del equipo.\n\nRecordá que «hecho» significa asignado a vos: si otra persona cerró un issue tuyo, igual aparece.","source":"inferido","notes":"Las skills de lectura dicen qué es y qué no es cada número. Salida de ejemplo, inferida: depende del Jira de cada quien.","pause":true},{"type":"ask","text":"¿Cómo viene mi equipo? ¿Qué está estancado?","source":"inferido","notes":"jira-em: para quien sigue varios boards y un equipo, no para uno mismo. La diferencia con standup es el «mi equipo»."},{"type":"say","md":"Con el view **plataforma** miro `jtk team status` y `jtk team stalled`. Los boards necesitan su perfil guardado: qué estado significa «hecho» en cada proyecto. Si falta alguno te lo pregunto, **no lo adivino**.","source":"inferido","notes":"Un detalle que muestra el criterio de la skill: los roles de cada estado los decide una persona, una vez por proyecto. El agente los relaya, no los elige."},{"type":"say","md":"#### Las cuatro skills\n- **jira-team-kit:** crea épicas desde la conversación y las sincroniza con pull y push\n- **jira-standup:** qué hiciste, qué podés hacer, qué te bloquea\n- **jira-em:** cómo viene el equipo y los boards, solo lectura\n- **jira-em-ops:** cambios en lote con plan y aprobación\n\nLas dos que escriben pasan siempre por la ventana. Las dos que leen, nunca escriben.","source":"inferido","notes":"El resumen del episodio en una tabla mental: dos leen, dos escriben, y las que escriben pasan por la ventana. Si recordás una sola cosa, que sea esa.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores más comunes y cómo salir","screen":"terminal","faq":[{"q":"«No encuentro las credenciales», pero ya las puse","a":"Casi seguro Cursor se abrió antes de que las variables existieran. Cerralo del todo y abrilo de nuevo. Si sigue, revisá las tres variables, con los nombres exactos."},{"q":"Puse el token y no entra","a":"Lo más probable es que lo creaste «con alcance». jtk entra por la URL de tu sitio con tu email y el token, y un token con alcance solo funciona por api.atlassian.com. Creá otro con el botón sin alcance."},{"q":"La ventana no aparece y el comando termina sin escribir","a":"Puede ser que no hay ventana (no es macOS, estás por ssh o sin sesión gráfica) o que la cancelaste o pasaron 100 segundos. Sin ventana, el comando sale con código 3 e imprime la línea para correr en una terminal real."},{"q":"El agente dice que falta un campo del spec","a":"Pedile que complete el por qué, el qué y el hecho cuando de ese issue. Con una descripción libre jtk se niega."}],"steps":[{"type":"term","cmd":"readlink ~/.local/bin/jtk","out":["~/skills/jira-kanban/jtk.py"],"source":"real","cwd":"~","notes":"Si el agente dice que jtk no existe, mirá primero si el enlace está. Acá apunta al clon, o sea el instalador anduvo. Entonces lo que falta es el PATH: la línea del ~/.zshrc y una terminal nueva."},{"type":"term","cmd":"~/.local/bin/jtk who \"Persona del equipo\" --jira-project PLAT","out":["jtk: Jira credentials not found (set JIRA_BASE_URL, JIRA_EMAIL and JIRA_API_TOKEN in the environment, ./.env.local or ./.spec-kit/.env)","# exit 1"],"source":"real","cwd":"~","notes":"El segundo error típico, sin credenciales: jtk no entra y lo dice con las tres variables que busca. Es el mismo comando que se usa para comprobar que todo anda, porque solo lee. Acá falla a propósito: la captura no tiene tu Jira.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Cuándo la uso?","a":"Al cerrar un trabajo para dejarlo registrado, o antes de empezar uno para planificarlo en Jira. Y los cambios en lote, cuando el número de tickets ya duele hacerlos a mano."},{"q":"¿Reemplaza a Jira?","a":"No. Es una puerta con control: escribe en tu Jira con tu aprobación y deja un espejo local. Jira sigue siendo la fuente de verdad."},{"q":"¿Qué necesito para el próximo episodio?","a":"Lo del episodio 0 y haber hecho este: confluence-team-kit usa la misma idea de plan y aprobación, pero para Confluence."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Un pedido de una frase** alcanza: «creame una épica para esto» y la skill trae el formato y el orden.\n- **Nada se escribe sin tu clic:** primero un dry run para revisar, después una ventana con el detalle. El agente avisa, vos aprobás.\n- **Quedan un espejo local y un registro** de cada escritura.\n\n#### Próximo episodio: confluence-team-kit\nCómo publicar la documentación de tu repo en Confluence sin pisar a nadie: un plan, el aviso si alguien editó la página y una aprobación humana.","source":"inferido","notes":"Las tres ideas son el porqué de adoptarla: poco esfuerzo, control y rastro. El próximo episodio sigue con la misma lógica de plan y aprobación, ahora para la documentación. Si cambia el orden de la serie, cambiá la línea del próximo episodio.","pause":true}]}]},{"id":"confluence-team-kit","series":"cursor","order":3,"title":"confluence-team-kit","pitch":{"ask":"Mostrame qué publicaría este repo en Confluence","does":"Calcula el plan de páginas, te muestra qué cambia (y si alguien editó una página en Confluence) y, cuando vos aprobás con un clic en una ventana, publica sin pisar a nadie."},"skill":{"repo":"confluence-team-kit","commit":"f432c40","date":"2026-10-19"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md",".confluence.yml"],"chats":[{"title":"Actualizar el runbook de despliegue","age":"2h"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: la herramienta, la skill, el MCP y tus credenciales","screen":"terminal","faq":[{"q":"¿Puedo pedirle al agente que la instale?","a":"Casi todo sí. En Cursor decile «Instalá confluence-team-kit: cloná el repo, corré uv sync y dejá ctk en el PATH». Lo que no le pedís es el token de Confluence: eso lo guardás vos, con un editor, y nunca por el chat."},{"q":"¿Qué es uv y por qué hace falta?","a":"Es el programa que trae el Python que necesita ctk (3.12 o más) y sus dependencias, sin tocar el Python de tu máquina. Si hiciste el episodio 0, ya lo tenés."},{"q":"¿Y qué es el MCP? ¿Es obligatorio?","a":"Es un enchufe que le da al agente tres herramientas de ctk para leer Confluence y preparar publicaciones. No es obligatorio: sin él, el agente corre los mismos comandos de ctk en la terminal. Con él, las ventanas de aprobación salen igual."},{"q":"¿Por qué el archivo de configuración del MCP lleva el token?","a":"Porque algunos editores no heredan las variables de tu terminal y hay que pasárselas al servidor. Por eso ese archivo es tan secreto como el token: no se commitea ni se comparte."}],"steps":[{"type":"term","cmd":"git clone git@github.com:josefigueredo/confluence-skill-mcp.git skills/confluence-team-kit","out":["Cloning into 'skills/confluence-team-kit'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo: trae el comando ctk, la skill y el MCP en un solo lugar. Es un git clone común y necesita acceso por SSH a la organización, porque el repo es privado; el episodio 0 lo dejó listo. Paso inferido: necesita red."},{"type":"term","cmd":"cd ~/skills/confluence-team-kit \u0026\u0026 uv sync --extra mcp","out":["Using CPython 3.13.7","Creating virtual environment at: .venv","Resolved 28 packages in 9ms","Installed 27 packages in 41ms"," + confluence-team-kit==0.1.0 (from file://~/skills/confluence-team-kit)"," + mcp==2.3.0"," + requests==2.34.2"," + ... (y las demás)"],"source":"inferido","cwd":"~","notes":"Acá entra uv. Pensalo como un ayudante que arma un cuarto aparte, con el Python y las piezas que ctk necesita, sin tocar nada del resto de tu máquina. El extra mcp suma la pieza que habla con el agente. Si uv no está, es brew install uv, como en el episodio 0. Salida inferida: las versiones cambian con el tiempo."},{"type":"term","cmd":"cd ~/skills/confluence-team-kit \u0026\u0026 uv tool install .","out":["Installed 2 executables: ctk, ctk-mcp"],"source":"inferido","cwd":"~","notes":"Esto deja ctk disponible desde cualquier carpeta. Importa mucho: ctk se corre en la raíz del repo que querés publicar, no dentro de este clon. Sin este paso solo anda con uv run --project y la ruta del clon. Si te avisa que falta una carpeta en el PATH, es la línea del ~/.zshrc de siempre. Fijate que aparece también ctk-mcp: ese programa solo corre con el extra mcp, y por eso la configuración del MCP usa uv run --project … --extra mcp."},{"type":"term","cmd":"ctk --help","out":["usage: ctk [-h] [--root ROOT] {plan,apply,ci,diff,grant,tree,read} ...","","positional arguments:","  {plan,apply,ci,diff,grant,tree,read}","    plan                compute what would change, write nothing to Confluence","    apply               apply a plan after a person approves it","    ci                  plan or publish from GitHub Actions; the merge is the approval","    diff                show what the source would change on pages edited in Confluence","    grant               mark an anchor page as owned by a repo (platform)","    tree                walk the page tree under a page","    read                show a page with its sync state and owner"],"source":"inferido","cwd":"~/mi-servicio","notes":"La prueba de que quedó andando, y de paso el mapa de todo el episodio. Señalá tres: plan solo lee, apply y grant son los que escriben y piden aprobación, y ci es solo para GitHub Actions: lo mencionamos, nunca lo corremos desde la compu. Inferido porque ctk necesita Python 3.12 y acá no lo hay."},{"type":"term","cmd":"mkdir -p ~/.cursor/skills","out":[],"source":"real","cwd":"~","notes":"La skill es lo que le enseña al agente cuándo usar ctk y qué reglas seguir. Primero creamos la carpeta donde Cursor busca skills, si todavía no existe."},{"type":"term","cmd":"ln -s ~/skills/confluence-team-kit/skills/confluence-team-kit ~/.cursor/skills/confluence-team-kit","out":[],"source":"real","cwd":"~","notes":"Un enlace simbólico es un acceso directo: no copia nada, apunta al clon, y así hay una sola versión. Cada vez que actualices el clon, el agente ve la skill nueva."},{"type":"term","cmd":"readlink ~/.cursor/skills/confluence-team-kit","out":["~/skills/confluence-team-kit/skills/confluence-team-kit"],"source":"real","cwd":"~","notes":"Comprobamos que el enlace apunta donde debe. Es la misma comprobación que vas a necesitar si el agente dice que no conoce la skill."},{"type":"term","cmd":"open -e ~/.zshrc","out":[],"source":"inferido","cwd":"~","notes":"Ahora lo único que no hace el agente: las credenciales. En id.atlassian.com creás un token de API con el botón «Create API token» a secas, no el que dice «with scopes»: ctk entra por la URL de tu sitio y un token con alcance no funciona. Guardás tres variables en este archivo: CONFLUENCE_BASE_URL, sin /wiki y sin barra final, CONFLUENCE_EMAIL y CONFLUENCE_TOKEN. Con un editor, nunca por el chat. Después cerrás Cursor del todo y lo abrís otra vez.","pause":true},{"type":"term","cmd":"cat ~/.cursor/mcp.json","out":["{","  \"mcpServers\": {","    \"confluence\": {","      \"command\": \"uv\",","      \"args\": [\"run\", \"--project\", \"/ruta/a/confluence-team-kit\", \"--extra\", \"mcp\", \"ctk-mcp\"],","      \"env\": {","        \"CTK_ROOT\": \"/ruta/al/repo/que/publica\",","        \"CONFLUENCE_BASE_URL\": \"https://tu-sitio.atlassian.net\",","        \"CONFLUENCE_EMAIL\": \"vos@example.com\",","        \"CONFLUENCE_TOKEN\": \"\u003ctu-token\u003e\"","      }","    }","  }","}"],"source":"inferido","cwd":"~","notes":"Último paso de la instalación: conectar el MCP. Es el archivo de configuración de MCP que usa Cursor normalmente (~/.cursor/mcp.json); la guía de ctk solo dice «la configuración de MCP de tu editor», así que si el tuyo guarda otra ruta, es ahí. Le decís a Cursor que arranque ctk-mcp con uv. Dos cosas para remarcar. CTK_ROOT es el repo que publica y las herramientas no reciben rutas: el agente no puede apuntar el servidor a otra carpeta, hay un servidor por repo. Y este archivo lleva el token, así que no se commitea. Sin las tres variables, el servidor se niega a arrancar y lo dice."}]},{"id":"caso-principal","title":"Caso principal","subtitle":"Del plan al diff y a la ventana: publicar un cambio del runbook","screen":"cursor-full","faq":[{"q":"¿Puede el agente publicar solo?","a":"No. Planifica y lee todo lo que quiera, pero para escribir lanza ctk apply y se abre una ventana: la aprobación es tu clic, y el agente no puede tocarla."},{"q":"¿Qué pasa si cierro la ventana o no hago nada?","a":"No se escribe nada. Cancelar, Escape, cerrarla o dejar pasar los 100 segundos termina el comando con código 3, y el agente no reintenta: te pregunta qué querés."},{"q":"¿Y la terminal, no pedía escribir «Apruebo n»?","a":"Sí: si corrés ctk apply vos en una terminal, escribís esa frase ahí. Cuando lo lanza el agente no hay terminal para vos, entonces sale la ventana. Es la misma regla con otra puerta."},{"q":"¿Hay una forma de publicar sin nadie que apruebe?","a":"Una sola: ctk ci, en GitHub Actions, donde el merge a la rama por defecto es la aprobación. Corre solo ahí y desde la compu nunca se corre ni se simula."}],"steps":[{"type":"ask","text":"Actualicé el runbook. Mostrame qué se publicaría en Confluence, sin escribir nada.","source":"inferido","notes":"Un pedido de lo más normal: acabás de editar un documento y querés saber qué cambia. Fijate el chat de la izquierda: veníamos trabajando en el runbook de despliegue. No hay nada que configurar ni comando que recordar."},{"type":"tool","label":"Read · ~/.cursor/skills/confluence-team-kit/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue las reglas de la skill: Confluence se toca solo con ctk, primero se planifica y para escribir hace falta una persona."},{"type":"tool","label":"Read · .confluence.yml","source":"inferido","notes":"Antes de planificar mira el manifest: el archivo que dice qué carpeta o archivo va bajo qué página ancla de Confluence. Es la receta que ya tiene el repo; el agente no inventa a dónde publicar."},{"type":"term","cmd":"ctk plan","out":["UNCHANGED docs/arquitectura/index.md  'Arquitectura del servicio'","UNCHANGED docs/arquitectura/componentes.md  'Componentes'","UNCHANGED docs/arquitectura/decisiones  'Decisiones'","UNCHANGED docs/arquitectura/decisiones/adr-001.md  'ADR 001: usar colas'","UPDATE    docs/runbook.md  'Runbook de despliegue'","1 update, 4 unchanged","plan written to ctk-plan.json"],"source":"inferido","cwd":"~/mi-servicio","notes":"Este es el comando central. ctk plan lee Confluence, compara con tus archivos y escribe un plan en ctk-plan.json. No escribe nada en Confluence. Cada línea es una acción: UPDATE es una página cuyo origen cambió, UNCHANGED es nada que hacer. Acá una sola página cambia y las otras cuatro siguen igual. Inferido porque lee un Confluence real."},{"type":"term","cmd":"ctk diff","out":["UPDATE docs/runbook.md  'Runbook de despliegue'  (page 5014)","--- confluence","+++ local","@@ -1,2 +1,2 @@"," \u003ch2\u003eDespliegue\u003c/h2\u003e","-\u003cp\u003eCorré el job a mano.\u003c/p\u003e","+\u003cp\u003eCorré el job desde el pipeline.\u003c/p\u003e"],"source":"inferido","cwd":"~/mi-servicio","notes":"El diff es el paso que casi nadie conoce y el que da tranquilidad. Muestra el lado de Confluence contra lo que publicaría tu repo: el signo menos es lo que hoy está en Confluence, el más es lo que va a quedar. Se imprime acá y no se guarda en ningún lado. Lo leés como un control de cambios de un documento."},{"type":"say","md":"Se publicaría **una sola página**: `docs/runbook.md`, que pasa de «Corré el job a mano» a «Corré el job desde el pipeline». Las otras **4 páginas no cambian**.\n\nHasta acá no escribí nada en Confluence. **¿Lo publico?**","source":"inferido","notes":"Mirá cómo cierra el agente: resume en una frase, dice qué no tocó y pregunta. La skill exige mostrar las filas y esperar tu visto bueno antes de aplicar. Tu sí en el chat habilita el comando, pero todavía no aprueba nada."},{"type":"ask","text":"Dale, publicalo.","source":"inferido","notes":"Ese es el visto bueno. Recién ahora el agente puede ir al comando que escribe."},{"type":"say","md":"Voy a correr el comando que **escribe en Confluence**. **Se va a abrir una ventana** con la página que se actualiza y los botones **Cancelar** y **Apruebo 1**.\n\nLa aprobación es tu clic en esa ventana: mi pregunta de recién no cuenta, y yo no puedo tocarla. Si cancelás o la cerrás, no lo vuelvo a correr salvo que me lo pidas.","source":"inferido","notes":"Este aviso es parte de la regla de la skill: antes de lanzar ctk apply, el agente avisa que se abre una ventana y qué va a aprobarse. Y que vos tenés que estar adelante de la pantalla. Si no estás, deja el comando listo para que lo corras vos. Remarcá la última frase: si cancelás, no insiste.","pause":true},{"type":"approve","title":"Publicar en Confluence","lines":["docs/runbook.md · 'Runbook de despliegue' · UPDATE · página 5014, título actual en Confluence: Runbook de despliegue","Aprobás con un clic en Apruebo 1. Escape, Return o Cancelar no escriben nada. Se cancela sola a los 100 s."],"button":"Apruebo 1","source":"inferido","notes":"La ventana nativa de macOS, con una tarjeta por página: ruta, título y el cambio. Para una página que ya existe, además, muestra su id y su título actual leídos justo antes de abrirla, para que un plan que nombra una página y apunta a otra no pueda pasar como inocente. Es lo que tenés que mirar antes de hacer clic, y recordá que Return no aprueba: solo el clic. Inferida: no se puede capturar sin una persona.","pause":true},{"type":"term","cmd":"ctk apply ctk-plan.json","out":["UNCHANGED docs/arquitectura/index.md  'Arquitectura del servicio'","UNCHANGED docs/arquitectura/componentes.md  'Componentes'","UNCHANGED docs/arquitectura/decisiones  'Decisiones'","UNCHANGED docs/arquitectura/decisiones/adr-001.md  'ADR 001: usar colas'","UPDATE    docs/runbook.md  'Runbook de despliegue'","1 update, 4 unchanged","done    UPDATE docs/runbook.md"],"source":"inferido","cwd":"~/mi-servicio","notes":"Con tu clic, apply ejecuta exactamente ese plan y dice qué hizo con cada página. Antes de escribir vuelve a comprobar que la página sigue siendo de este repo y que nadie la editó después del plan; si algo cambió, esa acción falla y hay que planificar de nuevo. Inferido: escribe en Confluence."},{"type":"worked","seconds":27,"source":"inferido","notes":"El tiempo del agente, sin contar lo que tardaste vos en revisar y aprobar."},{"type":"say","md":"Listo: **`docs/runbook.md` ya está actualizado en Confluence**, con el cambio que revisamos.\n\n#### Qué quedó\n- **En Confluence:** la página nueva versión, con el estado de la sincronización guardado en la propia página\n- **En tu repo:** solo `ctk-plan.json`, el plan; conviene ignorarlo en git\n\nPara comprobar, pedime otro plan: tiene que decir **`5 unchanged`**.","source":"inferido","notes":"Cerrá con lo que queda y por qué importa: el estado vive en Confluence y no en tu repo, así que no hay archivos de estado que se desincronicen. Y la prueba de que todo cerró es un segundo plan que dice todo igual.","pause":true}]},{"id":"otro-caso","title":"Otro caso","subtitle":"Alguien editó la página en Confluence: el drift","screen":"cursor-agent","faq":[{"q":"¿Qué es el drift?","a":"Que alguien editó la página directo en Confluence después de tu última publicación, y vos también cambiaste el archivo. Publicar pisaría su edición, así que ctk frena y avisa."},{"q":"¿Qué pasa con on_drift en su valor por defecto?","a":"Con repo_wins el repo es la fuente de verdad y pisa la edición, pero solo si estás en la última versión de la rama por defecto; el plan lo avisa en la propia fila. Si no estás al día, bloquea y dice por qué: la salida es ponerte al día, nunca cambiar on_drift. Con on_drift: fail no se pisa nunca."},{"q":"¿Cómo traigo lo que escribió la otra persona?","a":"A mano: ctk detecta que la página cambió y muestra el diff, pero no fusiona. Copiás el cambio al .md y planificás de nuevo. El plan puede seguir diciendo DRIFT, porque compara con la página de Confluence; con repo_wins y al día no se pierde nada, y publicar sigue pidiendo tu aprobación."},{"q":"¿Y si el plan sale BLOCKED?","a":"Es que la página ancla no tiene dueño, o es de otro repo. No es un error tuyo: Plataforma tiene que correr ctk grant, que también abre su ventana de aprobación. El agente no lo arregla creando la página por su cuenta."}],"steps":[{"type":"ask","text":"Alguien tocó el runbook directo en Confluence. ¿Qué pasa si publico?","source":"inferido","notes":"Otro pedido típico, y mucho más delicado: no es publicar, es no pisar a nadie. Es la razón de ser de ctk. Fijate que no le decís qué comando usar; la skill lo sabe."},{"type":"term","cmd":"ctk plan","out":["UNCHANGED docs/arquitectura/index.md  'Arquitectura del servicio'","UNCHANGED docs/arquitectura/componentes.md  'Componentes'","UNCHANGED docs/arquitectura/decisiones  'Decisiones'","UNCHANGED docs/arquitectura/decisiones/adr-001.md  'ADR 001: usar colas'","DRIFT     docs/runbook.md  'Runbook de despliegue'  -- remote page was edited since the last sync; repo wins: this checkout is the latest version of the default branch, so the Confluence edit is overwritten","1 drift, 4 unchanged","plan written to ctk-plan.json"],"source":"inferido","cwd":"~/mi-servicio","notes":"Ahora la fila dice DRIFT: alguien editó la página en Confluence y vos también cambiaste el archivo. Fijate el final de la línea: este repo usa el valor por defecto, repo_wins, y como estás en la última versión de la rama por defecto el plan no bloquea y avisa que la edición de Confluence se pisaría. Sale con código 0 y todavía no escribió nada: publicar es otro comando, con ventana. Inferido: el texto sale de plan.py, el resto es ilustrativo."},{"type":"term","cmd":"ctk diff --key docs/runbook.md","out":["DRIFT docs/runbook.md  'Runbook de despliegue'  (page 5014)","--- confluence","+++ local","@@ -1,3 +1,3 @@"," \u003ch2\u003eDespliegue\u003c/h2\u003e","-\u003cp\u003eAvisá en el canal antes de correr el job.\u003c/p\u003e","+\u003cp\u003eCorré el job desde el pipeline.\u003c/p\u003e"," \u003cp\u003eRevertí con el botón de rollback.\u003c/p\u003e"],"source":"inferido","cwd":"~/mi-servicio","notes":"El diff dice exactamente qué pasó. Alguien agregó en Confluence un aviso de «avisá en el canal» que tu archivo no tiene; y vos cambiaste otra línea. Solo lee, imprime acá y no guarda nada. Es lo que la skill pide mirar antes de decidir."},{"type":"say","md":"La página tiene una línea que **tu archivo no tiene**: alguien agregó «Avisá en el canal antes de correr el job». Si publico, el plan lo dice claro: **el repo gana y esa línea se pisa**.\n\n**¿Qué lado gana?**\n- **Recomendado:** traigo esa línea a `docs/runbook.md`, planifico de nuevo y recién ahí publicamos, sin perder nada\n- **Si gana tu versión tal cual:** lo decidís vos; yo **no toco Confluence ni cambio `on_drift`**\n\nHasta que me digas, no publico nada.","source":"inferido","notes":"Acá se ve el criterio de la skill. Aunque el plan permitiría pisar, el agente no elige un lado por vos: te muestra qué se perdería y te pregunta. Y se cuida de dos atajos prohibidos: resolver el drift borrando la página o editando Confluence por su cuenta. Lo seguro es traer el cambio al archivo y volver a planificar."},{"type":"ask","text":"Traé la línea al archivo.","source":"inferido","notes":"Una decisión humana, en una frase. El agente edita tu archivo, que es tuyo, y no Confluence."},{"type":"tool","label":"Edit · docs/runbook.md","source":"inferido","notes":"Edita el runbook para sumar la línea de la otra persona. Es un cambio en tu repo que ves en el diff de Cursor y podés deshacer."},{"type":"tool","label":"Ran · ctk plan","source":"inferido","notes":"Planifica de nuevo con la línea ya en el archivo. Ojo, que es lo contraintuitivo: la fila sigue diciendo DRIFT. ctk compara la página de Confluence con lo que publicaría tu repo, no fusiona, y la página todavía no coincide con tu archivo. Pero ahora el repo gana sin perder nada: lo único que se pisa es la versión vieja de Confluence, porque la línea de la otra persona ya está en tu archivo. Sale con código 0."},{"type":"say","md":"Hecho: la línea de la otra persona **ya está en `docs/runbook.md`**. El plan sigue marcando **DRIFT**, pero ahora **el repo gana sin perder nada**: solo se reemplaza la versión vieja de la página.\n\n**¿Lo publico?** Se abre la misma ventana de aprobación que antes.","source":"inferido","notes":"Terminó donde terminan todos los casos de escritura: pregunta y espera. Si decís que sí, se repite el aviso previo y la ventana que ya viste. Remarcá que el plan dijo DRIFT a propósito: es el aviso, no un error, y lo que protege es que primero trajimos el cambio ajeno al archivo.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores más comunes y cómo salir","screen":"terminal","faq":[{"q":"El agente no usa la skill y habla de otra herramienta de Confluence.","a":"Revisá que el enlace de la skill exista y apunte al clon: el readlink de este capítulo. La skill dice que Confluence se toca solo con ctk, nunca con otro conector."},{"q":"«error: missing environment». ¿Qué falta?","a":"Las tres variables de Confluence. Si ya las guardaste, casi seguro Cursor se abrió antes de que existieran: cerralo del todo y abrilo de nuevo."},{"q":"Cancelé la ventana sin querer. ¿Cómo sigo?","a":"Nada se escribió. Pedile al agente que lo vuelva a intentar: no lo hace solo, a propósito, y te va a preguntar."},{"q":"«cannot tell which repo this is».","a":"El repo no tiene remoto origin. Pasá --repo org/nombre a ctk plan."}],"steps":[{"type":"term","cmd":"readlink ~/.cursor/skills/confluence-team-kit","out":["~/skills/confluence-team-kit/skills/confluence-team-kit"],"source":"real","cwd":"~","notes":"Si el agente no parece conocer la skill, mirá primero si el enlace está. Acá apunta al clon, o sea que la instalación anduvo: lo que falta es reiniciar Cursor."},{"type":"term","cmd":"ctk plan","out":["error: missing environment: CONFLUENCE_BASE_URL, CONFLUENCE_EMAIL, CONFLUENCE_TOKEN","# exit 1"],"source":"inferido","cwd":"~/mi-servicio","notes":"El segundo error típico: faltan las credenciales y ctk lo dice con las tres variables que busca. Casi siempre es que Cursor se abrió antes de guardarlas, así que cerralo del todo y abrilo. Inferido: esta captura no puede correr ctk, la salida es la de la documentación."},{"type":"term","cmd":"ctk plan","out":["BLOCKED   docs/arquitectura/  'docs/arquitectura/'  -- anchor 5001 has no owner; ask the platform team to run `ctk grant 5001 --owner tu-empresa/demo-servicio`","1 blocked","plan written to ctk-plan.json","# exit 2"],"source":"inferido","cwd":"~/mi-servicio","notes":"El tercero no es un error tuyo ni del agente: la página ancla todavía no tiene dueño, y ctk no escribe bajo un ancla sin dueño. La salida está en la propia fila: Plataforma corre ctk grant, que también abre una ventana. Lo único que podés hacer vos es pedírselo.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Tengo que instalar el MCP para usar la skill?","a":"No. Sin el MCP el agente corre ctk en la terminal; con él, usa tres herramientas (page, publish, anchor) con las mismas reglas y la misma ventana."},{"q":"¿Qué tan seguro es el dueño de una página?","a":"Es un guardrail ante errores, no una frontera de seguridad: el token de Confluence es compartido, así que cualquiera con él puede escribir sin pasar por ctk."},{"q":"¿Qué sigue?","a":"El episodio 4: product-brain-mcp, otra herramienta con MCP y con la misma ventana de aprobación."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Primero el plan, después el diff, después la escritura:** `ctk plan` y `ctk diff` solo leen; publicar es un paso aparte.\n- **Nada se escribe sin tu clic:** el agente avisa que se abre la ventana, vos aprobás, y si cancelás no insiste.\n- **No se pisa a nadie:** si alguien editó la página, hay drift y primero se trae el cambio al archivo, antes de publicar.\n\n#### Próximo episodio: product-brain-mcp\nCómo armar una iniciativa completa (el PRD, el RFC y las épicas) desde una conversación y exportarla a Jira, con otro MCP y otra ventana de aprobación.","source":"inferido","notes":"Las tres ideas son el producto: plan antes de escribir, tu clic como única puerta, y no pisar a nadie. Anticipá el próximo en una frase: es el mismo patrón, con un MCP, pero para pasar de una conversación a una iniciativa completa.","pause":true}]}]},{"id":"product-brain-mcp","series":"cursor","order":4,"title":"product-brain-mcp","pitch":{"ask":"Quiero armar la iniciativa «Autogestión de devoluciones», con su PRD, su RFC y sus épicas","does":"Te hace las preguntas de a una, redacta el documento entero, lo abre en tu editor para que lo revises y, con tu «listo» y un clic tuyo, lo escribe. Después exporta las épicas a Jira con tu aprobación."},"skill":{"repo":"product-brain-mcp","commit":"64d7721","date":"2026-10-20"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: la herramienta, el MCP, la configuración y tu token","screen":"terminal","faq":[{"q":"¿Por qué pide Python 3.12 y yo no lo tengo?","a":"No tenés que instalarlo vos. uv, el ayudante que usamos, trae el Python 3.12 que la herramienta necesita y lo guarda aparte, sin tocar el Python de tu máquina. Lo que sí necesitás es uv: si hiciste el episodio 0, ya lo tenés."},{"q":"¿Qué es el MCP y por qué aparece un archivo mcp.json?","a":"Es el enchufe que le da al agente seis herramientas para hablar con tu espacio de trabajo. El mcp.json es la lista de enchufes que Cursor arranca: ahí le decís qué programa correr. Lo escribe el instalador y no lleva ningún secreto."},{"q":"¿Puedo pedirle al agente que instale todo?","a":"Casi: «Instalá product-brain-mcp: cloná el repo y corré ./install.sh». Lo que no le pedís es el token: es tu sesión, lo copiás y lo guardás vos, y nunca pasa por el chat."},{"q":"¿Funciona en Windows o Linux?","a":"No. Cada escritura se aprueba en una ventana nativa de macOS, y sin ella el servidor se niega a escribir."}],"steps":[{"type":"term","cmd":"git clone \u003crepo\u003e skills/product-brain-mcp","out":["Cloning into 'skills/product-brain-mcp'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo: trae la skill y el servidor juntos. En \u003crepo\u003e va la dirección que te da tu equipo; necesita red y acceso, que dejó listo el episodio 0. Paso inferido."},{"type":"term","cmd":"uv --version","out":["uv 0.5.0"],"source":"inferido","cwd":"~","notes":"Acá aparece uv, lo único que tenés que tener antes. Pensalo como un ayudante que arma un cuarto aparte con el Python 3.12 y las piezas que hacen falta, sin tocar nada del resto de tu máquina. Si no existe, brew install uv, como en el episodio 0. Salida inferida."},{"type":"term","cmd":"cd ~/skills/product-brain-mcp \u0026\u0026 ./install.sh","out":["skill: product-brain -\u003e ~/skills/product-brain-mcp/skill/product-brain (Claude Code, Codex, Cursor)","MCP server product-brain: Claude Code: skipped (claude is not on PATH); Cursor: registered","next: put base_url in ~/.config/product-brain/config.toml, copy the token and run: uv run --project ~/skills/product-brain-mcp pbmcp token paste"],"source":"inferido","cwd":"~","notes":"Un solo comando hace dos cosas. Enlaza la skill, que le enseña al agente cuándo y cómo usar las herramientas, y escribe el servidor en el mcp.json de Cursor. No copia nada: son accesos directos a tu clon. Si tenés Claude Code también lo registra; acá no estaba y por eso dice skipped. Correrlo de nuevo es seguro. La última línea te dice qué falta. Inferido: corre uv sync, que necesita red."},{"type":"term","cmd":"cat ~/.cursor/mcp.json","out":["{","  \"mcpServers\": {","    \"product-brain\": {","      \"command\": \"uv\",","      \"args\": [\"run\", \"--project\", \"/RUTA/A/product-brain-mcp\", \"pbmcp\"]","    }","  }","}"],"source":"inferido","cwd":"~","notes":"Esto dejó el instalador: le dice a Cursor que arranque el servidor con uv desde tu clon. Remarcá dos cosas. La ruta de --project es la de tu clon: si lo movés, el instalador no actualiza una entrada que ya existe y hay que corregirla a mano; es la causa más común de un servidor con error. Y este archivo no tiene ningún secreto. En Cursor Settings, en MCP, el servidor tiene que aparecer encendido con sus seis herramientas; si no, cerrá Cursor del todo y abrilo."},{"type":"term","cmd":"mkdir -p ~/.config/product-brain","out":[],"source":"real","cwd":"~","notes":"Ahora la configuración. Todo vive en una carpeta tuya, fuera del repo. Primero la creamos, si no existe."},{"type":"term","cmd":"cat ~/.config/product-brain/config.toml","out":["base_url = \"https://\u003cel backend de tu equipo\u003e\"","deletes_enabled = false"],"source":"real","cwd":"~","notes":"La configuración no tiene nada secreto: es la dirección del backend de tu equipo, y una línea que hoy no hace nada. Esto sí se lo podés pedir al agente. Sin este archivo, cualquier herramienta falla con config_missing y te dice qué ruta falta."},{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token paste","out":["saved 107 characters to ~/.config/product-brain/token"],"source":"inferido","cwd":"~","notes":"Esto es lo único que no hace el agente, a propósito. El token es tu sesión: lo que hace que los cambios queden a tu nombre. Con tu sesión iniciada en el navegador, abrís las herramientas de desarrollo, buscás okta-token-storage en Local Storage y copiás accessToken.accessToken. Con eso en el portapapeles, corrés este comando: lo guarda con permisos solo tuyos e imprime cuántos caracteres guardó. Nunca lo pegues en el chat. Dura unas 8 horas. Inferido: necesita uv y tu sesión real.","pause":true},{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': True, 'valid': True, 'minutes_left': 464, 'warn': False, 'error': None}"],"source":"inferido","cwd":"~","notes":"La prueba de que quedó bien, sin salir a la red. Mirá minutes_left; con menos de 30, warn pasa a True y el agente te avisa. Una cosa más a mano: allowed_projects, la lista de proyectos donde se puede escribir. Los que creás desde la skill se suman solos; uno que ya existía lo sumás vos con un editor. Es una barrera y no se le pide al agente que la amplíe."}]},{"id":"caso-principal","title":"Caso principal","subtitle":"De una idea a la iniciativa y su PRD, con una ventana de aprobación por cada escritura","screen":"cursor-full","faq":[{"q":"¿Escribe algo antes de que yo diga «listo»?","a":"No. El borrador es un archivo privado en tu máquina que se abre en el editor. Recién con tu «listo» el agente pide escribirlo, y ahí se abre la ventana."},{"q":"¿Qué es el {{pendiente}}?","a":"Es la marca de un dato que nadie dio, o que no cumple las metas del documento anterior. El sistema lo cuenta como campo vacío, así que el hueco se ve. Si el agente escribiera «a definir», contaría como completo y escondería el problema."},{"q":"¿Y si cancelo la ventana o no hago nada?","a":"No se escribe nada. Cancelar, Escape, cerrarla o dejar pasar 100 segundos es un rechazo, y el agente te pregunta qué cambiar. Editás el mismo borrador y decís «listo» otra vez."},{"q":"¿Cuándo uso workflow y cuándo documentos sueltos?","a":"Lo decide un número que el agente cuenta con vos: cuántos equipos entregan. Con uno, workflow: PRD, RFC y una épica encadenados. Con dos o más, una épica por equipo, sueltas."}],"steps":[{"type":"ask","text":"Quiero armar la iniciativa «Autogestión de devoluciones» con su PRD, su RFC y sus épicas. Hoy las devoluciones las resuelve soporte a mano y tardan 9 días. La meta es bajar a 3 días para el 01/03. Las hace un solo equipo, en dos entregas: 15/01 y 27/02. Afuera queda el reembolso a otros medios de pago.","source":"inferido","notes":"Un pedido normal, con mucho contexto de entrada, a propósito: cuanto más le contás en un solo mensaje, menos preguntas te hace. Fijate lo que dice: el problema con su número, la meta, el plazo, cuántos equipos entregan y qué queda afuera. No hay comandos ni nombres de herramientas: la skill sabe qué hacer."},{"type":"tool","label":"Read · ~/.cursor/skills/product-brain/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue sus reglas: preguntar de a una cosa, armar el documento entero, chequear contra las metas y escribir solo con tu clic."},{"type":"tool","label":"Ran · session(action=\"token_status\")","source":"inferido","notes":"Lo primero que hace siempre: mirar que tu token valga y cuánto le queda. Es solo lectura y no sale a la red."},{"type":"tool","label":"Ran · session(action=\"whoami\")","source":"inferido","notes":"Segunda lectura: quién sos en el sistema, para saludarte y para que todo quede a tu nombre."},{"type":"tool","label":"Ran · project(action=\"list\")","source":"inferido","notes":"Mira qué proyectos hay para elegir uno, o crear uno nuevo. Otra lectura."},{"type":"say","md":"Hola, **Persona del equipo**. Tu token vale por **464 minutos** más.\n\n#### Resumen a aprobar\n- **Problema:** las devoluciones se resuelven a mano en soporte y tardan **9 días**\n- **Usuarios:** clientes que devuelven y el equipo de soporte\n- **Éxito:** bajar a **3 días** para el **01/03**\n- **Afuera:** reembolso a otros medios de pago\n- **Restricciones:** un solo equipo, dos entregas (**15/01** y **27/02**)\n\n¿Está bien? Con tu sí creo el proyecto, y **se abre una ventana** con lo que se va a crear: **Cancelar** y **Aprobar**. La aprobación es tu clic, no mi pregunta.","source":"inferido","notes":"Mirá cómo cierra el agente: resume en cinco líneas lo decidido, que es el contrato de lo que sigue. Y avisa que se abre una ventana antes de lanzar el comando que escribe. Es una regla de la skill, y que vos estés frente a la pantalla es lo que hace valer la aprobación. Si no estás, no lo corre."},{"type":"ask","text":"Sí, creá el proyecto.","source":"inferido","notes":"El visto bueno del resumen. Todavía no es la aprobación de la escritura: esa es la que viene.","pause":true},{"type":"approve","title":"Crear proyecto","lines":["Proyecto nuevo: «Autogestión de devoluciones»","Se agrega a tus proyectos permitidos para que la herramienta pueda escribir en él.","Aprobás con un clic en Aprobar. Cancelar, Escape o cerrar la ventana no escriben nada. Se cancela sola a los 100 s."],"button":"Aprobar","source":"inferido","notes":"La primera ventana nativa de macOS, el único camino para escribir. Muestra el plan en claro, qué se va a crear, no un resumen del agente. Crear un proyecto lo suma además a la lista de proyectos permitidos. Si cancelás, cerrás o esperás, no pasa nada. Inferida: no se puede capturar sin una persona.","pause":true},{"type":"say","md":"Proyecto creado y habilitado.\n\nAntes de escribir, el modo. **Equipos que entregan: 1 → workflow**: el PRD, el RFC y **una** épica encadenados, con las dos entregas como historias en orden. Con dos equipos o más serían épicas sueltas.\n\n¿Vamos con workflow?","source":"inferido","notes":"Acá se ve la regla de decisión de la skill, en una línea: cuenta los equipos que entregan y recomienda. Una entrega o varias en secuencia no cambia la cuenta. Lo que cambia es cuántos equipos. Y en los dos modos se escribe una iniciativa, un PRD y un RFC."},{"type":"ask","text":"Dale, workflow.","source":"inferido","notes":"Una decisión humana, en dos palabras."},{"type":"tool","label":"Ran · workflow(action=\"steps\")","source":"inferido","notes":"Lee los pasos del workflow en orden y los recorre así, nunca de memoria. En modo workflow, la primera aprobación arranca el workflow y escribe el primer documento en una sola ventana."},{"type":"tool","label":"Ran · template(action=\"get\")","source":"inferido","notes":"Lee los campos del PRD, que son más de cien. Por eso no te pregunta sección por sección: arma el documento entero con lo que ya sabe."},{"type":"say","md":"Armé el PRD entero y lo abrí en tu editor. Todavía **no escribí nada**.\n\n#### Metas del PRD\n- Resolver en **3 días** para el **01/03**\n- Entregas 15/01 y 27/02 ≤ plazo 01/03 ✓\n- Solo la web, sin la app → objetivo «web y app» ✗\n\nPor el ✗ dejé **`{{pendiente}}`** en ese campo, aunque lo hayas propuesto: proponerlo no es aceptarlo. ¿Alcanza con la web en la primera entrega?\n\n**Completitud prevista: 88%.** Quedan parciales los riesgos y las dependencias.\n\nEditá el borrador, guardalo y decime **listo**.","source":"inferido","notes":"Esta es la parte que distingue a la skill. Cada valor que propusiste se compara con las metas, y lo que no cumple, o no se sabe, queda pendiente y no como un texto que parezca completo. El porcentaje sale de la misma fórmula del sistema, antes de escribir. Ahora el trabajo es tuyo: editás el documento en tu editor, y el agente espera sin llamar a nada más.","pause":true},{"type":"ask","text":"Listo. Dejé la app para la segunda entrega.","source":"inferido","notes":"Tu «listo» es el que habilita el siguiente paso, y acá además contás un cambio que hiciste."},{"type":"tool","label":"Ran · session(action=\"token_status\")","source":"inferido","notes":"Vuelve a mirar el token, porque mientras editabas pudo vencer. Si venció, pide uno nuevo y sigue desde el mismo borrador."},{"type":"say","md":"Voy a correr el comando que **escribe**: arranca el workflow y crea el PRD. **Se va a abrir una ventana** con tus cambios y los botones **Cancelar** y **Aprobar**.\n\nSi cancelás o la cerrás, no lo reintento: te pregunto qué cambiar.","source":"inferido","notes":"El mismo aviso de antes, y a propósito: antes de cada escritura el agente dice que se abre una ventana y qué va a aprobarse. Remarcá la última frase: si cancelás, no insiste y no vuelve a intentarlo tal cual.","pause":true},{"type":"approve","title":"Crear documento","lines":["PRD · «Autogestión de devoluciones» · se arranca el workflow y se escribe el primer paso","Tus cambios sobre el borrador: objetivo web y app → web en la 1.ª entrega, app en la 2.ª","Aprobás con un clic en Aprobar. Cancelar, Escape o cerrar la ventana no escriben nada. Se cancela sola a los 100 s."],"button":"Aprobar","source":"inferido","notes":"Esta ventana muestra lo que cambiaste vos, no el documento entero: es lo que tenés que mirar antes del clic. Una sola aprobación hace las dos cosas, arrancar el workflow y escribir el primer documento. Inferida: no se puede capturar sin una persona.","pause":true},{"type":"tool","label":"Ran · document(action=\"create\")","source":"inferido","notes":"Con tu clic, el servidor escribe. Un borrador se usa una sola vez: después deja de valer, así que reintentar no escribe dos veces."},{"type":"worked","seconds":41,"source":"inferido","notes":"El tiempo del agente, sin contar lo que tardaste vos en editar y aprobar."},{"type":"say","md":"Listo: el **PRD está escrito** y el workflow arrancó.\n\n#### Qué quedó\n- **Completitud:** **91%**, con un hueco en el campo `{{pendiente}}` que falta resolver\n- **Siguiente paso:** el RFC, con el mismo camino: borrador, tu «listo» y tu clic\n- **Después:** una épica con las dos entregas como historias\n\n¿Seguimos con el RFC?","source":"inferido","notes":"Cerrá con lo que queda: el documento escrito, su completitud y lo que falta. El RFC y la épica siguen el mismo camino, así que no hace falta mostrarlos.","pause":true}]},{"id":"otro-caso","title":"Otro caso","subtitle":"Exportar una épica a Jira, con el chequeo previo y la ventana","screen":"cursor-agent","faq":[{"q":"¿Qué hace falta para exportar?","a":"Que la integración de Atlassian esté conectada en los ajustes de integraciones de la plataforma. Eso lo hacés vos ahí, no el agente."},{"q":"¿Qué es el aviso de la ventana?","a":"Si un campo quedó como {{pendiente}}, a Jira ese texto llega literal. La ventana te dice cuántos issues lo llevarían. Avisa, no bloquea: cancelás vos y completás el campo antes."},{"q":"¿Se puede deshacer una exportación?","a":"No. La herramienta no tiene acciones para borrar ni deshacer: lo que se crea en Jira se crea de verdad. Por eso el chequeo previo y la ventana."},{"q":"¿Y si solo quiero saber cómo viene la iniciativa?","a":"Pedilo así: «¿Cómo viene la iniciativa?». Una sola lectura arma una tabla con cada documento, su completitud y lo que le falta, sin escribir nada."}],"steps":[{"type":"ask","text":"Exportá la épica «Portal de devoluciones» a Jira, proyecto PLAT.","source":"inferido","notes":"Otro pedido típico, y mucho más delicado: acá se crean issues de verdad. Fijate que no le decís cómo ni con qué."},{"type":"tool","label":"Ran · jira(action=\"status\")","source":"inferido","notes":"Primero mira que Atlassian esté conectado. Es solo lectura. Si no lo está, te manda a las integraciones y no sigue."},{"type":"tool","label":"Ran · jira(action=\"preflight\")","source":"inferido","notes":"El chequeo previo: qué le falta a la épica para exportarse bien, como componentes, prioridades o campos obligatorios. Solo lectura. Es la regla de la skill: nunca exporta sin mostrarte esto y resolverlo con vos."},{"type":"say","md":"A la épica le falta el **componente** de dos historias. Te propongo **Backend** y **Web**. ¿Va?\n\nCon tu sí corro la exportación: **se abre una ventana** con los issues que se crearían, y los botones **Cancelar** y **Aprobar**. Yo no puedo hacer ese clic.","source":"inferido","notes":"Dos cosas en un mensaje: el hueco concreto con una propuesta, para que respondas con un sí, y el aviso de que se abre una ventana. Las dos vienen antes de tocar nada."},{"type":"ask","text":"Va.","source":"inferido","notes":"Una respuesta corta que habilita el export, y todavía no aprueba nada.","pause":true},{"type":"tool","label":"Ran · jira(action=\"preview\")","source":"inferido","notes":"Pide la vista previa de lo que se crearía. Todavía no escribe: el export vuelve a pedir una vista fresca justo antes de abrir la ventana, para que lo que ves sea lo que se crea."},{"type":"approve","title":"Exportar a Jira","lines":["Épica «Portal de devoluciones» · proyecto PLAT","Se crearían 4 issues: 1 épica y 3 historias, con sus tareas","Sin avisos: ningún campo quedó como {{pendiente}}","Aprobás con un clic en Aprobar. Cancelar, Escape o cerrar la ventana no escriben nada. Se cancela sola a los 100 s."],"button":"Aprobar","source":"inferido","notes":"La ventana del export muestra los issues que se crearían, no un resumen. Mirá la línea de avisos: si un campo quedó pendiente, dice cuántos issues llevarían ese texto a Jira, y lo sano es cancelar y completarlo. Inferida.","pause":true},{"type":"tool","label":"Ran · jira(action=\"export\")","source":"inferido","notes":"Con tu clic se crean los issues, a través del servidor product-brain-mcp y con tu usuario. Si cancelás, no se exporta nada y el agente te pregunta."},{"type":"say","md":"Listo: se crearon **4 issues** en el proyecto **PLAT**.\n\n#### Qué quedó\n- **Épica:** `PLAT-123`\n- **Historias:** `PLAT-124`, `PLAT-125` y `PLAT-126`\n\nTodo quedó a tu nombre. No hay forma de deshacerlo desde acá: si algo no va, se corrige en Jira.","source":"inferido","notes":"Cerrá con lo que se creó y con una advertencia honesta: no hay deshacer. Las claves son inventadas para la demo. Es la razón de tanto chequeo antes.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores más comunes y cómo salir","screen":"terminal","faq":[{"q":"El servidor aparece con error en Cursor.","a":"Casi siempre es la ruta de --project en el mcp.json: si moviste o volviste a clonar el repo, quedó vieja y el instalador no la actualiza. Corregila a mano, o probá el comando en una terminal."},{"q":"La ventana de aprobación no aparece.","a":"Es una ventana nativa de macOS: sin macOS o sin sesión gráfica no hay forma de aprobar, y el servidor no escribe. Es una barrera, no un error."},{"q":"«declined». ¿Qué pasó?","a":"No aprobaste: cancelaste, cerraste la ventana o pasaron 100 segundos. No se escribió nada. Pedile al agente que siga: no reintenta solo."},{"q":"«duplicate». ¿Se escribió dos veces?","a":"No: el documento ya existe, porque una llamada cortada pudo haberlo escrito. El agente lo lee en vez de crearlo otra vez."}],"steps":[{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': True, 'valid': False, 'minutes_left': None, 'warn': True, 'error': 'token_permissions: ~/.config/product-brain/token must be readable only by you: chmod 600 ~/.config/product-brain/token'}"],"source":"inferido","cwd":"~","notes":"El primer error típico: el archivo del token tiene permisos de más y la herramienta lo rechaza a propósito, porque un secreto no tiene que poder leerlo otra persona. La salida dice el comando: chmod 600. Inferido: necesita uv y un token."},{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': False, 'valid': False, 'minutes_left': None, 'warn': True, 'error': 'token_missing: no token at ~/.config/product-brain/token; copy the token and run: pbmcp token paste'}"],"source":"inferido","cwd":"~","notes":"El segundo: no hay token o venció, y dura unas 8 horas. Se repite el paso de copiarlo del navegador y pegarlo con token paste. No hay forma de renovarlo desde el agente, y es a propósito. Si el error dice token_expired es lo mismo. Inferido."},{"type":"term","cmd":"cat ~/.config/product-brain/allowed_projects","out":["proj-demo-0001"],"source":"real","cwd":"~","notes":"El tercero es not_allowed: el proyecto no está en esta lista, un id por línea, y el error dice qué id agregar. Lo agregás vos con un editor; no se le pide al agente.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Tengo que instalar la skill y el servidor por separado?","a":"No: el mismo ./install.sh deja las dos piezas. Y solo andan juntas: la skill io","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: clonar, enlazar y autenticar gh","screen":"terminal","faq":[{"q":"¿Por qué enlazar y no copiar?","a":"Porque así hay una sola fuente de verdad: tu clon. Cuando lo actualizás, la skill se actualiza sola. Una copia se queda vieja en silencio."},{"q":"¿Qué son ~/.agents y ~/.claude?","a":"Son las carpetas donde cada agente busca skills. Cursor lee la primera; Claude Code lee la segunda, por eso hay dos enlaces. Si solo usás Cursor, alcanza con el primero."},{"q":"¿Puedo instalarla sin enlaces?","a":"Sí: con npx skills add, desde tu clon, y necesitás Node. Pero instala una copia: no se actualiza con git pull, hay que repetir el comando. Y si ya la habías enlazado, te cambia el enlace por la copia."},{"q":"¿Es obligatorio tener gh y Jira?","a":"No. Sin gh autenticado la skill audita y escribe el informe local, pero no publica. Sin las variables de Jira, Jira se saltea y el resto anda igual."}],"steps":[{"type":"term","cmd":"git clone \u003crepo\u003e ~/skills/teamwayofwork","out":["Cloning into '~/skills/teamwayofwork'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo del equipo. Ojo: es un repo con varias skills adentro, y la que vamos a usar vive en la carpeta skills/auditing-repos. En \u003crepo\u003e va la dirección que te da tu equipo. Necesita red y acceso por SSH, que dejó listo el episodio 0. Paso inferido."},{"type":"term","cmd":"mkdir -p ~/.agents/skills ~/.claude/skills","out":[],"source":"real","cwd":"~","notes":"Creamos las dos carpetas donde los agentes buscan skills, por si no existen. Si ya existen, no pasa nada: el -p lo tolera."},{"type":"term","cmd":"cd ~/skills/teamwayofwork \u0026\u0026 ln -s \"$PWD/skills/auditing-repos\" ~/.agents/skills/auditing-repos","out":[],"source":"real","cwd":"~","notes":"Un enlace simbólico es un acceso directo: la carpeta de la skill sigue estando en tu clon y el agente la ve desde acá. No imprime nada, y está bien. Si el destino ya existe, ln falla; en ese caso mirá a dónde apunta antes de deshacer nada."},{"type":"term","cmd":"ln -s ../../.agents/skills/auditing-repos ~/.claude/skills/auditing-repos","out":[],"source":"real","cwd":"~","notes":"El segundo enlace es solo para Claude Code. Fijate que es relativo y apunta al primero: así hay un único origen. Si usás solo Cursor, podés saltearlo."},{"type":"term","cmd":"head -3 ~/.claude/skills/auditing-repos/SKILL.md","out":["---","name: auditing-repos","description: Use when asked to review, audit, or assess a local repository for code quality, architecture, testability, coverage, security, documentation or resilience — especially when the findings should become GitHub issues and pull requests, or be tracked on a Jira board."],"source":"real","cwd":"~","notes":"La prueba de que quedó bien: leemos el encabezado del SKILL.md pasando por los dos enlaces. Si lo ves, el agente también lo va a ver. Abrí una sesión nueva del agente: una abierta antes no se entera."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/test-attribution-pattern.sh | tail -3","out":["  ✓ ignored: refactor: rename the codex_parser module","","passed=22 failed=0"],"source":"inferido","cwd":"~","notes":"Otra comprobación, con un script que viene con la skill: prueba que el detector de atribución dispara en los casos malos y no se confunde con los legítimos. Tiene que terminar en passed=22 failed=0. Inferido: usa rg, que no está en el entorno de la captura; la salida sale de la documentación de la skill."},{"type":"term","cmd":"gh auth login","out":["? What account do you want to log into? GitHub.com","✓ Logged in as \u003ctu-usuario\u003e"],"source":"inferido","cwd":"~","notes":"Esto lo hacés vos, en tu terminal, y es a propósito: es un flujo interactivo con tu cuenta de GitHub, y el agente no debe hacerlo por vos. Sin gh autenticado la skill so <script>
// Pure navigation over an episode: the global index is the flattened list of
// (chapter card + its steps). No DOM, no state.
// keyAction(KeyboardEvent.key) -> "right" | "left" | "space" | "b" | null: the presenter
// keys, shared by the control and the stage. PageDown/PageUp act as the arrows because
// presentation clickers send them.
var Nav = (function () {
  function flatten(ep) {
    var out = [];
    (ep.chapters || []).forEach(function (ch, i) {
      out.push({chapter: i, step: -1, kind: "card"});
      (ch.steps || []).forEach(function (st, j) {
        out.push({chapter: i, step: j, kind: st.type});
      });
    });
    return out;
  }

  function clamp(ep, i) {
    var last = flatten(ep).length - 1;
    return Math.max(0, Math.min(Math.floor(i) || 0, Math.max(last, 0)));
  }

  function nextChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    for (var k = i + 1; k < flat.length; k++) {
      if (flat[k].step === -1) return k;
    }
    return Math.max(flat.length - 1, 0);
  }

  function prevChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var cur = i;
    while (cur > 0 && flat[cur].step !== -1) cur--;
    if (cur < i) return cur;
    for (var k = i - 1; k >= 0; k--) {
      if (flat[k].step === -1) return k;
    }
    return 0;
  }

  function keyAction(key) {
    if (key === "ArrowRight" || key === "PageDown") return "right";
    if (key === "ArrowLeft" || key === "PageUp") return "left";
    if (key === " " || key === "Spacebar") return "space";
    if (key === "b" || key === "B") return "b";
    return null;
  }

  function position(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var e = flat[i] || {chapter: 0, step: -1};
    var ch = (ep.chapters || [])[e.chapter] || {};
    return {chapter: e.chapter, step: e.step, total: flat.length, chapterTitle: ch.title};
  }

  return {flatten: flatten, clamp: clamp, nextChapter: nextChapter,
          prevChapter: prevChapter, position: position, keyAction: keyAction};
})();

</script>
<script>
// Static render of the stage: Render.step(container, episode, index) replaces the
// container's content with the FINISHED state of global index `index` (see nav.js).
// Pure function of (episode, index): nothing is kept between calls.
//
// Screens are laid out for a fixed 1600x900 canvas (.ws-screen); the stage scales it.
// All episode text goes through textContent / createTextNode; `say` markdown is parsed
// into DOM nodes, never assigned as HTML.
//
// Animation hooks (for animate.js, which renders the finished state, hides, reveals):
//   data-step="<j>"      on the root node of every applied step (j = index of the step
//                        inside its chapter). Nothing else carries data-step. Steps may
//                        live in different areas (a cursor-full term with `in: "zsh"`
//                        sits in the zsh panel, approve is an overlay at the end of the
//                        screen root), so document order is not step order: select by value.
//   data-anim="type"     the element holding exactly the text that gets typed
//                        (ask text, term command).
//   data-anim="line"     an output line, a say paragraph / heading / list item; revealed
//                        one at a time.
//   data-anim="node"     tool, worked and approve nodes (and the "▸ Ran · cmd" chip and
//                        the "⏺ Bash(cmd)" line); revealed whole.
//   hidden               an approve step that is not the current index keeps its node
//                        (so the step count holds) but is hidden: the window closed.
//   data-anim="idle"     the wrapper of the waiting prompt (prompt line + "❯ █") at the
//                        end of the terminal and of the cursor-full zsh panel. It is not
//                        a step: hide it while a term step animates, show it at the end.
//
// Prompt clock: every prompt shows Render.now() as HH:MM:SS (local time) in a
// .ws-time span. Render.now defaults to `new Date()`; tests and render-preview replace it
// with a fixed date so the output stays deterministic. The stage refreshes only the idle
// prompt's .ws-time every second (Stage.tickClock); steps are never re-rendered for it.
// Prompt icons (folder, house, clock) are inline SVG built with createElementNS.
// Unmarked descendants of a step root appear with the root; hooks inside one root are
// revealed in document order. Chapter cards carry no hooks and appear whole.
//
// Term placement on cursor-full: by default a term step is the agent's command and
// renders in the conversation exactly as on cursor-agent ("▸ Ran · cmd" chip + output
// block). With `in: "zsh"` it is a command the person types and renders in the
// integrated zsh (prompt, typed command, output lines).
// The first chapter card also shows the episode pitch («Le decís al agente…» /
// «Y la skill…») under its title; it is part of the card, not a separate index.
var Render = (function () {
  var USER = "Persona del equipo";
  var TEAM = "Equipo";
  var MODEL = "Sonnet 5.5";
  var BRANCH = "main";

  // ---- DOM helpers (text only) ----
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }
  function stepNode(tag, cls, j, anim) {
    var n = el(tag, cls);
    n.setAttribute("data-step", String(j));
    if (anim) n.setAttribute("data-anim", anim);
    return n;
  }
  function anim(node, kind) { node.setAttribute("data-anim", kind); return node; }
  function dots() {
