<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de skills</title>
<!-- Template: build inlines tokens.css + screens.css at CSS, the episodes of ONE series
     as <script type="application/json" id="episodes">[…]</script> at EPISODES, and
     nav.js, render.js, animate.js, stage.js at JS. No external references. -->
<style>
/* Every colour, font and size of the stage. When Cursor or the terminal change, edit here.
   Sizes are for the fixed 1600x900 canvas (the stage scales it). */
:root {
  /* canvas */
  --ws-w: 1600px;
  --ws-h: 900px;

  /* fonts */
  --ws-font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ws-font-mono: "SF Mono", Menlo, Monaco, "Courier New", monospace;
  --ws-fs: 15px;          /* Cursor body text */
  --ws-fs-sm: 13.5px;     /* sidebar, tabs, footers */
  --ws-fs-xs: 12.5px;     /* section labels, ages */
  --ws-fs-h4: 19px;       /* say #### heading */
  --ws-fs-mono: 13.5px;   /* code, chips, zsh */
  --ws-fs-term: 16px;     /* personal terminal and Claude Code */
  --ws-lh: 1.6;
  --ws-lh-mono: 1.55;
  --ws-lh-tight: 1.3;     /* user label block */
  --ws-lh-list: 2;        /* file tree, Open Tabs */
  --ws-caret-w: .6em;     /* terminal caret block */

  /* spacing and radii */
  --ws-gap: 12px;
  --ws-pad: 18px;
  --ws-pad-sm: 8px;
  --ws-pad-xs: 4px;
  --ws-radius: 12px;
  --ws-radius-sm: 6px;
  --ws-radius-xs: 4px;
  --ws-line: 1px;

  /* window chrome */
  --ws-dot: 12px;
  --ws-dot-r: #ff5f57;
  --ws-dot-y: #febc2e;
  --ws-dot-g: #28c840;

  /* Cursor, light theme */
  --ws-c-bg: #ffffff;
  --ws-c-side: #f3f3f3;
  --ws-c-line: #e6e6e6;
  --ws-c-tx: #1d1d1f;
  --ws-c-tx2: #3a3a3c;
  --ws-c-mut: #7a7a7a;
  --ws-c-faint: #a0a0a0;
  --ws-c-sel: #e3e3e3;
  --ws-c-chip: #f2f2f2;
  --ws-c-code: #efefef;
  --ws-c-send-bg: #111111;
  --ws-c-send-fg: #ffffff;
  --ws-c-plus: #1a7f37;
  --ws-c-avatar: #8a7b6b;
  --ws-c-shadow: 0 1px 4px rgba(0, 0, 0, .06);
  --ws-c-sidebar-w: 250px;
  --ws-c-right-w: 680px;
  --ws-c-tree-w: 230px;
  --ws-c-zsh-h: 400px;
  --ws-c-opentabs-w: 270px;
  --ws-c-top-h: 40px;
  --ws-c-tabs-h: 40px;
  --ws-c-avatar-s: 26px;
  --ws-c-send-s: 22px;
  --ws-c-preview-fs: 28px;

  /* zsh prompt segments inside Cursor (light) */
  --ws-z-bg: #ffffff;
  --ws-z-tx: #1d1d1f;
  --ws-z-apple-bg: #ffffff;
  --ws-z-apple-fg: #111111;
  --ws-z-path-bg: #1f4f8f;
  --ws-z-path-fg: #ffffff;
  --ws-z-git-bg: #2a8a76;
  --ws-z-git-fg: #ffffff;
  --ws-z-sys-bg: #8e1f6f;
  --ws-z-sys-fg: #ffffff;
  --ws-z-time-bg: transparent;
  --ws-z-time-fg: #1d1d1f;
  --ws-z-fill: #7a7a7a;
  --ws-z-path-icon: #ffffff;
  --ws-z-sys-icon: #ffffff;
  --ws-z-time-icon: #1d1d1f;
  --ws-z-ok: #2ea043;
  --ws-z-out: #3a3a3c;

  /* personal terminal (dark) */
  --ws-t-bg: #252830;
  --ws-t-bar: #2d3139;
  --ws-t-bar-fg: #c9ced8;
  --ws-t-tx: #d7dae0;
  --ws-t-mut: #8b919c;
  --ws-t-cmd: #79c0ff;
  --ws-t-ok: #7ee000;
  --ws-t-caret: #d7dae0;
  --ws-t-apple-bg: #d0d4db;
  --ws-t-apple-fg: #111111;
  --ws-t-path-bg: #86a6cc;
  --ws-t-path-fg: #ffffff;
  --ws-t-path-icon: #ffffff;
  --ws-t-git-bg: #2f8f8a;
  --ws-t-git-fg: #ffffff;
  --ws-t-sys-bg: #b994c9;
  --ws-t-sys-fg: #1b1b22;
  --ws-t-sys-icon: #1b1b22;
  --ws-t-time-bg: #d6d9df;
  --ws-t-time-fg: #111111;
  --ws-t-time-icon: #111111;
  --ws-t-fill: #5d6370;
  --ws-t-bar-h: 34px;
  --ws-seg-slant: 8px;
  --ws-fill-w: 2px;       /* dotted fill between prompt segments */
  --ws-icon-s: 1em;       /* prompt icons (folder, house, clock), inline SVG */
  --ws-icon-gap: .4em;    /* space between a prompt icon and its text */
  --ws-icon-drop: -.14em; /* vertical-align of prompt icons on the text baseline */

  /* Claude Code tab */
  --ws-cc-accent: #d97757;
  --ws-cc-ok: #3fb950;
  --ws-cc-user: #ffa657;  /* the person's turn, as in the cc-* mockups */
  --ws-cc-bang: #f778ba;  /* a `!` command the person runs in bash mode */
  --ws-cc-box: #5d6370;
  --ws-cc-gutter: 2ch;    /* width of the ⏺ / ⎿ / > gutter */

  /* browser window of a page step */
  --ws-p-w: 92%;
  --ws-p-h: 90%;
  --ws-p-bg: #ffffff;
  --ws-p-bar: #f1f1f3;

  /* macOS approval window */
  --ws-a-scrim: rgba(0, 0, 0, .28);
  --ws-a-bg: #ececec;
  --ws-a-tx: #1d1d1f;
  --ws-a-mut: #4a4a4c;
  --ws-a-line: #d2d2d2;
  --ws-a-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  --ws-a-w: 560px;
  --ws-a-radius: 14px;
  --ws-a-icon: 56px;
  --ws-a-icon-bg: #2d6cdf;
  --ws-a-btn-bg: #ffffff;
  --ws-a-btn-fg: #1d1d1f;
  --ws-a-ok-bg: #0a6cf0;
  --ws-a-ok-fg: #ffffff;
  --ws-a-fs-title: 17px;
  --ws-a-fs: 14px;
  --ws-a-lh: 1.45;
  /* the tool's own approval panel (alert.js): light or dark like macOS, because its page follows the system too */
  --ws-r-bg: #ececec;
  --ws-r-tx: #1d1d1f;
  --ws-r-bar-tx: #4a4a4c;
  --ws-r-btn-bg: #ffffff;
  --ws-r-btn-line: #c8c8c8;
  --ws-r-bar: 28px;         /* title bar */
  --ws-r-foot: 58px;        /* the button bar under the page (alert.js `bar`) */
  --ws-r-btn-h: 28px;
  --ws-r-btn-cancel: 90px;
  --ws-r-btn-ok: 130px;
  --ws-r-fs-btn: 13px;

  /* chapter card */
  --ws-k-grad: linear-gradient(135deg, #2d6cdf, #7a4fe0);
  --ws-k-fg: #ffffff;
  --ws-k-fs-kicker: 22px;
  --ws-k-fs-title: 88px;
  --ws-k-fs-sub: 30px;
  --ws-k-pad: 140px;
  --ws-k-sub-w: 1100px;
  --ws-k-kicker-track: .12em;
  --ws-k-kicker-op: .8;
  --ws-k-sub-op: .9;
  --ws-k-title-mt: .2em;
  --ws-k-title-mb: .3em;
  --ws-k-lh-title: 1.05;
  --ws-k-lh-sub: 1.35;
  --ws-k-pitch-mt: 56px;
  --ws-k-pitch-w: 1180px;
  --ws-k-pitch-pad: 28px 36px;
  --ws-k-pitch-bg: rgba(255, 255, 255, .12);
  --ws-k-pitch-radius: 14px;
  --ws-k-fs-pitch-k: 18px;
  --ws-k-fs-pitch: 30px;
  --ws-k-lh-pitch: 1.3;
  --ws-k-pitch-gap: 8px;
  --ws-k-pitch-row-gap: 22px;
}

/* Stage screens: card, cursor-full, cursor-agent, terminal, claude-code, approve overlay.
   Values come from tokens.css; this file only lays things out. */
.ws-screen {
  position: relative; box-sizing: border-box; width: var(--ws-w); height: var(--ws-h);
  overflow: hidden; font-family: var(--ws-font-ui);
}
.ws-screen *, .ws-screen *::before, .ws-screen *::after { box-sizing: border-box; }
.ws-empty { background: var(--ws-c-bg); }
.ws-mut { color: var(--ws-c-mut); }

/* bottom-anchored area: short content on top, long content shows its newest part */
.ws-scroll { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; min-height: 0; }
.ws-flow { flex: 1 0 auto; }

.ws-dots { display: flex; gap: calc(var(--ws-dot) / 2); }
.ws-dot { display: inline-block; width: var(--ws-dot); height: var(--ws-dot); border-radius: 50%; }
.ws-dot-r { background: var(--ws-dot-r); }
.ws-dot-y { background: var(--ws-dot-y); }
.ws-dot-g { background: var(--ws-dot-g); }

/* ---------- chapter card ---------- */
.ws-card { background: var(--ws-k-grad); color: var(--ws-k-fg); display: flex; align-items: center; }
.ws-card-inner { padding: 0 var(--ws-k-pad); }
.ws-card-kicker { font-size: var(--ws-k-fs-kicker); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase; opacity: var(--ws-k-kicker-op); }
.ws-card-title { margin: var(--ws-k-title-mt) 0 var(--ws-k-title-mb); font-size: var(--ws-k-fs-title); line-height: var(--ws-k-lh-title); font-weight: 700; }
.ws-card-sub { margin: 0; font-size: var(--ws-k-fs-sub); opacity: var(--ws-k-sub-op); max-width: var(--ws-k-sub-w); line-height: var(--ws-k-lh-sub); }
.ws-card-pitch { margin-top: var(--ws-k-pitch-mt); max-width: var(--ws-k-pitch-w); padding: var(--ws-k-pitch-pad);
  background: var(--ws-k-pitch-bg); border-radius: var(--ws-k-pitch-radius); }
.ws-card-pitch-k { font-size: var(--ws-k-fs-pitch-k); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase;
  opacity: var(--ws-k-kicker-op); margin-bottom: var(--ws-k-pitch-gap); }
.ws-card-pitch-ask, .ws-card-pitch-does { font-size: var(--ws-k-fs-pitch); line-height: var(--ws-k-lh-pitch); }
.ws-card-pitch-ask { font-style: italic; margin-bottom: var(--ws-k-pitch-row-gap); }

/* ---------- Cursor ---------- */
.ws-cursor { display: flex; background: var(--ws-c-bg); color: var(--ws-c-tx); font-size: var(--ws-fs); line-height: var(--ws-lh); }
.ws-sb {
  width: var(--ws-c-sidebar-w); flex: none; background: var(--ws-c-side); border-right: var(--ws-line) solid var(--ws-c-line);
  display: flex; flex-direction: column; padding: var(--ws-gap) 0; font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-sb .ws-dots { padding: 0 var(--ws-gap) var(--ws-pad); }
.ws-sb-nav { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-sec { padding: var(--ws-pad) var(--ws-gap) var(--ws-pad-xs); color: var(--ws-c-mut); font-size: var(--ws-fs-xs); }
.ws-sb-repo { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-chat {
  display: flex; gap: var(--ws-pad-sm); justify-content: space-between;
  margin: 0 var(--ws-pad-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm) var(--ws-pad-xs) var(--ws-pad);
  border-radius: var(--ws-radius-sm);
}
.ws-sb-chat-t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ws-sb-chat b { font-weight: 400; color: var(--ws-c-mut); flex: none; }
.ws-sb-chat.ws-on { background: var(--ws-c-sel); color: var(--ws-c-tx); }
.ws-me { margin-top: auto; padding: var(--ws-gap); display: flex; align-items: center; gap: var(--ws-pad-sm); line-height: var(--ws-lh-tight); }
.ws-avatar { width: var(--ws-c-avatar-s); height: var(--ws-c-avatar-s); border-radius: 50%; background: var(--ws-c-avatar); flex: none; }

.ws-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ws-top {
  height: var(--ws-c-top-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-pad);
  font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-top-r { margin-left: auto; color: var(--ws-c-mut); font-size: var(--ws-fs-xs); white-space: pre; }
.ws-conv { flex: 1; padding: 0 var(--ws-pad); }
.ws-conv .ws-flow { display: flex; flex-direction: column; gap: var(--ws-gap); padding-bottom: var(--ws-gap); }
.ws-ask {
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius); padding: var(--ws-gap) var(--ws-gap) var(--ws-pad-sm);
  box-shadow: var(--ws-c-shadow); background: var(--ws-c-bg); white-space: pre-wrap;
}
.ws-ask-row { display: flex; align-items: center; gap: var(--ws-gap); margin-top: var(--ws-pad-sm); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); white-space: normal; }
.ws-send {
  margin-left: auto; width: var(--ws-c-send-s); height: var(--ws-c-send-s); border-radius: 50%;
  background: var(--ws-c-send-bg); color: var(--ws-c-send-fg); display: flex; align-items: center; justify-content: center; font-size: var(--ws-fs-xs);
}
.ws-worked { color: var(--ws-c-mut); }
.ws-tool {
  align-self: flex-start; font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); color: var(--ws-c-tx2);
  background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm);
  white-space: pre-wrap; word-break: break-word;
}
.ws-ran { display: flex; flex-direction: column; gap: var(--ws-pad-xs); }
.ws-ran-out {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); line-height: var(--ws-lh-mono); color: var(--ws-z-out);
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-sm) var(--ws-gap);
}
.ws-ran-out .ws-out { white-space: pre-wrap; word-break: break-word; }
.ws-say p, .ws-say ul, .ws-say h4 { margin: 0 0 var(--ws-pad-sm); }
.ws-say > :last-child { margin-bottom: 0; }
.ws-say h4 { font-size: var(--ws-fs-h4); margin-top: var(--ws-pad-xs); }
.ws-say ul { padding-left: var(--ws-pad); }
.ws-md-table { overflow-x: auto; margin: 0 0 var(--ws-pad-sm); }
.ws-md-table table { border-collapse: collapse; font-size: var(--ws-fs-sm); }
.ws-md-table th, .ws-md-table td {
  border: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-pad-xs) var(--ws-pad-sm); text-align: left;
  white-space: nowrap;
}
.ws-md-table th { font-weight: 600; }
.ws-cursor code {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); background: var(--ws-c-code);
  border-radius: var(--ws-radius-xs); padding: 0 var(--ws-pad-xs);
}
.ws-followup {
  flex: none; margin: var(--ws-pad-sm) var(--ws-pad) var(--ws-pad-xs); border: var(--ws-line) solid var(--ws-c-line);
  border-radius: var(--ws-radius); padding: var(--ws-pad-sm) var(--ws-gap); display: flex; color: var(--ws-c-faint);
  font-size: var(--ws-fs-sm); box-shadow: var(--ws-c-shadow); white-space: pre;
}
.ws-followup-m { margin-left: auto; color: var(--ws-c-mut); }
.ws-foot { flex: none; display: flex; gap: var(--ws-pad); padding: var(--ws-pad-xs) var(--ws-pad) var(--ws-gap); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); }

/* right panel (cursor-full) */
.ws-rp { width: var(--ws-c-right-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); display: flex; flex-direction: column; font-size: var(--ws-fs-sm); }
.ws-rp-tabs { height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: 0 var(--ws-gap); color: var(--ws-c-mut); }
.ws-tab.ws-on { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); font-style: italic; color: var(--ws-c-tx); }
.ws-rp-sub {
  height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-gap);
  color: var(--ws-c-tx2); border-top: var(--ws-line) solid var(--ws-c-line); border-bottom: var(--ws-line) solid var(--ws-c-line); white-space: pre;
}
.ws-rp-sub-r { margin-left: auto; display: flex; gap: var(--ws-pad-sm); color: var(--ws-c-mut); }
.ws-pill { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); color: var(--ws-c-tx); }
.ws-rp-files { flex: 1; min-height: 0; display: flex; }
.ws-preview { flex: 1; padding: var(--ws-pad); }
.ws-preview h1 { margin: var(--ws-pad-sm) 0 0; font-size: var(--ws-c-preview-fs); }
.ws-tree { width: var(--ws-c-tree-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-gap) var(--ws-pad-sm); color: var(--ws-c-tx2); line-height: var(--ws-lh-list); }
.ws-tree-h { color: var(--ws-c-mut); padding: 0 var(--ws-pad-xs); }
.ws-tree-i { padding: 0 var(--ws-pad-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-zsh { height: var(--ws-c-zsh-h); flex: none; border-top: var(--ws-line) solid var(--ws-c-line); background: var(--ws-z-bg); display: flex; flex-direction: column; }
.ws-zsh-tabs { flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: var(--ws-pad-sm) var(--ws-gap) 0; color: var(--ws-c-mut); }
.ws-zsh-title { flex: none; padding: var(--ws-pad-sm) var(--ws-gap); color: var(--ws-c-tx2); }
.ws-zsh-body {
  flex: 1; padding: 0 var(--ws-gap) var(--ws-pad-sm); font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono);
  line-height: var(--ws-lh-mono); color: var(--ws-z-tx);
}

/* Open Tabs column (cursor-agent) */
.ws-opentabs { width: var(--ws-c-opentabs-w); flex: none; padding: var(--ws-c-top-h) var(--ws-pad) var(--ws-pad); color: var(--ws-c-tx2); font-size: var(--ws-fs-sm); line-height: var(--ws-lh-list); }
.ws-ot-h { color: var(--ws-c-mut); font-size: var(--ws-fs-xs); margin-top: var(--ws-gap); }
.ws-ot-h:first-child { margin-top: 0; }
.ws-plus { color: var(--ws-c-plus); }

/* ---------- shell lines (zsh in Cursor and personal terminal) ---------- */
.ws-prompt { display: flex; align-items: center; white-space: nowrap; margin-top: var(--ws-pad-xs); }
.ws-seg {
  display: inline-block; padding: 0 calc(var(--ws-seg-slant) + var(--ws-pad-xs));
  clip-path: polygon(var(--ws-seg-slant) 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%);
  margin-right: calc(var(--ws-seg-slant) / -2);
}
.ws-seg-apple { clip-path: polygon(0 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%); }
.ws-seg-fill { flex: 1; align-self: center; height: 0; margin: 0 var(--ws-pad-sm); border-bottom: var(--ws-fill-w) dotted; }
.ws-ico { display: inline-block; width: var(--ws-icon-s); height: var(--ws-icon-s); vertical-align: var(--ws-icon-drop); }
.ws-ico-folder { margin-right: var(--ws-icon-gap); }
.ws-ico-house, .ws-ico-clock { margin-left: var(--ws-icon-gap); }
.ws-path-last { font-weight: 700; }
.ws-cmdline, .ws-out { white-space: pre-wrap; word-break: break-word; }
.ws-caret { display: inline-block; width: var(--ws-caret-w); }

.ws-zsh .ws-seg-apple { background: var(--ws-z-apple-bg); color: var(--ws-z-apple-fg); }
.ws-zsh .ws-seg-path { background: var(--ws-z-path-bg); color: var(--ws-z-path-fg); }
.ws-zsh .ws-seg-git { background: var(--ws-z-git-bg); color: var(--ws-z-git-fg); }
.ws-zsh .ws-seg-sys { background: var(--ws-z-sys-bg); color: var(--ws-z-sys-fg); }
.ws-zsh .ws-seg-time { background: var(--ws-z-time-bg); color: var(--ws-z-time-fg); }
.ws-zsh .ws-seg-fill { color: var(--ws-z-fill); }
.ws-zsh .ws-ico-folder { color: var(--ws-z-path-icon); }
.ws-zsh .ws-ico-house { color: var(--ws-z-sys-icon); }
.ws-zsh .ws-ico-clock { color: var(--ws-z-time-icon); }
.ws-zsh .ws-caret-prompt { color: var(--ws-z-ok); font-weight: 700; }
.ws-zsh .ws-out { color: var(--ws-z-out); }
.ws-zsh .ws-caret { outline: var(--ws-line) solid var(--ws-z-tx); }

/* ---------- terminal theme (personal terminal and Claude Code) ---------- */
.ws-term-theme { background: var(--ws-t-bg); color: var(--ws-t-tx); display: flex; flex-direction: column; font-size: var(--ws-fs-term); }
.ws-tbar {
  height: var(--ws-t-bar-h); flex: none; background: var(--ws-t-bar); color: var(--ws-t-bar-fg); display: flex;

it: it is not a symlink; move it away and re-run"],"source":"inferido","cwd":"~","notes":"Primer tropiezo: ya había una carpeta de verdad con ese nombre, por ejemplo de una copia hecha a mano. El instalador no la pisa. Paso inferido: es la salida real del instalador en ese caso."},{"type":"term","cmd":"mv ~/.claude/skills/inherited-audit ~/inherited-audit-viejo \u0026\u0026 ~/skills/inherited-audit/install.sh","out":["skill: ~/.claude/skills/inherited-audit -\u003e ~/skills/inherited-audit/skill"],"source":"inferido","cwd":"~","notes":"El arreglo es el que dice el mensaje: mover la carpeta vieja y volver a instalar, a mano o pedíselo al agente. Paso inferido, con la salida real del instalador."},{"type":"term","cmd":"echo \"# a medio hacer\" \u003e\u003e api/mi_servicio/orders.py","out":[],"source":"real","cwd":"~/mi-servicio","notes":"Segundo tropiezo, el más común: dejaste un cambio a medio hacer en el repo. Lo simulamos con esta línea."},{"type":"term","cmd":"python3 ~/.claude/skills/inherited-audit/ia.py init --system mi-servicio --repo API=~/mi-servicio:api --host cursor","out":["error: API (~/mi-servicio) has uncommitted changes; commit or stash them first:","   M api/mi_servicio/orders.py","# exit 1"],"source":"real","cwd":"~","notes":"init no arranca y te dice qué archivo cambió. Por qué: el commit fijado tiene que ser exactamente lo que se audita. En Cursor el agente te pregunta si lo commitea o lo guarda aparte.","pause":true},{"type":"term","cmd":"git stash","out":["Saved working directory and index state WIP on main: 8151c7c feat: order handler, static web and docs"],"source":"real","cwd":"~/mi-servicio","notes":"Lo guardamos aparte con git stash, sin perder nada, y el repo queda limpio para auditar. Lo podés correr vos o pedíselo al agente."},{"type":"term","cmd":"python3 ~/.claude/skills/inherited-audit/ia.py init --system mi-servicio --repo API=~/mi-servicio:api --host cursor --out ~/mi-servicio/auditoria","out":["error: output dir ~/mi-servicio/auditoria is inside API (~/mi-servicio) and not ignored by git: it could be committed; choose a dir outside the repo or add it to .gitignore","# exit 1"],"source":"real","cwd":"~","notes":"Tercer tropiezo: pedir la corrida adentro del repo. Se niega porque git la podría commitear, y los reportes llevan hallazgos de seguridad. La salida va siempre fuera del repo.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Cuándo la uso?","a":"Cada vez que heredás un sistema y vas a construir encima: antes de la primera historia, no después del primer incidente."},{"q":"¿Sirve para revisar un PR?","a":"No. Para un diff usá el revisor de tu host (/review-bugbot en Cursor). Esta skill es para un sistema entero."},{"q":"¿Qué necesito para el próximo episodio?","a":"Lo mismo del episodio 0. Cada episodio empieza instalando su skill."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Un pedido de una frase** alcanza: la skill trae el checklist y el orden.\n- **Cada bug viene probado** con un test que falla, en una rama local. Nada se publica.\n- **Dos reportes** para el equipo dueño, que dicen cuánto muestran de cuánto.\n\n#### Próximo episodio: jira-team-kit\nCómo crear épicas en Jira desde la conversación, con una ventana que te pide aprobar cada cambio.","source":"inferido","notes":"Las tres ideas son el porqué de adoptarla: poco esfuerzo, evidencia y nada sale de tu máquina sin vos. Si el orden de la serie cambia, cambiá la línea del próximo episodio.","pause":true}]}]},{"id":"jira-team-kit","series":"cursor","order":2,"title":"jira-team-kit","pitch":{"ask":"Creame una épica para esto que estuvimos trabajando","does":"Arma la épica con sus historias, tareas y subtareas, te la muestra antes de escribir y, cuando vos aprobás con un clic en una ventana, la crea en Jira y la deja como kanban local."},"skill":{"repo":"jira-kanban","commit":"93a6126","date":"2026-10-19"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Tope al descuento en pedidos","age":"1h"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina, más tu token de Jira","screen":"terminal","faq":[{"q":"¿Puedo pedirle al agente que la instale?","a":"Sí. En Cursor decile «Instalá jira-team-kit: cloná el repo y corré ./install.sh --with-write» y hace lo mismo que ves acá. Lo mostramos en la terminal para que sepas qué deja en tu máquina."},{"q":"¿Qué es --with-write y por qué no es el comportamiento normal?","a":"Sin esa opción se instalan solo las dos skills de lectura. Con --with-write se suman las dos que pueden escribir en Jira. Escribir es una decisión explícita, no un efecto de instalar."},{"q":"¿Instala algo más, o toca mis archivos?","a":"No copia nada: deja enlaces a tu clon, así hay una sola fuente de verdad. Y nunca pisa un archivo real: si donde va un enlace ya hay un archivo, frena y te dice cuál mover."},{"q":"Me dice «add ~/.local/bin to PATH». ¿Qué hago?","a":"Es el aviso que ves acá: jtk quedó en ~/.local/bin y tu terminal todavía no mira esa carpeta. Agregás una línea a tu ~/.zshrc (o le pedís al agente que la agregue) y abrís una terminal nueva."},{"q":"¿Por qué el token lo creo yo y no se lo pido al agente?","a":"Porque es un secreto: se muestra una sola vez y nunca se pega en el chat. Lo creás vos y lo guardás vos, con un editor."}],"steps":[{"type":"term","cmd":"git clone git@github.com:josefigueredo/jira-team-kit.git skills/jira-kanban","out":["Cloning into 'skills/jira-kanban'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo, que trae las cuatro skills y el comando jtk. Es un git clone común. Necesitás Python 3.9 o más, git y acceso por SSH a la organización (el repo es privado); si hiciste el episodio 0 ya lo tenés. El nombre de la carpeta da igual: el instalador calcula dónde está. Paso inferido: necesita red."},{"type":"term","cmd":"~/skills/jira-kanban/install.sh --with-write","out":["skill: jira-standup (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-standup","skill: jira-em (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-em","skill: jira-team-kit (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban","skill: jira-em-ops (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-em-ops","cli: jtk -\u003e ~/skills/jira-kanban/jtk.py","note: add ~/.local/bin to PATH to use jtk"],"source":"real","cwd":"~","notes":"Esta es toda la instalación. Mirá las cuatro líneas «skill:»: dos de lectura (standup y em) y dos que escriben (jira-team-kit y jira-em-ops). Remarcá que no copia nada, son enlaces, y que se enlazan a la vez en Claude Code, Codex y Cursor. Y mirá el aviso del final: jtk existe, pero falta el PATH.","pause":true},{"type":"term","cmd":"echo 'export PATH=\"$HOME/.local/bin:$PATH\"' \u003e\u003e ~/.zshrc","out":[],"source":"real","cwd":"~","notes":"El aviso se arregla con una línea en tu ~/.zshrc. Después, abrís una terminal nueva. Si te trabás acá, es el error número uno: «el agente dice que jtk no existe»."},{"type":"term","cmd":"~/.local/bin/jtk --version","out":["jtk 93a6126 2026-10-14"],"source":"real","cwd":"~","notes":"Comprobamos que quedó andando. Imprime el commit y su fecha. Lo corremos con la ruta completa porque esta terminal todavía no tiene el PATH nuevo; en una terminal nueva alcanza con jtk --version. Todavía no tocamos Jira, ni hace falta."},{"type":"term","cmd":"open -e ~/.zshrc","out":[],"source":"inferido","cwd":"~","notes":"Ahora lo único que no hace el agente: las credenciales. Creás un token de API en id.atlassian.com, con el botón «Create API token» a secas, no el que dice «with scopes»: jtk entra por la URL de tu sitio y un token con alcance no funciona. Lo guardás vos, con un editor, en tres variables: JIRA_BASE_URL, JIRA_EMAIL y JIRA_API_TOKEN. Nunca por el chat. Después cerrás Cursor del todo y lo abrís de nuevo.","pause":true}]},{"id":"caso-principal","title":"Caso principal","subtitle":"De «creame una épica» a PLAT-123, con tu clic","screen":"cursor-full","faq":[{"q":"¿Puede el agente escribir en Jira sin que yo lo sepa?","a":"No. Todo comando que escribe necesita --apply, y --apply abre una ventana que solo responde a un clic tuyo en «Apruebo». El agente te avisa antes de lanzarla, pero no puede aprobar por vos."},{"q":"¿Y si aprieto Cancelar, o me voy a tomar un café?","a":"No se escribe nada. Cancelar, Escape, cerrar la ventana o esperar 100 segundos dan lo mismo: el comando sale sin crear y el agente no vuelve a intentarlo salvo que se lo pidas."},{"q":"¿Qué pasa si Jira rechaza una tarea a mitad de camino?","a":"Lo creado se conserva y jtk te dice las claves. Repetir el mismo comando retoma sin duplicar. Si solo falla un cambio de estado, no se repite el create: se termina con un push."},{"q":"¿Por qué «Vos · en curso» y «A decidir»?","a":"Lo que dijiste que estás haciendo se te asigna sin preguntar. Lo que todavía no empezó necesita tu respuesta: asignártelo o dejarlo sin dueño. jtk nunca lo decide por vos."},{"q":"¿Y el MCP de Atlassian que Cursor sugiere cuando escribo «jira»?","a":"No lo uses junto a esta skill. Sus herramientas de escritura no pasan por la ventana de aprobación. La skill le dice al agente que Jira va siempre por jtk."}],"steps":[{"type":"ask","text":"creame una épica para esto que estuvimos trabajando","source":"inferido","notes":"Una frase, como se la dirías a un compañero. Fijate el chat de la izquierda: veníamos hablando del tope al descuento. De ahí saca el contenido; nada de llenar formularios. Pedir así, al cerrar un trabajo, es el hábito que queremos instalar."},{"type":"tool","label":"Read · ~/.cursor/skills/jira-team-kit/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue pasos fijos, no improvisa. El primero: mirar antes de escribir."},{"type":"tool","label":"Ran · jtk update --check","source":"inferido","notes":"Una vez por conversación mira si hay una versión nueva del jtk. Es solo lectura, no toca Jira. Si todo está al día no dice nada, y acá no dice nada: ese es el comportamiento correcto."},{"type":"term","cmd":"~/.local/bin/jtk create --check --project .","out":["Check          Result  Detail","wow plan       no      no wow/plan/manifest.json","jira project   none    ask the person which project and pass --jira-project KEY","existing epic  none    none in specs/*/spec.md or the branch; a key in the conversation is not checked here"],"source":"real","cwd":"~/mi-servicio","notes":"Tres filas, sin red ni credenciales. «wow plan»: si el trabajo ya sale de un plan de WayOfWork, la épica la crea otra herramienta. «jira project»: no hay proyecto por defecto, así que hay que preguntarlo. «existing epic»: si ya existe una épica para esto, se pregunta antes de crear otra. Acá no hay ni plan ni épica. Falta el proyecto. Y una aclaración: el comando sale con la ruta completa, ~/.local/bin/jtk, porque la captura corre sin tu PATH; en tu terminal alcanza con escribir jtk.","pause":true},{"type":"say","md":"No hay plan de WayOfWork ni una épica previa para esto, pero no tengo un proyecto de Jira por defecto. **¿En qué proyecto la creo?**","source":"inferido","notes":"El agente se frena y pregunta, porque la skill dice que nunca se adivina el proyecto. Esta es una de las pocas preguntas obligatorias."},{"type":"ask","text":"En PLAT.","source":"inferido","notes":"Una palabra alcanza. Desde acá el agente pasa --jira-project PLAT en todos los comandos."},{"type":"tool","label":"Read · ~/.cursor/skills/jira-team-kit/references/spec.md","source":"inferido","notes":"Antes de redactar lee el formato del spec. Cada épica, tarea y subtarea necesita tres cosas: por qué, qué y hecho cuando. Si falta una, jtk se niega a seguir. Es lo que evita tickets de una línea que nadie entiende dentro de un mes."},{"type":"tool","label":"Write · ~/scratchpad/spec.json","source":"inferido","notes":"El spec es un JSON que el agente arma desde la conversación: una épica, una tarea con una subtarea, y otra tarea. Lo deja en su carpeta temporal, no en tu repo."},{"type":"term","cmd":"jtk create --spec ~/scratchpad/spec.json --jira-project PLAT --html ~/scratchpad/vista.html --project .","out":["Issue        Tipo      Estado       Asignado        Título","NUEVO-1      Epic      Backlog      A decidir       Tope de descuento","  NUEVO-2    Tarea     En progreso  Vos · en curso  [BE] Acotar el descuento","    NUEVO-3  Subtarea  Backlog      A decidir       Test del tope","  NUEVO-4    Tarea     Backlog      A decidir       [BE] Documentar el tope","preview: ~/scratchpad/vista.html","dry run: nothing created; --apply creates 4 issues in PLAT"],"source":"inferido","cwd":"~/mi-servicio","notes":"El dry run: lo que se crearía, sin escribir nada. La tabla y una página vista.html con forma de pantalla de Jira. Fijate «NUEVO-1»: todavía no hay claves reales. La tarea que decimos que estamos haciendo ya figura «En progreso» y «Vos · en curso»; el resto, «A decidir». Esta salida es inferida: sin credenciales de Jira el comando no corre en la captura, y el formato sale del showcase de la skill.","pause":true},{"type":"tool","label":"Ran · open ~/scratchpad/vista.html","source":"inferido","notes":"Abre la vista previa en el navegador."},{"type":"page","title":"~/scratchpad/vista.html","source":"real","notes":"Esta es la página que genera jtk, tal cual: la sacamos de su código (tools/jtk_vista.py). Árbol a la izquierda, y por issue el por qué, el qué y el hecho cuando. Hacé clic en NUEVO-2: «Vos · en curso». Es el momento de corregir, no después.","pause":true,"html":"\u003c!doctype html\u003e\n\u003chtml lang=\"es\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003ctitle\u003ePLAT · vista previa\u003c/title\u0
