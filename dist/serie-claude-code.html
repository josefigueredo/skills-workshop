<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de skills</title>
<!-- Template: build inlines tokens.css + screens.css at CSS, the episodes of ONE series
     as <script type="application/json" id="episodes">[…]</script> at EPISODES, and
     nav.js, render.js, animate.js, stage.js at JS. No external references. -->
<style>
/* Every colour, font and size of the stage. When Cursor or the terminal change, edit here.
   Sizes are for the fixed 1600x900 canvas (the stage scales it). */
:root {
  /* canvas */
  --ws-w: 1600px;
  --ws-h: 900px;

  /* fonts */
  --ws-font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ws-font-mono: "SF Mono", Menlo, Monaco, "Courier New", monospace;
  --ws-fs: 15px;          /* Cursor body text */
  --ws-fs-sm: 13.5px;     /* sidebar, tabs, footers */
  --ws-fs-xs: 12.5px;     /* section labels, ages */
  --ws-fs-h4: 19px;       /* say #### heading */
  --ws-fs-mono: 13.5px;   /* code, chips, zsh */
  --ws-fs-term: 16px;     /* personal terminal and Claude Code */
  --ws-lh: 1.6;
  --ws-lh-mono: 1.55;
  --ws-lh-tight: 1.3;     /* user label block */
  --ws-lh-list: 2;        /* file tree, Open Tabs */
  --ws-caret-w: .6em;     /* terminal caret block */

  /* spacing and radii */
  --ws-gap: 12px;
  --ws-pad: 18px;
  --ws-pad-sm: 8px;
  --ws-pad-xs: 4px;
  --ws-radius: 12px;
  --ws-radius-sm: 6px;
  --ws-radius-xs: 4px;
  --ws-line: 1px;

  /* window chrome */
  --ws-dot: 12px;
  --ws-dot-r: #ff5f57;
  --ws-dot-y: #febc2e;
  --ws-dot-g: #28c840;

  /* Cursor, light theme */
  --ws-c-bg: #ffffff;
  --ws-c-side: #f3f3f3;
  --ws-c-line: #e6e6e6;
  --ws-c-tx: #1d1d1f;
  --ws-c-tx2: #3a3a3c;
  --ws-c-mut: #7a7a7a;
  --ws-c-faint: #a0a0a0;
  --ws-c-sel: #e3e3e3;
  --ws-c-chip: #f2f2f2;
  --ws-c-code: #efefef;
  --ws-c-send-bg: #111111;
  --ws-c-send-fg: #ffffff;
  --ws-c-plus: #1a7f37;
  --ws-c-avatar: #8a7b6b;
  --ws-c-shadow: 0 1px 4px rgba(0, 0, 0, .06);
  --ws-c-sidebar-w: 250px;
  --ws-c-right-w: 680px;
  --ws-c-tree-w: 230px;
  --ws-c-zsh-h: 400px;
  --ws-c-opentabs-w: 270px;
  --ws-c-top-h: 40px;
  --ws-c-tabs-h: 40px;
  --ws-c-avatar-s: 26px;
  --ws-c-send-s: 22px;
  --ws-c-preview-fs: 28px;

  /* zsh prompt segments inside Cursor (light) */
  --ws-z-bg: #ffffff;
  --ws-z-tx: #1d1d1f;
  --ws-z-apple-bg: #ffffff;
  --ws-z-apple-fg: #111111;
  --ws-z-path-bg: #1f4f8f;
  --ws-z-path-fg: #ffffff;
  --ws-z-git-bg: #2a8a76;
  --ws-z-git-fg: #ffffff;
  --ws-z-sys-bg: #8e1f6f;
  --ws-z-sys-fg: #ffffff;
  --ws-z-time-bg: transparent;
  --ws-z-time-fg: #1d1d1f;
  --ws-z-fill: #7a7a7a;
  --ws-z-path-icon: #ffffff;
  --ws-z-sys-icon: #ffffff;
  --ws-z-time-icon: #1d1d1f;
  --ws-z-ok: #2ea043;
  --ws-z-out: #3a3a3c;

  /* personal terminal (dark) */
  --ws-t-bg: #252830;
  --ws-t-bar: #2d3139;
  --ws-t-bar-fg: #c9ced8;
  --ws-t-tx: #d7dae0;
  --ws-t-mut: #8b919c;
  --ws-t-cmd: #79c0ff;
  --ws-t-ok: #7ee000;
  --ws-t-caret: #d7dae0;
  --ws-t-apple-bg: #d0d4db;
  --ws-t-apple-fg: #111111;
  --ws-t-path-bg: #86a6cc;
  --ws-t-path-fg: #ffffff;
  --ws-t-path-icon: #ffffff;
  --ws-t-git-bg: #2f8f8a;
  --ws-t-git-fg: #ffffff;
  --ws-t-sys-bg: #b994c9;
  --ws-t-sys-fg: #1b1b22;
  --ws-t-sys-icon: #1b1b22;
  --ws-t-time-bg: #d6d9df;
  --ws-t-time-fg: #111111;
  --ws-t-time-icon: #111111;
  --ws-t-fill: #5d6370;
  --ws-t-bar-h: 34px;
  --ws-seg-slant: 8px;
  --ws-fill-w: 2px;       /* dotted fill between prompt segments */
  --ws-icon-s: 1em;       /* prompt icons (folder, house, clock), inline SVG */
  --ws-icon-gap: .4em;    /* space between a prompt icon and its text */
  --ws-icon-drop: -.14em; /* vertical-align of prompt icons on the text baseline */

  /* Claude Code tab */
  --ws-cc-accent: #d97757;
  --ws-cc-ok: #3fb950;
  --ws-cc-user: #ffa657;  /* the person's turn, as in the cc-* mockups */
  --ws-cc-bang: #f778ba;  /* a `!` command the person runs in bash mode */
  --ws-cc-box: #5d6370;
  --ws-cc-gutter: 2ch;    /* width of the ⏺ / ⎿ / > gutter */

  /* macOS approval window */
  --ws-a-scrim: rgba(0, 0, 0, .28);
  --ws-a-bg: #ececec;
  --ws-a-tx: #1d1d1f;
  --ws-a-mut: #4a4a4c;
  --ws-a-line: #d2d2d2;
  --ws-a-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  --ws-a-w: 560px;
  --ws-a-radius: 14px;
  --ws-a-icon: 56px;
  --ws-a-icon-bg: #2d6cdf;
  --ws-a-btn-bg: #ffffff;
  --ws-a-btn-fg: #1d1d1f;
  --ws-a-ok-bg: #0a6cf0;
  --ws-a-ok-fg: #ffffff;
  --ws-a-fs-title: 17px;
  --ws-a-fs: 14px;
  --ws-a-lh: 1.45;

  /* chapter card */
  --ws-k-grad: linear-gradient(135deg, #2d6cdf, #7a4fe0);
  --ws-k-fg: #ffffff;
  --ws-k-fs-kicker: 22px;
  --ws-k-fs-title: 88px;
  --ws-k-fs-sub: 30px;
  --ws-k-pad: 140px;
  --ws-k-sub-w: 1100px;
  --ws-k-kicker-track: .12em;
  --ws-k-kicker-op: .8;
  --ws-k-sub-op: .9;
  --ws-k-title-mt: .2em;
  --ws-k-title-mb: .3em;
  --ws-k-lh-title: 1.05;
  --ws-k-lh-sub: 1.35;
  --ws-k-pitch-mt: 56px;
  --ws-k-pitch-w: 1180px;
  --ws-k-pitch-pad: 28px 36px;
  --ws-k-pitch-bg: rgba(255, 255, 255, .12);
  --ws-k-pitch-radius: 14px;
  --ws-k-fs-pitch-k: 18px;
  --ws-k-fs-pitch: 30px;
  --ws-k-lh-pitch: 1.3;
  --ws-k-pitch-gap: 8px;
  --ws-k-pitch-row-gap: 22px;
}

/* Stage screens: card, cursor-full, cursor-agent, terminal, claude-code, approve overlay.
   Values come from tokens.css; this file only lays things out. */
.ws-screen {
  position: relative; box-sizing: border-box; width: var(--ws-w); height: var(--ws-h);
  overflow: hidden; font-family: var(--ws-font-ui);
}
.ws-screen *, .ws-screen *::before, .ws-screen *::after { box-sizing: border-box; }
.ws-empty { background: var(--ws-c-bg); }
.ws-mut { color: var(--ws-c-mut); }

/* bottom-anchored area: short content on top, long content shows its newest part */
.ws-scroll { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; min-height: 0; }
.ws-flow { flex: 1 0 auto; }

.ws-dots { display: flex; gap: calc(var(--ws-dot) / 2); }
.ws-dot { display: inline-block; width: var(--ws-dot); height: var(--ws-dot); border-radius: 50%; }
.ws-dot-r { background: var(--ws-dot-r); }
.ws-dot-y { background: var(--ws-dot-y); }
.ws-dot-g { background: var(--ws-dot-g); }

/* ---------- chapter card ---------- */
.ws-card { background: var(--ws-k-grad); color: var(--ws-k-fg); display: flex; align-items: center; }
.ws-card-inner { padding: 0 var(--ws-k-pad); }
.ws-card-kicker { font-size: var(--ws-k-fs-kicker); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase; opacity: var(--ws-k-kicker-op); }
.ws-card-title { margin: var(--ws-k-title-mt) 0 var(--ws-k-title-mb); font-size: var(--ws-k-fs-title); line-height: var(--ws-k-lh-title); font-weight: 700; }
.ws-card-sub { margin: 0; font-size: var(--ws-k-fs-sub); opacity: var(--ws-k-sub-op); max-width: var(--ws-k-sub-w); line-height: var(--ws-k-lh-sub); }
.ws-card-pitch { margin-top: var(--ws-k-pitch-mt); max-width: var(--ws-k-pitch-w); padding: var(--ws-k-pitch-pad);
  background: var(--ws-k-pitch-bg); border-radius: var(--ws-k-pitch-radius); }
.ws-card-pitch-k { font-size: var(--ws-k-fs-pitch-k); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase;
  opacity: var(--ws-k-kicker-op); margin-bottom: var(--ws-k-pitch-gap); }
.ws-card-pitch-ask, .ws-card-pitch-does { font-size: var(--ws-k-fs-pitch); line-height: var(--ws-k-lh-pitch); }
.ws-card-pitch-ask { font-style: italic; margin-bottom: var(--ws-k-pitch-row-gap); }

/* ---------- Cursor ---------- */
.ws-cursor { display: flex; background: var(--ws-c-bg); color: var(--ws-c-tx); font-size: var(--ws-fs); line-height: var(--ws-lh); }
.ws-sb {
  width: var(--ws-c-sidebar-w); flex: none; background: var(--ws-c-side); border-right: var(--ws-line) solid var(--ws-c-line);
  display: flex; flex-direction: column; padding: var(--ws-gap) 0; font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-sb .ws-dots { padding: 0 var(--ws-gap) var(--ws-pad); }
.ws-sb-nav { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-sec { padding: var(--ws-pad) var(--ws-gap) var(--ws-pad-xs); color: var(--ws-c-mut); font-size: var(--ws-fs-xs); }
.ws-sb-repo { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-chat {
  display: flex; gap: var(--ws-pad-sm); justify-content: space-between;
  margin: 0 var(--ws-pad-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm) var(--ws-pad-xs) var(--ws-pad);
  border-radius: var(--ws-radius-sm);
}
.ws-sb-chat-t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ws-sb-chat b { font-weight: 400; color: var(--ws-c-mut); flex: none; }
.ws-sb-chat.ws-on { background: var(--ws-c-sel); color: var(--ws-c-tx); }
.ws-me { margin-top: auto; padding: var(--ws-gap); display: flex; align-items: center; gap: var(--ws-pad-sm); line-height: var(--ws-lh-tight); }
.ws-avatar { width: var(--ws-c-avatar-s); height: var(--ws-c-avatar-s); border-radius: 50%; background: var(--ws-c-avatar); flex: none; }

.ws-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ws-top {
  height: var(--ws-c-top-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-pad);
  font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-top-r { margin-left: auto; color: var(--ws-c-mut); font-size: var(--ws-fs-xs); white-space: pre; }
.ws-conv { flex: 1; padding: 0 var(--ws-pad); }
.ws-conv .ws-flow { display: flex; flex-direction: column; gap: var(--ws-gap); padding-bottom: var(--ws-gap); }
.ws-ask {
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius); padding: var(--ws-gap) var(--ws-gap) var(--ws-pad-sm);
  box-shadow: var(--ws-c-shadow); background: var(--ws-c-bg); white-space: pre-wrap;
}
.ws-ask-row { display: flex; align-items: center; gap: var(--ws-gap); margin-top: var(--ws-pad-sm); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); white-space: normal; }
.ws-send {
  margin-left: auto; width: var(--ws-c-send-s); height: var(--ws-c-send-s); border-radius: 50%;
  background: var(--ws-c-send-bg); color: var(--ws-c-send-fg); display: flex; align-items: center; justify-content: center; font-size: var(--ws-fs-xs);
}
.ws-worked { color: var(--ws-c-mut); }
.ws-tool {
  align-self: flex-start; font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); color: var(--ws-c-tx2);
  background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm);
  white-space: pre-wrap; word-break: break-word;
}
.ws-ran { display: flex; flex-direction: column; gap: var(--ws-pad-xs); }
.ws-ran-out {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); line-height: var(--ws-lh-mono); color: var(--ws-z-out);
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-sm) var(--ws-gap);
}
.ws-ran-out .ws-out { white-space: pre-wrap; word-break: break-word; }
.ws-say p, .ws-say ul, .ws-say h4 { margin: 0 0 var(--ws-pad-sm); }
.ws-say > :last-child { margin-bottom: 0; }
.ws-say h4 { font-size: var(--ws-fs-h4); margin-top: var(--ws-pad-xs); }
.ws-say ul { padding-left: var(--ws-pad); }
.ws-cursor code {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); background: var(--ws-c-code);
  border-radius: var(--ws-radius-xs); padding: 0 var(--ws-pad-xs);
}
.ws-followup {
  flex: none; margin: var(--ws-pad-sm) var(--ws-pad) var(--ws-pad-xs); border: var(--ws-line) solid var(--ws-c-line);
  border-radius: var(--ws-radius); padding: var(--ws-pad-sm) var(--ws-gap); display: flex; color: var(--ws-c-faint);
  font-size: var(--ws-fs-sm); box-shadow: var(--ws-c-shadow); white-space: pre;
}
.ws-followup-m { margin-left: auto; color: var(--ws-c-mut); }
.ws-foot { flex: none; display: flex; gap: var(--ws-pad); padding: var(--ws-pad-xs) var(--ws-pad) var(--ws-gap); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); }

/* right panel (cursor-full) */
.ws-rp { width: var(--ws-c-right-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); display: flex; flex-direction: column; font-size: var(--ws-fs-sm); }
.ws-rp-tabs { height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: 0 var(--ws-gap); color: var(--ws-c-mut); }
.ws-tab.ws-on { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); font-style: italic; color: var(--ws-c-tx); }
.ws-rp-sub {
  height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-gap);
  color: var(--ws-c-tx2); border-top: var(--ws-line) solid var(--ws-c-line); border-bottom: var(--ws-line) solid var(--ws-c-line); white-space: pre;
}
.ws-rp-sub-r { margin-left: auto; display: flex; gap: var(--ws-pad-sm); color: var(--ws-c-mut); }
.ws-pill { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); color: var(--ws-c-tx); }
.ws-rp-files { flex: 1; min-height: 0; display: flex; }
.ws-preview { flex: 1; padding: var(--ws-pad); }
.ws-preview h1 { margin: var(--ws-pad-sm) 0 0; font-size: var(--ws-c-preview-fs); }
.ws-tree { width: var(--ws-c-tree-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-gap) var(--ws-pad-sm); color: var(--ws-c-tx2); line-height: var(--ws-lh-list); }
.ws-tree-h { color: var(--ws-c-mut); padding: 0 var(--ws-pad-xs); }
.ws-tree-i { padding: 0 var(--ws-pad-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-zsh { height: var(--ws-c-zsh-h); flex: none; border-top: var(--ws-line) solid var(--ws-c-line); background: var(--ws-z-bg); display: flex; flex-direction: column; }
.ws-zsh-tabs { flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: var(--ws-pad-sm) var(--ws-gap) 0; color: var(--ws-c-mut); }
.ws-zsh-title { flex: none; padding: var(--ws-pad-sm) var(--ws-gap); color: var(--ws-c-tx2); }
.ws-zsh-body {
  flex: 1; padding: 0 var(--ws-gap) var(--ws-pad-sm); font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono);
  line-height: var(--ws-lh-mono); color: var(--ws-z-tx);
}

/* Open Tabs column (cursor-agent) */
.ws-opentabs { width: var(--ws-c-opentabs-w); flex: none; padding: var(--ws-c-top-h) var(--ws-pad) var(--ws-pad); color: var(--ws-c-tx2); font-size: var(--ws-fs-sm); line-height: var(--ws-lh-list); }
.ws-ot-h { color: var(--ws-c-mut); font-size: var(--ws-fs-xs); margin-top: var(--ws-gap); }
.ws-ot-h:first-child { margin-top: 0; }
.ws-plus { color: var(--ws-c-plus); }

/* ---------- shell lines (zsh in Cursor and personal terminal) ---------- */
.ws-prompt { display: flex; align-items: center; white-space: nowrap; margin-top: var(--ws-pad-xs); }
.ws-seg {
  display: inline-block; padding: 0 calc(var(--ws-seg-slant) + var(--ws-pad-xs));
  clip-path: polygon(var(--ws-seg-slant) 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%);
  margin-right: calc(var(--ws-seg-slant) / -2);
}
.ws-seg-apple { clip-path: polygon(0 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%); }
.ws-seg-fill { flex: 1; align-self: center; height: 0; margin: 0 var(--ws-pad-sm); border-bottom: var(--ws-fill-w) dotted; }
.ws-ico { display: inline-block; width: var(--ws-icon-s); height: var(--ws-icon-s); vertical-align: var(--ws-icon-drop); }
.ws-ico-folder { margin-right: var(--ws-icon-gap); }
.ws-ico-house, .ws-ico-clock { margin-left: var(--ws-icon-gap); }
.ws-path-last { font-weight: 700; }
.ws-cmdline, .ws-out { white-space: pre-wrap; word-break: break-word; }
.ws-caret { display: inline-block; width: var(--ws-caret-w); }

.ws-zsh .ws-seg-apple { background: var(--ws-z-apple-bg); color: var(--ws-z-apple-fg); }
.ws-zsh .ws-seg-path { background: var(--ws-z-path-bg); color: var(--ws-z-path-fg); }
.ws-zsh .ws-seg-git { background: var(--ws-z-git-bg); color: var(--ws-z-git-fg); }
.ws-zsh .ws-seg-sys { background: var(--ws-z-sys-bg); color: var(--ws-z-sys-fg); }
.ws-zsh .ws-seg-time { background: var(--ws-z-time-bg); color: var(--ws-z-time-fg); }
.ws-zsh .ws-seg-fill { color: var(--ws-z-fill); }
.ws-zsh .ws-ico-folder { color: var(--ws-z-path-icon); }
.ws-zsh .ws-ico-house { color: var(--ws-z-sys-icon); }
.ws-zsh .ws-ico-clock { color: var(--ws-z-time-icon); }
.ws-zsh .ws-caret-prompt { color: var(--ws-z-ok); font-weight: 700; }
.ws-zsh .ws-out { color: var(--ws-z-out); }
.ws-zsh .ws-caret { outline: var(--ws-line) solid var(--ws-z-tx); }

/* ---------- terminal theme (personal terminal and Claude Code) ---------- */
.ws-term-theme { background: var(--ws-t-bg); color: var(--ws-t-tx); display: flex; flex-direction: column; font-size: var(--ws-fs-term); }
.ws-tbar {
  height: var(--ws-t-bar-h); flex: none; background: var(--ws-t-bar); color: var(--ws-t-bar-fg); display: flex;
  align-items: center; gap: var(--ws-gap); padding: 0 var(--ws-gap); font-size: var(--ws-fs-sm);
}
.ws-term-body, .ws-cc-body { flex: 1; padding: var(--ws-pad-sm) var(--ws-gap); font-family: var(--ws-font-mono); line-height: var(--ws-lh-mono); }
.ws-term-theme .ws-seg-apple { background: var(--ws-t-apple-bg); color: var(--ws-t-apple-fg); }
.ws-term-theme .ws-seg-path { background: var(--ws-t-path-bg); color: var(--ws-t-path-fg); }
.ws-term-theme .ws-seg-git { background: var(--ws-t-git-bg); color: var(--ws-t-git-fg); }
.ws-term-theme .ws-seg-sys { background: var(--ws-t-sys-bg); color: var(--ws-t-sys-fg); }
.ws-term-theme .ws-seg-time { background: var(--ws-t-time-bg); color: var(--ws-t-time-fg); }
.ws-term-theme .ws-seg-fill { color: var(--ws-t-fill); }
.ws-term-theme .ws-ico-folder { color: var(--ws-t-path-icon); }
.ws-term-theme .ws-ico-house { color: var(--ws-t-sys-icon); }
.ws-term-theme .ws-ico-clock { color: var(--ws-t-time-icon); }

<script type="application/json" id="episodes">[{"id":"wayofwork","series":"claude-code","order":1,"title":"wayofwork","pitch":{"ask":"¿Qué sigue?","does":"Te muestra los dos flujos, el de Product Brain y el de Spec-Kit, con su porcentaje, los bloqueos y hasta tres próximos pasos. Siete skills y un CLI, wow, llevan una iniciativa de punta a punta, y la única escritura hacia Jira es un comando que corrés vos."},"skill":{"repo":"WayOfWork","commit":"739b578","date":"2026-10-16"},"workspace":{"repo":"mi-servicio"},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: el CLI wow, las siete skills y los hooks de Cursor","screen":"terminal","faq":[{"q":"¿Qué necesito instalado?","a":"python3 3.9 o más y git: wow no baja dependencias. Y acceso por SSH al repo, que es privado: la clave sale del episodio 0. Spec-Kit, Cursor, tmux y la skill run-in-cursor hacen falta recién para las fases de Spec-Kit."},{"q":"¿Por qué las skills no quedan para Cursor?","a":"Porque WayOfWork se maneja desde Claude Code o Codex: el modelo fuerte piensa acá y Cursor solo ratifica los comandos de Spec-Kit. Lo de Cursor son los dos hooks."},{"q":"¿Y las credenciales de Jira?","a":"Un token de API sin alcance («Create API token», no «with scopes») y tres variables JIRA_* en tu ~/.zshrc o en un .env.local del proyecto. Las escribís vos con un editor, nunca por el chat. Sin ellas todo anda, y lo que depende de Jira queda sin verificar."},{"q":"¿Cómo lo actualizo?","a":"Con git pull en el clon. Como el instalador solo dejó enlaces, el CLI y las skills se actualizan solos."}],"steps":[{"type":"term","cmd":"git clone \u003crepo\u003e ~/skills/WayOfWork","out":["Cloning into '~/skills/WayOfWork'..."],"source":"inferido","cwd":"~","notes":"Bajamos WayOfWork; en \u003crepo\u003e va la dirección que te da tu equipo. Es privado y va por SSH: si dice «Permission denied», falta el acceso (clave del episodio 0). Inferido: necesita red."},{"type":"term","cmd":"cd ~/skills/WayOfWork \u0026\u0026 ./install.sh --skills","out":["installed: ~/.local/bin/wow -\u003e ~/skills/WayOfWork/wow/wow","note: ~/.local/bin is not on PATH","skill: wow-context (Claude Code, Codex)","skill: wow-guide (Claude Code, Codex)","skill: wow-pack (Claude Code, Codex)","skill: wow-pb-audit (Claude Code, Codex)","skill: wow-plan (Claude Code, Codex)","skill: wow-review (Claude Code, Codex)","skill: wow-sk-prep (Claude Code, Codex)"],"source":"real","cwd":"~","notes":"Un comando deja el CLI wow y las siete skills wow-*, todo con enlaces a tu clon: nada se copia. Fijate en la nota del PATH: si ~/.local/bin no está, wow no se encuentra. Es el fallo más común; se arregla en tu ~/.zshrc y abriendo una terminal nueva.","pause":true},{"type":"term","cmd":"~/.local/bin/wow --version","out":["wow 0.1.0"],"source":"real","cwd":"~","notes":"Comprobamos que wow responde. Acá va la ruta completa porque la terminal de la grabación no tiene ~/.local/bin en el PATH; en tu máquina alcanza con wow. Lo mismo vale para todo el episodio."},{"type":"term","cmd":"ls ~/.claude/skills","out":["wow-context","wow-guide","wow-pack","wow-pb-audit","wow-plan","wow-review","wow-sk-prep"],"source":"real","cwd":"~","notes":"Las siete skills quedaron para Claude Code (y para Codex, en su carpeta). Cada una responde a un pedido distinto, y ninguna llama a otra: todas vuelven a wow-guide, que es la que dice qué sigue. Abrí una sesión nueva de Claude Code para que las vea."},{"type":"term","cmd":"~/.local/bin/wow hook install-cursor","out":["~/.cursor/hooks.json: stop hook added","~/.cursor/hooks.json: beforeShellExecution hook added"],"source":"real","cwd":"~","notes":"Una vez por máquina: dos hooks en Cursor. stop guarda modelo y tokens de cada turno; beforeShellExecution es una baranda que frena comandos de shell destructivos. Los hooks apuntan a tu clon: si lo movés, lo corrés de nuevo."},{"type":"term","cmd":"uv tool install git+ssh://\u003crepo-de-spec-kit\u003e","out":["Installed 1 executable: spec-kit"],"source":"inferido","cwd":"~","notes":"uv y tmux salen del episodio 0. Spec-Kit y Cursor hacen falta para las fases 4 a 6; sin ellos la guía se queda en la fase 3. wow sk run además necesita tmux, cursor-agent y la skill run-in-cursor, que es el próximo episodio. Las credenciales de Jira las cargás vos con un editor, nunca por el chat. Inferido: necesita red.","pause":true}]},{"id":"caso-principal","title":"Caso principal","subtitle":"«¿Qué sigue?»: los dos flujos, sus bloqueos y el próximo paso","screen":"claude-code","faq":[{"q":"¿Qué son los dos flujos?","a":"El de Product Brain registra el trabajo: contexto, plan, paquetes, chats y export a Jira. El de Spec-Kit lo construye, uno por épica. Se tocan en un solo punto: la clave de la épica en Jira, como PLAT-123."},{"q":"¿Qué quiere decir un [?]","a":"Que no se pudo verificar: acá, porque Jira no está configurado. Un [?] nunca cuenta como hecho, aunque en la realidad esté hecho."},{"q":"¿Por qué no decide el agente lo del mail?","a":"Porque es una decisión del owner. La skill trata los bloqueos como tareas de una persona y nunca los resuelve infiriendo."},{"q":"¿Quién pega el paquete en Product Brain?","a":"Vos, en su chat, con el modelo 3.1 Pro. Después copiás el chat y el panel a wow/pb/chats y el agente los audita."}],"steps":[{"type":"ask","text":"¿Qué sigue?","source":"inferido","notes":"Así se arranca cada sesión de trabajo: una pregunta. El proyecto es mi-servicio con una iniciativa inventada a mitad de camino, «Devoluciones en línea», con dos épicas: E1 ya está en Jira y E2 todavía no."},{"type":"tool","label":"Skill(wow-guide)","source":"inferido","notes":"Claude Code carga wow-guide, la navegadora. Es de solo lectura: nunca ejecuta los pasos que recomienda."},{"type":"term","cmd":"~/.local/bin/wow progress","out":["Flujo PB                62%  (10 de 16)  wow/checklists/pb.md","    [ ] Decisiones del owner cerradas — 1 abiertas","    [ ] Paquete epic-E2 al 100% — wow/pb/epic-E2.md missing","    [?] Historias de PLAT-123 completas en Jira — sin verificar: jira no configurado","    [?] Campos de PLAT-123 corregidos (wow jira fix-fields) — sin verificar: jira no configurado","    [ ] Chat de la épica E2 cerrado y auditado — falta el chat","    [ ] Épica E2 exportada a Jira","Flujo SK PLAT-123       44%  (4 de 9)  wow/checklists/sk-PLAT-123.md","    [ ] Tareas (tasks.md)","    [ ] Work units (work-units.json)","    [?] Historias en Done (sync-status, en Cursor) — sin verificar: jira no configurado","    [ ] Review de cierre de E1","    [?] Épica PLAT-123 cerrada (wow close) — sin verificar: jira no configurado"],"source":"real","cwd":"~/mi-servicio","notes":"Un checklist por flujo, con su porcentaje y solo lo que falta. Mostrá los dos flujos: PB, el de Product Brain, y SK · PLAT-123, el de Spec-Kit para la épica que ya está en Jira. Y los [?]: sin Jira no se pueden verificar, y por eso no cuentan como hechos. Salida real.","pause":true},{"type":"term","cmd":"~/.local/bin/wow snapshot","out":["wrote wow/progress.json","! owner: 1 decision(s) open in wow/context-pack/pending-owner.md","- [harness] generate the epic-E2 packet -\u003e wow pack epic --id E2"],"source":"real","cwd":"~/mi-servicio","notes":"snapshot da los bloqueos (el signo de exclamación) y los próximos pasos, cada uno con dónde se corre. Acá dice harness: o sea, acá, en Claude Code. Salida real."},{"type":"say","md":"#### Flujo PB (Product Brain): 62%\n- **Bloqueo, y es tuyo:** hay una decisión del owner abierta en `pending-owner.md`: si avisamos por mail cuando sale el reintegro. No la decido yo.\n- **Próximo paso:** generar el paquete de E2 (reintegro del pago). Dónde: acá, con el modelo fuerte (claude-opus). Comando: `wow pack epic --id E2`, porque `wow/pb/epic-E2.md` no existe.\n\n#### Flujo SK · PLAT-123 (E1, pedir una devolución): 44%\n- Spec-Kit ya tiene el clarify y el plan; faltan las tareas y los work units.\n- Los `[?]` no se pudieron verificar porque Jira no está configurado: **no cuentan como hechos**.","source":"inferido","notes":"Tres cosas que la skill cuida: primero los bloqueos, que son de una persona; los ids con una glosa corta, E2 (reintegro del pago), para no tener que volver atrás; y nunca un paso que no esté en el estado. Texto ilustrativo sobre salida real."},{"type":"tool","label":"AskUserQuestion(¿Qué hacemos? · Generar el paquete de E2 (Recomendado) · Explicame el estado)","source":"inferido","notes":"En Claude Code, la skill te ofrece elegir con opciones: la recomendada primero. Después se frena y corre solo lo que elegiste."},{"type":"ask","text":"Generar el paquete de E2 (Recomendado)","source":"inferido","notes":"Elegís vos. Fijate que wow-guide no lo corre: el paso lo hace la skill que corresponde."},{"type":"tool","label":"Skill(wow-pack)","source":"inferido","notes":"Para el paquete se carga wow-pack. Las skills no se encadenan solas: la guía propone, vos elegís y entra la skill del paso."},{"type":"term","cmd":"~/.local/bin/wow manifest lint --pb","out":["wow: components not checked against Jira (no credentials or no project key)"],"source":"real","cwd":"~/mi-servicio","notes":"Antes de generar, revisa que el plan tenga lo que Product Brain exige. El aviso es solo porque esta máquina no tiene Jira: no pudo comparar los componentes contra el proyecto de Jira. Salida real."},{"type":"term","cmd":"~/.local/bin/wow pack epic --id E2","out":["wrote wow/pb/epic-E2.md"],"source":"real","cwd":"~/mi-servicio","notes":"Genera el paquete de la épica E2 con la forma exacta de la plantilla de Product Brain. Product Brain registra el trabajo, no lo planifica: el plan ya está decidido. Salida real."},{"type":"term","cmd":"~/.local/bin/wow pack check epic --id E2","out":["predicted completion: 96% (25/26 units)","optional: jira_prefix (empty) — Product Brain can fill it at Jira export"],"source":"real","cwd":"~/mi-servicio","notes":"Y lo mide antes de pegarlo, con las mismas reglas de Product Brain: 96%. Lo único que falta es el prefijo de Jira, que Product Brain completa al exportar. Medir, no especular. Salida real.","pause":true},{"type":"say","md":"Paquete de E2 (reintegro del pago) listo: **96%**, y lo que falta lo completa Product Brain al exportar.\n\nDos cosas son tuyas:\n- **La decisión del mail:** marcala en `pending-owner.md` cuando el owner la tome.\n- **Product Brain:** pegá primero `wow/pb/preamble.md` y después `wow/pb/epic-E2.md`, con el modelo 3.1 Pro.","source":"inferido","notes":"El agente prepara y la persona hace lo que es de una persona: decidir y pegar en Product Brain. Contenido ilustrativo."},{"type":"ask","text":"El owner dijo que sí al mail y ya lo marqué. ¿Qué sigue?","source":"inferido","notes":"La persona marcó la decisión en el archivo. Y vuelve a la guía: así es el ritmo de todos los días, un paso y de nuevo «¿qué sigue?»."},{"type":"term","cmd":"~/.local/bin/wow snapshot","out":["wrote wow/progress.json","- [product-brain] finish the epic E2 chat in Product Brain -\u003e paste the preamble and wow/pb/epic-E2.md"],"source":"real","cwd":"~/mi-servicio","notes":"El bloqueo desapareció y el próximo paso cambió de lugar: ahora es en Product Brain. Salida real."},{"type":"say","md":"Sin bloqueos. El próximo paso es **en Product Brain, y es tuyo**: terminar el chat de E2 (reintegro del pago) pegando el preámbulo y `wow/pb/epic-E2.md`.\n\nCuando termines, copiá el chat y el panel a `wow/pb/chats/` y pedime la auditoría. Al exportar, Product Brain crea la épica en Jira: con esa clave, E2 entra a su propio flujo de Spec-Kit.","source":"inferido","notes":"Este es el centro del episodio: la clave de Jira es lo único que une los dos flujos. Lo que hace Product Brain es de la persona; el agente audita después, porque «completé el documento» no es evidencia.","pause":true}]},{"id":"spec-kit-y-jira","title":"Caso principal (2)","subtitle":"Del lado de Spec-Kit, hasta cerrar la épica en Jira","screen":"claude-code","faq":[{"q":"¿Por qué no lo hace todo Cursor?","a":"Porque el pool de Cursor es escaso. El modelo fuerte piensa acá y Cursor solo ratifica. Igual el comando se manda a Cursor de verdad, así la telemetría de Spec-Kit registra los turnos y los tokens."},{"q":"¿Por qué el agente no manda sync-status?","a":"Porque escribe en Jira. wow y la baranda se niegan a mandarlo: lo corrés vos en Cursor."},{"q":"¿Y el --apply del cierre?","a":"También es tuyo. El agente te muestra la corrida en seco y te deja el comando; vos lo corrés con un signo de exclamación. Acá no hay ventana de aprobación: tu control es la lista que viste antes."},{"q":"¿Queda registro de lo que se escribió en Jira?","a":"Sí: cada escritura queda en harness/jira-writes.jsonl, en el repo."}],"steps":[{"type":"ask","text":"Preparame el paso de Spec-Kit para PLAT-123","source":"inferido","notes":"Ahora el otro flujo: la épica E1 ya está en Jira como PLAT-123 (clave inventada) y Spec-Kit la está construyendo."},{"type":"tool","label":"Skill(wow-sk-prep)","source":"inferido","notes":"wow-sk-prep tiene una meta: que Cursor solo ratifique, sin gastar su pool en pensar."},{"type":"term","cmd":"~/.local/bin/wow sk status --feature specs/001-devoluciones","out":["{","  \"import_warnings\": 0,","  \"features\": [","    {","      \"dir\": \"specs/001-devoluciones\",","      \"epic_key\": \"PLAT-123\",","      \"missing\": [","        \"tasks.md\",","        \"work-units.json\",","        \"wow/sk/001-devoluciones/clarify-answers.md\",","        \"wow/sk/001-devoluciones/plan-draft.md\"","      ],","      \"orphan_tasks\": 0","    }","  ]","}"],"source":"real","cwd":"~/mi-servicio","notes":"Qué le falta a la feature: tasks.md y los work units. Los dos borradores se escriben antes del clarify y del plan, que acá ya se ratificaron. Salida real."},{"type":"term","cmd":"~/.local/bin/wow sk cmd tasks --feature specs/001-devoluciones","out":["/spec-kit.tasks","/spec-kit.tasks.shape"],"source":"real","cwd":"~/mi-servicio","notes":"El comando exacto de Spec-Kit para este paso; son dos, uno detrás del otro. Salida real."},{"type":"tool","label":"Bash(~/.local/bin/wow sk run \"/spec-kit.tasks\" --model claude-sonnet-5-5-high)","source":"inferido","notes":"wow sk run se lo manda a un cursor-agent interactivo, a través de run-in-cursor: queda registrado como si lo tipearas en Cursor, con modelo y tokens. Nunca cursor-agent -p ni el CLI spec-kit: se pierden la telemetría y los tokens. Inferido: necesita Cursor."},{"type":"tool","label":"Bash(~/.local/bin/wow sk quit wow-sk-1)","source":"inferido","notes":"Cuando el turno de Cursor termina, wow sk run muestra su pantalla, y la skill siempre cierra la sesión con wow sk quit. Si Cursor pregunta algo, se le contesta con wow sk send; si la respuesta es tuya, el agente te la pide. El nombre de la sesión es ilustrativo. Inferido."},{"type":"say","md":"Cursor ratificó `/spec-kit.tasks` y cerré la sesión. Después va `/spec-kit.tasks.shape` para los work units.\n\nCuando las historias estén implementadas, las cierra `/spec-kit.sync-status`, y ese **no lo mando yo**: escribe en Jira, lo corrés vos en Cursor.","source":"inferido","notes":"La regla de la serie, otra vez: lo que escribe en Jira es de la persona. Contenido ilustrativo."},{"type":"ask","text":"Ya corrí sync-status en Cursor y la revisión de cierre de E1 salió aprobada. Cerrá lo que quedó abierto en Jira.","source":"inferido","notes":"Saltamos unas semanas: E1 está implementada, sync-status cerró las historias y un revisor independiente aprobó la épica. Pero Spec-Kit deja abiertas las subtareas y la épica."},{"type":"tool","label":"Skill(wow-review)","source":"inferido","notes":"El cierre vive en wow-review, después de la revisión de la épica."},{"type":"term","cmd":"~/.local/bin/wow close --epic E1","out":["PLAT-123: 2 already done, 3 to close: PLAT-126, PLAT-127, PLAT-123","dry run: nothing changed; --apply closes them in this order"],"source":"inferido","notes":"Primero siempre en seco: lista lo que cerraría y no toca nada. Si quedara una historia abierta, se informa como anomalía de Spec-Kit y frena. Inferido: necesita Jira."},{"type":"say","md":"En seco no cambió nada. Quedan 3 por cerrar: las subtareas `PLAT-126` y `PLAT-127` y la épica `PLAT-123`.\n\n**Esto escribe en Jira, así que lo corrés vos:**\n`! wow close --epic E1 --apply`","source":"inferido","notes":"El agente no corre el --apply: te lo deja listo. Es la única escritura de wow hacia Jira, junto con fix-fields.","pause":true},{"type":"term","cmd":"wow close --epic E1 --apply","out":["PLAT-123: 2 already done, 3 to close: PLAT-126, PLAT-127, PLAT-123","closed 3 issues"],"source":"inferido","notes":"La persona lo corre con el signo de exclamación: es el modo bash de Claude Code, un comando tuyo y no del agente. Cada escritura queda en harness/jira-writes.jsonl. Inferido: escribe en Jira.","in":"zsh"},{"type":"say","md":"Cerrado: la épica PLAT-123 y sus subtareas. La escritura quedó registrada en `harness/jira-writes.jsonl`. Con `wow progress` lo confirmo cuando quieras.","source":"inferido","notes":"Cierre del flujo de punta a punta: Product Brain registró, Spec-Kit construyó, y Jira quedó prolijo. Contenido ilustrativo."}]},{"id":"otras-skills","title":"Las otras skills","subtitle":"Contexto, plan, auditoría y revisión, en un minuto","screen":"claude-code","faq":[{"q":"¿Tengo que usar las siete?","a":"No. Cada una hace un paso y vuelve a wow-guide. Si una iniciativa ya tiene su plan, empezás por donde esté."},{"q":"¿Qué es un revisor independiente?","a":"Otro modelo, distinto del que escribió: Codex, Copilot, Gemini, cursor-agent o Claude. wow saltea al autor. Si no hay ninguno, no aprueba nada: sale con 2."},{"q":"¿Qué pasa si el revisor marca un BLOCKER tres veces?","a":"La revisión pasa a una persona, que decide aprobar o rechazar con una razón. Queda registrada como decisión humana, nunca como aprobada por el modelo."}],"steps":[{"type":"ask","text":"¿Y las otras skills de WayOfWork, para qué son?","source":"inferido","notes":"Un repaso corto de las cuatro que no acts.md` vacíos; si querés, los completo leyendo el código.\n\nPara que otro modelo verifique los hechos: `wow review --set claims --ref facts`.","source":"inferido","notes":"El cierre del ejemplo apunta a wow-review: el autor nunca se revisa a sí mismo. Contenido ilustrativo.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores típicos y qué hacer con cada uno","screen":"terminal","faq":[{"q":"¿Qué quiere decir que salga con 2?","a":"Que wow no pudo evaluar: faltan credenciales, falta un revisor o una herramienta. No es un «no»: es «no sé». El agente informa el mensaje y no adivina."},{"q":"Jira me contesta como anónimo o con 401","a":"El token se creó con alcance. Creá uno nuevo con «Create API token» a secas."},{"q":"La baranda de shell no actúa","a":"Falta el hook o moviste el clon. Corré de nuevo wow hook install-cursor."}],"steps":[{"type":"term","cmd":"wow --version","out":["zsh: command not found: wow"],"source":"inferido","cwd":"~","notes":"El más común: ~/.local/bin no está en el PATH. Lo agregás en tu ~/.zshrc y abrís una terminal nueva. Inferido."},{"type":"term","cmd":"cd ~/skills/WayOfWork \u0026\u0026 ./install.sh --skills","out":["installed: ~/.local/bin/wow -\u003e ~/skills/WayOfWork/wow/wow","note: ~/.local/bin is not on PATH","skill: wow-context (Claude Code, Codex)","skill: wow-guide (Claude Code, Codex)","skill: wow-pack (Claude Code, Codex)","skill: wow-pb-audit (Claude Code, Codex)","refusing to replace ~/.agents/skills/wow-plan: it is not a symlink; move it away and re-run","skill: wow-review (Claude Code, Codex)","skill: wow-sk-prep (Claude Code, Codex)","# exit 1"],"source":"real","cwd":"~","notes":"Si ya hay una carpeta real con el nombre de una skill, el instalador no la pisa: dice cuál es y sale con 1. La movés a otro lado y lo corrés de nuevo. Salida real."},{"type":"term","cmd":"~/.local/bin/wow close --epic E1","out":["wow: Jira credentials not found (JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN)","# exit 2"],"source":"real","cwd":"~/mi-servicio","notes":"Sin credenciales de Jira, wow close sale con 2 y nombra las tres variables. Lo mismo indica wow progress con «sin verificar: jira no configurado». Salida real."},{"type":"term","cmd":"wow sk run \"/spec-kit.sync-status\"","out":["wow: /spec-kit.sync-status writes to Jira: run it in Cursor yourself","# exit 1"],"source":"inferido","cwd":"~/mi-servicio","notes":"No es un error, es una regla: sync-status escribe en Jira y wow se niega a mandarlo. Y si falta run-in-cursor, wow sk run sale con 2 y dice que no encuentra ric.py. Inferido: no corremos wow sk run en la grabación.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás y lo que sigue","screen":"claude-code","faq":[{"q":"¿Tengo que dejar de usar Cursor?","a":"No. Cursor sigue corriendo Spec-Kit; WayOfWork prepara cada paso desde Claude Code para que Cursor solo ratifique."},{"q":"¿Dónde veo cada skill en detalle?","a":"En el showcase de WayOfWork: un escenario por skill, con los comandos que corre y qué pasa si falla."},{"q":"¿Qué es run-in-cursor?","a":"La skill que usa wow sk run para mandarle un comando a Cursor como si lo tipearas. Es el próximo episodio."}],"steps":[{"type":"ask","text":"¿Qué me llevo de WayOfWork y qué sigue?","source":"inferido","notes":"Primer episodio de la serie de Claude Code: el cierre ata las ideas con lo que vimos en la serie de Cursor."},{"type":"say","md":"#### Lo que te llevás\n- **Una pregunta para arrancar:** «¿qué sigue?». `wow-guide` muestra los dos flujos, los bloqueos y el próximo paso, y nunca lo corre por vos.\n- **Dos flujos, una clave:** Product Brain registra y Spec-Kit construye; los une la clave de la épica en Jira.\n- **Medir, no especular:** un `[?]` nunca cuenta como hecho, y el paquete se mide antes de pegarlo.\n- **La escritura en Jira es tuya:** el `--apply` lo corrés vos con `!`, y `sync-status` en Cursor.\n\n#### Próximo episodio: Claude Code, episodio 2: run-in-cursor\nLa skill que <script>
// Pure navigation over an episode: the global index is the flattened list of
// (chapter card + its steps). No DOM, no state.
// keyAction(KeyboardEvent.key) -> "right" | "left" | "space" | "b" | null: the presenter
// keys, shared by the control and the stage. PageDown/PageUp act as the arrows because
// presentation clickers send them.
var Nav = (function () {
  function flatten(ep) {
    var out = [];
    (ep.chapters || []).forEach(function (ch, i) {
      out.push({chapter: i, step: -1, kind: "card"});
      (ch.steps || []).forEach(function (st, j) {
        out.push({chapter: i, step: j, kind: st.type});
      });
    });
    return out;
  }

  function clamp(ep, i) {
    var last = flatten(ep).length - 1;
    return Math.max(0, Math.min(Math.floor(i) || 0, Math.max(last, 0)));
  }

  function nextChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    for (var k = i + 1; k < flat.length; k++) {
      if (flat[k].step === -1) return k;
    }
    return Math.max(flat.length - 1, 0);
  }

  function prevChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var cur = i;
    while (cur > 0 && flat[cur].step !== -1) cur--;
    if (cur < i) return cur;
    for (var k = i - 1; k >= 0; k--) {
      if (flat[k].step === -1) return k;
    }
    return 0;
  }

  function keyAction(key) {
    if (key === "ArrowRight" || key === "PageDown") return "right";
    if (key === "ArrowLeft" || key === "PageUp") return "left";
    if (key === " " || key === "Spacebar") return "space";
    if (key === "b" || key === "B") return "b";
    return null;
  }

  function position(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var e = flat[i] || {chapter: 0, step: -1};
    var ch = (ep.chapters || [])[e.chapter] || {};
    return {chapter: e.chapter, step: e.step, total: flat.length, chapterTitle: ch.title};
  }

  return {flatten: flatten, clamp: clamp, nextChapter: nextChapter,
          prevChapter: prevChapter, position: position, keyAction: keyAction};
})();

</script>
<script>
// Static render of the stage: Render.step(container, episode, index) replaces the
// container's content with the FINISHED state of global index `index` (see nav.js).
// Pure function of (episode, index): nothing is kept between calls.
//
// Screens are laid out for a fixed 1600x900 canvas (.ws-screen); the stage scales it.
// All episode text goes through textContent / createTextNode; `say` markdown is parsed
// into DOM nodes, never assigned as HTML.
//
// Animation hooks (for animate.js, which renders the finished state, hides, reveals):
//   data-step="<j>"      on the root node of every applied step (j = index of the step
//                        inside its chapter). Nothing else carries data-step. Steps may
//                        live in different areas (a cursor-full term with `in: "zsh"`
//                        sits in the zsh panel, approve is an overlay at the end of the
//                        screen root), so document order is not step order: select by value.
//   data-anim="type"     the element holding exactly the text that gets typed
//                        (ask text, term command).
//   data-anim="line"     an output line, a say paragraph / heading / list item; revealed
//                        one at a time.
//   data-anim="node"     tool, worked and approve nodes (and the "▸ Ran · cmd" chip and
//                        the "⏺ Bash(cmd)" line); revealed whole.
//   hidden               an approve step that is not the current index keeps its node
//                        (so the step count holds) but is hidden: the window closed.
//   data-anim="idle"     the wrapper of the waiting prompt (prompt line + "❯ █") at the
//                        end of the terminal and of the cursor-full zsh panel. It is not
//                        a step: hide it while a term step animates, show it at the end.
//
// Prompt clock: every prompt shows Render.now() as HH:MM:SS (local time) in a
// .ws-time span. Render.now defaults to `new Date()`; tests and render-preview replace it
// with a fixed date so the output stays deterministic. The stage refreshes only the idle
// prompt's .ws-time every second (Stage.tickClock); steps are never re-rendered for it.
// Prompt icons (folder, house, clock) are inline SVG built with createElementNS.
// Unmarked descendants of a step root appear with the root; hooks inside one root are
// revealed in document order. Chapter cards carry no hooks and appear whole.
//
// Term placement on cursor-full: by default a term step is the agent's command and
// renders in the conversation exactly as on cursor-agent ("▸ Ran · cmd" chip + output
// block). With `in: "zsh"` it is a command the person types and renders in the
// integrated zsh (prompt, typed command, output lines).
// The first chapter card also shows the episode pitch («Le decís al agente…» /
// «Y la skill…») under its title; it is part of the card, not a separate index.
var Render = (function () {
  var USER = "Persona del equipo";
  var TEAM = "Equipo";
  var MODEL = "Sonnet 5.5";
  var BRANCH = "main";

  // ---- DOM helpers (text only) ----
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }
  function stepNode(tag, cls, j, anim) {
    var n = el(tag, cls);
    n.setAttribute("data-step", String(j));
    if (anim) n.setAttribute("data-anim", anim);
    return n;
  }
  function anim(node, kind) { node.setAttribute("data-anim", kind); return node; }
  function dots() {
    return add(el("div", "ws-dots"), el("i", "ws-dot ws-dot-r"), el("i", "ws-dot ws-dot-y"),
               el("i", "ws-dot ws-dot-g"));
  }
  // A bottom-anchored area: short content sits on top, long content shows its newest part.
  function scroller(cls) {
    var outer = el("div", "ws-scroll " + cls);
    var flow = el("div", "ws-flow");
    outer.appendChild(flow);
    return {outer: outer, flow: flow};
  }

  // ---- tiny markdown: **b**, `code`, "- " lists, "#### " heading, blank line = paragraph ----
  function inline(parent, text) {
    String(text).split(/(\*\*[^*]+?\*\*|`[^`]+`)/).forEach(function (part) {
      if (!part) return;
      if (/^\*\*[^*]+?\*\*$/.test(part)) parent.appendChild(el("strong", null, part.slice(2, -2)));
      else if (/^`[^`]+`$/.test(part)) parent.appendChild(el("code", null, part.slice(1, -1)));
      else parent.appendChild(document.createTextNode(part));
    });
    return parent;
  }
  function markdown(md) {
    var frag = document.createDocumentFragment();
    var para = [], list = null;
    function flushPara() {
      if (para.length) frag.appendChild(anim(inline(el("p"), para.join(" ")), "line"));
      para = [];
    }
    String(md || "").split("\n").forEach(function (raw) {
      var line = raw.replace(/\s+$/, "");
      if (/^- /.test(line)) {
        flushPara();
        if (!list) { list = el("ul"); frag.appendChild(list); }
        list.appendChild(anim(inline(el("li"), line.slice(2)), "line"));
        return;
      }
      list = null;
      if (/^#### /.test(line)) {
        flushPara();
        frag.appendChild(anim(inline(el("h4"), line.slice(5)), "line"));
      } else if (!line) {
        flushPara();
      } else {
        para.push(line);
      }
    });
    flushPara();
    return frag;
  }

  // ---- shared pieces ----
  function workedText(st) { return "Worked for " + (st.seconds || 0) + "s"; }
  function inRepo(cwd, repo) {
    var home = "~/" + repo;
    return cwd === home || cwd.indexOf(home + "/") === 0;
  }
  // ---- prompt clock and icons ----
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function clockText(d) {
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }
  function nowText() { return clockText(api.now()); }
  var SVG_NS = "http://www.w3.org/2000/svg";
  // Each icon: list of [tag, attributes] on a 16x16 viewBox; colour comes from currentColor.
  var ICONS = {
    folder: [["path", {d: "M1.5 3.5a1 1 0 0 1 1-1H6l1.5 1.5h6a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z",
                        fill: "currentColor"}]],
    house: [["path", {d: "M8 1.5 15 7.5h-2V14H9.5v-4h-3v4H3V7.5H1z", fill: "currentColor"}]],
    clock: [["circle", {cx: "8", cy: "8", r: "6.25", fill: "none", stroke: "currentColor", "stroke-width": "1.5"}],
            ["path", {d: "M8 4.5V8l2.5 1.5", fill: "none", stroke: "currentColor", "stroke-width": "1.5",
                      "stroke-linecap": "round", "stroke-linejoin": "round"}]]
  };
  function icon(name) {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "ws-ico ws-ico-" + name);
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("aria-hidden", "true");
    ICONS[name].forEach(function (spec) {
      var n = document.createElementNS(SVG_NS, spec[0]);
      Object.keys(spec[1]).forEach(function (k) { n.setAttribute(k, spec[1][k]); });
      svg.appendChild(n);
    });
    return svg;
  }
  // "~/a/b" -> "~/a/" + <b>b</b>: the last path component in bold, like the real prompt.
  function pathText(seg, cwd) {
    var s = String(cwd), cut = s.lastIndexOf("/") + 1;
    if (cut > 0 && cut === s.length) cut = s.lastIndexOf("/", s.length - 2) + 1;
    if (cut > 0) seg.appendChild(document.createTextNode(s.slice(0, cut)));
    seg.appendChild(el("b", "ws-path-last", s.slice(cut)));
    return seg;
  }
  // Two-line zsh prompt, first line: apple, folder, branch, dotted fill, system, time.
  function promptLine(cwd, repo) {
    var p = el("div", "ws-prompt");
    add(p, el("span", "ws-seg ws-seg-apple", ""),
        pathText(add(el("span", "ws-seg ws-seg-path"), icon("folder")), cwd));
    if (inRepo(cwd, repo)) p.appendChild(el("span", "ws-seg ws-seg-git", "on ⑂ " + BRANCH));
    add(p, el("span", "ws-seg-fill"),
        add(el("span", "ws-seg ws-seg-sys", "system"), icon("house")),
        add(el("span", "ws-seg ws-seg-time", "at "), el("span", "ws-time", nowText()), icon("clock")));
    return p;
  }
  function cmdLine(cmd) {
    var l = el("div", "ws-cmdline");
    add(l, el("span", "ws-caret-prompt", "❯ "), anim(el("span", "ws-cmd", cmd), "type"));
    return l;
  }
  function idlePrompt(flow, cwd, repo) {
    var l = el("div", "ws-cmdline");
    add(l, el("span", "ws-caret-prompt", "❯ "), el("span", "ws-caret", " "));
    flow.appendChild(add(anim(el("div", "ws-idle"), "idle"), promptLine(cwd, repo), l));
  }
  // A shell term step: prompt, typed command, output lines.
  function shellStep(st, j, cwd, repo) {
    var n = stepNode("div", "ws-shell-step", j);
    add(n, promptLine(cwd, repo), cmdLine(st.cmd));
    (st.out || []).forEach(function (o) { n.appendChild(anim(el("div", "ws-out", o), "line")); });
    return n;
  }
  function approveOverlay(st, j, current) {
    var ov = stepNode("div", "ws-approve", j, "node");
    if (j !== current) ov.setAttribute("hidden", "");
    var win = el("div", "ws-approve-win");
    add(win, el("div", "ws-approve-icon"), el("div", "ws-approve-title", st.title));
    var body = el("div", "ws-approve-lines");
    (st.lines || []).forEach(function (l) { body.appendChild(el("div", "ws-approve-line", l)); });
    var btns = add(el("div", "ws-approve-btns"), el("button", "ws-btn ws-btn-cancel", "Cancelar"),
                   el("button", "ws-btn ws-btn-ok", st.button));
    add(win, body, btns);
    ov.appendChild(win);
    return ov;
  }
  function chapterSteps(ch, last) { return (ch.steps || []).slice(0, last + 1); }

  // ---- card ----
  function card(ep, ci) {
    var ch = ep.chapters[ci];
    var root = el("div", "ws-screen ws-card");
    var inner = el("div", "ws-card-inner");
    add(inner, el("div", "ws-card-kicker", cardSkill(ep) + " · " + (ci + 1) + " de " + ep.chapters.length),
        el("h1", "ws-card-title", ch.title),
        ch.subtitle ? el("p", "ws-card-sub", ch.subtitle) : null,
        ci === 0 ? pitch(ep) : null);
    root.appendChild(inner);
    return root;
  }
  function pitch(ep) {
    var p = ep.pitch;
    if (!p || (!p.ask && !p.does)) return null;
    var box = el("div", "ws-card-pitch");
    if (p.ask) add(box, el("div", "ws-card-pitch-k", "Le decís al agente…"), el("div", "ws-card-pitch-ask", p.ask));
    if (p.does) add(box, el("div", "ws-card-pitch-k", "Y la skill…"), el("div", "ws-card-pitch-does", p.does));
    return box;
  }
  // Kicker name: the episode title (equals skill.repo for skill episodes; episode 0 has
  // its own title).
  function cardSkill(ep) { return ep.title || (ep.skill && ep.skill.repo) || ""; }

  // ---- Cursor (full and agent-only) ----
  function cursorSidebar(ep, ch) {
    var ws = ep.workspace || {};
    var sb = el("div", "ws-sb");
    sb.appendChild(dots());
    ["✎ New Chat", "⌕ Search", "◷ Automations", "⚙ Customize"].forEach(function (t) {
      sb.appendChild(el("div", "ws-sb-nav", t));
    });

  var api = {step: step, markdown: markdown, clockText: clockText,

  return api;

<script>
// Forward animation of ONE step, plus the playback policy as pure functions.
//
// Animate.run(container, episode, index, opts) -> {cancel(), done: Promise}
//   Renders the finished state with Render.step(container, episode, index), hides the
//   current step's hooks (see render.js header) and reveals them in document order on
//   the injected scheduler, so it looks like the step at `index` playing on top of
//   Render.step(index - 1). Both completion and cancel() end with a fresh
//   Render.step(container, episode, index): the final DOM is identical by construction.
//   `done` resolves in both cases (never rejects). A new run on the same container
//   cancels the previous one first, and a reveal that throws ends the run in the final
//   state too.
// Animate.stop(container): cancels the active run on `container` without rendering
//   (call it before a static Render.step, e.g. on a back-step).
//   opts: {speed = 1 (clamped to >= 0.1), schedule(fn, ms) -> id = setTimeout,
//          unschedule(id) = clearTimeout, now() = Date.now (accepted, not used: every
//          wait goes through schedule)}.
//
// Timing (every value is divided by speed):
//   type  28 ms per character (code points), the text grows one character per tick
//   line  120 ms per line / say block
//   node  250 ms, then the node appears whole (tool, worked, chips)
//   fade  250 ms for a card and an approve window: opacity 0 until the tick
//   autoplay delay between steps 900 ms
// Animate.stepDuration walks the same plan the animation schedules, so the estimate
// and the playback cannot drift apart.
var Animate = (function () {
  var CHAR_MS = 28;
  var LINE_MS = 120;
  var NODE_MS = 250;
  var FADE_MS = 250;
  var AUTOPLAY_MS = 900;
  var MIN_SPEED = 0.1;

  function speedOf(s) {
    s = Number(s);
    if (!(s > 0)) s = MIN_SPEED;
    return Math.max(s, MIN_SPEED);
  }
  function chars(text) { return Array.from(String(text || "")); }
  function hide(n) { n.style.display = "none"; }
  function show(n) { n.style.display = ""; }

  // Render the finished state into `container`, hide what the step at `index` adds and
  // return the reveal plan: [{ms, fn}] in order (ms already divided by speed).
  function prepare(container, ep, index, speed) {
    Render.step(container, ep, index);
    var flat = Nav.flatten(ep);
    if (!flat.length) return [];
    var e = flat[Nav.clamp(ep, index)];
    var plan = [];
    var screen = container.firstChild;
    if (e.step === -1) {
      screen.style.opacity = "0";
      plan.push({ms: FADE_MS / speed, fn: function () { screen.style.opacity = "1"; }});
      return plan;
    }
    var root = container.querySelector('[data-step="' + e.step + '"]');
    if (!root) return plan;
    var step = ep.chapters[e.chapter].steps[e.step];
    // The idle prompt lives in the zsh panel (cursor-full) and on the terminal screen: hide
    // it only when this step plays in that same flow, not for a chat-placed agent command.
    if (step.type === "term" && (step["in"] === "zsh" || ep.chapters[e.chapter].screen === "terminal")) {
      var idle = container.querySelector('[data-anim="idle"]');
      if (idle) hide(idle);
    }
    var hooks = [];
    if (root.hasAttribute("data-anim")) hooks.push(root);
    Array.prototype.forEach.call(root.querySelectorAll("[data-anim]"), function (n) { hooks.push(n); });
    hooks.forEach(function (n) {
      var kind = n.getAttribute("data-anim");
      if (kind === "type") {
        var cs = chars(n.textContent);
        n.textContent = "";
        cs.forEach(function (_, k) {
          plan.push({ms: CHAR_MS / speed, fn: function () { n.textContent = cs.slice(0, k + 1).join(""); }});
        });
      } else if (kind === "line") {
        hide(n);
        plan.push({ms: LINE_MS / speed, fn: function () { show(n); }});
      } else if (kind === "node" && step.type === "approve" && n === root) {
        n.style.opacity = "0";
        plan.push({ms: FADE_MS / speed, fn: function () { n.style.opacity = "1"; }});
      } else if (kind === "node") {
        hide(n);
        plan.push({ms: NODE_MS / speed, fn: function () { show(n); }});
      }
    });
    return plan;
  }

  // One active run per container: a new run (or stop) cancels the previous one first.
  var active = typeof WeakMap === "function" ? new WeakMap() : null;
  function getActive(c) { return active ? active.get(c) : c.__wsAnimRun; }
  function setActive(c, r) { if (active) active.set(c, r); else c.__wsAnimRun = r; }
  function clearActive(c, r) {
    if (getActive(c) !== r) return;
    if (active) active.delete(c); else delete c.__wsAnimRun;
  }

  // Cancel any active run on `container` without rendering (its `done` resolves).
  function stop(container) {
    var r = getActive(container);
    if (r) r.abort();
  }

  function run(container, ep, index, opts) {
    opts = opts || {};
    stop(container);
    var speed = speedOf(opts.speed === undefined ? 1 : opts.speed);
    var schedule = opts.schedule || function (fn, ms) { return setTimeout(fn, ms); };
    var unschedule = opts.unschedule || function (id) { clearTimeout(id); };
    var finished = false, timer = null, resolveDone;
    var done = new Promise(function (resolve) { resolveDone = resolve; });
    var handle = {cancel: function () { end(true); }, done: done, abort: function () { end(false); }};
    setActive(container, handle);
    var plan = prepare(container, ep, index, speed);

    function end(render) {
      if (finished) return;
      finished = true;
      if (timer !== null) { unschedule(timer); timer = null; }
      clearActive(container, handle);
      if (render) Render.step(container, ep, index);
      resolveDone();
    }
    function next(k) {
      if (finished) return;
      if (k >= plan.length) { end(true); return; }
      timer = schedule(function () {
        timer = null;
        if (finished) return;
        try {
          plan[k].fn();
        } catch (err) {
          // A broken reveal must not stall playback: jump to the final state.
          if (typeof console !== "undefined") console.error("Animate: reveal failed", err);
          end(true);
          return;
        }
        next(k + 1);
      }, plan[k].ms);
    }
    next(0);
    return {cancel: handle.cancel, done: done};
  }

  // Sum of the ms the animation of `index` schedules (same plan, detached container).
  function stepDuration(ep, index, speed) {
    var plan = prepare(document.createElement("div"), ep, index, speedOf(speed));
    return plan.reduce(function (s, a) { return s + a.ms; }, 0);
  }

  // What autoplay does after `index` finished animating.
  function autoplay(ep, index, speed) {
    var flat = Nav.flatten(ep);
    var i = Nav.clamp(ep, index);
    if (!flat.length || i >= flat.length - 1) return {stop: true, delay: 0};
    var e = flat[i];
    var steps = ep.chapters[e.chapter].steps || [];
    if (e.step === steps.length - 1) return {stop: true, delay: 0};  // also an empty chapter's card
    if (e.step >= 0 && steps[e.step].pause) return {stop: true, delay: 0};
    return {stop: false, delay: AUTOPLAY_MS / speedOf(speed)};
  }

  // Estimated length: step animations plus autoplay delays (none after a stop).
  function episodeDuration(ep, speed) {
    var flat = Nav.flatten(ep);
    var chapters = (ep.chapters || []).map(function (ch) { return {id: ch.id, ms: 0}; });
    var total = 0;
    flat.forEach(function (e, i) {
      var a = autoplay(ep, i, speed);
      var ms = stepDuration(ep, i, speed) + (a.stop ? 0 : a.delay);
      chapters[e.chapter].ms += ms;
      total += ms;
    });
    return {total: total, chapters: chapters};
  }

  return {run: run, stop: stop, stepDuration: stepDuration, autoplay: autoplay, episodeDuration: episodeDuration,
          CHAR_MS: CHAR_MS, LINE_MS: LINE_MS, NODE_MS: NODE_MS, FADE_MS: FADE_MS, AUTOPLAY_MS: AUTOPLAY_MS};
})();

</script>
<script>
// Stage page: what the audience sees. It holds (episode, index), renders or animates on
// `show` and answers the control. Messages (see the episode format):
//   in : {type:"show", episode, index, animate, speed} | {type:"blackout", on} | {type:"ping"}
//        {type:"wait", delay, seq} | {type:"wait-cancel"}
//   out: {type:"ready"} on load, {type:"shown", episode, index}, then
//        {type:"done-animating", index} (only for the latest show), {type:"pong"},
//        {type:"advance", seq} when a wait ends,
//        {type:"key", key, shift} for the presenter's keys pressed while the stage has focus.
// The stage times the autoplay delay (`wait`) because its window is the visible one:
// the control's timers may be throttled while the stage has focus. A new show, a new wait
// or wait-cancel drops the pending wait.
// A `show` animates only when animate is true and index == current + 1 in the same
// episode; anything else cancels the running animation and renders the finished state.
// The stage never shows notes, sources or the skill commit: it only calls Render.step.
//
// Stage.create(opts) -> {handle(msg) -> Promise, current()} is the testable core:
//   opts: {canvas (Render container), blackout (element toggled with .hidden), episodes,
//          post(msg), schedule?, unschedule? (passed to Animate.run)}.
// Stage.tickClock(canvas) sets the idle prompt's time text (.ws-time inside
//   [data-anim="idle"]) to Render.now(); it touches nothing else, so it never re-renders
//   a step or disturbs a running animation. The page calls it every second.
// Stage.localMove(ep, index, key, shift) -> {index, animate} | null: where the presenter
//   keys go when no control drives the page (opened from its link). → / PageDown / space
//   step forward animated, ← / PageUp step back finished, shift jumps chapters; null at
//   the ends or for any other key. Stage.hashFor(id, index) is the "#id/N" parseHash reads.
// The DOM bootstrap at the end runs only on the page with #ws-stage-root. The page is
// driven when the control opened it (window "ws-stage" with an opener); otherwise it
// navigates by itself and keeps the step in the hash, so a reload stays put.
var Stage = (function () {
  var FADE = "ws-fade-in";

  function create(opts) {
    var canvas = opts.canvas, blackout = opts.blackout;
    var post = opts.post || function () {};
    var byId = {};
    (opts.episodes || []).forEach(function (ep) { if (ep && ep.id) byId[ep.id] = ep; });
    var cur = null;   // {episode, index} of the latest show
    var seq = 0;      // id of the latest show; older runs stay silent
    var schedule = opts.schedule || function (fn, ms) { return setTimeout(fn, ms); };
    var unschedule = opts.unschedule || function (id) { clearTimeout(id); };
    var waiting = null;  // timer id of the pending wait
    function cancelWait() {
      if (waiting !== null) { unschedule(waiting); waiting = null; }
    }
    function onWait(msg) {
      cancelWait();
      var delay = Math.max(Number(msg.delay) || 0, 0);
      waiting = schedule(function () {
        waiting = null;
        post({type: "advance", seq: msg.seq});
      }, delay);
    }
    if (blackout) blackout.hidden = true;

    function fades(ep, index) {
      var e = Nav.flatten(ep)[index];
      return !!e && (e.kind === "card" || e.kind === "approve");
    }

    function onShow(msg) {
      var ep = byId[msg.episode];
      if (!ep) return Promise.resolve();
      var index = Nav.clamp(ep, msg.index);
      var id = ++seq;
      cancelWait();
      var animate = msg.animate === true && cur !== null && cur.episode === ep.id && index === cur.index + 1;
      cur = {episode: ep.id, index: index};
      canvas.classList.remove(FADE);
      if (!animate) {
        Animate.stop(canvas);
        Render.step(canvas, ep, index);
        post({type: "shown", episode: ep.id, index: index});
        post({type: "done-animating", index: index});
        return Promise.resolve();
      }
      var speed = Math.max(Number(msg.speed) || 1, 0.1);
      if (fades(ep, index)) {
        canvas.style.setProperty("--ws-fade-ms", Math.round(Animate.FADE_MS / speed) + "ms");
        canvas.classList.add(FADE);
      }
      var run = Animate.run(canvas, ep, index, {speed: speed, schedule: schedule, unschedule: unschedule});
      post({type: "shown", episode: ep.id, index: index});
      return run.done.then(function () {
        if (id !== seq) return;
        // Same task as Animate's final render: the fresh node never starts the fade.
        canvas.classList.remove(FADE);
        post({type: "done-animating", index: index});
      });
    }

    function handle(msg) {
      if (!msg || typeof msg !== "object") return Promise.resolve();
      if (msg.type === "show") return onShow(msg);
      if (msg.type === "blackout") { if (blackout) blackout.hidden = !msg.on; }
      else if (msg.type === "ping") post({type: "pong"});
      else if (msg.type === "wait") onWait(msg);
      else if (msg.type === "wait-cancel") cancelWait();
      return Promise.resolve();
    }

    return {handle: handle, current: function () { return cur; }};
  }

  // Refresh only the idle prompt's clock text; returns how many were updated.
  function tickClock(canvas) {
    var text = Render.clockText(Render.now());
    var spans = canvas.querySelectorAll('[data-anim="idle"] .ws-time');
    for (var i = 0; i < spans.length; i++) {
      if (spans[i].textContent !== text) spans[i].textContent = text;
    }
    return spans.length;
  }

  // The keydown the stage forwards to the control, or null.
  function keyMessage(ev) {
    if (!ev || !Nav.keyAction(ev.key) || ev.repeat || ev.metaKey || ev.ctrlKey || ev.altKey) return null;
    return {type: "key", key: ev.key, shift: !!ev.shiftKey};
  }

  // Static preview hook: "#<episode-id>/<step>" -> {episode, index}, or null. The step is
  // 1-based, like the "paso N de M" on the control: #id/1 is index 0 (#id/0 is rejected).
  function parseHash(hash) {
    var m = /^#([A-Za-z0-9._-]+)\/(\d+)$/.exec(typeof hash === "string" ? hash : "");
    var n = m ? parseInt(m[2], 10) : 0;
    return n >= 1 ? {episode: m[1], index: n - 1} : null;
  }

  function localMove(ep, index, key, shift) {
    var k = Nav.keyAction(key), last = Nav.flatten(ep).length - 1, target;
    if ((k === "right" || k === "left") && shift) {
      target = k === "right" ? Nav.nextChapter(ep, index) : Nav.prevChapter(ep, index);
      return target === index ? null : {index: target, animate: false};
    }
    if (k === "right" || k === "space") return index >= last ? null : {index: index + 1, animate: true};
    if (k === "left") return index <= 0 ? null : {index: index - 1, animate: false};
    return null;
  }

  function hashFor(id, index) { return "#" + id + "/" + (index + 1); }

  function readEpisodes() {
    var node = document.getElementById("episodes");
    if (!node) return [];
    try {
      var data = JSON.parse(node.textContent);
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  // Scale the 1600x900 frame to fit the window, letterboxed on black.
  function fit(frame) {
    var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    frame.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }

  function boot() {
    if (!document.getElementById("ws-stage-root")) return;
    var frame = document.getElementById("ws-frame");
    var opener = window.name === "ws-stage" ? window.opener : null;
    function post(msg) { if (opener && !opener.closed) opener.postMessage(msg, "*"); }
    var canvas = document.getElementById("ws-canvas");
    var blackout = document.getElementById("ws-blackout");
    var episodes = readEpisodes();
    var stage = create({canvas: canvas, blackout: blackout, episodes: episodes, post: post});
    window.addEventListener("message", function (ev) {
      if (!opener || ev.source !== opener) return;
      stage.handle(ev.data);
    });
    document.addEventListener("keydown", function (ev) {
      var msg = keyMessage(ev);
      if (!msg) return;
      ev.preventDefault();
      if (opener) post(msg);
      else moveAlone(msg);
    });
    function moveAlone(msg) {
      if (Nav.keyAction(msg.key) === "b") { blackout.hidden = !blackout.hidden; return; }
      var cur = stage.current(), ep = null;
      episodes.forEach(function (e) { if (cur && e.id === cur.episode) ep = e; });
      var to = ep && localMove(ep, cur.index, msg.key, msg.shift);
      if (!to) return;
      history.replaceState(null, "", hashFor(ep.id, to.index));
      stage.handle({type: "show", episode: ep.id, index: to.index, animate: to.animate, speed: 1});
    }
    setInterval(function () { tickClock(canvas); }, 1000);
    fit(frame);
    window.addEventListener("resize", function () { fit(frame); });
    if (!opener) {
      // No control driving this page: the hash picks the finished step to show (the first one
      // without a hash) and the presenter keys move from there (moveAlone).
      var preview = function () {
        var h = parseHash(location.hash) || (episodes[0] ? {episode: episodes[0].id, index: 0} : null);
        if (h) stage.handle({type: "show", episode: h.episode, index: h.index, animate: false});
      };
      window.addEventListener("hashchange", preview);
      preview();
    }
    post({type: "ready"});
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  return {create: create, keyMessage: keyMessage, parseHash: parseHash, tickClock: tickClock,
          localMove: localMove, hashFor: hashFor};
})();

</script>
</body>
</html>
