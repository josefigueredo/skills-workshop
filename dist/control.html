 apply ejecuta exactamente ese plan y dice qué hizo con cada página. Antes de escribir vuelve a comprobar que la página sigue siendo de este repo y que nadie la editó después del plan; si algo cambió, esa acción falla y hay que planificar de nuevo. Inferido: escribe en Confluence."},{"type":"worked","seconds":27,"source":"inferido","notes":"El tiempo del agente, sin contar lo que tardaste vos en revisar y aprobar."},{"type":"say","md":"Listo: **`docs/runbook.md` ya está actualizado en Confluence**, con el cambio que revisamos.\n\n#### Qué quedó\n- **En Confluence:** la página nueva versión, con el estado de la sincronización guardado en la propia página\n- **En tu repo:** solo `ctk-plan.json`, el plan; conviene ignorarlo en git\n\nPara comprobar, pedime otro plan: tiene que decir **`5 unchanged`**.","source":"inferido","notes":"Cerrá con lo que queda y por qué importa: el estado vive en Confluence y no en tu repo, así que no hay archivos de estado que se desincronicen. Y la prueba de que todo cerró es un segundo plan que dice todo igual.","pause":true}]},{"id":"otro-caso","title":"Otro caso","subtitle":"Alguien editó la página en Confluence: el drift","screen":"cursor-agent","faq":[{"q":"¿Qué es el drift?","a":"Que alguien editó la página directo en Confluence después de tu última publicación, y vos también cambiaste el archivo. Publicar pisaría su edición, así que ctk frena y avisa."},{"q":"¿Qué pasa con on_drift en su valor por defecto?","a":"Con repo_wins el repo es la fuente de verdad y pisa la edición, pero solo si estás en la última versión de la rama por defecto; el plan lo avisa en la propia fila. Si no estás al día, bloquea y dice por qué: la salida es ponerte al día, nunca cambiar on_drift. Con on_drift: fail no se pisa nunca."},{"q":"¿Cómo traigo lo que escribió la otra persona?","a":"A mano: ctk detecta que la página cambió y muestra el diff, pero no fusiona. Copiás el cambio al .md y planificás de nuevo. El plan puede seguir diciendo DRIFT, porque compara con la página de Confluence; con repo_wins y al día no se pierde nada, y publicar sigue pidiendo tu aprobación."},{"q":"¿Y si el plan sale BLOCKED?","a":"Es que la página ancla no tiene dueño, o es de otro repo. No es un error tuyo: Plataforma tiene que correr ctk grant, que también abre su ventana de aprobación. El agente no lo arregla creando la página por su cuenta."}],"steps":[{"type":"ask","text":"Alguien tocó el runbook directo en Confluence. ¿Qué pasa si publico?","source":"inferido","notes":"Otro pedido típico, y mucho más delicado: no es publicar, es no pisar a nadie. Es la razón de ser de ctk. Fijate que no le decís qué comando usar; la skill lo sabe."},{"type":"term","cmd":"ctk plan","out":["UNCHANGED docs/arquitectura/index.md  'Arquitectura del servicio'","UNCHANGED docs/arquitectura/componentes.md  'Componentes'","UNCHANGED docs/arquitectura/decisiones  'Decisiones'","UNCHANGED docs/arquitectura/decisiones/adr-001.md  'ADR 001: usar colas'","DRIFT     docs/runbook.md  'Runbook de despliegue'  -- remote page was edited since the last sync; repo wins: this checkout is the latest version of the default branch, so the Confluence edit is overwritten","1 drift, 4 unchanged","plan written to ctk-plan.json"],"source":"inferido","cwd":"~/mi-servicio","notes":"Ahora la fila dice DRIFT: alguien editó la página en Confluence y vos también cambiaste el archivo. Fijate el final de la línea: este repo usa el valor por defecto, repo_wins, y como estás en la última versión de la rama por defecto el plan no bloquea y avisa que la edición de Confluence se pisaría. Sale con código 0 y todavía no escribió nada: publicar es otro comando, con ventana. Inferido: el texto sale de plan.py, el resto es ilustrativo."},{"type":"term","cmd":"ctk diff --key docs/runbook.md","out":["DRIFT docs/runbook.md  'Runbook de despliegue'  (page 5014)","--- confluence","+++ local","@@ -1,3 +1,3 @@"," \u003ch2\u003eDespliegue\u003c/h2\u003e","-\u003cp\u003eAvisá en el canal antes de correr el job.\u003c/p\u003e","+\u003cp\u003eCorré el job desde el pipeline.\u003c/p\u003e"," \u003cp\u003eRevertí con el botón de rollback.\u003c/p\u003e"],"source":"inferido","cwd":"~/mi-servicio","notes":"El diff dice exactamente qué pasó. Alguien agregó en Confluence un aviso de «avisá en el canal» que tu archivo no tiene; y vos cambiaste otra línea. Solo lee, imprime acá y no guarda nada. Es lo que la skill pide mirar antes de decidir."},{"type":"say","md":"La página tiene una línea que **tu archivo no tiene**: alguien agregó «Avisá en el canal antes de correr el job». Si publico, el plan lo dice claro: **el repo gana y esa línea se pisa**.\n\n**¿Qué lado gana?**\n- **Recomendado:** traigo esa línea a `docs/runbook.md`, planifico de nuevo y recién ahí publicamos, sin perder nada\n- **Si gana tu versión tal cual:** lo decidís vos; yo **no toco Confluence ni cambio `on_drift`**\n\nHasta que me digas, no publico nada.","source":"inferido","notes":"Acá se ve el criterio de la skill. Aunque el plan permitiría pisar, el agente no elige un lado por vos: te muestra qué se perdería y te pregunta. Y se cuida de dos atajos prohibidos: resolver el drift borrando la página o editando Confluence por su cuenta. Lo seguro es traer el cambio al archivo y volver a planificar."},{"type":"ask","text":"Traé la línea al archivo.","source":"inferido","notes":"Una decisión humana, en una frase. El agente edita tu archivo, que es tuyo, y no Confluence."},{"type":"tool","label":"Edit · docs/runbook.md","source":"inferido","notes":"Edita el runbook para sumar la línea de la otra persona. Es un cambio en tu repo que ves en el diff de Cursor y podés deshacer."},{"type":"tool","label":"Ran · ctk plan","source":"inferido","notes":"Planifica de nuevo con la línea ya en el archivo. Ojo, que es lo contraintuitivo: la fila sigue diciendo DRIFT. ctk compara la página de Confluence con lo que publicaría tu repo, no fusiona, y la página todavía no coincide con tu archivo. Pero ahora el repo gana sin perder nada: lo único que se pisa es la versión vieja de Confluence, porque la línea de la otra persona ya está en tu archivo. Sale con código 0."},{"type":"say","md":"Hecho: la línea de la otra persona **ya está en `docs/runbook.md`**. El plan sigue marcando **DRIFT**, pero ahora **el repo gana sin perder nada**: solo se reemplaza la versión vieja de la página.\n\n**¿Lo publico?** Se abre la misma ventana de aprobación que antes.","source":"inferido","notes":"Terminó donde terminan todos los casos de escritura: pregunta y espera. Si decís que sí, se repite el aviso previo y la ventana que ya viste. Remarcá que el plan dijo DRIFT a propósito: es el aviso, no un error, y lo que protege es que primero trajimos el cambio ajeno al archivo.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores más comunes y cómo salir","screen":"terminal","faq":[{"q":"El agente no usa la skill y habla de otra herramienta de Confluence.","a":"Revisá que el enlace de la skill exista y apunte al clon: el readlink de este capítulo. La skill dice que Confluence se toca solo con ctk, nunca con otro conector."},{"q":"«error: missing environment». ¿Qué falta?","a":"Las tres variables de Confluence. Si ya las guardaste, casi seguro Cursor se abrió antes de que existieran: cerralo del todo y abrilo de nuevo."},{"q":"Cancelé la ventana sin querer. ¿Cómo sigo?","a":"Nada se escribió. Pedile al agente que lo vuelva a intentar: no lo hace solo, a propósito, y te va a preguntar."},{"q":"«cannot tell which repo this is».","a":"El repo no tiene remoto origin. Pasá --repo org/nombre a ctk plan."}],"steps":[{"type":"term","cmd":"readlink ~/.cursor/skills/confluence-team-kit","out":["~/skills/confluence-team-kit/skills/confluence-team-kit"],"source":"real","cwd":"~","notes":"Si el agente no parece conocer la skill, mirá primero si el enlace está. Acá apunta al clon, o sea que la instalación anduvo: lo que falta es reiniciar Cursor."},{"type":"term","cmd":"ctk plan","out":["error: missing environment: CONFLUENCE_BASE_URL, CONFLUENCE_EMAIL, CONFLUENCE_TOKEN","# exit 1"],"source":"inferido","cwd":"~/mi-servicio","notes":"El segundo error típico: faltan las credenciales y ctk lo dice con las tres variables que busca. Casi siempre es que Cursor se abrió antes de guardarlas, así que cerralo del todo y abrilo. Inferido: esta captura no puede correr ctk, la salida es la de la documentación."},{"type":"term","cmd":"ctk plan","out":["BLOCKED   docs/arquitectura/  'docs/arquitectura/'  -- anchor 5001 has no owner; ask the platform team to run `ctk grant 5001 --owner tu-empresa/demo-servicio`","1 blocked","plan written to ctk-plan.json","# exit 2"],"source":"inferido","cwd":"~/mi-servicio","notes":"El tercero no es un error tuyo ni del agente: la página ancla todavía no tiene dueño, y ctk no escribe bajo un ancla sin dueño. La salida está en la propia fila: Plataforma corre ctk grant, que también abre una ventana. Lo único que podés hacer vos es pedírselo.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Tengo que instalar el MCP para usar la skill?","a":"No. Sin el MCP el agente corre ctk en la terminal; con él, usa tres herramientas (page, publish, anchor) con las mismas reglas y la misma ventana."},{"q":"¿Qué tan seguro es el dueño de una página?","a":"Es un guardrail ante errores, no una frontera de seguridad: el token de Confluence es compartido, así que cualquiera con él puede escribir sin pasar por ctk."},{"q":"¿Qué sigue?","a":"El episodio 4: product-brain-mcp, otra herramienta con MCP y con la misma ventana de aprobación."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Primero el plan, después el diff, después la escritura:** `ctk plan` y `ctk diff` solo leen; publicar es un paso aparte.\n- **Nada se escribe sin tu clic:** el agente avisa que se abre la ventana, vos aprobás, y si cancelás no insiste.\n- **No se pisa a nadie:** si alguien editó la página, hay drift y primero se trae el cambio al archivo, antes de publicar.\n\n#### Próximo episodio: product-brain-mcp\nCómo armar una iniciativa completa (el PRD, el RFC y las épicas) desde una conversación y exportarla a Jira, con otro MCP y otra ventana de aprobación.","source":"inferido","notes":"Las tres ideas son el producto: plan antes de escribir, tu clic como única puerta, y no pisar a nadie. Anticipá el próximo en una frase: es el mismo patrón, con un MCP, pero para pasar de una conversación a una iniciativa completa.","pause":true}]}]},{"id":"product-brain-mcp","series":"cursor","order":4,"title":"product-brain-mcp","pitch":{"ask":"Quiero armar la iniciativa «Autogestión de devoluciones», con su PRD, su RFC y sus épicas","does":"Te hace las preguntas de a una, redacta el documento entero, lo abre en tu editor para que lo revises y, con tu «listo» y un clic tuyo, lo escribe. Después exporta las épicas a Jira con tu aprobación."},"skill":{"repo":"product-brain-mcp","commit":"64d7721","date":"2026-10-20"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: la herramienta, el MCP, la configuración y tu token","screen":"terminal","faq":[{"q":"¿Por qué pide Python 3.12 y yo no lo tengo?","a":"No tenés que instalarlo vos. uv, el ayudante que usamos, trae el Python 3.12 que la herramienta necesita y lo guarda aparte, sin tocar el Python de tu máquina. Lo que sí necesitás es uv: si hiciste el episodio 0, ya lo tenés."},{"q":"¿Qué es el MCP y por qué aparece un archivo mcp.json?","a":"Es el enchufe que le da al agente seis herramientas para hablar con tu espacio de trabajo. El mcp.json es la lista de enchufes que Cursor arranca: ahí le decís qué programa correr. Lo escribe el instalador y no lleva ningún secreto."},{"q":"¿Puedo pedirle al agente que instale todo?","a":"Casi: «Instalá product-brain-mcp: cloná el repo y corré ./install.sh». Lo que no le pedís es el token: es tu sesión, lo copiás y lo guardás vos, y nunca pasa por el chat."},{"q":"¿Funciona en Windows o Linux?","a":"No. Cada escritura se aprueba en una ventana nativa de macOS, y sin ella el servidor se niega a escribir."}],"steps":[{"type":"term","cmd":"git clone git@github.com:josefigueredo/product-brain-skill-mcp.git skills/product-brain-mcp","out":["Cloning into 'skills/product-brain-mcp'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo: trae la skill y el servidor juntos. Necesita red y acceso por SSH, que dejó listo el episodio 0. Paso inferido."},{"type":"term","cmd":"uv --version","out":["uv 0.5.0"],"source":"inferido","cwd":"~","notes":"Acá aparece uv, lo único que tenés que tener antes. Pensalo como un ayudante que arma un cuarto aparte con el Python 3.12 y las piezas que hacen falta, sin tocar nada del resto de tu máquina. Si no existe, brew install uv, como en el episodio 0. Salida inferida."},{"type":"term","cmd":"cd ~/skills/product-brain-mcp \u0026\u0026 ./install.sh","out":["skill: product-brain -\u003e ~/skills/product-brain-mcp/skill/product-brain (Claude Code, Codex, Cursor)","MCP server product-brain: Claude Code: skipped (claude is not on PATH); Cursor: registered","next: put base_url in ~/.config/product-brain/config.toml, copy the token and run: uv run --project ~/skills/product-brain-mcp pbmcp token paste"],"source":"inferido","cwd":"~","notes":"Un solo comando hace dos cosas. Enlaza la skill, que le enseña al agente cuándo y cómo usar las herramientas, y escribe el servidor en el mcp.json de Cursor. No copia nada: son accesos directos a tu clon."},{"type":"term","cmd":"cat ~/.cursor/mcp.json","out":["{","  \"mcpServers\": {","    \"product-brain\": {","      \"command\": \"uv\",","      \"args\": [\"run\", \"--project\", \"/RUTA/A/product-brain-mcp\", \"pbmcp\"]","    }","  }","}"],"source":"inferido","cwd":"~","notes":"Esto dejó el instalador: le dice a Cursor que arranque el servidor con uv desde tu clon. Ojo con la ruta de --project: si movés el clon, hay que corregirla a mano, es la causa más común de un servidor con error. No lleva ningún secreto."},{"type":"term","cmd":"mkdir -p ~/.config/product-brain","out":[],"source":"real","cwd":"~","notes":"Ahora la configuración. Todo vive en una carpeta tuya, fuera del repo. Primero la creamos, si no existe."},{"type":"term","cmd":"cat ~/.config/product-brain/config.toml","out":["base_url = \"https://\u003cel backend de tu equipo\u003e\"","deletes_enabled = false"],"source":"real","cwd":"~","notes":"Nada secreto: es la dirección del backend de tu equipo. Esta línea la escribió el agente a pedido, y la dirección real está en la documentación de tu equipo. Sin este archivo, cualquier herramienta falla con config_missing y dice qué ruta falta."},{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token paste","out":["saved 107 characters to ~/.config/product-brain/token"],"source":"inferido","cwd":"~","notes":"Lo único que no hace el agente, a propósito: el token es tu sesión. Lo copiás del navegador (Local Storage, okta-token-storage, accessToken.accessToken) y corrés este comando, que lo guarda con permisos solo tuyos. Nunca en el chat. Dura unas 8 horas. Inferido.","pause":true},{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': True, 'valid': True, 'minutes_left': 464, 'warn': False, 'error': None}"],"source":"inferido","cwd":"~","notes":"La prueba de que quedó bien, sin red. Mirá minutes_left; con menos de 30, el agente te avisa. Y a mano, allowed_projects: los proyectos donde se puede escribir. Los que creás desde la skill se suman solos; uno existente lo sumás vos."}]},{"id":"caso-principal","title":"Caso principal","subtitle":"De una idea a la iniciativa y su PRD, con una ventana de aprobación por cada escritura","screen":"cursor-full","faq":[{"q":"¿Escribe algo antes de que yo diga «listo»?","a":"No. El borrador es un archivo privado en tu máquina que se abre en el editor. Recién con tu «listo» el agente pide escribirlo, y ahí se abre la ventana."},{"q":"¿Qué es el {{pendiente}}?","a":"Es la marca de un dato que nadie dio, o que no cumple las metas del documento anterior. El sistema lo cuenta como campo vacío, así que el hueco se ve. Si el agente escribiera «a definir», contaría como completo y escondería el problema."},{"q":"¿Y si cancelo la ventana o no hago nada?","a":"No se escribe nada. Cancelar, Escape, cerrarla o dejar pasar 100 segundos es un rechazo, y el agente te pregunta qué cambiar. Editás el mismo borrador y decís «listo» otra vez."},{"q":"¿Cuándo uso workflow y cuándo documentos sueltos?","a":"Lo decide un número que el agente cuenta con vos: cuántos equipos entregan. Con uno, workflow: PRD, RFC y una épica encadenados. Con dos o más, una épica por equipo, sueltas."}],"steps":[{"type":"ask","text":"Quiero armar la iniciativa «Autogestión de devoluciones» con su PRD, su RFC y sus épicas. Hoy las devoluciones las resuelve soporte a mano y tardan 9 días. La meta es bajar a 3 días para el 01/03, y que el cliente pueda iniciarlas desde la web y la app. Las hace un solo equipo, en dos entregas: 15/01 y 27/02. Para la primera entrega pensaba hacer solo la web. Afuera queda el reembolso a otros medios de pago.","source":"inferido","notes":"Un pedido normal, con mucho contexto de entrada, a propósito: cuanto más le contás en un solo mensaje, menos preguntas te hace. Fijate lo que dice: el problema con su número, la meta, el plazo, cuántos equipos entregan, qué queda afuera, y una propuesta suya: primero solo la web."},{"type":"tool","label":"Read · ~/.cursor/skills/product-brain/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue sus reglas: preguntar de a una cosa, armar el documento entero, chequear contra las metas y escribir solo con tu clic."},{"type":"tool","label":"Ran · session(action=\"token_status\")","source":"inferido","notes":"Lo primero que hace siempre: mirar que tu token valga y cuánto le queda. Es solo lectura y no sale a la red."},{"type":"tool","label":"Ran · session(action=\"whoami\")","source":"inferido","notes":"Segunda lectura: quién sos en el sistema, para saludarte y para que todo quede a tu nombre."},{"type":"tool","label":"Ran · project(action=\"list\")","source":"inferido","notes":"Mira qué proyectos hay para elegir uno, o crear uno nuevo. Otra lectura."},{"type":"say","md":"Hola, **Persona del equipo**. Tu token vale por **464 minutos** más.\n\n#### Resumen a aprobar\n- **Problema:** las devoluciones se resuelven a mano en soporte y tardan **9 días**\n- **Usuarios:** clientes que devuelven y el equipo de soporte\n- **Éxito:** bajar a **3 días** para el **01/03**, con inicio desde la **web y la app**\n- **Afuera:** reembolso a otros medios de pago\n- **Restricciones:** un solo equipo, dos entregas (**15/01** y **27/02**)\n\n¿Está bien? Con tu sí creo el proyecto, y **se abre una ventana** con lo que se va a crear: **Cancelar** y **Aprobar**. La aprobación es tu clic, no mi pregunta.","source":"inferido","notes":"Mirá cómo cierra el agente: resume en cinco líneas lo decidido, que es el contrato de lo que sigue. Y avisa que se abre una ventana antes de lanzar el comando que escribe."},{"type":"ask","text":"Sí, creá el proyecto.","source":"inferido","notes":"El visto bueno del resumen. Todavía no es la aprobación de la escritura: esa es la que viene.","pause":true},{"type":"tool","label":"Ran · project(action=\"create\")","source":"inferido","notes":"Esta llamada es la que abre la ventana: el agente no escribe nada por su cuenta, pide la escritura y el sistema espera tu clic."},{"type":"approve","title":"Crear proyecto","button":"Aprobar","source":"inferido","notes":"La primera ventana nativa de macOS, el único camino para escribir. Muestra el plan en claro, qué se va a crear, no un resumen del agente. Crear un proyecto lo suma además a la lista de proyectos permitidos. Si cancelás, cerrás o esperás, no pasa nada. Formato real, datos de ejemplo.","pause":true,"window":"Product Brain (pbmcp)","width":600,"height":301,"html":"\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n* { box-sizing: border-box; }\nhtml, body { margin: 0; background: #f7f7f8; }\nbody { font: 13px/1.5 -apple-system, \"SF Pro Text\", \"Helvetica Neue\", sans-serif; color: #252529; padding: 18px 20px 14px;\n        -webkit-font-smoothing: antialiased; cursor: default; }\n.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #00a06d; }\nh1 { font-size: 18px; line-height: 1.3; font-weight: 650; margin: 3px 0 4px 0; }\nh2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #6c6c78; margin: 0 0 8px 0; }\np { margin: 0 0 6px 0; }\n.card h2:not(:first-child) { margin-top: 14px; }\n.meta { color: #6c6c78; margin: 0 0 14px 0; }\n.card { background: #fff; border: 1px solid #e6e6ea; border-radius: 12px; padding: 12px 14px; margin: 0 0 10px 0;\n         box-shadow: 0 1px 2px rgba(20, 20, 30, 0.04); }\n.chip { display: inline-block; border-radius: 999px; padding: 0 8px; margin-left: 4px; font-size: 11px; line-height: 1.6;\n         vertical-align: 1px; white-space: nowrap; }\nh1 .chip { vertical-align: 3px; }\n.prio { vertical-align: -1px; margin: 0 3px; }\n.items, .sub { margin: 0; padding-left: 18px; }\n.items \u003e li { margin: 0 0 4px 0; }\n.sub { color: #6c6c78; margin-top: 2px; }\n.diff { font: 12px/1.45 ui-monospace, \"SF Mono\", Menlo, monospace; border-radius: 8px; overflow: hidden; }\n.diff-line { padding: 1px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }\n.diff-line.add { background: #ecfdf5; color: #065f46; }\n.diff-line.del { background: #fef2f2; color: #991b1b; }\n.diff-line.more { color: #6c6c78; font-style: italic; padding-top: 4px; }\n.foot { color: #6c6c78; font-size: 11.5px; margin: 12px 2px 0 2px; }\n.desc { color: #6c6c78; margin: 2px 0 8px 0; }\n.row { margin: 0 0 5px 0; }\n.task { margin: 0 0 4px 22px; }\n.key { color: #0052CC; font-weight: 600; }\n.md { background: #fff; border: 1px solid #e6e6ea; border-radius: 12px; padding: 4px 18px 12px; margin: 0 0 10px 0; }\n.md h1 { font-size: 19px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 16px 0 8px 0; }\n.md h2 { font-size: 17px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 18px 0 6px 0; }\n.md h3 { font-size: 15px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 14px 0 4px 0; }\n.md h4 { font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 10px 0 4px 0; }\n.md .item { margin: 0 0 3px 14px; }\n.md .item.d2 { margin-left: 28px; }\n.md .item.d3 { margin-left: 42px; }\n.md table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 6px 0 12px 0; border: 1px solid #eaeaeb;\n             border-radius: 8px; overflow: hidden; }\n.md th { background: #f0f0f2; color: #252529; font-weight: 600; text-align: left; border-bottom: 1px solid #eaeaeb; padding: 6px 10px; }\n.md td { color: #252529; border-bottom: 1px solid #eaeaeb; padding: 6px 10px; font-size: 12.5px; vertical-align: top; }\n.md tr:last-child td { border-bottom: 0; }\n.md blockquote { color: #6c6c78; border-left: 3px solid #00a06d; background: #ecfdf5; margin: 8px 0; padding: 4px 12px; border-radius: 0 6px 6px 0; }\n.md pre { background: #f0f0f2; border: 1px solid #eaeaeb; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }\n.md code { font: 12px ui-monospace, \"SF Mono\", Menlo, monospace; color: #252529; background: #f0f0f2; border-radius: 4px; padding: 0 3px; }\n.md hr { border: 0; border-top: 1px solid #d8d8de; margin: 14px 0; }\n.md a { color: #0052CC; }\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003cdiv class=\"eyebrow\"\u003eProduct Brain · pbmcp pide tu aprobación\u003c/div\u003e\n\u003ch1\u003eCrear el proyecto «Autogestión de devoluciones»\u003c/h1\u003e\n\u003cp class=\"meta\"\u003eProduct Brain · pbmcp podrá escribir en él\u003c/p\u003e\n\u003csection class=\"card\"\u003e\n\u003ch2\u003eDescripción\u003c/h2\u003e\n\u003cp\u003eLas devoluciones se resuelven a mano en soporte y tardan 9 días; la meta es 3 días para el 01/03.\u003c/p\u003e\n\u003c/section\u003e\n\u003cp class=\"foot\"\u003eAprobás con un clic en Aprobar. Escape o Cancelar no escriben nada. Se cancela sola a los 100 s.\u003c/p\u003e\n\u003c/body\u003e\u003c/html\u003e"},{"type":"tool","label":"Ran · workflow(action=\"list\")","source":"inferido","notes":"Antes de preguntar el modo, mira si hay un workflow sin terminar para ofrecerte retomarlo."},{"type":"say","md":"Proyecto creado y habilitado.\n\nAntes de escribir, el modo. **Equipos que entregan: 1 → workflow**: el PRD, el RFC y **una** épica encadenados, con las dos entregas como historias en orden. Con dos equipos o más serían épicas sueltas.\n\n¿Vamos con workflow?","source":"inferido","notes":"Acá se ve la regla de decisión de la skill, en una línea: cuenta los equipos que entregan y recomienda. Una entrega o varias en secuencia no cambia la cuenta. Lo que cambia es cuántos equipos. Y en los dos modos se escribe una iniciativa, un PRD y un RFC."},{"type":"ask","text":"Dale, workflow.","source":"inferido","notes":"Una decisión humana, en dos palabras."},{"type":"tool","label":"Ran · workflow(action=\"steps\")","source":"inferido","notes":"Lee los pasos del workflow en orden y los recorre así, nunca de memoria. En modo workflow, la primera aprobación arranca el workflow y escribe el primer documento en una sola ventana."},{"type":"tool","label":"Ran · template(action=\"get\")","source":"inferido","notes":"Lee los campos del PRD, que son más de cien. Por eso no te pregunta sección por sección: arma el documento entero con lo que ya sabe."},{"type":"tool","label":"Ran · document(action=\"draft\")","source":"inferido","notes":"Este es el paso que escribe el borrador en un archivo privado, lo abre en tu editor y devuelve la completitud prevista."},{"type":"say","md":"Armé el PRD entero y lo abrí en tu editor. Todavía **no escribí nada**.\n\n#### Metas de la iniciativa\n- Resolver en **3 días** para el **01/03**\n- Entregas 15/01 y 27/02 ≤ plazo 01/03 ✓\n- Primera entrega solo web → objetivo «web y app» ✗\n\nPor el ✗ dejé **`{{pendiente}}`** en ese campo, aunque lo hayas propuesto: proponerlo no es aceptarlo. ¿Alcanza con la web en la primera entrega?\n\n**Completitud prevista: 88%.** Quedan parciales los riesgos y las dependencias.\n\nEditá el borrador, guardalo y decime **listo**.","source":"inferido","notes":"Esta es la parte que distingue a la skill. Cada valor que propusiste se compara con las metas, y lo que no cumple, o no se sabe, queda pendiente y no como un texto que parezca completo: acá, tu propia idea de la web primero.","pause":true},{"type":"ask","text":"Listo. Dejé la app para la segunda entrega.","source":"inferido","notes":"Tu «listo» es el que habilita el siguiente paso, y acá además contás un cambio que hiciste."},{"type":"tool","label":"Ran · session(action=\"token_status\")","source":"inferido","notes":"Vuelve a mirar el token, porque mientras editabas pudo vencer. Si venció, pide uno nuevo y sigue desde el mismo borrador."},{"type":"say","md":"Voy a correr el comando que **escribe**: arranca el workflow y crea el PRD. **Se va a abrir una ventana** con tus cambios y los botones **Cancelar** y **Aprobar**.\n\nSi cancelás o la cerrás, no lo reintento: te pregunto qué cambiar.","source":"inferido","notes":"El mismo aviso de antes, y a propósito: antes de cada escritura el agente dice que se abre una ventana y qué va a aprobarse. Remarcá la última frase: si cancelás, no insiste y no vuelve a intentarlo tal cual.","pause":true},{"type":"approve","title":"Crear documento","button":"Aprobar","source":"inferido","notes":"Esta ventana muestra lo que cambiaste vos, no el documento entero: es lo que tenés que mirar antes del clic. Una sola aprobación hace las dos cosas, arrancar el workflow y escribir el primer documento. Formato real, datos de ejemplo.","pause":true,"window":"Product Brain (pbmcp)","width":600,"height":387,"html":"\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n* { box-sizing: border-box; }\nhtml, body { margin: 0; background: #f7f7f8; }\nbody { font: 13px/1.5 -apple-system, \"SF Pro Text\", \"Helvetica Neue\", sans-serif; color: #252529; padding: 18px 20px 14px;\n        -webkit-font-smoothing: antialiased; cursor: default; }\n.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #00a06d; }\nh1 { font-size: 18px; line-height: 1.3; font-weight: 650; margin: 3px 0 4px 0; }\nh2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #6c6c78; margin: 0 0 8px 0; }\np { margin: 0 0 6px 0; }\n.card h2:not(:first-child) { margin-top: 14px; }\n.meta { color: #6c6c78; margin: 0 0 14px 0; }\n.card { background: #fff; border: 1px solid #e6e6ea; border-radius: 12px; padding: 12px 14px; margin: 0 0 10px 0;\n         box-shadow: 0 1px 2px rgba(20, 20, 30, 0.04); }\n.chip { display: inline-block; border-radius: 999px; padding: 0 8px; margin-left: 4px; font-size: 11px; line-height: 1.6;\n         vertical-align: 1px; white-space: nowrap; }\nh1 .chip { vertical-align: 3px; }\n.prio { vertical-align: -1px; margin: 0 3px; }\n.items, .sub { margin: 0; padding-left: 18px; }\n.items \u003e li { margin: 0 0 4px 0; }\n.sub { color: #6c6c78; margin-top: 2px; }\n.diff { font: 12px/1.45 ui-monospace, \"SF Mono\", Menlo, monospace; border-radius: 8px; overflow: hidden; }\n.diff-line { padding: 1px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }\n.diff-line.add { background: #ecfdf5; color: #065f46; }\n.diff-line.del { background: #fef2f2; color: #991b1b; }\n.diff-line.more { color: #6c6c78; font-style: italic; padding-top: 4px; }\n.foot { color: #6c6c78; font-size: 11.5px; margin: 12px 2px 0 2px; }\n.desc { color: #6c6c78; margin: 2px 0 8px 0; }\n.row { margin: 0 0 5px 0; }\n.task { margin: 0 0 4px 22px; }\n.key { color: #0052CC; font-weight: 600; }\n.md { background: #fff; border: 1px solid #e6e6ea; border-radius: 12px; padding: 4px 18px 12px; margin: 0 0 10px 0; }\n.md h1 { font-size: 19px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 16px 0 8px 0; }\n.md h2 { font-size: 17px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 18px 0 6px 0; }\n.md h3 { font-size: 15px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 14px 0 4px 0; }\n.md h4 { font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 10px 0 4px 0; }\n.md .item { margin: 0 0 3px 14px; }\n.md .item.d2 { margin-left: 28px; }\n.md .item.d3 { margin-left: 42px; }\n.md table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 6px 0 12px 0; border: 1px solid #eaeaeb;\n             border-radius: 8px; overflow: hidden; }\n.md th { background: #f0f0f2; color: #252529; font-weight: 600; text-align: left; border-bottom: 1px solid #eaeaeb; padding: 6px 10px; }\n.md td { color: #252529; border-bottom: 1px solid #eaeaeb; padding: 6px 10px; font-size: 12.5px; vertical-align: top; }\n.md tr:last-child td { border-bottom: 0; }\n.md blockquote { color: #6c6c78; border-left: 3px solid #00a06d; background: #ecfdf5; margin: 8px 0; padding: 4px 12px; border-radius: 0 6px 6px 0; }\n.md pre { background: #f0f0f2; border: 1px solid #eaeaeb; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }\n.md code { font: 12px ui-monospace, \"SF Mono\", Menlo, monospace; color: #252529; background: #f0f0f2; border-radius: 4px; padding: 0 3px; }\n.md hr { border: 0; border-top: 1px solid #d8d8de; margin: 14px 0; }\n.md a { color: #0052CC; }\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003cdiv class=\"eyebrow\"\u003eProduct Brain · pbmcp pide tu aprobación\u003c/div\u003e\n\u003ch1\u003eArrancar el workflow «Autogestión de devoluciones» y crear «Autogestión de devoluciones»\u003c/h1\u003e\n\u003cp class=\"meta\"\u003eProyecto p-devoluciones · Tipo PRD · tus cambios: +1 −1 líneas\u003c/p\u003e\n\u003csection class=\"card\"\u003e\n\u003ch2\u003eTus cambios\u003c/h2\u003e\n\u003cdiv class=\"diff\"\u003e\u003cdiv class=\"diff-line del\"\u003e- Objetivo de la primera entrega: {{pendiente}}\u003c/div\u003e\u003cdiv class=\"diff-line add\"\u003e+ Objetivo de la primera entrega: web en la 1.ª entrega, app en la 2.ª\u003c/div\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"card\"\u003e\n\u003ch2\u003eContenido\u003c/h2\u003e\n\u003cp\u003eCompletitud al escribir: 88 % · parcial: riesgos, dependencias\u003c/p\u003e\n\u003c/section\u003e\n\u003cp class=\"foot\"\u003eAprobás con un clic en Aprobar. Escape o Cancelar no escriben nada. Se cancela sola a los 100 s.\u003c/p\u003e\n\u003c/body\u003e\u003c/html\u003e"},{"type":"tool","label":"Ran · document(action=\"create\")","source":"inferido","notes":"Con tu clic, el servidor escribe. Un borrador se usa una sola vez: después deja de valer, así que reintentar no escribe dos veces."},{"type":"worked","seconds":41,"source":"inferido","notes":"El tiempo del agente, sin contar lo que tardaste vos en editar y aprobar."},{"type":"say","md":"Listo: el **PRD está escrito** y el workflow arrancó.\n\n#### Qué quedó\n- **Completitud:** **94%**; lo que pediste (web primero, app en la segunda entrega) ya está en el documento\n- **Parciales:** los **riesgos** y las **dependencias**\n- **Siguiente paso:** completar esos dos campos, y después el RFC con el mismo camino: borrador, tu «listo» y tu clic\n\n¿Completamos los riesgos y las dependencias?","source":"inferido","notes":"Cerrá con lo que queda: el documento escrito, su completitud y lo que falta de verdad. Mirá que el hueco de la web y la app ya no está: lo resolviste vos en el borrador.","pause":true}]},{"id":"otro-caso","title":"Otro caso","subtitle":"Exportar una épica a Jira, con el chequeo previo y la ventana","screen":"cursor-agent","faq":[{"q":"¿Qué hace falta para exportar?","a":"Que la integración de Atlassian esté conectada en los ajustes de integraciones de la plataforma. Eso lo hacés vos ahí, no el agente."},{"q":"¿Qué es el aviso de la ventana?","a":"Si un campo quedó como {{pendiente}}, a Jira ese texto llega literal. La ventana te dice cuántos issues lo llevarían. Avisa, no bloquea: cancelás vos y completás el campo antes."},{"q":"¿Se puede deshacer una exportación?","a":"No. La herramienta no tiene acciones para borrar ni deshacer: lo que se crea en Jira se crea de verdad. Por eso el chequeo previo y la ventana."},{"q":"¿Y si solo quiero saber cómo viene la iniciativa?","a":"Pedilo así: «¿Cómo viene la iniciativa?». Una sola lectura arma una tabla con cada documento, su completitud y lo que le falta, sin escribir nada."}],"steps":[{"type":"ask","text":"Exportá la épica «Portal de devoluciones» a Jira, proyecto PLAT.","source":"inferido","notes":"Otro pedido típico, y mucho más delicado: acá se crean issues de verdad. Fijate que no le decís cómo ni con qué."},{"type":"tool","label":"Ran · jira(action=\"status\")","source":"inferido","notes":"Primero mira que Atlassian esté conectado. Es solo lectura. Si no lo está, te manda a las integraciones y no sigue."},{"type":"tool","label":"Ran · jira(action=\"preflight\")","source":"inferido","notes":"El chequeo previo: qué le falta a la épica para exportarse bien, como componentes, prioridades o campos obligatorios. Solo lectura. Es la regla de la skill: nunca exporta sin mostrarte esto y resolverlo con vos."},{"type":"say","md":"A la épica le falta el **componente** de dos historias. Eso lo completás **vos** en el sistema (no lo edito yo): cuando lo tengas, decime y vuelvo a revisar antes de exportar.","source":"inferido","notes":"Acá el agente solo pregunta y señala el hueco; arreglarlo es una escritura sobre la épica y queda en tus manos. No exporta nada hasta que el chequeo previo salga limpio: es la regla de la skill."},{"type":"ask","text":"Ya les puse el componente.","source":"inferido","notes":"Lo resolviste vos, fuera del chat."},{"type":"tool","label":"Ran · jira(action=\"preflight\")","source":"inferido","notes":"Vuelve a correr el chequeo, y ahora no tiene huecos."},{"type":"say","md":"Sin huecos. Ahora la exportación: **se abre una ventana** con los issues que se crearían, **Cancelar** y **Aprobar**. Yo no puedo hacer ese clic.","source":"inferido","notes":"El aviso previo de siempre, antes de la escritura que crea issues de verdad.","pause":true},{"type":"tool","label":"Ran · jira(action=\"preview\")","source":"inferido","notes":"Pide la vista previa de lo que se crearía. Todavía no escribe: el export vuelve a pedir una vista fresca justo antes de abrir la ventana, para que lo que ves sea lo que se crea."},{"type":"approve","title":"Exportar a Jira","button":"Aprobar","source":"inferido","notes":"La ventana del export muestra los issues que se crearían, no un resumen. Mirá la línea de avisos: si un campo quedó pendiente, dice cuántos issues llevarían ese texto a Jira, y lo sano es cancelar y completarlo. Formato real, datos de ejemplo.","pause":true,"window":"Product Brain (pbmcp)","width":600,"height":349,"html":"\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n* { box-sizing: border-box; }\nhtml, body { margin: 0; background: #f7f7f8; }\nbody { font: 13px/1.5 -apple-system, \"SF Pro Text\", \"Helvetica Neue\", sans-serif; color: #252529; padding: 18px 20px 14px;\n        -webkit-font-smoothing: antialiased; cursor: default; }\n.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #00a06d; }\nh1 { font-size: 18px; line-height: 1.3; font-weight: 650; margin: 3px 0 4px 0; }\nh2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #6c6c78; margin: 0 0 8px 0; }\np { margin: 0 0 6px 0; }\n.card h2:not(:first-child) { margin-top: 14px; }\n.meta { color: #6c6c78; margin: 0 0 14px 0; }\n.card { background: #fff; border: 1px solid #e6e6ea; border-radius: 12px; padding: 12px 14px; margin: 0 0 10px 0;\n         box-shadow: 0 1px 2px rgba(20, 20, 30, 0.04); }\n.chip { display: inline-block; border-radius: 999px; padding: 0 8px; margin-left: 4px; font-size: 11px; line-height: 1.6;\n         vertical-align: 1px; white-space: nowrap; }\nh1 .chip { vertical-align: 3px; }\n.prio { vertical-align: -1px; margin: 0 3px; }\n.items, .sub { margin: 0; padding-left: 18px; }\n.items \u003e li { margin: 0 0 4px 0; }\n.sub { color: #6c6c78; margin-top: 2px; }\n.diff { font: 12px/1.45 ui-monospace, \"SF Mono\", Menlo, monospace; border-radius: 8px; overflow: hidden; }\n.diff-line { padding: 1px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }\n.diff-line.add { background: #ecfdf5; color: #065f46; }\n.diff-line.del { background: #fef2f2; color: #991b1b; }\n.diff-line.more { color: #6c6c78; font-style: italic; padding-top: 4px; }\n.foot { color: #6c6c78; font-size: 11.5px; margin: 12px 2px 0 2px; }\n.desc { color: #6c6c78; margin: 2px 0 8px 0; }\n.row { margin: 0 0 5px 0; }\n.task { margin: 0 0 4px 22px; }\n.key { color: #0052CC; font-weight: 600; }\n.md { background: #fff; border: 1px solid #e6e6ea; border-radius: 12px; padding: 4px 18px 12px; margin: 0 0 10px 0; }\n.md h1 { font-size: 19px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 16px 0 8px 0; }\n.md h2 { font-size: 17px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 18px 0 6px 0; }\n.md h3 { font-size: 15px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 14px 0 4px 0; }\n.md h4 { font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: #252529; margin: 10px 0 4px 0; }\n.md .item { margin: 0 0 3px 14px; }\n.md .item.d2 { margin-left: 28px; }\n.md .item.d3 { margin-left: 42px; }\n.md table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 6px 0 12px 0; border: 1px solid #eaeaeb;\n             border-radius: 8px; overflow: hidden; }\n.md th { background: #f0f0f2; color: #252529; font-weight: 600; text-align: left; border-bottom: 1px solid #eaeaeb; padding: 6px 10px; }\n.md td { color: #252529; border-bottom: 1px solid #eaeaeb; padding: 6px 10px; font-size: 12.5px; vertical-align: top; }\n.md tr:last-child td { border-bottom: 0; }\n.md blockquote { color: #6c6c78; border-left: 3px solid #00a06d; background: #ecfdf5; margin: 8px 0; padding: 4px 12px; border-radius: 0 6px 6px 0; }\n.md pre { background: #f0f0f2; border: 1px solid #eaeaeb; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }\n.md code { font: 12px ui-monospace, \"SF Mono\", Menlo, monospace; color: #252529; background: #f0f0f2; border-radius: 4px; padding: 0 3px; }\n.md hr { border: 0; border-top: 1px solid #d8d8de; margin: 14px 0; }\n.md a { color: #0052CC; }\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003cdiv class=\"eyebrow\"\u003eProduct Brain · pbmcp pide tu aprobación\u003c/div\u003e\n\u003ch1\u003eExportar «Portal de devoluciones» a Jira PLAT\u003c/h1\u003e\n\u003cp class=\"meta\"\u003e1 Epic, 3 Story\u003c/p\u003e\n\u003csection class=\"card\"\u003e\n\u003ch2\u003eIssues (4)\u003c/h2\u003e\n\u003cul class=\"items\"\u003e\n\u003cli\u003e\u003cb\u003eEpic\u003c/b\u003e — Portal de devoluciones\u003c/li\u003e\n\u003cli\u003e\u003cb\u003eStory\u003c/b\u003e — Iniciar una devolución desde la web\u003c/li\u003e\n\u003cli\u003e\u003cb\u003eStory\u003c/b\u003e — Seguir el estado de la devolución\u003c/li\u003e\n\u003cli\u003e\u003cb\u003eStory\u003c/b\u003e — Iniciar una devolución desde la app\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/section\u003e\n\u003cp class=\"foot\"\u003eAprobás con un clic en Aprobar. Escape o Cancelar no escriben nada. Se cancela sola a los 100 s.\u003c/p\u003e\n\u003c/body\u003e\u003c/html\u003e"},{"type":"tool","label":"Ran · jira(action=\"export\")","source":"inferido","notes":"Con tu clic se crean los issues, a través del servidor product-brain-mcp y con tu usuario. Si cancelás, no se exporta nada y el agente te pregunta."},{"type":"say","md":"Listo: se crearon **4 issues** en el proyecto **PLAT**.\n\n#### Qué quedó\n- **Épica:** `PLAT-123`\n- **Historias:** `PLAT-124`, `PLAT-125` y `PLAT-126`\n\nTodo quedó a tu nombre. No hay forma de deshacerlo desde acá: si algo no va, se corrige en Jira.","source":"inferido","notes":"Cerrá con lo que se creó y con una advertencia honesta: no hay deshacer. Las claves son inventadas para la demo. Es la razón de tanto chequeo antes.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores más comunes y cómo salir","screen":"terminal","faq":[{"q":"El servidor aparece con error en Cursor.","a":"Casi siempre es la ruta de --project en el mcp.json: si moviste o volviste a clonar el repo, quedó vieja y el instalador no la actualiza. Corregila a mano, o probá el comando en una terminal."},{"q":"La ventana de aprobación no aparece.","a":"Es una ventana nativa de macOS: sin macOS o sin sesión gráfica no hay forma de aprobar, y el servidor no escribe. Es una barrera, no un error."},{"q":"«declined». ¿Qué pasó?","a":"No aprobaste: cancelaste, cerraste la ventana o pasaron 100 segundos. No se escribió nada. Pedile al agente que siga: no reintenta solo."},{"q":"«duplicate». ¿Se escribió dos veces?","a":"No: el documento ya existe, porque una llamada cortada pudo haberlo escrito. El agente lo lee en vez de crearlo otra vez."}],"steps":[{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': True, 'valid': False, 'minutes_left': None, 'warn': True, 'error': 'token_permissions: ~/.config/product-brain/token must be readable only by you: chmod 600 ~/.config/product-brain/token'}"],"source":"inferido","cwd":"~","notes":"El primer error típico: el archivo del token tiene permisos de más y la herramienta lo rechaza a propósito, porque un secreto no tiene que poder leerlo otra persona. La salida dice el comando: chmod 600. Inferido: necesita uv y un token."},{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': False, 'valid': False, 'minutes_left': None, 'warn': True, 'error': 'token_missing: no token at ~/.config/product-brain/token; copy the token and run: pbmcp token paste'}"],"source":"inferido","cwd":"~","notes":"El segundo: no hay token o venció, y dura unas 8 horas. Se repite el paso de copiarlo del navegador y pegarlo con token paste. No hay forma de renovarlo desde el agente, y es a propósito. Si el error dice token_expired es lo mismo. Inferido."},{"type":"term","cmd":"# lo que ve el agente al escribir en un proyecto fuera de la lista","out":["project proj-demo-0002 is not in ~/.config/product-brain/allowed_projects; add its id there to let pbmcp write to it"],"source":"inferido","cwd":"~","notes":"Este es el error en sí: not_allowed, con el id que falta. Es un texto de la herramienta, inferido; el comando de abajo es la lista de verdad."},{"type":"term","cmd":"cat ~/.config/product-brain/allowed_projects","out":["proj-demo-0001"],"source":"real","cwd":"~","notes":"El tercero es not_allowed: el proyecto no está en esta lista, un id por línea, y el error dice qué id agregar. Lo agregás vos con un editor; no se le pide al agente.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Tengo que instalar la skill y el servidor por separado?","a":"No: el mismo ./install.sh deja las dos piezas. Y solo andan juntas: la skill no escribe por sí sola, usa las herramientas del servidor."},{"q":"¿Qué tan seguro es esto?","a":"La ventana frena al agente, pero no es una frontera de seguridad total: el token sirve para todo lo que tu usuario puede hacer. Lo que sí limita la herramienta es dónde escribe, con la lista de proyectos permitidos."},{"q":"¿Qué sigue?","a":"El episodio 5: auditing-repos, para revisar un repo y convertir los hallazgos en issues y pull requests, con Jira como vínculo opcional."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Una conversación en vez de cien campos:** el agente arma el documento entero, vos lo revisás en tu editor y los datos que no se saben quedan `{{pendiente}}`, no escondidos.\n- **Nada se escribe sin tu clic:** el agente avisa que se abre la ventana, vos aprobás, y si cancelás no insiste.\n- **El token es tuyo:** lo guardás vos, dura unas 8 horas y nunca pasa por el chat.\n\n#### Próximo episodio: auditing-repos\nCómo pedirle al agente que revise un repo, mida su calidad y su seguridad, y convierta los hallazgos en issues y pull requests, que podés vincular a un ticket de Jira.","source":"inferido","notes":"Las tres ideas son el producto: una conversación guiada, tu clic como única puerta y un secreto que no sale de tu máquina. Anticipá el próximo en una frase: cambiamos de plano, de armar un documento a mirar un repo que ya existe y ordenar lo que está mal.","pause":true}]}]},{"id":"auditing-repos","series":"cursor","order":5,"title":"auditing-repos","pitch":{"ask":"Auditá este repo","does":"Analiza ocho dimensiones, verifica ejecutando cada hallazgo y escribe un informe local con su nivel de confianza. Frena y espera tu respuesta: recién entonces publica un issue por hallazgo y los pull requests que los cierran."},"skill":{"repo":"teamwayofwork","commit":"a0bc150","date":"2026-10-17"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: clonar, enlazar y autenticar gh","screen":"terminal","faq":[{"q":"¿Por qué enlazar y no copiar?","a":"Porque así hay una sola fuente de verdad: tu clon. Cuando lo actualizás, la skill se actualiza sola. Una copia se queda vieja en silencio."},{"q":"¿Qué son ~/.agents y ~/.claude?","a":"Son las carpetas donde cada agente busca skills. Cursor lee la primera; Claude Code lee la segunda, por eso hay dos enlaces. Si solo usás Cursor, alcanza con el primero."},{"q":"¿Puedo instalarla sin enlaces?","a":"Sí: con npx skills add, desde tu clon, y necesitás Node. Pero instala una copia: no se actualiza con git pull, hay que repetir el comando. Y si ya la habías enlazado, te cambia el enlace por la copia."},{"q":"El clone dice «Permission denied», ¿qué hago?","a":"Falta acceso a este repo, que es de otra organización. Pedíselo al equipo dueño; la clave SSH del episodio 0 sirve en cuanto te lo den. Y sobre gh y Jira: son opcionales; sin gh la skill solo escribe el informe local, y sin Jira el resto anda igual."}],"steps":[{"type":"term","cmd":"git clone \u003crepo\u003e ~/skills/teamwayofwork","out":["Cloning into '~/skills/teamwayofwork'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo del equipo. Ojo: es un repo con varias skills adentro, y la que vamos a usar vive en la carpeta skills/auditing-repos. En \u003crepo\u003e va la dirección que te da tu equipo. Necesita red y acceso por SSH. La clave SSH sale del episodio 0, pero el acceso a este repo, que es de otra organización, se lo pedís al equipo dueño: si no te lo dieron, git clone responde «Permission denied» y no es un error tuyo. Paso inferido."},{"type":"term","cmd":"mkdir -p ~/.agents/skills ~/.claude/skills","out":[],"source":"real","cwd":"~","notes":"Creamos las dos carpetas donde los agentes buscan skills, por si no existen. Si ya existen, no pasa nada: el -p lo tolera."},{"type":"term","cmd":"cd ~/skills/teamwayofwork \u0026\u0026 ln -s \"$PWD/skills/auditing-repos\" ~/.agents/skills/auditing-repos","out":[],"source":"real","cwd":"~","notes":"Un enlace simbólico es un acceso directo: la carpeta de la skill sigue estando en tu clon y el agente la ve desde acá. No imprime nada, y está bien. Si el destino ya existe, ln falla; en ese caso mirá a dónde apunta antes de deshacer nada."},{"type":"term","cmd":"ln -s ../../.agents/skills/auditing-repos ~/.claude/skills/auditing-repos","out":[],"source":"real","cwd":"~","notes":"El segundo enlace es solo para Claude Code. Fijate que es relativo y apunta al primero: así hay un único origen. Si usás solo Cursor, podés saltearlo."},{"type":"term","cmd":"head -3 ~/.claude/skills/auditing-repos/SKILL.md","out":["---","name: auditing-repos","description: Use when asked to review, audit, or assess a local repository for code quality, architecture, testability, coverage, security, documentation or resilience — especially when the findings should become GitHub issues and pull requests, or be tracked on a Jira board."],"source":"real","cwd":"~","notes":"La prueba de que quedó bien: leemos el encabezado del SKILL.md pasando por los dos enlaces. Si lo ves, el agente también lo va a ver. Abrí una sesión nueva del agente: una abierta antes no se entera."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/test-attribution-pattern.sh | tail -3","out":["  ✓ ignored: refactor: rename the codex_parser module","","passed=22 failed=0"],"source":"inferido","cwd":"~","notes":"Una comprobación que viene con la skill: prueba que el detector de atribución dispara en los casos malos y no se confunde con los legítimos. Tiene que terminar en passed=22 failed=0. Inferido: usa rg, que no está en el entorno de la captura."},{"type":"term","cmd":"gh auth login","out":["? What account do you want to log into? GitHub.com","✓ Logged in as \u003ctu-usuario\u003e"],"source":"inferido","cwd":"~","notes":"Esto lo hacés vos, en tu terminal, y es a propósito: es un flujo interactivo con tu cuenta de GitHub, y el agente no debe hacerlo por vos. Sin gh autenticado la skill solo escribe el informe local. Salida inferida.","pause":true},{"type":"term","cmd":"open -e ~/.zshrc","out":[],"source":"inferido","cwd":"~","notes":"Jira es opcional. Si lo querés, abrís tu ~/.zshrc con un editor y agregás JIRA_BASE_URL, JIRA_EMAIL y JIRA_API_TOKEN. Son un secreto: nunca las pegues en el chat. Después reiniciá Cursor. Si falta alguna, Jira se saltea y todo lo demás sigue andando."}]},{"id":"caso-principal","title":"Caso principal","subtitle":"Auditar un repo y frenar en la compuerta","screen":"cursor-full","faq":[{"q":"¿Por qué verifica ejecutando y no solo leyendo?","a":"Porque leer el código y que algo «parezca mal» es una hipótesis, no un hallazgo. Un hallazgo equivocado le cuesta una tarde a una compañera y la confianza en todos los demás."},{"q":"¿Qué es la compuerta?","a":"Es el momento en que la skill frena con el informe y te pregunta qué publicar. Hasta que contestás, no toca GitHub ni Jira. Ojo: es una instrucción de la skill, no un bloqueo técnico."},{"q":"¿Qué pasa con lo que no se pudo verificar?","a":"Se reporta, con su confianza en «unverified», pero no se publica. Así lo ves vos y decidís, sin que le llegue ruido a nadie."},{"q":"¿Por qué agrega AUDIT-REPORT.md al .gitignore?","a":"Porque el informe tiene hallazgos de seguridad y es un borrador hasta que lo aprobás. Con un git add -A se subiría al historial antes de la compuerta."}],"steps":[{"type":"ask","text":"Auditá este repo","source":"inferido","notes":"Dos palabras alcanzan. Lo que cambia con esta skill es que no hace falta explicarle el método: se activa sola con «auditá», «revisá este código» o «chequeá seguridad». Parado en el repo que querés revisar, no en el de la skill."},{"type":"tool","label":"Read · ~/.agents/skills/auditing-repos/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue un orden fijo: preflight, analizar, verificar, informe local, compuerta, publicar, responder la review. También lee dos referencias obligatorias: verificación y atribución."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/preflight.sh","out":["── repository ──","git repo                   yes (main)","working tree               clean","default branch             unknown","","── github ──","gh auth                    yes","repo permission            WRITE","issues enabled             true","","── jira (optional) ──","jira                       skipped (missing: JIRA_BASE_URL JIRA_EMAIL JIRA_API_TOKEN)","","── audit report safety ──","AUDIT-REPORT.md            NOT IGNORED in this repo","  →                      the report holds detailed security findings and is a draft until","                           approved. A git add -A would publish it to history before the gate.","  fix                      echo 'AUDIT-REPORT.md' \u003e\u003e .gitignore   (or write to the scratchpad)","","── verification tooling ──","docker                     no — some claims cannot be verified by running them","uv                         yes","rg                         yes","fd                         yes","","ok=1 warnings=2 blocking=0"],"source":"inferido","cwd":"~/mi-servicio","notes":"Primero el preflight: qué hay y qué falta. No escribe nada. Fijate en dos cosas. Una, el aviso de AUDIT-REPORT.md: el informe es un borrador con hallazgos de seguridad y hay que evitar que un git add -A lo suba. Dos, docker en «no»: un faltante opcional no frena la auditoría, pero cambia lo que el agente puede afirmar; sin docker no dirá nada sobre una imagen. Inferido: usa rg, que no está en la captura; la salida sigue la de la documentación."},{"type":"say","md":"Hay git, el árbol está limpio y `gh` está autenticado. Dos avisos:\n- `AUDIT-REPORT.md` no está en el `.gitignore`: lo agrego antes de escribirlo.\n- No hay `docker`: no voy a afirmar nada sobre imágenes.\n\nNo hay `CLAUDE.md`, `AGENTS.md` ni configuración de CI para leer. Sigo con el análisis.","source":"inferido","notes":"El agente no calla lo que no puede hacer: lo dice. Y no se lanza a analizar sin mirar antes el CI y las instrucciones del repo; acá no hay, y lo informa. Es donde más fallan las auditorías: afirmar cosas que el CI privado desmiente."},{"type":"term","cmd":"echo 'AUDIT-REPORT.md' \u003e\u003e .gitignore","out":[],"source":"real","cwd":"~/mi-servicio","notes":"Esto es lo que dice la skill: confirmar que el informe no se pueda commitear antes de escribirlo. Una línea al .gitignore, y listo."},{"type":"tool","label":"Ran · análisis de ocho dimensiones · api/ y web/","source":"inferido","notes":"El agente recorre las ocho dimensiones: código limpio, arquitectura, testabilidad, cobertura, seguridad, cadena de suministro, resiliencia y documentación. Anota hallazgos, todavía no publica nada."},{"type":"say","md":"Encontré **tres candidatos**. Ninguno es un hallazgo todavía: los verifico ejecutando.\n- Un descuento mayor al 100% en `orders.py`\n- La paginación de `stats.py`\n- El contador de `counter.py`","source":"inferido","notes":"Remarcá la palabra «candidatos». Un hallazgo sin verificar es una suposición con una cita; hasta que algo lo ejecuta, no pasa a ser hallazgo.","pause":true},{"type":"term","cmd":"python3 -c \"from mi_servicio import orders; orders.create_order('A1', [(100, 1)]); print(orders.order_total('A1', discount_pct=150))\"","out":["-50.0"],"source":"real","cwd":"~/mi-servicio/api","notes":"Primer candidato, probado de verdad: un pedido de 100 con 150% de descuento. Fijate el resultado: da menos 50. El total queda negativo; esto sí es un hallazgo, con evidencia que cualquiera puede repetir."},{"type":"term","cmd":"python3 -c \"from mi_servicio import stats; print(stats.paginate([1, 2, 3, 4], 1, 2))\"","out":["[3, 4]"],"source":"real","cwd":"~/mi-servicio/api","notes":"Segundo candidato: el docstring dice que las páginas empiezan en 1, pero pedir la página 1 devuelve la segunda, 3 y 4. Otra vez, evidencia ejecutada, no opinión."},{"type":"tool","label":"Ran · counter.hit() desde 8 hilos · el total dio lo esperado","source":"inferido","notes":"Del tercer candidato, la carrera del contador, el agente intentó reproducirla y no pudo. Eso no lo descarta, pero tampoco lo deja pasar como cierto: va al informe como «unverified». Esta es la honestidad que buscamos."},{"type":"tool","label":"Write · AUDIT-REPORT.md","source":"inferido","notes":"Un archivo local, que ya está ignorado. Cada hallazgo lleva dimensión, severidad, evidencia, por qué importa, arreglo propuesto y, obligatoria, la confianza."},{"type":"say","md":"#### Informe listo: AUDIT-REPORT.md\n#### F-01 · Un descuento de más del 100% deja el total negativo\n**Dimensión:** clean code · **Severidad:** media · **Confianza:** verified by execution\n#### F-02 · La paginación dice «desde 1» pero salta una página\n**Dimensión:** documentación · **Severidad:** baja · **Confianza:** verified by execution\n#### F-03 · Dos pedidos a la vez pueden contarse como uno\n**Dimensión:** resiliencia · **Severidad:** baja · **Confianza:** unverified, reasoning only\n\nF-03 queda **sin verificar**: lo reporto, pero no lo publico. No toqué GitHub. **¿Cuáles publico?**","source":"inferido","notes":"Este es el momento clave del episodio. El agente frena y pregunta; no publicó nada. Leé la confianza de cada uno y señalá que F-03 dice «unverified»: se muestra, pero no sale. Recordá el límite: la compuerta es una instrucción de la skill, no un bloqueo técnico; por eso conviene leer el informe vos.","pause":true},{"type":"ask","text":"Publicá F-01 y F-02. F-03 no.","source":"inferido","notes":"Esta es la decisión humana, en una frase y en el chat. La skill no sigue hasta que contestás. Si hubieras dicho «ninguno», el informe se queda local y listo."},{"type":"tool","label":"Ran · sweep.sh main","source":"inferido","notes":"Antes de pushear la skill corre el sweep: 40 caracteres, tooling local, atribución y SHAs de actions. Vamos a verlo con detalle en el próximo capítulo, con un caso que falla."},{"type":"tool","label":"Ran · gh issue create · F-01 y F-02","source":"inferido","notes":"Un issue por hallazgo, con el comando y su salida como evidencia. Es el agente, con gh, quien publica; la skill le indica frenar y preguntar antes, y eso ya pasó."},{"type":"tool","label":"Ran · gh pr create · fix/descuento-sin-tope y fix/paginacion-desde-1","source":"inferido","notes":"Los PRs se agrupan por cambio que se puede mergear y revertir solo. Acá F-01 y F-02 tocan archivos distintos, así que son dos PRs. Si compartieran archivo, irían juntos. Los arreglos van en una rama por PR; no se muestran."},{"type":"say","md":"#### Listo\n- **Issues:** #21 (F-01) y #22 (F-02), uno por hallazgo.\n- **PRs:** #23 cierra #21 y #24 cierra #22; cada uno abre con `Closes #…` y nombra los archivos que comparte con el otro, o que no comparte ninguno.\n- **F-03** quedó en el informe, sin publicar.\n- Nada de lo que escribí menciona que lo hizo un asistente: todo sale a tu nombre.","source":"inferido","notes":"Leé el cierre: cuántos issues y PRs, y qué quedó afuera. Remarcá la última línea: la regla de atribución es absoluta; no hay pie de página ni trailer de co-autor en nada. Eso ya está decidido por la skill y no se discute en cada corrida.","pause":true}]},{"id":"el-sweep","title":"Otro caso: el sweep","subtitle":"Antes de pushear, chequeos que cuestan menos que descubrirlos en CI","screen":"cursor-agent","faq":[{"q":"¿Por qué marca un nombre de test como secreto?","a":"Porque el detector de TruffleHog toma cualquier palabra de 40 caracteres alfanuméricos como un secreto verificado y rompe el CI. Hay nombres de test que justo miden 40."},{"q":"¿Qué es el tooling local?","a":"Carpetas de herramientas del editor o del agente, como .serena o .idea. Un git add -A las mete en el PR de otra persona sin que te des cuenta."},{"q":"¿Cuándo dice «limpio»?","a":"Solo cuando pudo comparar y no encontró nada. Si no puede comparar, por ejemplo con una rama base que no existe, se niega a decir limpio."},{"q":"¿Puedo correrlo yo, sin el agente?","a":"Sí: son scripts sueltos. Parado en tu repo, corrés sweep.sh con la rama base. Lo mismo con check-attribution.sh."}],"steps":[{"type":"ask","text":"Voy a pushear: pasá el sweep y chequeá que nada indique que lo hizo un LLM","source":"inferido","notes":"Dos pedidos en una frase. La skill los resuelve con dos scripts: el sweep y el chequeo de atribución. Es un segundo push: ya hay PRs abiertos y la persona vuelve a pedir el chequeo antes de empujar un cambio nuevo."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/sweep.sh main","out":["── sweeping fix/descuento-sin-tope against main ──","✗ 40-char identifiers (TruffleHog Lob false positive):","    api/tests/test_orders.py:test_discount_above_100_keeps_total_zero","✗ local tooling in the diff:","    .serena/project.yml","✓ no LLM attribution (commits, diff, branch, GitHub, Jira)","· no pinned action SHAs to verify","✓ no mutable action refs","","sweep found problems — fix before pushing","# exit 1"],"source":"inferido","cwd":"~/mi-servicio","notes":"Dos problemas, y los dos son de los que no se ven a simple vista. Un nombre de test de exactamente 40 caracteres, que TruffleHog tomaría por un secreto, y un archivo de .serena dentro del diff, que se coló con un git add -A. Inferido: el sweep usa rg, que no está en la captura; la salida sigue la de la documentación."},{"type":"say","md":"No pusheo. El sweep encontró dos problemas:\n- Un nombre de test de 40 caracteres en `api/tests/test_orders.py`: el detector de TruffleHog lo marcaría como secreto.\n- Un archivo de `.serena/` en el diff.\n\nLos saco, enmiendo el commit y vuelvo a correr el sweep.","source":"inferido","notes":"El agente se frena solo y dice por qué. No empuja «y vemos en CI». Es el valor del sweep: el error cuesta un minuto acá y una tarde en un PR ajeno."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/sweep.sh main","out":["── sweeping fix/descuento-sin-tope against main ──","✓ no 40-char identifiers","✓ no local tooling files","✓ no LLM attribution (commits, diff, branch, GitHub, Jira)","· no pinned action SHAs to verify","✓ no mutable action refs","","sweep clean","# exit 0"],"source":"inferido","cwd":"~/mi-servicio","notes":"Después de arreglar, el mismo comando. Fijate el punto en «no pinned action SHAs»: no es un tilde, es un punto. Significa que no había nada para chequear, no que se chequeó y estaba bien. La skill distingue las dos cosas a propósito."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/check-attribution.sh main","out":["── attribution sweep: fix/descuento-sin-tope vs main ──","✓ commits clean (author, committer, body, trailers)","✓ diff contents clean","✓ branch name clean","✓ GitHub clean (4 items, 0 with own comments)","· skipped Jira (env vars not set)","","no attribution found on any reachable surface","# exit 0"],"source":"inferido","cwd":"~/mi-servicio","notes":"El segundo pedido: que nada indique que lo hizo un asistente. Mira los commits, el diff, la rama, los PRs y issues de GitHub y, si hay credenciales, Jira. Fijate la última línea: dice «en cualquier superficie alcanzable», no «sin atribución». Lo que no pudo leer figura como salteado con un punto, nunca como limpio."}]},{"id":"jira-y-review","title":"Otro caso: Jira y la review","subtitle":"Vincular los PRs a un ticket y contestar al revisor automático","screen":"cursor-agent","faq":[{"q":"¿Crea tickets en Jira por cada hallazgo?","a":"No. Los hallazgos van a issues de GitHub. Con Jira la skill solo comenta en tickets que ya existen y vincula PRs."},{"q":"¿Por qué no renombra la rama?","a":"Porque, según la documentación de GitHub, si renombrás la rama de un PR abierto, el PR se cierra. Para PRs que ya existen, la clave va en el título."},{"q":"¿Por qué la clave va al final del título?","a":"Para no romper el prefijo de los conventional commits, como fix:. Jira escanea el título entero, así que lo encuentra igual. Y la clave va en mayúsculas."}],"steps":[{"type":"ask","text":"Vinculá estos PRs al ticket PLAT-123","source":"inferido","notes":"Un pedido corto. Jira vincula un PR cuando la clave aparece en el nombre de la rama, en un commit o en el título del PR."},{"type":"say","md":"Los PRs #23 y #24 ya existen, así que **no renombro sus ramas**: GitHub cierra un PR si se renombra su rama.\n\nLes agrego la clave al final del título: `fix: … (PLAT-123)`.","source":"inferido","notes":"Esta es la regla que más cuesta aprender a las malas. La rama de un PR abierto no se toca. El título sí, y es no destructivo. Si ya sabías el ticket antes de empezar, la clave se pone en el nombre de la rama desde el principio."},{"type":"tool","label":"Ran · gh pr edit 23 y gh pr edit 24 · título con (PLAT-123)","source":"inferido","notes":"Dos comandos, uno por PR. Escribe en GitHub, pero sobre PRs que la persona ya aprobó publicar en esta misma conversación."},{"type":"ask","text":"Contestá los comentarios del revisor automático","source":"inferido","notes":"Después de publicar, llegan los comentarios de un revisor automático. Son útiles, pero no tienen la última palabra."},{"type":"say","md":"Verifiqué cada comentario antes de contestar:\n- **Comentario 1: tiene razón.** El borde de la página 0 también falla; lo arreglo.\n- **Comentario 2: no tiene razón.** Muestro la prueba: el test pasa con el valor que él propone.\n\nRespondo en cada hilo con la evidencia, en las dos direcciones.","source":"inferido","notes":"Verificar en las dos direcciones es la idea: ni aceptar todo ni rechazar por reflejo. Si el comentario está mal por la razón que da pero bien en el efecto, la skill dice exactamente eso: es lo más útil para quien lee.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los tres tropiezos más comunes","screen":"terminal","faq":[{"q":"El agente no ofrece la skill, ¿qué hago?","a":"Casi siempre abriste la sesión antes de crear los enlaces. Abrí una sesión nueva y verificá a dónde apunta el enlace."},{"q":"¿Anda en Cursor pero no en Claude Code?","a":"Falta el segundo enlace, el de ~/.claude/skills. Pedile al agente que lo cree, o corrélo vos."},{"q":"¿Qué significa un 401 de Jira?","a":"Que el token venció o se revocó. No es un problema de permisos. Creá otro token y cambiá la variable."},{"q":"¿Se puede forzar la skill?","a":"Sí: escribí /auditing-repos en el chat. Pero normalmente se activa sola cuando pedís una auditoría."}],"steps":[{"type":"term","cmd":"readlink ~/.agents/skills/auditing-repos","out":["~/skills/teamwayofwork/skills/auditing-repos"],"source":"real","cwd":"~","notes":"Primer síntoma: el agente no ofrece la skill. Esto muestra a dónde apunta el enlace: tiene que ser la carpeta skills/auditing-repos de tu clon. Si no sale nada, el enlace no existe; si apunta a otro lado, el clon se movió. Y abrí una sesión nueva."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/sweep.sh nope","out":["✗ base ref 'nope' does not resolve — cannot diff, refusing to report clean","  available: main ","  pass one explicitly: sweep.sh \u003cbase-ref\u003e","# exit 2"],"source":"real","cwd":"~/mi-servicio","notes":"Segundo síntoma: la rama base no existe. El sweep se niega a decir limpio y sale con código 2. Muestra qué ramas hay y cómo pasarla explícita. Un chequeo que pasa en silencio cuando no pudo correr es peor que no tener chequeo."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/preflight.sh | grep -A2 '^jira auth'","out":["jira auth                  HTTP 401 — token expired or revoked, NOT a permissions problem","  note                     an unauthenticated Jira returns 404 for real tickets. Never conclude","                           'the ticket does not exist' from a 404 while /myself returns 401."],"source":"inferido","cwd":"~/mi-servicio","notes":"Tercer síntoma, con Jira: un 401 es un token vencido, no un tema de permisos. Lo importante es la nota: una Jira sin autenticar devuelve 404 para tickets que sí existen, así que jamás se concluye «el ticket no existe» mientras el 401 siga. Inferido: necesita credenciales y red."}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Cuándo la uso?","a":"Cuando vas a entregar un repo a otro equipo, antes de clonar una plantilla muchas veces, o cuando querés que los hallazgos terminen en issues y PRs."},{"q":"¿Sirve para revisar un PR?","a":"No. Para un diff puntual usá el revisor de tu host, por ejemplo /code-review. Esta skill es para un repositorio entero."},{"q":"¿Qué necesito para el próximo episodio?","a":"Lo mismo del episodio 0. Cada episodio empieza instalando su skill."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Un hallazgo sin verificar no es un hallazgo:** cada cosa que se publica salió de ejecutar algo, y lo que no, se reporta pero no sale.\n- **Una compuerta antes de publicar:** el agente frena con el informe y espera tu respuesta. Es una instrucción, no un candado: leé el informe.\n- **Nada indica que lo hizo un asistente:** ni en commits ni en issues ni en PRs, y el sweep lo comprueba.\n\n#### Próximo episodio: local-board-skill\nCómo mantener un tablero de trabajo en archivos Markdown, trazado contra los commits de Git, y sincronizarlo con Jira solo después de revisar un plan.","source":"inferido","notes":"Las tres ideas son el producto: verificar, frenar y no dejar firma. Anticipá el próximo en una frase: pasamos de auditar código a ordenar el trabajo, con un tablero que vive en tu repo y que solo llega a Jira cuando vos revisaste el plan.","pause":true}]}]},{"id":"local-board-skill","series":"cursor","order":6,"title":"local-board-skill","pitch":{"ask":"Armame un board local para este proyecto","does":"Crea un board de épicas, historias y tareas en archivos Markdown, lo traza contra los commits de Git y lo sincroniza con Jira solo después de que revisás un plan guardado: solo se escribe con un plan guardado que revisaste (o con --apply, en la limpieza de links)."},"skill":{"repo":"teamwayofwork","commit":"a0bc150","date":"2026-10-17"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: clonar y enlazar","screen":"terminal","faq":[{"q":"¿Qué necesito instalado?","a":"Solo python3 y git. Los scripts de la skill usan nada más que la biblioteca estándar de Python, así que no hay nada que instalar con pip."},{"q":"¿Por qué enlazar y no copiar?","a":"Porque así hay una sola fuente de verdad: tu clon. Cuando lo actualizás, la skill se actualiza sola. Una copia se queda vieja en silencio."},{"q":"¿Puedo instalarla sin enlaces?","a":"Sí: con npx skills add, desde tu clon, y necesitás Node. Pero instala una copia: no se actualiza con git pull, hay que repetir el comando. Y si ya la habías enlazado, te cambia el enlace por la copia."},{"q":"El clone dice «Permission denied», ¿qué hago?","a":"Falta acceso a este repo, que es de otra organización. Pedíselo al equipo dueño; la clave SSH del episodio 0 sirve en cuanto te lo den."}],"steps":[{"type":"term","cmd":"git clone \u003crepo\u003e ~/skills/teamwayofwork","out":["Cloning into '~/skills/teamwayofwork'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo del equipo. Ojo: es un repo con varias skills adentro, y la que vamos a usar vive en la carpeta skills/local-board-skill. En \u003crepo\u003e va la dirección que te da tu equipo. Necesita red y acceso por SSH. La clave SSH sale del episodio 0, pero el acceso e el trabajo. Hasta acá todo corrió sin red: no tocamos Jira."},{"type":"term","cmd":"find board -type f | sort","out":["board/Board.md","board/SRVE01-devoluciones-de-pedidos/SRVE01.md","board/SRVE01-devoluciones-de-pedidos/SRVS01-como-cajero-devuelvo-un-pedido/SRVS01.md","board/SRVE01-devoluciones-de-pedidos/SRVS01-como-cajero-devuelvo-un-pedido/SRVT01-limitar-el-descuento-al-100/SRVT01.md","board/_meta/autores.md","board/_meta/convenciones.md","board/_meta/inventario-commits.md","board/_meta/mapeo-capacidades.md","board/_meta/spec-ticket-traceability.md","board/sync/.env","board/sync/.gitignore","board/sync/jira-config.json","board/sync/relations.json","board/sync/state.json"],"source":"real","cwd":"~/mi-servicio","notes":"El resultado en disco: cada entidad es un archivo Markdown en una carpeta que respeta la jerarquía. Mirá sync/.env: ahí van las credenciales, y nace ignorado por git para que nadie lo suba por error."},{"type":"say","md":"#### Board armado\n- **Épica SRVE01**, **historia SRVS01** y **tarea SRVT01**, cada una en su archivo y colgando de su padre.\n- Los archivos nacen con secciones «Pendiente de completar». Antes de sincronizar las redacto con evidencia y sin inventar requisitos: lo que no sé lo marco como supuesto.\n\nSi querés, sigo con la evidencia de Git.","source":"inferido","notes":"Redactar no lo hace ningún script. La skill pide objetivo, alcance y criterios de aceptación verificables, y prohíbe inventar requisitos: lo dudoso se marca como supuesto. Estos cuerpos terminan como descripción en Jira, vale la pena revisarlos."},{"type":"ask","text":"Fijate qué commits hay desde el principio del repo y validá el grafo del board","source":"inferido","notes":"Otra pieza. Usamos el principio del repo como corte porque el board es nuevo; con uno que ya sincronizó, el corte sale del estado guardado, y eso lo vemos enseguida."},{"type":"term","cmd":"python3 ~/.agents/skills/local-board-skill/scripts/inventory_git.py --workspace . --board-dir board -
