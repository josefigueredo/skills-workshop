3e\u003c/div\u003e\n\u003c/div\u003e\n\u003cp class=\"lead\"\u003eSe muestran 1 de 1. Los demás quedaron afuera por el filtro del equipo dueño: sin confirmar, refutados por el contraste o fuera de alcance.\u003c/p\u003e\n\u003cdiv class=\"callout info\"\u003e\u003cstrong\u003eCómo leer este informe\u003c/strong\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eSeveridad\u003c/b\u003e, con un criterio fijo. \u003cb\u003eAlta:\u003c/b\u003e expone datos o credenciales a quien no debería, corrompe datos, o rompe una función entera. \u003cb\u003eMedia:\u003c/b\u003e produce un resultado incorrecto que se nota, o expone información menor. \u003cb\u003eBaja:\u003c/b\u003e robustez, observabilidad o una inconsistencia visible sin pérdida.\u003c/li\u003e\u003cli\u003e\u003cb\u003eEsfuerzo:\u003c/b\u003e S es un cambio chico y local, M toca varios archivos, L pide rediseñar una parte. Los links llevan a las líneas citadas en la base fijada.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eHallazgo\u003c/th\u003e\u003cth\u003eCategoría\u003c/th\u003e\u003cth\u003eSeveridad\u003c/th\u003e\u003cth\u003eEsfuerzo\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eQ-01\u003c/td\u003e\u003ctd\u003e\u003ca href=\"#f-q-01\"\u003eLa paginación dice empezar en 1 pero empieza en 0\u003c/a\u003e\u003c/td\u003e\u003ctd\u003eestadisticas\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"verdict low\"\u003ebaja\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eS\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003csection id=\"start-here\"\u003e\n\u003ch2\u003ePor dónde empezar\u003c/h2\u003e\n\u003cp class=\"lead\"\u003eLo de mayor severidad y menor esfuerzo primero.\u003c/p\u003e\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eHallazgo\u003c/th\u003e\u003cth\u003eSeveridad\u003c/th\u003e\u003cth\u003eEsfuerzo\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eQ-01\u003c/td\u003e\u003ctd\u003e\u003ca href=\"#f-q-01\"\u003eLa paginación dice empezar en 1 pero empieza en 0\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"verdict low\"\u003ebaja\u003c/span\u003e\u003c/td\u003e\u003ctd\u003eS\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003csection id=\"cat-estadisticas\" class=\"cat\" data-category=\"estadisticas\"\u003e\n\u003ch2\u003eestadisticas\u003c/h2\u003e\n\u003carticle class=\"issue\" id=\"f-q-01\"\u003e\n\u003cheader\u003e\u003cspan class=\"issue-n\"\u003eQ-01\u003c/span\u003e\u003ch3\u003eLa paginación dice empezar en 1 pero empieza en 0\u003c/h3\u003e\u003cspan class=\"verdict low\"\u003ebaja\u003c/span\u003e\u003c/header\u003e\n\u003cp class=\"sev\"\u003eestadisticas · esfuerzo S\u003c/p\u003e\n\u003ch4\u003eQué pasa\u003c/h4\u003e\u003cp\u003eLa documentación de paginate() y su cálculo no coinciden en cuál es la primera página.\u003c/p\u003e\n\n\u003ch4\u003eEvidencia en la base\u003c/h4\u003e\n\u003cfigure class=\"code\"\u003e\u003cfigcaption\u003e\u003ccode\u003eAPI/mi_servicio/stats.py:9-12\u003c/code\u003e · page * size: la primera página es la 0\u003c/figcaption\u003e\u003cpre\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e6\u003c/i\u003e    return sum(values) / len(values)\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e7\u003c/i\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e8\u003c/i\u003e\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e9\u003c/i\u003edef paginate(items, page, size):\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e10\u003c/i\u003e    \u0026quot;\u0026quot;\u0026quot;Return the items of a 1-based page.\u0026quot;\u0026quot;\u0026quot;\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e11\u003c/i\u003e    start = page * size\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e12\u003c/i\u003e    return items[start:start + size]\u003c/span\u003e\u003c/pre\u003e\u003c/figure\u003e\n\u003ch4\u003eSugerencia\u003c/h4\u003e\u003cp\u003eDecidir si la primera página es la 0 o la 1, corregir el docstring o el cálculo y sumar un test de la página 1.\u003c/p\u003e\n\u003c/article\u003e\n\u003c/section\u003e\n\u003csection id=\"how\"\u003e\n\u003ch2\u003eCómo se hizo\u003c/h2\u003e\n\u003cp\u003eSe leyó cada repo en un commit fijo; todo lo citado sale de ese commit, no del árbol de trabajo.\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eRepo\u003c/th\u003e\u003cth\u003eBase\u003c/th\u003e\u003cth\u003eRemoto\u003c/th\u003e\u003cth\u003eCarpeta\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eAPI\u003c/td\u003e\u003ctd\u003e\u003ccode title=\"8151c7c7d1a409a17bdb058f27bc878250be75d1\"\u003e8151c7c\u003c/code\u003e\u003c/td\u003e\u003ctd\u003esin remoto\u003c/td\u003e\u003ctd\u003eapi\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eROOT\u003c/td\u003e\u003ctd\u003e\u003ccode title=\"8151c7c7d1a409a17bdb058f27bc878250be75d1\"\u003e8151c7c\u003c/code\u003e\u003c/td\u003e\u003ctd\u003esin remoto\u003c/td\u003e\u003ctd\u003e-\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eQuién revisó cada paso: las herramientas externas por nombre y, si no hubo, la revisión propia.\u003c/p\u003e\n\u003cp\u003eModelo autor: \u003ccode\u003eGPT-5.6 Terra\u003c/code\u003e\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePaso\u003c/th\u003e\u003cth\u003eQuién lo hizo\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003ecorrección\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"who\"\u003e/review-bugbot\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ecalidad\u003c/td\u003e\u003ctd\u003erevisión propia\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003econtraste\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"who\"\u003eSonnet 5.5 High\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eUn segundo modelo revisó cada hallazgo; si es de la misma familia que el autor, el contraste vale menos y se dice.\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eModelo de contraste\u003c/th\u003e\u003cth\u003eFamilia\u003c/th\u003e\u003cth\u003eVeredicto\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ca href=\"#f-q-01\"\u003eQ-01\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eSonnet 5.5 High\u003c/code\u003e\u003c/td\u003e\u003ctd\u003emisma familia: no\u003c/td\u003e\u003ctd\u003ecoincide\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eLo que pasó el filtro:\u003c/p\u003e\u003cul\u003e\u003cli\u003eCorrección: se muestran 1 de 2\u003c/li\u003e\u003cli\u003eCalidad: se muestran 1 de 1\u003c/li\u003e\u003c/ul\u003e\n\u003cp class=\"nota\"\u003eLos demás quedaron afuera por el filtro del equipo dueño: sin confirmar, refutados por el contraste o fuera de alcance.\u003c/p\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n(function () {\n  var root = document.documentElement;\n  var btn = document.querySelector(\".theme-toggle\");\n  try { var saved = localStorage.getItem(\"ia-theme\"); if (saved) { root.setAttribute(\"data-theme\", saved); } } catch (e) {}\n  if (btn) {\n    btn.addEventListener(\"click\", function () {\n      var dark = root.getAttribute(\"data-theme\") === \"dark\" ||\n        (!root.getAttribute(\"data-theme\") \u0026\u0026 window.matchMedia(\"(prefers-color-scheme: dark)\").matches);\n      var next = dark ? \"light\" : \"dark\";\n      root.setAttribute(\"data-theme\", next);\n      try { localStorage.setItem(\"ia-theme\", next); } catch (e) {}\n    });\n  }\n  var links = Array.prototype.slice.call(document.querySelectorAll(\"#toc \u003e li \u003e a\"));\n  if (!(\"IntersectionObserver\" in window) || !links.length) { return; }\n  var byId = {};\n  links.forEach(function (a) { byId[a.getAttribute(\"href\").slice(1)] = a; });\n  var obs = new IntersectionObserver(function (entries) {\n    entries.forEach(function (en) {\n      if (en.isIntersecting \u0026\u0026 byId[en.target.id]) {\n        links.forEach(function (a) { a.classList.remove(\"active\"); });\n        byId[en.target.id].classList.add(\"active\");\n      }\n    });\n  }, { rootMargin: \"0px 0px -70% 0px\" });\n  Object.keys(byId).forEach(function (id) { var el = document.getElementById(id); if (el) { obs.observe(el); } });\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"type":"say","md":"#### Listo\n- Corrida y reportes en `~/auditorias/mi-servicio`: `mi-servicio-correctness.html` y `mi-servicio-quality.html`.\n- Correctitud: **se muestra 1 de 2**. C-02 (la carrera en el contador) quedó sin verificar y afuera.\n- Calidad: **se muestra 1 de 1**.\n- Una rama local, `fix/c-01-descuento-sin-tope`, sin push.\n- Pasadas propias en vez de workers externos: estático (sin semgrep, gitleaks ni osv-scanner), calidad (sin wshobson/agents) y contraste (sin el CLI `agent`).\n- Contraste: **Sonnet 5.5 High** revisó lo que escribí yo (**GPT-5.6 Terra**), un modelo de **otra familia**, y el reporte dice quién contrastó a quién.\n- Pendiente: los tests nuevos (paso 1.5), como pediste; sin superpowers, con la pasada propia.","source":"inferido","notes":"Leé el cierre: dónde están los reportes, cuánto se muestra de cuánto, qué rama quedó (local), qué pasos usaron la pasada propia, quién contrastó a quién y qué falta. Nada se publicó.","pause":true}]},{"id":"probar-un-hallazgo","title":"Probar un hallazgo","subtitle":"Un test que falla, no una opinión","screen":"cursor-agent","faq":[{"q":"¿Y si el bug no se puede probar con un test?","a":"Se descarta con el motivo, o queda como candidato y fuera del reporte. Es un resultado válido: el reporte solo dice lo que se probó."},{"q":"¿Por qué no arregla el bug directamente?","a":"Porque el sistema es de otro equipo. La skill deja el test rojo y la propuesta escrita; el arreglo lo decide y lo hace el equipo dueño."},{"q":"¿Qué pasa con problemas de configuración o de CI?","a":"No llevan rama: se confirman con el comando que se corrió y su salida guardada, o con documentación."}],"steps":[{"type":"ask","text":"¿Cómo sé que el C-01 es real y no una opinión?","source":"inferido","notes":"Es la pregunta que va a hacer el equipo dueño. Si la skill la contesta con evidencia, el reporte se acepta sin discusión."},{"type":"term","cmd":"git -C ~/mi-servicio diff --stat main fix/c-01-descuento-sin-tope","out":[" api/tests/test_discount_cap.py | 12 ++++++++++++"," 1 file changed, 12 insertions(+)"],"source":"real","cwd":"~","notes":"La rama del hallazgo cambia un solo archivo, y es un test. Ni una línea de código de producción."},{"type":"term","cmd":"grep AssertionError ~/auditorias/mi-servicio/outputs/C-01-red.txt","out":["AssertionError: -50.0 not greater than or equal to 0"],"source":"real","cwd":"~","notes":"Y esta es la salida guardada del test: falla por la aserción, en el commit fijado. Cualquiera puede reproducirla."},{"type":"say","md":"La rama `fix/c-01-descuento-sin-tope` tiene **un commit, solo con el test**, y falla en la base por una aserción: `order_total()` devuelve -50.0.\n\nEl arreglo queda como propuesta escrita en el hallazgo: limitar el descuento entre 0 y 100. **No lo aplico**: lo decide el equipo dueño.","source":"inferido","notes":"Remarcá las dos reglas: rojo por la razón correcta (un import roto no cuenta) y la skill nunca arregla. Eso es lo que hace que el equipo dueño confíe en el reporte.","pause":true}]},{"id":"antes-de-entregar","title":"Antes de entregar","subtitle":"Citas, higiene y qué queda afuera","screen":"cursor-agent","faq":[{"q":"Si la cita existe, ¿el hallazgo es cierto?","a":"No necesariamente. cite-check confirma que el archivo y las líneas existen; que el hallazgo sea cierto lo prueban el test rojo, el contraste y la verificación."},{"q":"¿La higiene encuentra cualquier secreto?","a":"Busca por patrones. Un secreto con un formato raro puede pasar, así que no reemplaza mirar lo que compartís."},{"q":"¿Puedo ver lo que quedó afuera?","a":"Sí: está en la carpeta de la corrida, con el motivo. El filtro aplica una regla explícita; no decide si algo es importante para tu equipo."}],"steps":[{"type":"ask","text":"¿Está todo listo para entregar?","source":"inferido","notes":"Antes de mandarle nada al equipo dueño, se revisa. La skill tiene tres revisiones que se pueden correr cuantas veces haga falta."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py cite-check --run mi-servicio","out":["all 3 citations resolve"],"source":"real","cwd":"~/auditorias","notes":"Cada cita del reporte apunta a un archivo y unas líneas que existen en el commit fijado. Si alguna no existe, el agente la corrige antes de armar los reportes."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py hygiene --run mi-servicio","out":["hygiene: clean"],"source":"real","cwd":"~/auditorias","notes":"La higiene otra vez, ahora también sobre los HTML ya armados: ningún secreto a la vista. Es el último control antes de compartir."},{"type":"say","md":"Sí: las **3 citas** existen en el commit fijado y la higiene da **limpio**, también en los reportes. Se pueden compartir.","source":"inferido","notes":"Respuesta corta y con números. Eso es lo que esperamos de la skill siempre."},{"type":"ask","text":"¿Qué quedó afuera del reporte y por qué?","source":"inferido","notes":"La tercera frase del README de la skill. Es la pregunta que hace alguien desconfiado, y está bien que la haga."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py filter --run mi-servicio","out":["correctness: showing 1 of 2","quality: showing 1 of 1","start here: Q-01"],"source":"real","cwd":"~/auditorias","notes":"El filtro dice cuánto se muestra de cuánto. Correr el filtro de nuevo no cambia nada: aplica la misma regla."},{"type":"say","md":"Se muestra **1 de 2** en correctitud y **1 de 1** en calidad.\n\nQuedó afuera **C-02** (dos pedidos a la vez pueden contarse como uno): no se pudo probar con un test, y la regla es que nada sin verificar entra al reporte.","source":"inferido","notes":"Remarcá que lo que queda afuera no se esconde: se cuenta y se explica. Mejor un reporte corto y cierto que uno largo y discutible.","pause":true}]},{"id":"los-dos-reportes","title":"Los dos reportes","subtitle":"Lo que recibe el equipo dueño","screen":"cursor-agent","faq":[{"q":"¿Necesitan algo instalado para abrirlos?","a":"No. Cada reporte es un solo archivo HTML con todo adentro; se abre con doble clic en cualquier navegador."},{"q":"¿Puedo cambiarle el aspecto?","a":"Sí, con --theme y un CSS propio al armarlos, sin tocar el generador."},{"q":"¿Y si quiero abrir los issues?","a":"Con publish prendido, la skill deja escritos los textos y los comandos gh. Los revisás y los corrés vos, o no."}],"steps":[{"type":"ask","text":"¿Dónde quedaron los reportes y qué tienen?","source":"inferido","notes":"Cerramos el recorrido por lo que importa: el entregable."},{"type":"term","cmd":"ls ~/auditorias/mi-servicio","out":["findings","manifest.json","mi-servicio-correctness.html","mi-servicio-quality.html","outputs"],"source":"real","cwd":"~","notes":"Toda la corrida en una carpeta: el estado (manifest.json), un archivo por hallazgo, las salidas guardadas y los dos reportes."},{"type":"say","md":"#### Dos HTML, uno por tema\n- **Correctitud**: cada bug con el código citado en el commit fijado, la rama co  -p --mode ask --trust --workspace … --model gemini-3.1-pro · revisión de solo lectura","source":"inferido","notes":"Revisa otro agente, con otro modelo y en modo de solo lectura: ni GPT, que escribió el fix, ni Sonnet, que confirmó el bug en la auditoría. Responde tres preguntas con evidencia: si ataca la causa, si abre un riesgo nuevo y si es mínimo."},{"type":"say","md":"La revisión dio **CONFIDENT** en las tres:\n- **targeted**: limita el descuento antes del cálculo, que es la causa; no toca el test.\n- **no_new_risk**: `order_total()` es el único que usa el descuento.\n- **minimal**: una línea en `orders.py`.","source":"inferido","notes":"Si alguna no hubiera dado CONFIDENT, hay una sola vuelta de corrección; si sigue sin convencer, el fix se descarta y no sale nada."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py fix done C-01 --run mi-servicio","out":["C-01: done (sha_fix d11bb3eb70, suite 8 of 8 pass)","worktree removed: ~/auditorias/mi-servicio/fix/wt-fix-c-01-descuento-sin-tope"],"source":"real","cwd":"~/auditorias","notes":"Recién ahora lo registra como hecho: con el chequeo y la revisión sobre el mismo commit. Y borra la copia de trabajo."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py fix publish --run mi-servicio","out":["fix/c-01-descuento-sin-tope: ready (C-01)","prepared ~/auditorias/mi-servicio/fix/commands.sh  (nothing was executed; review it, then run it yourself)"],"source":"real","cwd":"~/auditorias","notes":"Escribe los comandos, no los corre. «nothing was executed» es literal."},{"type":"term","cmd":"grep -E 'push origin|--title|pr ready' ~/auditorias/mi-servicio/fix/commands.sh","out":["git -C ~/mi-servicio push origin fix/c-01-descuento-sin-tope","gh pr edit \"$PR\" --repo demo-org/mi-servicio --title 'fix(orders): cap the discount between 0 and 100 percent'","gh pr ready \"$PR\" --repo demo-org/mi-servicio"],"source":"real","cwd":"~/auditorias","notes":"Lo que va a hacer el script cuando lo corras vos: push de la rama, título nuevo en formato conventional commits y sacar el PR de draft. También cambia en el cuerpo del PR «Refs #N» por «Closes #N»."},{"type":"say","md":"#### Listo para que lo publiques\n- **PR #12** (base `main`): **C-01 hecho** con `fix(orders): cap the discount between 0 and 100 percent`.\n- Suite: **8 de 8** sobre el merge con `main`, comparada **por cantidades** porque el proyecto no deja reportes junit.\n- Revisó **gemini-3.1-pro** (pedido; Cursor no informa el modelo): las tres en CONFIDENT.\n- Sin conflicto con la base.\n- Comandos en `~/auditorias/mi-servicio/fix/commands.sh`. **No los corrí**: corrélos vos.","source":"inferido","notes":"Este es el formato de reporte de la skill: PR y base, estado de cada hallazgo, cómo se comparó la suite, quién revisó y dónde están los comandos.","pause":true},{"type":"term","cmd":"sh ~/auditorias/mi-servicio/fix/commands.sh","out":["fix/c-01-descuento-sin-tope: PR #12 updated"],"source":"inferido","cwd":"~/mi-servicio","notes":"La persona corre el script. Paso inferido: hace push y edita el PR en GitHub.","in":"zsh"}]},{"id":"otros-casos","title":"Otros casos","subtitle":"Grupos, bugs ya arreglados y fixes que no salen","screen":"cursor-agent","faq":[{"q":"¿Por qué los de un grupo no van en paralelo?","a":"Porque comparten archivos: por eso la auditoría los agrupó. Uno por uno en la misma rama evita conflictos entre fixes."},{"q":"¿Bloqueado es un fracaso?","a":"No. Es una respuesta válida: el fix necesita una decisión del equipo dueño. Se lo contás y no se fuerza nada."},{"q":"¿Y si main ya no mergea con la rama?","a":"La skill frena y te pregunta: rebasear primero la rama del test rojo, o arreglar sobre la base vieja y dejar el conflicto para el PR."}],"steps":[{"type":"ask","text":"¿Y si el PR agrupa varios hallazgos, o el bug ya lo arreglaron en main?","source":"inferido","notes":"Las dos dudas que más aparecen."},{"type":"say","md":"#### Un PR con varios hallazgos\nLa rama es `audit/pr-N`. Los arreglo **en orden, en una sola copia de trabajo**: un commit por hallazgo, cada uno con su chequeo y su revisión. El PR se publica cuando están todos.\n\n#### Ya arreglado en main\nSi el test rojo ya pasa sobre `main`, el hallazgo queda **moot**: te lo digo y no lo toco.\n\n#### Fixes que no salen\n- **blocked**: necesita una decisión de diseño, una migración, un cambio de contrato o tocar otro repo. Paro sin commitear.\n- **declined**: la revisión no quedó convencida después de una vuelta. Descarto el commit local; no se publicó nada.","source":"inferido","notes":"Remarcá que bloqueado y descartado son resultados válidos. La skill nunca agranda el alcance para llegar al verde.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los frenos que vas a ver","screen":"terminal","faq":[{"q":"¿Puedo saltear la autorización?","a":"No. Si la decisión es tuya, decílo y queda escrito así: «la decido yo, sin consultar al equipo»."},{"q":"El chequeo falla, ¿lo arreglo a mano?","a":"No: el agente le devuelve los problemas al subagente que arregla. Nunca se edita el registro para pasar el chequeo."}],"steps":[{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py fix start C-01 --run mi-servicio","out":["error: fix.authorized_by is not set: confirm with the person that the owner team agreed to receive fixes (or that the person takes that decision), then `ia.py set --run ~/auditorias/mi-servicio fix.authorized_by=\u003cwho\u003e`"],"source":"inferido","cwd":"~/auditorias","notes":"Primer freno: nadie dijo quién autorizó. Se resuelve contestando la pregunta del agente. Paso inferido, con la salida real del CLI en ese caso."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py fix check C-01 --run mi-servicio","out":["suite on the merge of origin/main + 289ddde285: 8 of 8 pass (compared by counts: no junit names); output outputs/C-01-fix-suite.txt","FAIL out of scope: api/mi_servicio/stats.py (not in prod_files; name it with its reason in fix.extra_files)","FAIL existing test file changed: api/tests/test_discount_cap.py (only new tests may be added)","check C-01: 2 problems"],"source":"inferido","cwd":"~/auditorias","notes":"El más importante: un fix que «hizo pasar» el test cambiándolo. La suite da 8 de 8 y aun así el chequeo falla, porque el test rojo está congelado. También marca un archivo que no estaba en el alcance. Paso inferido, con la salida real del CLI en ese caso.","callouts":[{"kind":"box","match":"FAIL existing test file changed: api/tests/test_discount_cap.py (only new tests may be added)","text":"8 de 8 y falla igual"}]},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py fix done C-01 --run mi-servicio","out":["error: C-01 cannot be recorded as done: no review of HEAD d11bb3eb70 (fix.review.sha); review claims not CONFIDENT: targeted, no_new_risk, minimal (one revision round, then fix.status=declined with fix.reason); fix.review.model is empty: record which agent reviewed"],"source":"inferido","cwd":"~/auditorias","notes":"Sin revisión no hay «hecho». El que escribió el fix nunca se aprueba solo. Paso inferido, con la salida real del CLI en ese caso."}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Cuándo la uso?","a":"Cuando el equipo dueño acepta recibir el fix de un hallazgo que la auditoría ya probó con un test rojo."},{"q":"¿Sirve para un bug que no viene de la auditoría?","a":"No. Necesita la rama con el test rojo y el PR que deja inherited-audit."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Nada se toca sin autorización**, y queda escrito quién la dio.\n- **El test rojo es la especificación**: no se cambia, y el fix se prueba sobre el merge con la base del PR.\n- **Otro modelo revisa** y **vos publicás**: la skill deja los comandos, nunca hace push.\n\n#### Próximo episodio: jira-team-kit\nCómo crear épicas en Jira desde la conversación, con una ventana que te pide aprobar cada cambio.","source":"inferido","notes":"Las tres ideas son el porqué de confiar en el fix: permiso, evidencia y una segunda mirada. Si el orden de la serie cambia, cambiá la línea del próximo episodio.","pause":true}]}]},{"id":"jira-team-kit","series":"cursor","order":2,"title":"jira-team-kit","pitch":{"ask":"Creame una épica para esto que estuvimos trabajando","does":"Arma la épica con sus historias, tareas y subtareas, te la muestra antes de escribir y, cuando vos aprobás con un clic en una ventana, la crea en Jira y la deja como kanban local."},"skill":{"repo":"jira-kanban","commit":"93a6126","date":"2026-10-19"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Tope al descuento en pedidos","age":"1h"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina, más tu token de Jira","screen":"terminal","faq":[{"q":"¿Puedo pedirle al agente que la instale?","a":"Sí. En Cursor decile «Instalá jira-team-kit: cloná el repo y corré ./install.sh --with-write» y hace lo mismo que ves acá. Lo mostramos en la terminal para que sepas qué deja en tu máquina."},{"q":"¿Qué es --with-write y por qué no es el comportamiento normal?","a":"Sin esa opción se instalan solo las dos skills de lectura. Con --with-write se suman las dos que pueden escribir en Jira. Escribir es una decisión explícita, no un efecto de instalar."},{"q":"¿Instala algo más, o toca mis archivos?","a":"No copia nada: deja enlaces a tu clon, así hay una sola fuente de verdad. Y nunca pisa un archivo real: si donde va un enlace ya hay un archivo, frena y te dice cuál mover."},{"q":"Me dice «add ~/.local/bin to PATH». ¿Qué hago?","a":"Es el aviso que ves acá: jtk quedó en ~/.local/bin y tu terminal todavía no mira esa carpeta. Agregás una línea a tu ~/.zshrc (o le pedís al agente que la agregue) y abrís una terminal nueva."},{"q":"¿Por qué el token lo creo yo y no se lo pido al agente?","a":"Porque es un secreto: se muestra una sola vez y nunca se pega en el chat. Lo creás vos y lo guardás vos, con un editor."}],"steps":[{"type":"term","cmd":"git clone git@github.com:josefigueredo/jira-team-kit.git skills/jira-kanban","out":["Cloning into 'skills/jira-kanban'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo, que trae las cuatro skills y el comando jtk. Es un git clone común. Necesitás Python 3.9 o más, git y acceso por SSH a la organización (el repo es privado); si hiciste el episodio 0 ya lo tenés. El nombre de la carpeta da igual: el instalador calcula dónde está. Paso inferido: necesita red."},{"type":"term","cmd":"~/skills/jira-kanban/install.sh --with-write","out":["skill: jira-standup (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-standup","skill: jira-em (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-em","skill: jira-team-kit (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban","skill: jira-em-ops (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-em-ops","cli: jtk -\u003e ~/skills/jira-kanban/jtk.py","note: add ~/.local/bin to PATH to use jtk"],"source":"real","cwd":"~","notes":"Esta es toda la instalación. Mirá las cuatro líneas «skill:»: dos de lectura (standup y em) y dos que escriben (jira-team-kit y jira-em-ops). Remarcá que no copia nada, son enlaces, y que se enlazan a la vez en Claude Code, Codex y Cursor. Y mirá el aviso del final: jtk existe, pero falta el PATH.","pause":true},{"type":"term","cmd":"echo 'export PATH=\"$HOME/.local/bin:$PATH\"' \u003e\u003e ~/.zshrc","out":[],"source":"real","cwd":"~","notes":"El aviso se arregla con una línea en tu ~/.zshrc. Después, abrís una terminal nueva. Si te trabás acá, es el error número uno: «el agente dice que jtk no existe»."},{"type":"term","cmd":"~/.local/bin/jtk --version","out":["jtk 93a6126 2026-10-14"],"source":"real","cwd":"~","notes":"Comprobamos que quedó andando. Imprime el commit y su fecha. Lo corremos con la ruta completa porque esta terminal todavía no tiene el PATH nuevo; en una terminal nueva alcanza con jtk --version. Todavía no tocamos Jira, ni hace falta."},{"type":"term","cmd":"open -e ~/.zshrc","out":[],"source":"inferido","cwd":"~","notes":"Ahora lo único que no hace el agente: las credenciales. Creás un token de API en id.atlassian.com, con el botón «Create API token» a secas, no el que dice «with scopes»: jtk entra por la URL de tu sitio y un token con alcance no funciona. Lo guardás vos, con un editor, en tres variables: JIRA_BASE_URL, JIRA_EMAIL y JIRA_API_TOKEN. Nunca por el chat. Después cerrás Cursor del todo y lo abrís de nuevo.","pause":true}]},{"id":"caso-principal","title":"Caso principal","subtitle":"De «creame una épica» a PLAT-123, con tu clic","screen":"cursor-full","faq":[{"q":"¿Puede el agente escribir en Jira sin que yo lo sepa?","a":"No. Todo comando que escribe necesita --apply, y --apply abre una ventana que solo responde a un clic tuyo en «Apruebo». El agente te avisa antes de lanzarla, pero no puede aprobar por vos."},{"q":"¿Y si aprieto Cancelar, o me voy a tomar un café?","a":"No se escribe nada. Cancelar, Escape, cerrar la ventana o esperar 100 segundos dan lo mismo: el comando sale sin crear y el agente no vuelve a intentarlo salvo que se lo pidas."},{"q":"¿Qué pasa si Jira rechaza una tarea a mitad de camino?","a":"Lo creado se conserva y jtk te dice las claves. Repetir el mismo comando retoma sin duplicar. Si solo falla un cambio de estado, no se repite el create: se termina con un push."},{"q":"¿Por qué «Vos · en curso» y «A decidir»?","a":"Lo que dijiste que estás haciendo se te asigna sin preguntar. Lo que todavía no empezó necesita tu respuesta: asignártelo o dejarlo sin dueño. jtk nunca lo decide por vos."},{"q":"¿Y el MCP de Atlassian que Cursor sugiere cuando escribo «jira»?","a":"No lo uses junto a esta skill. Sus herramientas de escritura no pasan por la ventana de aprobación. La skill le dice al agente que Jira va siempre por jtk."}],"steps":[{"type":"ask","text":"creame una épica para esto que estuvimos trabajando","source":"inferido","notes":"Una frase, como se la dirías a un compañero. Fijate el chat de la izquierda: veníamos hablando del tope al descuento. De ahí saca el contenido; nada de llenar formularios. Pedir así, al cerrar un trabajo, es el hábito que queremos instalar."},{"type":"tool","label":"Read · ~/.cursor/skills/jira-team-kit/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue pasos fijos, no improvisa. El primero: mirar antes de escribir."},{"type":"tool","label":"Ran · jtk update --check","source":"inferido","notes":"Una vez por conversación mira si hay una versión nueva del jtk. Es solo lectura, no toca Jira. Si todo está al día no dice nada, y acá no dice nada: ese es el comportamiento correcto."},{"type":"term","cmd":"~/.local/bin/jtk create --check --project .","out":["Check          Result  Detail","wow plan       no      no wow/plan/manifest.json","jira project   none    ask the person which project and pass --jira-project KEY","existing epic  none    none in specs/*/spec.md or the branch; a key in the conversation is not checked here"],"source":"real","cwd":"~/mi-servicio","notes":"Tres filas, sin red ni credenciales. «wow plan»: si el trabajo ya sale de un plan de WayOfWork, la épica la crea otra herramienta. «jira project»: no hay proyecto por defecto, así que hay que preguntarlo. «existing epic»: si ya existe una épica para esto, se pregunta antes de crear otra. Acá no hay ni plan ni épica. Falta el proyecto. Y una aclaración: el comando sale con la ruta completa, ~/.local/bin/jtk, porque la captura corre sin tu PATH; en tu terminal alcanza con escribir jtk.","pause":true},{"type":"say","md":"No hay plan de WayOfWork ni una épica previa para esto, pero no tengo un proyecto de Jira por defecto. **¿En qué proyecto la creo?**","source":"inferido","notes":"El agente se frena y pregunta, porque la skill dice que nunca se adivina el proyecto. Esta es una de las pocas preguntas obligatorias."},{"type":"ask","text":"En PLAT.","source":"inferido","notes":"Una palabra alcanza. Desde acá el agente pasa --jira-project PLAT en todos los comandos."},{"type":"tool","label":"Read · ~/.cursor/skills/jira-team-kit/references/spec.md","source":"inferido","notes":"Antes de redactar lee el formato del spec. Cada épica, tarea y subtarea necesita tres cosas: por qué, qué y hecho cuando. Si falta una, jtk se niega a seguir. Es lo que evita tickets de una línea que nadie entiende dentro de un mes."},{"type":"tool","label":"Write · ~/scratchpad/spec.json","source":"inferido","notes":"El spec es un JSON que el agente arma desde la conversación: una épica, una tarea con una subtarea, y otra tarea. Lo deja en su carpeta temporal, no en tu repo."},{"type":"term","cmd":"jtk create --spec ~/scratchpad/spec.json --jira-project PLAT --html ~/scratchpad/vista.html --project .","out":["Issue        Tipo      Estado       Asignado        Título","NUEVO-1      Epic      Backlog      A decidir       Tope de descuento","  NUEVO-2    Tarea     En progreso  Vos · en curso  [BE] Acotar el descuento","    NUEVO-3  Subtarea  Backlog      A decidir       Test del tope","  NUEVO-4    Tarea     Backlog      A decidir       [BE] Documentar el tope","preview: ~/scratchpad/vista.html","dry run: nothing created; --apply creates 4 issues in PLAT"],"source":"inferido","cwd":"~/mi-servicio","notes":"El dry run: lo que se crearía, sin escribir nada. La tabla y una página vista.html con forma de pantalla de Jira. Fijate «NUEVO-1»: todavía no hay claves reales. La tarea que decimos que estamos haciendo ya figura «En progreso» y «Vos · en curso»; el resto, «A decidir». Esta salida es inferida: sin credenciales de Jira el comando no corre en la captura, y el formato sale del showcase de la skill.","pause":true},{"type":"tool","label":"Ran · open ~/s  cy=\"5.5\" r=\"3\" fill=\"#fff\"/\u003e\u003cpath d=\"M2.5 14c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5z\" fill=\"#fff\"/\u003e\u003c/svg\u003e\u003c/span\u003e A decidir\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan class=\"lbl\"\u003ePrioridad\u003c/span\u003e\u003cspan\u003e\u003csvg viewBox=\"0 0 16 16\" class=\"pi\"\u003e\u003cpath d=\"M3 6h10M3 10h10\" stroke=\"#E2B203\" stroke-width=\"2\"/\u003e\u003c/svg\u003e Medium\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan class=\"lbl\"\u003eEtiquetas\u003c/span\u003e\u003cspan\u003e\u003cspan class=\"muted\"\u003eNinguno\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan class=\"lbl\"\u003ePrincipal\u003c/span\u003e\u003cspan\u003e\u003ca href=\"#NUEVO-1\"\u003e\u003csvg viewBox=\"0 0 16 16\" class=\"ti\"\u003e\u003crect width=\"16\" height=\"16\" rx=\"3\" fill=\"#904EE2\"/\u003e\u003cpath d=\"M9.2 3 5 9h2.6L6.8 13 11 7H8.4z\" fill=\"#fff\"/\u003e\u003c/svg\u003e \u003cspan class=\"k\"\u003eNUEVO-1\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"foot\"\u003eSe crea en el paso 4 de 4, después de NUEVO-1.\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n(function(){var ids=[].map.call(document.querySelectorAll('.issue'),function(s){return s.id});\nfunction show(){var id=location.hash.slice(1);if(ids.indexOf(id)\u003c0)id=ids[0];\n[].forEach.call(document.querySelectorAll('.issue'),function(s){s.classList.toggle('on',s.id===id)});\n[].forEach.call(document.querySelectorAll('.side a'),function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+id)});\nwindow.scrollTo(0,0);}window.addEventListener('hashchange',show);show();})();\n\u003c/script\u003e\n\u003c/body\u003e\u003c/html\u003e\n"},{"type":"say","md":"Armé la épica con **1 tarea con una subtarea** y **1 tarea más**, en PLAT. Abrí `vista.html` para revisarla.\n\nUna decisión que es tuya:\n- la tarea del tope ya la estás haciendo, así que queda **En progreso y a tu nombre**\n- las otras dos están abiertas: **¿te las asigno a vos o las dejo sin asignar?**\n\nCuando me digas, creo todo. No escribo nada hasta tu respuesta.","source":"inferido","notes":"Dos cosas para remarcar. Una: la skill espera un sí explícito antes de escribir. Dos: pregunta por las asignaciones y no las supone. Es la diferencia entre una herramienta que ordena y una que decide por vos.","pause":true},{"type":"ask","text":"Asignámelas a mí y creala.","source":"inferido","notes":"Ese es el sí explícito, con la respuesta sobre las asignaciones incluida. Recién ahora el agente puede ir al comando que escribe."},{"type":"say","md":"Voy a correr el comando que **escribe en Jira**. **Se va a abrir una ventana** con las 4 issues que se crean en PLAT, quién las recibe y los botones **Cancelar** y **Apruebo 4**.\n\nLa aprobación es tu clic en esa ventana: mi pregunta de recién no cuenta, y yo no puedo tocarla. Si cancelás, no lo vuelvo a correr salvo que me lo pidas.","source":"inferido","notes":"Este aviso es parte de la regla de la skill: antes de lanzar un comando con --apply, el agente dice en el chat que se abre una ventana y qué va a aprobarse. Y que la persona tiene que estar presente. Por eso este momento no se apura: esperá a que cada quien lo lea.","pause":true},{"type":"approve","title":"Crear en PLAT","button":"Apruebo 4","source":"inferido","notes":"La ventana de jtk, tal cual la dibuja su código: arriba, cuántos issues, a quién quedan y «⇄ 1 cambio de estado»; abajo, una tarjeta por issue. La tarea del tope lleva «En progreso»: se crea y se mueve, y las dos escrituras se aprueban acá. El botón dice cuántos. Escape cancela; ninguna tecla aprueba, solo el clic. El agente espera. Formato real, datos de ejemplo.","pause":true,"window":"jtk · Jira","width":520,"height":462,"html":"\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n:root{color-scheme:light dark;--fg:#1d1d1f;--muted:#6e6e73;--card:rgba(0,0,0,.045);--line:rgba(0,0,0,.08);\n --chip-bg:rgba(0,0,0,.07);--to-bg:rgba(0,113,227,.12);--to-fg:#0058b0;--out:#9a5b00;--out-bg:rgba(255,159,10,.14)}\n@media (prefers-color-scheme:dark){:root{--fg:#f5f5f7;--muted:#a1a1a6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);\n --chip-bg:rgba(255,255,255,.12);--to-bg:rgba(10,132,255,.22);--to-fg:#6cb4ff;--out:#ffb340;--out-bg:rgba(255,159,10,.16)}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:transparent;color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,\"SF Pro Text\",sans-serif;\n -webkit-font-smoothing:antialiased;cursor:default;-webkit-user-select:none}\nbody{padding:22px 24px 8px}\n.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\nh1{font-size:19px;line-height:1.25;font-weight:650;margin:4px 0 16px}\n.cards{list-style:none;margin:0;padding:0;display:grid;gap:8px}\n.card{background:var(--card);border-radius:10px;padding:10px 12px;display:grid;gap:6px}\n.top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}\n.key{flex:0 1 auto;min-width:0;overflow-wrap:anywhere;font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip-bg);border-radius:5px;padding:1px 6px}\n.key[class*=\" k-\"]{display:inline-flex;align-items:center;gap:5px}\n.key[class*=\" k-\"]::before{content:\"\";flex:none;width:9px;height:9px;border-radius:2px;background:var(--k)}\n.k-epic{--k:#904EE2;background:rgba(144,78,226,.18)}\n.k-story{--k:#63BA3C;background:rgba(99,186,60,.2)}\n.k-task,.k-subtask{--k:#4BADE8;background:rgba(75,173,232,.2)}\n.name{font-weight:500;overflow-wrap:anywhere}\na.name{color:var(--to-fg);text-decoration:none;cursor:pointer}a.name:hover{text-decoration:underline}\na.name::after{content:\" 🔗\";font-size:11px}\n.chg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;overflow-wrap:anywhere}\n.from{color:var(--muted)}\n.arrow{color:var(--muted)}\n.to{background:var(--to-bg);color:var(--to-fg);border-radius:999px;padding:1px 9px;font-weight:600}\n.plain{color:var(--muted)}\n.out-h{margin:18px 0 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--out)}\n.out{list-style:none;margin:0;padding:0;display:grid;gap:6px}\n.out li{background:var(--out-bg);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:baseline}\n.out .why{color:var(--muted);font-size:12px}\n.foot{margin:16px 0 0;color:var(--muted);font-size:11.5px}\n.lines{display:grid;grid-template-columns:max-content 1fr;column-gap:12px;row-gap:2px;width:100%}\n.lbl{color:var(--muted)}\n.val{overflow-wrap:anywhere}\n.badges{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 14px}\n.badge{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--chip-bg);color:var(--muted)}\n.badge.state{background:var(--out-bg);color:var(--out)}\n.badge.danger{background:rgba(255,59,48,.13);color:#d70015}\n@media (prefers-color-scheme:dark){.badge.danger{background:rgba(255,69,58,.2);color:#ff6961}}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003ch1\u003eCrear en PLAT\u003c/h1\u003e\n\u003cdiv class=\"badges\"\u003e\u003cspan class=\"badge\"\u003e4 issues\u003c/span\u003e\u003cspan class=\"badge\"\u003easignado a Persona del equipo\u003c/span\u003e\u003cspan class=\"badge state\"\u003e⇄ 1 cambio de estado\u003c/span\u003e\u003c/div\u003e\n\u003cul class=\"cards\"\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key k-epic\"\u003eEpic\u003c/span\u003e\u003cspan class=\"name\"\u003eTope de descuento\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key k-task\"\u003eTarea\u003c/span\u003e\u003cspan class=\"name\"\u003e[BE] Acotar el descuento\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"chg\"\u003e\u003cspan class=\"to\"\u003eEn progreso\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key k-subtask\"\u003eSubtarea\u003c/span\u003e\u003cspan class=\"name\"\u003eTest del tope\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key k-task\"\u003eTarea\u003c/span\u003e\u003cspan class=\"name\"\u003e[BE] Documentar el tope\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp class=\"foot\"\u003eEscape cancela · se cancela sola a los 100 s\u003c/p\u003e\u003c/body\u003e\u003c/html\u003e"},{"type":"term","cmd":"jtk create --spec ~/scratchpad/spec.json --jira-project PLAT --apply --assign-open --project .","out":["Issue        Tipo      Estado       Asignado        Título","PLAT-123     Epic      Backlog      Vos             Tope de descuento","  PLAT-124   Tarea     En progreso  Vos · en curso  [BE] Acotar el descuento","    PLAT-125 Subtarea  Backlog      Vos             Test del tope","  PLAT-126   Tarea     Backlog      Vos             [BE] Documentar el tope","created PLAT-123; local kanban in .jira-team-kit/PLAT-123/"],"source":"inferido","cwd":"~/mi-servicio","notes":"Con el clic, el comando termina: ahora sí hay claves reales, PLAT-123 a PLAT-126. Y quedó el kanban local en .jira-team-kit, que se mantiene sincronizado en los dos sentidos con pull y push. Inferido: escribe en Jira, por eso nunca corre en la captura."},{"type":"worked","seconds":48,"source":"inferido","notes":"El tiempo que le llevó al agente, sin contar lo que tardaste vos en revisar y aprobar."},{"type":"say","md":"Listo: la épica es **PLAT-123**, con 3 issues debajo (PLAT-124 a PLAT-126).\n\n#### Qué quedó\n- **En Jira:** la épica, la tarea en progreso a tu nombre, la subtarea y la tarea abierta\n- **En tu repo:** el kanban local en `.jira-team-kit/PLAT-123/`; lo editás en archivos y lo subís con `jtk push`\n- **En un registro:** cada escritura queda en `.jira-team-kit/jira-writes.jsonl`","source":"inferido","notes":"Cerrá con las tres cosas que quedaron y por qué importan: Jira tiene lo que aprobaste, tu repo tiene un espejo editable, y hay un registro de cada escritura. Si alguien pregunta «¿y quién creó esto?», el registro responde.","pause":true}]},{"id":"otro-caso","title":"Otro caso","subtitle":"Cambiar varios tickets a la vez con jira-em-ops","screen":"cursor-agent","faq":[{"q":"¿Cuántos tickets puedo cambiar de una vez?","a":"Hasta 25 por plan, y hasta 200 si lo pedís con --max. Mover a «entregado» o «descartado» además exige confirmarlo expresamente."},{"q":"¿Qué pasa si alguien cambió un ticket entre el plan y el apply?","a":"Antes de cada escritura jtk vuelve a leer el issue. Si alguien lo movió o lo reasignó después de planificar, lo saltea y te lo informa. Aplicar el mismo plan dos veces es seguro."},{"q":"¿Se puede deshacer?","a":"Hay jtk plan revert con el plan inverso, pero no garantiza deshacer todo, y lo dice. Por eso el plan se revisa antes de aplicarlo."},{"q":"¿Por qué plan y apply son dos pasos?","a":"Porque planificar solo lee Jira y guarda un archivo: es seguro y lo hace el agente solo. Aplicar escribe, y abre la ventana. Separarlos te deja revisar exactamente qué se va a cambiar."}],"steps":[{"type":"ask","text":"Asigná a una compañera del equipo los tickets sin dueño del view plataforma","source":"inferido","notes":"Otro pedido típico: no es crear, es cambiar muchas cosas ya existentes. Esta vez es jira-em-ops, la hermana de jira-team-kit para operaciones en lote. Necesita que antes hayas guardado el view y el perfil de tus boards, una sola vez."},{"type":"tool","label":"Ran · jtk team status plataforma --list --unassigned","source":"inferido","notes":"Primero lista cuáles son, para que el plan trate exactamente de esos tickets y no de un número. La skill lo dice: si pedís «los 7 sin dueño», primero se listan."},{"type":"term","cmd":"jtk plan assign plataforma --unassigned --person \"Persona del equipo\"","out":["Plan 3f9a1c07b2de · assign · view plataforma · 3 issue(s)","  PLAT-131: unassigned -\u003e Persona del equipo","  PLAT-134: unassigned -\u003e Persona del equipo","  PLAT-140: unassigned -\u003e Persona del equipo","","Plan 3f9a1c07b2de saved in ~/.local/state/jtk/plans/3f9a1c07b2de.json. Nothing was written to Jira.","To apply it, run: jtk apply 3f9a1c07b2de","(a window shows the changes and a person clicks Apruebo; with no window, it asks for your approval in a terminal)"],"source":"inferido","notes":"jtk plan solo lee Jira y guarda un archivo con las claves, el estado de origen y el de destino. Fijate el cierre: «Nothing was written to Jira». Por eso esto lo corre el agente sin pedirte nada. Salida inferida: lee Jira, y en la captura no hay Jira.","pause":true},{"type":"say","md":"Armé el plan **3f9a1c07b2de**: asignar a **una compañera del equipo** los **3 tickets sin dueño** de plataforma (PLAT-131, PLAT-134 y PLAT-140). Hasta acá no escribí nada.\n\n¿Lo aplico?","source":"inferido","notes":"El agente muestra el plan tal cual salió y pregunta. Es el segundo punto de control: el primero es el plan, el segundo es tu sí, y el tercero, el clic."},{"type":"ask","text":"Sí, aplicalo.","source":"inferido","notes":"Un sí en el chat habilita al agente a lanzar el comando. No aprueba nada: eso es el clic."},{"type":"say","md":"Voy a correr `jtk apply 3f9a1c07b2de`. **Se abre una ventana** con los 3 cambios y los botones **Cancelar** y **Apruebo 3**. Tu clic es la aprobación; un «sí» en el chat no cuenta.","source":"inferido","notes":"Mismo aviso previo que en el caso principal. La regla de jira-em-ops es todavía más explícita: nunca hacer clic, teclear ni automatizar la ventana.","pause":true},{"type":"approve","title":"Aplicar el plan 3f9a1c07b2de","button":"Apruebo 3","source":"inferido","notes":"Misma ventana, otro plan: «Reasignar», una tarjeta por ticket con de dónde viene y adónde va. Cada título es un link para abrir el ticket antes de aprobar. Formato real, datos de ejemplo.","pause":true,"window":"jtk · Jira","width":520,"height":388,"html":"\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n:root{color-scheme:light dark;--fg:#1d1d1f;--muted:#6e6e73;--card:rgba(0,0,0,.045);--line:rgba(0,0,0,.08);\n --chip-bg:rgba(0,0,0,.07);--to-bg:rgba(0,113,227,.12);--to-fg:#0058b0;--out:#9a5b00;--out-bg:rgba(255,159,10,.14)}\n@media (prefers-color-scheme:dark){:root{--fg:#f5f5f7;--muted:#a1a1a6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);\n --chip-bg:rgba(255,255,255,.12);--to-bg:rgba(10,132,255,.22);--to-fg:#6cb4ff;--out:#ffb340;--out-bg:rgba(255,159,10,.16)}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:transparent;color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,\"SF Pro Text\",sans-serif;\n -webkit-font-smoothing:antialiased;cursor:default;-webkit-user-select:none}\nbody{padding:22px 24px 8px}\n.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\nh1{font-size:19px;line-height:1.25;font-weight:650;margin:4px 0 16px}\n.cards{list-style:none;margin:0;padding:0;display:grid;gap:8px}\n.card{background:var(--card);border-radius:10px;padding:10px 12px;display:grid;gap:6px}\n.top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}\n.key{flex:0 1 auto;min-width:0;overflow-wrap:anywhere;font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip-bg);border-radius:5px;padding:1px 6px}\n.key[class*=\" k-\"]{display:inline-flex;align-items:center;gap:5px}\n.key[class*=\" k-\"]::before{content:\"\";flex:none;width:9px;height:9px;border-radius:2px;background:var(--k)}\n.k-epic{--k:#904EE2;background:rgba(144,78,226,.18)}\n.k-story{--k:#63BA3C;background:rgba(99,186,60,.2)}\n.k-task,.k-subtask{--k:#4BADE8;background:rgba(75,173,232,.2)}\n.name{font-weight:500;overflow-wrap:anywhere}\na.name{color:var(--to-fg);text-decoration:none;cursor:pointer}a.name:hover{text-decoration:underline}\na.name::after{content:\" 🔗\";font-size:11px}\n.chg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;overflow-wrap:anywhere}\n.from{color:var(--muted)}\n.arrow{color:var(--muted)}\n.to{background:var(--to-bg);color:var(--to-fg);border-radius:999px;padding:1px 9px;font-weight:600}\n.plain{color:var(--muted)}\n.out-h{margin:18px 0 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--out)}\n.out{list-style:none;margin:0;padding:0;display:grid;gap:6px}\n.out li{background:var(--out-bg);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:baseline}\n.out .why{color:var(--muted);font-size:12px}\n.foot{margin:16px 0 0;color:var(--muted);font-size:11.5px}\n.lines{display:grid;grid-template-columns:max-content 1fr;column-gap:12px;row-gap:2px;width:100%}\n.lbl{color:var(--muted)}\n.val{overflow-wrap:anywhere}\n.badges{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 14px}\n.badge{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--chip-bg);color:var(--muted)}\n.badge.state{background:var(--out-bg);color:var(--out)}\n.badge.danger{background:rgba(255,59,48,.13);color:#d70015}\n@media (prefers-color-scheme:dark){.badge.danger{background:rgba(255,69,58,.2);color:#ff6961}}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003ch1\u003eReasignar\u003c/h1\u003e\n\u003cdiv class=\"badges\"\u003e\u003cspan class=\"badge\"\u003e3 issues\u003c/span\u003e\u003c/div\u003e\n\u003cul class=\"cards\"\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key\"\u003ePLAT-131\u003c/span\u003e\u003ca class=\"name\" href=\"https://example.atlassian.net/browse/PLAT-131\" target=\"_blank\"\u003eOrdenar por fecha en el listado\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\"chg\"\u003e\u003cspan class=\"from\"\u003eunassigned\u003c/span\u003e\u003cspan class=\"arrow\"\u003e→\u003c/span\u003e\u003cspan class=\"to\"\u003ePersona del equipo\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key\"\u003ePLAT-134\u003c/span\u003e\u003ca class=\"name\" href=\"https://example.atlassian.net/browse/PLAT-134\" target=\"_blank\"\u003eMensaje de error del cupón\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\"chg\"\u003e\u003cspan class=\"from\"\u003eunassigned\u003c/span\u003e\u003cspan class=\"arrow\"\u003e→\u003c/span\u003e\u003cspan class=\"to\"\u003ePersona del equipo\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key\"\u003ePLAT-140\u003c/span\u003e\u003ca class=\"name\" href=\"https://example.atlassian.net/browse/PLAT-140\" target=\"_blank\"\u003ePaginar el historial\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\"chg\"\u003e\u003cspan class=\"from\"\u003eunassigned\u003c/span\u003e\u003cspan class=\"arrow\"\u003e→\u003c/span\u003e\u003cspan class=\"to\"\u003ePersona del equipo\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp class=\"foot\"\u003eEscape cancela · se cancela sola a los 100 s\u003c/p\u003e\u003c/body\u003e\u003c/html\u003e"},{"type":"term","cmd":"jtk apply 3f9a1c07b2de","out":["PLAT-131  applied","PLAT-134  applied","PLAT-140  applied"],"source":"inferido","notes":"Apply ejecuta exactamente ese plan, ticket por ticket, y dice qué pasó con cada uno. Si alguno hubiera cambiado mientras tanto, diría que lo saltea. Inferido: escribe en Jira."},{"type":"say","md":"Aplicado: los **3 tickets** son de la compañera ahora. Si querés ver cómo quedó el equipo, corro `jtk team status plataforma`; y si querés volver atrás, `jtk plan revert 3f9a1c07b2de` (no garantiza deshacer todo).","source":"inferido","notes":"Dos salidas después de aplicar: ver el resultado o planificar la inversa. Siempre ofrecidas, nunca hechas sin que lo pidas.","pause":true}]},{"id":"las-otras-skills","title":"Las otras skills","subtitle":"Las que solo leen Jira","screen":"cursor-agent","faq":[{"q":"¿Estas dos también necesitan la ventana?","a":"No. jira-standup y jira-em solo leen: nunca escriben en Jira. Por eso ni siquiera piden aprobación."},{"q":"¿Qué es un «view»?","a":"Una lista guardada de los boards y del equipo que seguís. La armás una sola vez con jtk team setup y después preguntás por «mi equipo» sin repetir nada."},{"q":"¿Puedo preguntar por otra persona?","a":"Sí, con su nombre. Si hay dos personas que coinciden, jtk lista a los candidatos con su email y te pregunta; nunca elige entre dos."}],"steps":[{"type":"ask","text":"¿Qué hice ayer?","source":"inferido","notes":"jira-standup. Tres preguntas personales: qué hiciste, qué podés hacer, en qué estás bloqueado. Más la carga de un compañero y tus métricas de entrega."},{"type":"tool","label":"Ran · jtk done --when yesterday","source":"inferido","notes":"El agente traduce «ayer» a un nombre de ventana y el CLI hace el calendario. Lee Jira en vivo y muestra la salida tal cual, como árbol de épica, tarea y subtarea."},{"type":"say","md":"Ayer pasaste **2 issues** a En progreso o Done: **PLAT-124** (el tope al descuento) y **PLAT-125**. La ventana fue ayer, de lunes a domingo en la zona del equipo.\n\nRecordá que «hecho» significa asignado a vos: si otra persona cerró un issue tuyo, igual aparece.","source":"inferido","notes":"Las skills de lectura dicen qué es y qué no es cada número. Salida de ejemplo, inferida: depende del Jira de cada quien.","pause":true},{"type":"ask","text":"¿Cómo viene mi equipo? ¿Qué está estancado?","source":"inferido","notes":"jira-em: para quien sigue varios boards y un equipo, no para uno mismo. La diferencia con standup es el «mi equipo»."},{"type":"tool","label":"Ran · jtk team status plataforma","source":"inferido","notes":"jira-em traduce «cómo viene mi equipo» a jtk team status. Cada board necesita su perfil: qué estado es «hecho» o «en curso». Si falta, te lo pregunta; no lo adivina."},{"type":"say","md":"## Estado del equipo\n**View:** plataforma · **Boards:** PLAT · **Equipo:** grupo team · **Consultado:** 2026-10-20 · **Perfiles:** confirmados\n\n**7 abiertos** (issues del equipo y sin asignar)\n\n### Por board\n| Board | Abiertos | Por hacer | En curso | Bloqueado | Esperando | Sin rol | Sin asignar |\n| ----- | -------- | --------- | -------- | --------- | --------- | ------- | ----------- |\n| PLAT  | 7        | 3         | 3        | 1         | 0         | 0       | 0           |\n\n### Por persona y board\n| Persona            | Board | Abiertos | Por hacer | En curso | Bloqueado | Esperando | Sin rol | WIP | Límite | Veredicto      |\n| ------------------ | ----- | -------- | --------- | -------- | --------- | --------- | ------- | --- | ------ | -------------- |\n| Ana Gómez          | PLAT  | 2        | 0         | 2        | 0         | 0         | 0       | 2   | 3      | espacio para 1 |\n| Beto Ruiz          | PLAT  | 2        | 0         | 1        | 1         | 0         | 0       | 2   | 3      | espacio para 1 |\n| Persona del equipo | PLAT  | 3        | 3         | 0        | 0         | 0         | 0       | 0   | 3      | espacio para 3 |\n\n### Límites\n- «Sin rol» son issues en estados que el perfil todavía no decidió o no conoce.\n- «Sin asignar» cuenta lo abierto sin dueño en esos boards, sea o no del equipo; lo asignado a otras personas no se cuenta.\n- El veredicto de carga sale del límite de WIP de cada perfil (`jtk board limit KEY N`); sin límite, solo números.","source":"inferido","pause":true,"notes":"La skill muestra la salida tal cual: ya es Markdown y cierra con «Límites». Formato real de jtk, datos inventados. Los 3 que asignamos recién ya tienen dueño: «Sin asignar» da 0."},{"type":"tool","label":"Ran · jtk team stalled plataforma","source":"inferido","notes":"«Qué está estancado» es jtk team stalled, con los 7 días del view."},{"type":"say","md":"## Estancados\n**View:** plataforma · **Boards:** PLAT · **Equipo:** grupo team · **Consultado:** 2026-10-20 · **Perfiles:** confirmados\n\n**2 de 3 en curso** llevan 7 días o más en su categoría\n\n| Key      | Título                          | Dueño     | Estado   | Días en la categoría | Días desde la última edición |\n| -------- | ------------------------------- | --------- | -------- | -------------------- | ---------------------------- |\n| PLAT-118 | Migrar el cálculo de envíos     | Ana Gómez | En curso | 15                   | 11                           |\n| PLAT-121 | Reintentos del webhook de pagos | Beto Ruiz | En curso | 11                   | 4                            |\n\n### Límites\n- «Estancado» no es «sin progreso»: la categoría de Jira solo cambia al pasar de una categoría a otra, así que moverse entre dos estados «en curso» no reinicia los días en la categoría.\n- Los días desde la última edición se reinician con cualquier cambio, comentarios incluidos.","source":"inferido","pause":true,"notes":"Estancado no es «sin progreso»: moverse entre dos estados «en curso» no reinicia la cuenta. Por eso está la última columna: PLAT-121 se tocó hace 4 días."},{"type":"ask","text":"¿Y cuáles son las cuatro skills, en resumen?","source":"inferido","notes":"Cierre del capítulo: el mapa completo."},{"type":"say","md":"#### Las cuatro skills\n- **jira-team-kit:** crea épicas desde la conversación y las sincroniza con pull y push\n- **jira-standup:** qué hiciste, qué podés hacer, qué te bloquea\n- **jira-em:** cómo viene el equipo y los boards, solo lectura\n- **jira-em-ops:** cambios en lote con plan y aprobación\n\nLas dos que escriben pasan siempre por la ventana. Las dos que leen, nunca escriben.","source":"inferido","notes":"El resumen del episodio en una tabla mental: dos leen, dos escriben, y las que escriben pasan por la ventana. Si recordás una sola cosa, que sea esa.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores más comunes y cómo salir","screen":"terminal","faq":[{"q":"«No encuentro las credenciales», pero ya las puse","a":"Casi seguro Cursor se abrió antes de que las variables existieran. Cerralo del todo y abrilo de nuevo. Si sigue, revisá las tres variables, con los nombres exactos."},{"q":"Puse el token y no entra","a":"Lo más probable es que lo creaste «con alcance». jtk entra por la URL de tu sitio con tu email y el token, y un token con alcance solo funciona por api.atlassian.com. Creá otro con el botón sin alcance."},{"q":"La ventana no aparece y el comando termina sin escribir","a":"Puede ser que no hay ventana (no es macOS, estás por ssh o sin sesión gráfica) o que la cancelaste o pasaron 100 segundos. Sin ventana, el comando sale con código 3 e imprime la línea para correr en una terminal real."},{"q":"El agente dice que falta un campo del spec","a":"Pedile que complete el por qué, el qué y el hecho cuando de ese issue. Con una descripción libre jtk se niega."}],"steps":[{"type":"term","cmd":"readlink ~/.local/bin/jtk","out":["~/skills/jira-kanban/jtk.py"],"source":"real","cwd":"~","notes":"Si el agente dice que jtk no existe, mirá primero si el enlace está. Acá apunta al clon, o sea el instalador anduvo. Entonces lo que falta es el PATH: la línea del ~/.zshrc y una terminal nueva."},{"type":"term","cmd":"~/.local/bin/jtk who \"Persona del equipo\" --jira-project PLAT","out":["jtk: Jira credentials not found (set JIRA_BASE_URL, JIRA_EMAIL and JIRA_API_TOKEN in the environment, ./.env.local or ./.spec-kit/.env)","# exit 1"],"source":"real","cwd":"~","notes":"El segundo error típico, sin credenciales: jtk no entra y lo dice con las tres variables que busca. Es el mismo comando que se usa para comprobar que todo anda, porque solo lee. Acá falla a propósito: la captura no tiene tu Jira.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Cuándo la uso?","a":"Al cerrar un trabajo para dejarlo registrado, o antes de empezar uno para planificarlo en Jira. Y los cambios en lote, cuando el número de tickets ya duele hacerlos a mano."},{"q":"¿Reemplaza a Jira?","a":"No. Es una puerta con control: escribe en tu Jira con tu aprobación y deja un espejo local. Jira sigue siendo la fuente de verdad."},{"q":"¿Qué necesito para el próximo episodio?","a":"Lo del episodio 0 y haber hecho este: confluence-team-kit usa la misma idea de plan y aprobación, pero para Confluence."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Un pedido de una frase** alcanza: «creame una épica para esto» y la skill trae el formato y el orden.\n- **Nada se escribe sin tu clic:** primero un dry run para revisar, después una ventana con el detalle. El agente avisa, vos aprobás.\n- **Quedan un espejo local y un registro** de cada escritura.\n\n#### Próximo episodio: confluence-team-kit\nCómo publicar la documentación de tu repo en Confluence sin pisar a nadie: un plan, el aviso si alguien editó la página y una aprobación humana.","source":"inferido","notes":"Las tres ideas son el porqué de adoptarla: poco esfuerzo, control y rastro. El próximo episodio sigue con la misma lógica de plan y aprobación, ahora para la documentación. Si cambia el orden de la serie, cambiá la línea del próximo episodio.","pause":true}]}]},{"id":"confluence-team-kit","series":"cursor","order":3,"title":"confluence-team-kit","pitch":{"ask":"Mostrame qué publicaría este repo en Confluence","does":"Calcula el plan de páginas, te muestra qué cambia (y si alguien editó una página en Confluence) y, cuando vos aprobás con un clic en una ventana, publica sin pisar a nadie."},"skill":{"repo":"confluence-team-kit","commit":"f432c40","date":"2026-10-19"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md",".confluence.yml"],"chats":[{"title":"Actualizar el runbook de despliegue","age":"2h"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: la herramienta, la skill, el MCP y tus credenciales","screen":"terminal","faq":[{"q":"¿Puedo pedirle al agente que la instale?","a":"Casi todo sí. En Cursor decile «Instalá confluence-team-kit: cloná el repo, corré uv sync y dejá ctk en el PATH». Lo que no le pedís es el token de Confluence: eso lo guardás vos, con un editor, y nunca por el chat."},{"q":"¿Qué es uv y por qué hace falta?","a":"Es el programa que trae el Python que necesita ctk (3.12 o más) y sus dependencias, sin tocar el Python de tu máquina. Si hiciste el episodio 0, ya lo tenés."},{"q":"¿Y qué es el MCP? ¿Es obligatorio?","a":"Es un enchufe que le da al agente tres herramientas de ctk para leer Confluence y preparar publicaciones. No es obligatorio: sin él, el agente corre los mismos comandos de ctk en la terminal. Con él, las ventanas de aprobación salen igual."},{"q":"¿Por qué el archivo de configuración del MCP lleva el token?","a":"Porque algunos editores no heredan las variables de tu terminal y hay que pasárselas al servidor. Por eso ese archivo es tan secreto como el token: no se commitea ni se comparte."}],"steps":[{"type":"term","cmd":"git clone git@github.com:josefigueredo/confluence-skill-mcp.git skills/confluence-team-kit","out":["Cloning into 'skills/confluence-team-kit'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo: trae el comando ctk, la skill y el MCP en un solo lugar. Es un git clone común y necesita acceso por SSH a la organización, porque el repo es privado; el episodio 0 lo dejó listo. Paso inferido: necesita red."},{"type":"term","cmd":"cd ~/skills/confluence-team-kit \u0026\u0026 uv sync --extra mcp","out":["Using CPython 3.13.7","Creating virtual environment at: .venv","Resolved 28 packages in 9ms","Installed 27 packages in 41ms"," + confluence-team-kit==0.1.0 (from file://~/skills/confluence-team-kit)"," + mcp==2.3.0"," + requests==2.34.2"," + ... (y las demás)"],"source":"inferido","cwd":"~","notes":"Acá entra uv. Pensalo como un ayudante que arma un cuarto aparte, con el Python y las piezas que ctk necesita, sin tocar nada del resto de tu máquina. El extra mcp suma la pieza que habla con el agente. Si uv no está, es brew install uv, como en el episodio 0. Salida inferida: las versiones cambian con el tiempo."},{"type":"term","cmd":"cd ~/skills/confluence-team-kit \u0026\u0026 uv tool install .","out":["Installed 2 executables: ctk, ctk-mcp"],"source":"inferido","cwd":"~","notes":"Esto deja ctk disponible desde cualquier carpeta. Importa mucho: ctk se corre en la raíz del repo que querés publicar, no dentro de este clon. Sin este paso solo anda con uv run --project y la ruta del clon. Si te avisa que falta una carpeta en el PATH, es la línea del ~/.zshrc de siempre. Fijate que aparece también ctk-mcp: ese programa solo corre con el extra mcp, y por eso la configuración del MCP usa uv run --project … --extra mcp."},{"type":"term","cmd":"ctk --help","out":["usage: ctk [-h] [--root ROOT] {plan,apply,ci,diff,grant,tree,read} ...","","positional arguments:","  {plan,apply,ci,diff,grant,tree,read}","    plan                compute what would change, write nothing to Confluence","    apply               apply a plan after a person approves it","    ci                  plan or publish from GitHub Actions; the merge is the approval","    diff                show what the source would change on pages edited in Confluence","    grant               mark an anchor page as owned by a repo (platform)","    tree                walk the page tree under a page","    read                show a page with its sync state and owner"],"source":"inferido","cwd":"~/mi-servicio","notes":"La prueba de que quedó andando, y de paso el mapa de todo el episodio. Señalá tres: plan solo lee, apply y grant son los que escriben y piden aprobación, y ci es solo para GitHub Actions: lo mencionamos, nunca lo corremos desde la compu. Inferido porque ctk necesita Python 3.12 y acá no lo hay."},{"type":"term","cmd":"mkdir -p ~/.cursor/skills","out":[],"source":"real","cwd":"~","notes":"ctk no trae instalador de skill; su guía dice «la carpeta de skills que use tu instalación». Usamos ~/.cursor/skills, como el instalador de jira-team-kit."},{"type":"term","cmd":"ln -s ~/skills/confluence-team-kit/skills/confluence-team-kit ~/.cursor/skills/confluence-team-kit","out":[],"source":"real","cwd":"~","notes":"Un enlace simbólico es un acceso directo: no copia nada, apunta al clon, y así hay una sola versión. Cada vez que actualices el clon, el agente ve la skill nueva."},{"type":"term","cmd":"readlink ~/.cursor/skills/confluence-team-kit","out":["~/skills/confluence-team-kit/skills/confluence-team-kit"],"source":"real","cwd":"~","notes":"Comprobamos que el enlace apunta donde debe. Es la misma comprobación que vas a necesitar si el agente dice que no conoce la skill."},{"type":"term","cmd":"open -e ~/.zshrc","out":[],"source":"inferido","cwd":"~","notes":"Ahora lo único que no hace el agente: las credenciales. En id.atlassian.com creás un token de API con el botón «Create API token» a secas, no el que dice «with scopes»: ctk entra por la URL de tu sitio y un token con alcance no funciona. Guardás tres variables en este archivo: CONFLUENCE_BASE_URL, sin /wiki y sin barra final, CONFLUENCE_EMAIL y CONFLUENCE_TOKEN. Con un editor, nunca por el chat. Después cerrás Cursor del todo y lo abrís otra vez.","pause":true},{"type":"term","cmd":"cat ~/.cursor/mcp.json","out":["{","  \"mcpServers\": {","    \"confluence\": {","      \"command\": \"uv\",","      \"args\": [\"run\", \"--project\", \"/ruta/a/confluence-team-kit\", \"--extra\", \"mcp\", \"ctk-mcp\"],","      \"env\": {","        \"CTK_ROOT\": \"/ruta/al/repo/que/publica\",","        \"CONFLUENCE_BASE_URL\": \"https://tu-sitio.atlassian.net\",","        \"CONFLUENCE_EMAIL\": \"vos@example.com\",","        \"CONFLUENCE_TOKEN\": \"\u003ctu-token\u003e\"","      }","    }","  }","}"],"source":"inferido","cwd":"~","notes":"Último paso de la instalación: conectar el MCP. Es el archivo de configuración de MCP que usa Cursor normalmente (~/.cursor/mcp.json); la guía de ctk solo dice «la configuración de MCP de tu editor», así que si el tuyo guarda otra ruta, es ahí. Le decís a Cursor que arranque ctk-mcp con uv. Dos cosas para remarcar. CTK_ROOT es el repo que publica y las herramientas no reciben rutas: el agente no puede apuntar el servidor a otra carpeta, hay un servidor por repo. Y este archivo lleva el token, así que no se commitea. Sin las tres variables, el servidor se niega a arrancar y lo dice."}]},{"id":"caso-principal","title":"Caso principal","subtitle":"Del plan al diff y a la ventana: publicar un cambio del runbook","screen":"cursor-full","faq":[{"q":"¿Puede el agente publicar solo?","a":"No. Planifica y lee todo lo que quiera, pero para escribir lanza ctk apply y se abre una ventana: la aprobación es tu clic, y el agente no puede tocarla."},{"q":"¿Qué pasa si cierro la ventana o no hago nada?","a":"No se escribe nada. Cancelar, Escape, cerrarla o dejar pasar los 100 segundos termina el comando con código 3, y el agente no reintenta: te pregunta qué querés."},{"q":"¿Y la terminal, no pedía escribir «Apruebo n»?","a":"Sí: si corrés ctk apply vos en una terminal, escribís esa frase ahí. Cuando lo lanza el agente no hay terminal para vos, entonces sale la ventana. Es la misma regla con otra puerta."},{"q":"¿Hay una forma de publicar sin nadie que apruebe?","a":"Una sola: ctk ci, en GitHub Actions, donde el merge a la rama por defecto es la aprobación. Corre solo ahí y desde la compu nunca se corre ni se simula."}],"steps":[{"type":"ask","text":"Actualicé el runbook. Mostrame qué se publicaría en Confluence, sin escribir nada.","source":"inferido","notes":"Un pedido de lo más normal: acabás de editar un documento y querés saber qué cambia. Fijate el chat de la izquierda: veníamos trabajando en el runbook de despliegue. No hay nada que configurar ni comando que recordar."},{"type":"tool","label":"Read · ~/.cursor/skills/confluence-team-kit/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue las reglas de la skill: Confluence se toca solo con ctk, primero se planifica y para escribir hace falta una persona."},{"type":"tool","label":"Read · .confluence.yml","source":"inferido","notes":"Antes de planificar mira el manifest: el archivo que dice qué carpeta o archivo va bajo qué página ancla de Confluence. Es la receta que ya tiene el repo; el agente no inventa a dónde publicar."},{"type":"term","cmd":"ctk plan","out":["UNCHANGED docs/arquitectura/index.md  'Arquitectura del servicio'","UNCHANGED docs/arquitectura/componentes.md  'Componentes'","UNCHANGED docs/arquitectura/decisiones  'Decisiones'","UNCHANGED docs/arquitectura/decisiones/adr-001.md  'ADR 001: usar colas'","UPDATE    docs/runbook.md  'Runbook de despliegue'","1 update, 4 unchanged","plan written to ctk-plan.json"],"source":"inferido","cwd":"~/mi-servicio","notes":"Este es el comando central. ctk plan lee Confluence, compara con tus archivos y escribe un plan en ctk-plan.json. No escribe nada en Confluence. Cada línea es una acción: UPDATE es una página cuyo origen cambió, UNCHANGED es nada que hacer. Acá una sola página cambia y las otras cuatro siguen igual. Inferido porque lee un Confluence real."},{"type":"term","cmd":"ctk diff","out":["UPDATE docs/runbook.md  'Runbook de despliegue'  (page 5014)","--- confluence","+++ local","@@ -1,2 +1,2 @@"," \u003ch2\u003eDespliegue\u003c/h2\u003e","-\u003cp\u003eCorré el job a mano.\u003c/p\u003e","+\u003cp\u003eCorré el job desde el pipeline.\u003c/p\u003e"],"source":"inferido","cwd":"~/mi-servicio","notes":"El diff es el paso que casi nadie conoce y el que da tranquilidad. Muestra el lado de Confluence contra lo que publicaría tu repo: el signo menos es lo que hoy está en Confluence, el más es lo que va a quedar. Se imprime acá y no se guarda en ningún lado. Lo leés como un control de cambios de un documento."},{"type":"say","md":"Se publicaría **una sola página**: `docs/runbook.md`, que pasa de «Corré el job a mano» a «Corré el job desde el pipeline». Las otras **4 páginas no cambian**.\n\nHasta acá no escribí nada en Confluence. **¿Lo publico?**","source":"inferido","notes":"Mirá cómo cierra el agente: resume en una frase, dice qué no tocó y pregunta. La skill exige mostrar las filas y esperar tu visto bueno antes de aplicar. Tu sí en el chat habilita el comando, pero todavía no aprueba nada."},{"type":"ask","text":"Dale, publicalo.","source":"inferido","notes":"Ese es el visto bueno. Recién ahora el agente puede ir al comando que escribe."},{"type":"say","md":"Voy a correr el comando que **escribe en Confluence**. **Se va a abrir una ventana** con la página que se actualiza y los botones **Cancelar** y **Apruebo 1**.\n\nLa aprobación es tu clic en esa ventana: mi pregunta de recién no cuenta, y yo no puedo tocarla. Si cancelás o la cerrás, no lo vuelvo a correr salvo que me lo pidas.","source":"inferido","notes":"Este aviso es parte de la regla de la skill: antes de lanzar ctk apply, el agente avisa que se abre una ventana y qué va a aprobarse. Y que vos tenés que estar adelante de la pantalla. Si no estás, deja el comando listo para que lo corras vos. Remarcá la última frase: si cancelás, no insiste.","pause":true},{"type":"approve","title":"Publicar en Confluence","button":"Apruebo 1","source":"inferido","notes":"La ventana de ctk: de qué repo sale, cuántas páginas cambian y una tarjeta por página con el archivo y la página de destino, con su id y su título leídos justo antes de abrirla. Así un plan que nombra una página y apunta a otra no pasa como inocente. Solo el clic aprueba. Formato real, datos de ejemplo.","pause":true,"window":"ctk · Confluence","width":520,"height":258,"html":"\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n:root{color-scheme:light dark;--fg:#1d1d1f;--muted:#6e6e73;--card:rgba(0,0,0,.045);--chip-bg:rgba(0,0,0,.07);\n --to-bg:rgba(0,113,227,.12);--to-fg:#0058b0}\n@media (prefers-color-scheme:dark){:root{--fg:#f5f5f7;--muted:#a1a1a6;--card:rgba(255,255,255,.07);\n --chip-bg:rgba(255,255,255,.12);--to-bg:rgba(10,132,255,.22);--to-fg:#6cb4ff}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:transparent;color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,\"SF Pro Text\",sans-serif;\n -webkit-font-smoothing:antialiased;cursor:default;-webkit-user-select:none}\nbody{padding:22px 24px 8px}\nh1{font-size:19px;line-height:1.25;font-weight:650;margin:4px 0 16px}\n.badges{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 14px}\n.badge{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--chip-bg);color:var(--muted)}\n.badge.danger{background:rgba(255,59,48,.13);color:#d70015}\n@media (prefers-color-scheme:dark){.badge.danger{background:rgba(255,69,58,.2);color:#ff6961}}\n.lines{display:grid;grid-template-columns:max-content 1fr;column-gap:12px;row-gap:2px;width:100%}\n.lbl{color:var(--muted)}\n.val{overflow-wrap:anywhere}\n.cards{list-style:none;margin:0;padding:0;display:grid;gap:8px}\n.card{background:var(--card);border-radius:10px;padding:10px 12px;display:grid;gap:6px}\n.top{display:flex;gap:8px;align-items:baseline}\n.key{flex:none;font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip-bg);border-radius:5px;padding:1px 6px;overflow-wrap:anywhere}\n.key[class*=\" k-\"]{display:inline-flex;align-items:center;gap:5px}\n.key[class*=\" k-\"]::before{content:\"\";width:9px;height:9px;border-radius:2px;background:var(--k)}\n.k-create{--k:#34a853}.k-update{--k:#4BADE8}.k-move{--k:#904EE2}.k-delete{--k:#d93025}.k-overwrite{--k:#f29900}.k-grant{--k:#5f6368}.k-adopt{--k:#12b5cb}\n.name{font-weight:500;overflow-wrap:anywhere}\na.name{color:var(--to-fg);text-decoration:none;cursor:pointer}a.name:hover{text-decoration:underline}\na.name::after{content:\" 🔗\";font-size:11px}\n.chg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}\n.from{color:var(--muted)}.arrow{color:var(--muted)}\n.to{background:var(--to-bg);color:var(--to-fg);border-radius:999px;padding:1px 9px;font-weight:600}\n.plain{color:var(--muted)}\n.foot{margin:16px 0 0;color:var(--muted);font-size:11.5px}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003ch1\u003ePublicar en Confluence\u003c/h1\u003e\n\u003cdiv class=\"badges\"\u003e\u003cspan class=\"badge\"\u003edesde mi-equipo/mi-servicio\u003c/span\u003e\u003cspan class=\"badge\"\u003e1 se actualiza\u003c/span\u003e\u003c/div\u003e\n\u003cul class=\"cards\"\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key k-update\"\u003eActualiza\u003c/span\u003e\u003ca class=\"name\" href=\"https://example.atlassian.net/wiki/pages/viewpage.action?pageId=5014\" target=\"_blank\"\u003eRunbook de despliegue\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\"chg\"\u003e\u003cdiv class=\"lines\"\u003e\u003cspan class=\"lbl\"\u003eArchivo\u003c/span\u003e\u003cspan class=\"val\"\u003edocs/runbook.md\u003c/span\u003e\u003cspan class=\"lbl\"\u003ePágina\u003c/span\u003e\u003cspan class=\"val\"\u003e«Runbook de despliegue» (id 5014)\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp class=\"foot\"\u003eEscape cancela · se cancela sola a los 100 s\u003c/p\u003e\u003c/body\u003e\u003c/html\u003e"},{"type":"term","cmd":"ctk apply ctk-plan.json","out":["UNCHANGED docs/arquitectura/index.md  'Arquitectura del servicio'","UNCHANGED docs/arquitectura/componentes.md  'Componentes'","UNCHANGED docs/arquitectura/decisiones  'Decisiones'","UNCHANGED docs/arquitectura/decisiones/adr-001.md  'ADR 001: usar colas'","UPDATE    docs/runbook.md  'Runbook de despliegue'","1 update, 4 unchanged","done    UPDATE docs/runbook.md"],"source":"inferido","cwd":"~/mi-servicio","notes":"Con tu clic,
