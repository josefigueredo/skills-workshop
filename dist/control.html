<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control del taller</title>
<!-- Template: build inlines tokens.css + screens.css at CSS (for the mini preview), every
     episode as <script type="application/json" id="episodes">[…]</script> at EPISODES,
     and nav.js, render.js, animate.js, control.js at JS. No external references. -->
<style>
/* Every colour, font and size of the stage. When Cursor or the terminal change, edit here.
   Sizes are for the fixed 1600x900 canvas (the stage scales it). */
:root {
  /* canvas */
  --ws-w: 1600px;
  --ws-h: 900px;

  /* fonts */
  --ws-font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ws-font-mono: "SF Mono", Menlo, Monaco, "Courier New", monospace;
  --ws-fs: 15px;          /* Cursor body text */
  --ws-fs-sm: 13.5px;     /* sidebar, tabs, footers */
  --ws-fs-xs: 12.5px;     /* section labels, ages */
  --ws-fs-h4: 19px;       /* say #### heading */
  --ws-fs-mono: 13.5px;   /* code, chips, zsh */
  --ws-fs-term: 16px;     /* personal terminal and Claude Code */
  --ws-lh: 1.6;
  --ws-lh-mono: 1.55;
  --ws-lh-tight: 1.3;     /* user label block */
  --ws-lh-list: 2;        /* file tree, Open Tabs */
  --ws-caret-w: .6em;     /* terminal caret block */

  /* spacing and radii */
  --ws-gap: 12px;
  --ws-pad: 18px;
  --ws-pad-sm: 8px;
  --ws-pad-xs: 4px;
  --ws-radius: 12px;
  --ws-radius-sm: 6px;
  --ws-radius-xs: 4px;
  --ws-line: 1px;

  /* window chrome */
  --ws-dot: 12px;
  --ws-dot-r: #ff5f57;
  --ws-dot-y: #febc2e;
  --ws-dot-g: #28c840;

  /* Cursor, light theme */
  --ws-c-bg: #ffffff;
  --ws-c-side: #f3f3f3;
  --ws-c-line: #e6e6e6;
  --ws-c-tx: #1d1d1f;
  --ws-c-tx2: #3a3a3c;
  --ws-c-mut: #7a7a7a;
  --ws-c-faint: #a0a0a0;
  --ws-c-sel: #e3e3e3;
  --ws-c-chip: #f2f2f2;
  --ws-c-code: #efefef;
  --ws-c-send-bg: #111111;
  --ws-c-send-fg: #ffffff;
  --ws-c-plus: #1a7f37;
  --ws-c-avatar: #8a7b6b;
  --ws-c-shadow: 0 1px 4px rgba(0, 0, 0, .06);
  --ws-c-sidebar-w: 250px;
  --ws-c-right-w: 680px;
  --ws-c-tree-w: 230px;
  --ws-c-zsh-h: 400px;
  --ws-c-opentabs-w: 270px;
  --ws-c-top-h: 40px;
  --ws-c-tabs-h: 40px;
  --ws-c-avatar-s: 26px;
  --ws-c-send-s: 22px;
  --ws-c-preview-fs: 28px;

  /* zsh prompt segments inside Cursor (light) */
  --ws-z-bg: #ffffff;
  --ws-z-tx: #1d1d1f;
  --ws-z-apple-bg: #ffffff;
  --ws-z-apple-fg: #111111;
  --ws-z-path-bg: #1f4f8f;
  --ws-z-path-fg: #ffffff;
  --ws-z-git-bg: #2a8a76;
  --ws-z-git-fg: #ffffff;
  --ws-z-sys-bg: #8e1f6f;
  --ws-z-sys-fg: #ffffff;
  --ws-z-time-bg: transparent;
  --ws-z-time-fg: #1d1d1f;
  --ws-z-fill: #7a7a7a;
  --ws-z-path-icon: #ffffff;
  --ws-z-sys-icon: #ffffff;
  --ws-z-time-icon: #1d1d1f;
  --ws-z-ok: #2ea043;
  --ws-z-out: #3a3a3c;

  /* personal terminal (dark) */
  --ws-t-bg: #252830;
  --ws-t-bar: #2d3139;
  --ws-t-bar-fg: #c9ced8;
  --ws-t-tx: #d7dae0;
  --ws-t-mut: #8b919c;
  --ws-t-cmd: #79c0ff;
  --ws-t-ok: #7ee000;
  --ws-t-caret: #d7dae0;
  --ws-t-apple-bg: #d0d4db;
  --ws-t-apple-fg: #111111;
  --ws-t-path-bg: #86a6cc;
  --ws-t-path-fg: #ffffff;
  --ws-t-path-icon: #ffffff;
  --ws-t-git-bg: #2f8f8a;
  --ws-t-git-fg: #ffffff;
  --ws-t-sys-bg: #b994c9;
  --ws-t-sys-fg: #1b1b22;
  --ws-t-sys-icon: #1b1b22;
  --ws-t-time-bg: #d6d9df;
  --ws-t-time-fg: #111111;
  --ws-t-time-icon: #111111;
  --ws-t-fill: #5d6370;
  --ws-t-bar-h: 34px;
  --ws-seg-slant: 8px;
  --ws-fill-w: 2px;       /* dotted fill between prompt segments */
  --ws-icon-s: 1em;       /* prompt icons (folder, house, clock), inline SVG */
  --ws-icon-gap: .4em;    /* space between a prompt icon and its text */
  --ws-icon-drop: -.14em; /* vertical-align of prompt icons on the text baseline */

  /* Claude Code tab */
  --ws-cc-accent: #d97757;
  --ws-cc-ok: #3fb950;
  --ws-cc-user: #ffa657;  /* the person's turn, as in the cc-* mockups */
  --ws-cc-bang: #f778ba;  /* a `!` command the person runs in bash mode */
  --ws-cc-box: #5d6370;
  --ws-cc-gutter: 2ch;    /* width of the ⏺ / ⎿ / > gutter */

  /* browser window of a page step */
  --ws-p-w: 92%;
  --ws-p-h: 90%;
  --ws-p-bg: #ffffff;
  --ws-p-bar: #f1f1f3;

  /* macOS approval window */
  --ws-a-scrim: rgba(0, 0, 0, .28);
  --ws-a-bg: #ececec;
  --ws-a-tx: #1d1d1f;
  --ws-a-mut: #4a4a4c;
  --ws-a-line: #d2d2d2;
  --ws-a-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  --ws-a-w: 560px;
  --ws-a-radius: 14px;
  --ws-a-icon: 56px;
  --ws-a-icon-bg: #2d6cdf;
  --ws-a-btn-bg: #ffffff;
  --ws-a-btn-fg: #1d1d1f;
  --ws-a-ok-bg: #0a6cf0;
  --ws-a-ok-fg: #ffffff;
  --ws-a-fs-title: 17px;
  --ws-a-fs: 14px;
  --ws-a-lh: 1.45;
  /* the tool's own approval panel (alert.js): light or dark like macOS, because its page follows the system too */
  --ws-r-bg: #ececec;
  --ws-r-tx: #1d1d1f;
  --ws-r-bar-tx: #4a4a4c;
  --ws-r-btn-bg: #ffffff;
  --ws-r-btn-line: #c8c8c8;
  --ws-r-bar: 28px;         /* title bar */
  --ws-r-foot: 58px;        /* the button bar under the page (alert.js `bar`) */
  --ws-r-btn-h: 28px;
  --ws-r-btn-cancel: 90px;
  --ws-r-btn-ok: 130px;
  --ws-r-fs-btn: 13px;

  /* callouts on the current step (note bubble, box, underline, tag) */
  --ws-co-mark: #ff5a1f;
  --ws-co-tag-fg: #ffffff;
  --ws-co-note-bg: #fff4b8;
  --ws-co-note-tx: #3b3000;
  --ws-co-note-line: #f2cf3d;
  --ws-co-note-w: 520px;
  --ws-co-note-fs: 17px;
  --ws-co-note-shadow: 0 6px 18px rgba(0, 0, 0, .18);
  --ws-co-box-w: 3px;
  --ws-co-under-w: 3px;

  /* chapter card */
  --ws-k-grad: linear-gradient(135deg, #2d6cdf, #7a4fe0);
  --ws-k-fg: #ffffff;
  --ws-k-fs-kicker: 22px;
  --ws-k-fs-title: 88px;
  --ws-k-fs-sub: 30px;
  --ws-k-pad: 140px;
  --ws-k-sub-w: 1100px;
  --ws-k-kicker-track: .12em;
  --ws-k-kicker-op: .8;
  --ws-k-sub-op: .9;
  --ws-k-title-mt: .2em;
  --ws-k-title-mb: .3em;
  --ws-k-lh-title: 1.05;
  --ws-k-lh-sub: 1.35;
  --ws-k-pitch-mt: 56px;
  --ws-k-pitch-w: 1180px;
  --ws-k-pitch-pad: 28px 36px;
  --ws-k-pitch-bg: rgba(255, 255, 255, .12);
  --ws-k-pitch-radius: 14px;
  --ws-k-fs-pitch-k: 18px;
  --ws-k-fs-pitch: 30px;
  --ws-k-lh-pitch: 1.3;
  --ws-k-pitch-gap: 8px;
  --ws-k-pitch-row-gap: 22px;
  --ws-k-keys-mt: 40px;
  --ws-k-keys-gap: 28px;
  --ws-k-key-label-gap: 12px;
  --ws-k-key: 56px;
  --ws-k-key-radius: 10px;
  --ws-k-key-border: rgba(255, 255, 255, .7);
  --ws-k-fs-key: 30px;
  --ws-k-fs-keys: 24px;
}

/* Stage screens: card, cursor-full, cursor-agent, terminal, claude-code, approve overlay.
   Values come from tokens.css; this file only lays things out. */
.ws-screen {
  position: relative; box-sizing: border-box; width: var(--ws-w); height: var(--ws-h);
  overflow: hidden; font-family: var(--ws-font-ui);
}
.ws-screen *, .ws-screen *::before, .ws-screen *::after { box-sizing: border-box; }
.ws-empty { background: var(--ws-c-bg); }
.ws-mut { color: var(--ws-c-mut); }

/* bottom-anchored area: short content on top, long content shows its newest part */
.ws-scroll { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; min-height: 0; }
.ws-flow { flex: 1 0 auto; }

.ws-dots { display: flex; gap: calc(var(--ws-dot) / 2); }
.ws-dot { display: inline-block; width: var(--ws-dot); height: var(--ws-dot); border-radius: 50%; }
.ws-dot-r { background: var(--ws-dot-r); }
.ws-dot-y { background: var(--ws-dot-y); }
.ws-dot-g { background: var(--ws-dot-g); }

/* ---------- chapter card ---------- */
.ws-card { background: var(--ws-k-grad); color: var(--ws-k-fg); display: flex; align-items: center; }
.ws-card-inner { padding: 0 var(--ws-k-pad); }
.ws-card-kicker { font-size: var(--ws-k-fs-kicker); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase; opacity: var(--ws-k-kicker-op); }
.ws-card-title { margin: var(--ws-k-title-mt) 0 var(--ws-k-title-mb); font-size: var(--ws-k-fs-title); line-height: var(--ws-k-lh-title); font-weight: 700; }
.ws-card-sub { margin: 0; font-size: var(--ws-k-fs-sub); opacity: var(--ws-k-sub-op); max-width: var(--ws-k-sub-w); line-height: var(--ws-k-lh-sub); }
.ws-card-pitch { margin-top: var(--ws-k-pitch-mt); max-width: var(--ws-k-pitch-w); padding: var(--ws-k-pitch-pad);
  background: var(--ws-k-pitch-bg); border-radius: var(--ws-k-pitch-radius); }
.ws-card-pitch-k { font-size: var(--ws-k-fs-pitch-k); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase;
  opacity: var(--ws-k-kicker-op); margin-bottom: var(--ws-k-pitch-gap); }
.ws-card-pitch-ask, .ws-card-pitch-does { font-size: var(--ws-k-fs-pitch); line-height: var(--ws-k-lh-pitch); }
.ws-card-pitch-ask { font-style: italic; margin-bottom: var(--ws-k-pitch-row-gap); }
.ws-card-keys { margin-top: var(--ws-k-keys-mt); max-width: var(--ws-k-pitch-w); display: flex;
  justify-content: flex-end; align-items: center; gap: var(--ws-k-keys-gap); }
.ws-card-key { display: flex; align-items: center; gap: var(--ws-k-key-label-gap); }
.ws-key { display: inline-flex; align-items: center; justify-content: center; width: var(--ws-k-key); height: var(--ws-k-key);
  border: 2px solid var(--ws-k-key-border); border-bottom-width: 5px; border-radius: var(--ws-k-key-radius);
  background: var(--ws-k-pitch-bg); font-size: var(--ws-k-fs-key); font-weight: 700; line-height: 1; }
.ws-card-key-t, .ws-card-keys-t { font-size: var(--ws-k-fs-keys); opacity: var(--ws-k-sub-op); }
.ws-card-keys-t { margin-left: var(--ws-k-keys-gap); }

/* ---------- Cursor ---------- */
.ws-cursor { display: flex; background: var(--ws-c-bg); color: var(--ws-c-tx); font-size: var(--ws-fs); line-height: var(--ws-lh); }
.ws-sb {
  width: var(--ws-c-sidebar-w); flex: none; background: var(--ws-c-side); border-right: var(--ws-line) solid var(--ws-c-line);
  display: flex; flex-direction: column; padding: var(--ws-gap) 0; font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-sb .ws-dots { padding: 0 var(--ws-gap) var(--ws-pad); }
.ws-sb-nav { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-sec { padding: var(--ws-pad) var(--ws-gap) var(--ws-pad-xs); color: var(--ws-c-mut); font-size: var(--ws-fs-xs); }
.ws-sb-repo { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-chat {
  display: flex; gap: var(--ws-pad-sm); justify-content: space-between;
  margin: 0 var(--ws-pad-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm) var(--ws-pad-xs) var(--ws-pad);
  border-radius: var(--ws-radius-sm);
}
.ws-sb-chat-t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ws-sb-chat b { font-weight: 400; color: var(--ws-c-mut); flex: none; }
.ws-sb-chat.ws-on { background: var(--ws-c-sel); color: var(--ws-c-tx); }
.ws-me { margin-top: auto; padding: var(--ws-gap); display: flex; align-items: center; gap: var(--ws-pad-sm); line-height: var(--ws-lh-tight); }
.ws-avatar { width: var(--ws-c-avatar-s); height: var(--ws-c-avatar-s); border-radius: 50%; background: var(--ws-c-avatar); flex: none; }

.ws-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ws-top {
  height: var(--ws-c-top-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-pad);
  font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-top-r { margin-left: auto; color: var(--ws-c-mut); font-size: var(--ws-fs-xs); white-space: pre; }
.ws-conv { flex: 1; padding: 0 var(--ws-pad); }
.ws-conv .ws-flow { display: flex; flex-direction: column; gap: var(--ws-gap); padding-bottom: var(--ws-gap); }
.ws-ask {
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius); padding: var(--ws-gap) var(--ws-gap) var(--ws-pad-sm);
  box-shadow: var(--ws-c-shadow); background: var(--ws-c-bg); white-space: pre-wrap;
}
.ws-ask-row { display: flex; align-items: center; gap: var(--ws-gap); margin-top: var(--ws-pad-sm); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); white-space: normal; }
.ws-send {
  margin-left: auto; width: var(--ws-c-send-s); height: var(--ws-c-send-s); border-radius: 50%;
  background: var(--ws-c-send-bg); color: var(--ws-c-send-fg); display: flex; align-items: center; justify-content: center; font-size: var(--ws-fs-xs);
}
.ws-worked { color: var(--ws-c-mut); }
.ws-tool {
  align-self: flex-start; font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); color: var(--ws-c-tx2);
  background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm);
  white-space: pre-wrap; word-break: break-word;
}
.ws-ran { display: flex; flex-direction: column; gap: var(--ws-pad-xs); }
.ws-ran-out {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); line-height: var(--ws-lh-mono); color: var(--ws-z-out);
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-sm) var(--ws-gap);
}
.ws-ran-out .ws-out { white-space: pre-wrap; word-break: break-word; }
.ws-say p, .ws-say ul, .ws-say h4 { margin: 0 0 var(--ws-pad-sm); }
.ws-say > :last-child { margin-bottom: 0; }
.ws-say h4 { font-size: var(--ws-fs-h4); margin-top: var(--ws-pad-xs); }
.ws-say ul { padding-left: var(--ws-pad); }
.ws-md-table { overflow-x: auto; margin: 0 0 var(--ws-pad-sm); }
.ws-md-table table { border-collapse: collapse; font-size: var(--ws-fs-sm); }
.ws-md-table th, .ws-md-table td {
  border: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-pad-xs) var(--ws-pad-sm); text-align: left;
  white-space: nowrap;
}
.ws-md-table th { font-weight: 600; }
.ws-cursor code {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); background: var(--ws-c-code);
  border-radius: var(--ws-radius-xs); padding: 0 var(--ws-pad-xs);
}
.ws-followup {
  flex: none; margin: var(--ws-pad-sm) var(--ws-pad) var(--ws-pad-xs); border: var(--ws-line) solid var(--ws-c-line);
  border-radius: var(--ws-radius); padding: var(--ws-pad-sm) var(--ws-gap); display: flex; color: var(--ws-c-faint);
  font-size: var(--ws-fs-sm); box-shadow: var(--ws-c-shadow); white-space: pre;
}
.ws-followup-m { margin-left: auto; color: var(--ws-c-mut); }
.ws-foot { flex: none; display: flex; gap: var(--ws-pad); padding: var(--ws-pad-xs) var(--ws-pad) var(--ws-gap); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); }

/* right panel (cursor-full) */
.ws-rp { width: var(--ws-c-right-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); display: flex; flex-direction: column; font-size: var(--ws-fs-sm); }
.ws-rp-tabs { height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: 0 var(--ws-gap); color: var(--ws-c-mut); }
.ws-tab.ws-on { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); font-style: italic; color: var(--ws-c-tx); }
.ws-rp-sub {
  height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-gap);
  color: var(--ws-c-tx2); border-top: var(--ws-line) solid var(--ws-c-line); border-bottom: var(--ws-line) solid var(--ws-c-line); white-space: pre;
}
.ws-rp-sub-r { margin-left: auto; display: flex; gap: var(--ws-pad-sm); color: var(--ws-c-mut); }
.ws-pill { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); color: var(--ws-c-tx); }
.ws-rp-files { flex: 1; min-height: 0; display: flex; }
.ws-preview { flex: 1; padding: var(--ws-pad); }
.ws-preview h1 { margin: var(--ws-pad-sm) 0 0; font-size: var(--ws-c-preview-fs); }
.ws-tree { width: var(--ws-c-tree-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-gap) var(--ws-pad-sm); color: var(--ws-c-tx2); line-height: var(--ws-lh-list); }
.ws-tree-h { color: var(--ws-c-mut); padding: 0 var(--ws-pad-xs); }
.ws-tree-i { padding: 0 var(--ws-pad-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-zsh { height: var(--ws-c-zsh-h); flex: none; border-top: var(--ws-line) solid var(--ws-c-line); background: var(--ws-z-bg); display: flex; flex-direction: column; }
.ws-zsh-tabs { flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: var(--ws-pad-sm) var(--ws-gap) 0; color: var(--ws-c-mut); }
.ws-zsh-title { flex: none; padding: var(--ws-pad-sm) var(--ws-gap); color: var(--ws-c-tx2); }
.ws-zsh-body {
  flex: 1; padding: 0 var(--ws-gap) var(--ws-pad-sm); font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono);
  line-height: var(--ws-lh-mono); color: var(--ws-z-tx);
}

/* Open Tabs column (cursor-agent) */
.ws-opentabs { width: var(--ws-c-opentabs-w); flex: none; padding: var(--ws-c-top-h) var(--ws-pad) var(--ws-pad); color: var(--ws-c-tx2); font-size: var(--ws-fs-sm); line-height: var(--ws-lh-list); }
.ws-ot-h { color: var(--ws-c-mut); font-size: var(--ws-fs-xs); margin-top: var(--ws-gap); }
.ws-ot-h:first-child { margin-top: 0; }
.ws-plus { color: var(--ws-c-plus); }

/* ---------- shell lines (zsh in Cursor and personal terminal) ---------- */
.ws-prompt { display: flex; align-items: center; white-space: nowrap; margin-top: var(--ws-pad-xs); }
.ws-seg {
  display: inline-block; padding: 0 calc(var(--ws-seg-slant) + var(--ws-pad-xs));
  clip-path: polygon(var(--ws-seg-slant) 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%);
  margin-right: calc(var(--ws-seg-slant) / -2);
}
.ws-seg-apple { clip-path: polygon(0 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%); }
.ws-seg-fill { flex: 1; align-self: center; height: 0; margin: 0 var(--ws-pad-sm); border-bottom: var(--ws-fill-w) dotted; }
.ws-ico { display: inline-block; width: var(--ws-icon-s); height: var(--ws-icon-s); vertical-align: var(--ws-icon-drop); }

roduct Brain can fill it at Jira export"],"source":"real","cwd":"~/mi-servicio","notes":"Y lo mide antes de pegarlo, con las mismas reglas de Product Brain: 96%. Lo único que falta es el prefijo de Jira, que Product Brain completa al exportar. Medir, no especular. Salida real.","pause":true},{"type":"say","md":"Paquete de E2 (reintegro del pago) listo: **96%**, y lo que falta lo completa Product Brain al exportar.\n\nDos cosas son tuyas:\n- **La decisión del mail:** marcala en `pending-owner.md` cuando el owner la tome.\n- **Product Brain:** pegá primero `wow/pb/preamble.md` y después `wow/pb/epic-E2.md`, con el modelo 3.1 Pro.","source":"inferido","notes":"El agente prepara y la persona hace lo que es de una persona: decidir y pegar en Product Brain. Contenido ilustrativo."},{"type":"ask","text":"El owner dijo que sí al mail y ya lo marqué. ¿Qué sigue?","source":"inferido","notes":"La persona marcó la decisión en el archivo. Y vuelve a la guía: así es el ritmo de todos los días, un paso y de nuevo «¿qué sigue?»."},{"type":"term","cmd":"~/.local/bin/wow snapshot","out":["wrote wow/progress.json","- [product-brain] finish the epic E2 chat in Product Brain -\u003e paste the preamble and wow/pb/epic-E2.md"],"source":"real","cwd":"~/mi-servicio","notes":"El bloqueo desapareció y el próximo paso cambió de lugar: ahora es en Product Brain. Salida real."},{"type":"say","md":"Sin bloqueos. El próximo paso es **en Product Brain, y es tuyo**: terminar el chat de E2 (reintegro del pago) pegando el preámbulo y `wow/pb/epic-E2.md`.\n\nCuando termines, copiá el chat y el panel a `wow/pb/chats/` y pedime la auditoría. Al exportar, Product Brain crea la épica en Jira: con esa clave, E2 entra a su propio flujo de Spec-Kit.","source":"inferido","notes":"Este es el centro del episodio: la clave de Jira es lo único que une los dos flujos. Lo que hace Product Brain es de la persona; el agente audita después, porque «completé el documento» no es evidencia. Esta vez no hay opciones para elegir: el único paso es tuyo, en Product Brain, así que la guía no pregunta.","pause":true}]},{"id":"spec-kit-y-jira","title":"Caso principal (2)","subtitle":"Del lado de Spec-Kit, hasta cerrar la épica en Jira","screen":"claude-code","faq":[{"q":"¿Por qué no lo hace todo Cursor?","a":"Porque el pool de Cursor es escaso. El modelo fuerte piensa acá y Cursor solo ratifica. Igual el comando se manda a Cursor de verdad, así la telemetría de Spec-Kit registra los turnos y los tokens."},{"q":"¿Por qué el agente no manda sync-status?","a":"Porque escribe en Jira. wow y la baranda se niegan a mandarlo: lo corrés vos en Cursor."},{"q":"¿Y el --apply del cierre?","a":"También es tuyo. El agente te muestra la corrida en seco y te deja el comando; vos lo corrés con un signo de exclamación. Acá no hay ventana de aprobación: tu control es la lista que viste antes."},{"q":"¿Queda registro de lo que se escribió en Jira?","a":"Sí: cada escritura queda en harness/jira-writes.jsonl, en el repo."}],"steps":[{"type":"ask","text":"Preparame el paso de Spec-Kit para PLAT-123","source":"inferido","notes":"Ahora el otro flujo: la épica E1 ya está en Jira como PLAT-123 (clave inventada) y Spec-Kit la está construyendo."},{"type":"tool","label":"Skill(wow-sk-prep)","source":"inferido","notes":"wow-sk-prep tiene una meta: que Cursor solo ratifique, sin gastar su pool en pensar."},{"type":"term","cmd":"~/.local/bin/wow sk status --feature specs/001-devoluciones","out":["{","  \"import_warnings\": 0,","  \"features\": [","    {","      \"dir\": \"specs/001-devoluciones\",","      \"epic_key\": \"PLAT-123\",","      \"missing\": [","        \"tasks.md\",","        \"work-units.json\",","        \"wow/sk/001-devoluciones/clarify-answers.md\",","        \"wow/sk/001-devoluciones/plan-draft.md\"","      ],","      \"orphan_tasks\": 0","    }","  ]","}"],"source":"real","cwd":"~/mi-servicio","notes":"Qué le falta a la feature: tasks.md y los work units. Los dos borradores se escriben antes del clarify y del plan, que acá ya se ratificaron. Salida real."},{"type":"term","cmd":"~/.local/bin/wow sk cmd tasks --feature specs/001-devoluciones","out":["/spec-kit.tasks","/spec-kit.tasks.shape"],"source":"real","cwd":"~/mi-servicio","notes":"El comando exacto de Spec-Kit para este paso; son dos, uno detrás del otro. Salida real."},{"type":"tool","label":"Bash(~/.local/bin/wow sk run \"/spec-kit.tasks\" --model claude-sonnet-5-5-high)","source":"inferido","notes":"wow sk run se lo manda a un cursor-agent interactivo, a través de run-in-cursor: queda registrado como si lo tipearas en Cursor, con modelo y tokens. Nunca cursor-agent -p ni el CLI spec-kit: se pierden la telemetría y los tokens. Inferido: necesita Cursor."},{"type":"tool","label":"Bash(~/.local/bin/wow sk quit wow-sk-1)","source":"inferido","notes":"Cuando el turno de Cursor termina, wow sk run muestra su pantalla, y la skill siempre cierra la sesión con wow sk quit. Si Cursor pregunta algo, se le contesta con wow sk send; si la respuesta es tuya, el agente te la pide. El nombre de la sesión es ilustrativo. Inferido."},{"type":"say","md":"La pantalla de Cursor que devolvió `wow sk run` muestra `/spec-kit.tasks` ratificado, y cerré la sesión. Después va `/spec-kit.tasks.shape` para los work units.\n\nCuando las historias estén implementadas, las cierra `/spec-kit.sync-status`, y ese **no lo mando yo**: escribe en Jira, lo corrés vos en Cursor.","source":"inferido","notes":"La regla de la serie, otra vez: lo que escribe en Jira es de la persona. Contenido ilustrativo. La pantalla de Cursor no se muestra en la grabación: wow sk run la imprime en la sesión real, y acá no corremos Cursor."},{"type":"ask","text":"Ya corrí sync-status en Cursor y la revisión de cierre de E1 salió aprobada. Cerrá lo que quedó abierto en Jira.","source":"inferido","notes":"Saltamos unas semanas: E1 está implementada, sync-status cerró las historias y un revisor independiente aprobó la épica. Pero Spec-Kit deja abiertas las subtareas y la épica."},{"type":"tool","label":"Skill(wow-review)","source":"inferido","notes":"El cierre vive en wow-review, después de la revisión de la épica."},{"type":"term","cmd":"~/.local/bin/wow close --epic E1","out":["PLAT-123: 2 already done, 3 to close: PLAT-126, PLAT-127, PLAT-123","dry run: nothing changed; --apply closes them in this order"],"source":"inferido","notes":"Primero siempre en seco: lista lo que cerraría y no toca nada. Si quedara una historia abierta, se informa como anomalía de Spec-Kit y frena. Inferido: necesita Jira."},{"type":"say","md":"En seco no cambió nada. Quedan 3 por cerrar: las subtareas `PLAT-126` y `PLAT-127` y la épica `PLAT-123`.\n\n**Esto escribe en Jira, así que lo corrés vos:**\n`! wow close --epic E1 --apply`","source":"inferido","notes":"El agente no corre el --apply: te lo deja listo. Es la única escritura de wow hacia Jira, junto con fix-fields.","pause":true},{"type":"term","cmd":"wow close --epic E1 --apply","out":["PLAT-123: 2 already done, 3 to close: PLAT-126, PLAT-127, PLAT-123","closed 3 issues"],"source":"inferido","notes":"La persona lo corre con el signo de exclamación: es el modo bash de Claude Code, un comando tuyo y no del agente. Cada escritura queda en harness/jira-writes.jsonl. Inferido: escribe en Jira.","in":"zsh"},{"type":"say","md":"Cerrado: la épica PLAT-123 y sus subtareas. La escritura quedó registrada en `harness/jira-writes.jsonl`. Con `wow progress` lo confirmo cuando quieras.","source":"inferido","notes":"Cierre del flujo de punta a punta: Product Brain registró, Spec-Kit construyó, y Jira quedó prolijo. Contenido ilustrativo."}]},{"id":"otras-skills","title":"Las otras skills","subtitle":"Contexto, plan, auditoría y revisión, en un minuto","screen":"claude-code","faq":[{"q":"¿Tengo que usar las siete?","a":"No. Cada una hace un paso y vuelve a wow-guide. Si una iniciativa ya tiene su plan, empezás por donde esté."},{"q":"¿Qué es un revisor independiente?","a":"Otro modelo, distinto del que escribió: Codex, Copilot, Gemini, cursor-agent o Claude. wow saltea al autor. Si no hay ninguno, no aprueba nada: sale con 2."},{"q":"¿Qué pasa si el revisor marca un BLOCKER tres veces?","a":"La revisión pasa a una persona, que decide aprobar o rechazar con una razón. Queda registrada como decisión humana, nunca como aprobada por el modelo."}],"steps":[{"type":"ask","text":"¿Y las otras skills de WayOfWork, para qué son?","source":"inferido","notes":"Un repaso corto de las cuatro que no vimos en acción. No hace falta memorizarlas: wow-guide te dice cuál toca."},{"type":"say","md":"Cada una hace un paso y vuelve a `wow-guide`:\n- **wow-context:** el context pack, cada afirmación con su etiqueta y su fuente `archivo:línea`.\n- **wow-plan:** el Brief y el kanban de épicas y tareas, con criterios en Gherkin y estimación.\n- **wow-pb-audit:** compara lo que escribió Product Brain contra el paquete y arma las correcciones para pegarle.\n- **wow-review:** una revisión con otro modelo, nunca el que escribió: del plan, de una historia, de una épica o de un documento.","source":"inferido","notes":"Remarcá la idea común: medir, no especular. Cada afirmación lleva su fuente, y lo que no se puede medir se rotula como inferencia. Contenido ilustrativo."},{"type":"ask","text":"Revisá que las fuentes del context pack sigan en pie","source":"inferido","notes":"Un ejemplo de wow-context, el que se usa cuando cambia el repo."},{"type":"tool","label":"Skill(wow-context)","source":"inferido"},{"type":"term","cmd":"~/.local/bin/wow context check","out":["metrics.md: missing (run wow context scan)","decisions.md: missing (run wow context scan)","contracts.md: missing (run wow context scan)","# exit 1"],"source":"real","cwd":"~/mi-servicio","notes":"Faltan tres archivos del pack. Es determinista: no depende de un modelo. Salida real."},{"type":"term","cmd":"~/.local/bin/wow context scan","out":["children: -","docs: 2","created wow/context-pack/metrics.md","created wow/context-pack/decisions.md" olo en las sesiones que lanzó `ric`; en cualquier otra sesión de Cursor no hace nada.","source":"inferido","notes":"Esto es lo que alimenta la telemetría: turnos, modelo y tokens, como si lo hubieras tipeado en Cursor. Y lo que la privacidad pide: nunca el contenido. Texto ilustrativo sobre salida real.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores que se repiten: el PATH, el hook, el timeout y la carpeta que ya existe","screen":"terminal","faq":[{"q":"Dice «tmux is not on PATH», ¿qué hago?","a":"Falta instalar tmux o su carpeta no está en tu PATH. Con brew install tmux alcanza, y abrís una terminal nueva. Con cursor-agent pasa lo mismo."},{"q":"¿Qué códigos de salida tiene ric?","a":"0 si completó, 1 si abortó, falló o se negó, 124 si se pasó el tiempo y 2 si falta tmux, cursor-agent o el hook, o el --deny no es válido."},{"q":"El turno se pasó del tiempo, ¿perdí la sesión?","a":"No. Sigue viva: con tmux attach la ves y después le pedís al agente que la cierre."},{"q":"¿Puedo correr el instalador de nuevo?","a":"Sí, es seguro: refresca los enlaces y no duplica el hook. Lo único que no hace es pisar una carpeta real con el nombre de la skill."}],"steps":[{"type":"term","cmd":"python3 ~/.agents/skills/run-in-cursor/ric.py run --workspace ~/mi-servicio \"/spec-kit.plan specs/001-devoluciones\"","out":["ric: tmux is not on PATH","# exit 2"],"source":"real","cwd":"~","notes":"El error más común: falta una herramienta en el PATH. Acá ric ni intenta abrir nada y sale con código 2, que es exactamente lo que queremos: no deja una sesión a medias. Se arregla instalando tmux o agregando su carpeta al PATH en tu ~/.zshrc y abriendo una terminal nueva. Salida real: la máquina de la grabación no tiene tmux."},{"type":"term","cmd":"python3 ~/.agents/skills/run-in-cursor/ric.py run --workspace ~/mi-servicio \"/spec-kit.plan specs/001-devoluciones\"","out":["ric: the global hook is missing from ~/.cursor/hooks.json: run \"ric install-hook\" first","# exit 2"],"source":"inferido","notes":"Con tmux y cursor-agent en su lugar, el siguiente error es el hook faltante. ric se niega de entrada, porque sin el aviso de fin de turno esperaría los treinta minutos enteros. Se arregla con ric install-hook, que pide el agente o corrés vos. Inferido: acá el hook sí está."},{"type":"term","cmd":"python3 ~/.agents/skills/run-in-cursor/ric.py install-hook","out":["~/.cursor/hooks.json: hook already present"],"source":"real","cwd":"~","notes":"Volver a instalar el hook es seguro: reconoce su propia entrada y no agrega otra, por eso dice «already present». Si en cambio el Python se mudó, no lo reemplaza: hay que corregir esa línea de hooks.json a mano. En una máquina sin el hook diría «hook added on stop and sessionEnd»; acá ya estaba, por el instalador. Salida real."},{"type":"term","cmd":"tmux attach -t ric-spec-kit-plan-20261020-101500","out":["(se abre la sesión de Cursor, con el turno todavía en curso)"],"source":"inferido","notes":"Si el turno se pasa del tiempo (estado timeout, código 124), la sesión sigue viva y esto te la muestra. Mirás qué está haciendo y después le pedís al agente que la cierre con ric quit. Inferido: necesita una sesión de Cursor viva."},{"type":"term","cmd":"cd ~/skills/run-in-cursor \u0026\u0026 ./install.sh","out":["refusing to replace ~/.agents/skills/run-in-cursor: it is not a symlink; move it away and re-run","# exit 1"],"source":"inferido","notes":"Si ya hay una carpeta real con el nombre de la skill, el instalador no la pisa: se detiene. La movés a otro lado y lo corrés de nuevo. Inferido: necesitaría armar esa carpeta a propósito.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás de run-in-cursor y de todo el taller","screen":"claude-code","faq":[{"q":"¿Tengo que usar las dos series?","a":"No. La de Cursor te enseña cada herramienta con su agente; la de Claude Code, WayOfWork y run-in-cursor, las usa desde acá. Quedate con lo que te sirva."},{"q":"¿Dónde sigo después del taller?","a":"En el showcase de cada skill: un escenario por caso, con los comandos que corre y qué pasa si falla."},{"q":"Si algo cambia en una skill, ¿el episodio queda viejo?","a":"Cada episodio dice contra qué versión se escribió. Si la skill cambia, hay que revisarlo contra la versión nueva."}],"steps":[{"type":"ask","text":"¿Qué me llevo de run-in-cursor y de todo el taller?","source":"inferido","notes":"El último episodio: el cierre ata run-in-cursor con las herramientas del taller. No hay próximo episodio."},{"type":"say","md":"#### Lo que te llevás de run-in-cursor\n- **Cursor, desde acá:** `ric run` abre un `cursor-agent` interactivo dentro de `tmux` y espera el turno: cuenta como uso real, con turnos, modelo y tokens.\n- **Lo tuyo es tuyo:** las decisiones que Cursor pregunta y lo que se publica. `--deny` frena textos, no acciones.\n- **Siempre se cierra:** `ric quit`, para que Cursor mande el fin de la sesión.\n\n#### Lo que te llevás del taller\n- **El agente prepara, vos aprobás:** de la serie de Cursor a la de Claude Code, lo que escribe afuera (Jira, Confluence, un push) lo corrés vos, lo aprobás en una ventana, o das tu OK explícito en el chat y el agente escribe (local-board, auditing-repos, install-unified-ci).\n- **Medir, no especular:** lo que se afirma lleva evidencia, y lo que no se pudo verificar se rotula como tal.\n- **Una vez por máquina:** instalar es enlazar a un clon y comprobar que responde; las herramientas que faltan, como tmux, se instalan una vez.\n\n#### Fin del taller\nGracias por llegar hasta acá. Ahora te toca usarlo en tu repo.","source":"inferido","notes":"Cerramos el taller con tres ideas que se repitieron en todos los episodios: el agente prepara y la persona aprueba, se mide antes de afirmar, y todo se instala una vez. Y una frase corta de despedida. No hay próximo episodio: es el final de la serie.","pause":true}]}]},{"id":"antes-de-empezar","series":"cursor","order":0,"title":"Antes de empezar","pitch":{"ask":"¿Qué tengo que tener instalado antes del curso?","does":"Te da la lista de lo que hace falta y un comando que revisa todo y te dice qué falta y cómo arreglarlo."},"skill":{"repo":"skills-workshop","commit":"d22e011","date":"2026-10-19"},"workspace":{"repo":"mi-servicio"},"chapters":[{"id":"que-necesitas","title":"Qué necesitás","subtitle":"Una vez por máquina, antes del primer episodio","screen":"cursor-agent","faq":[{"q":"¿Tengo que saber programar para esto?","a":"No. Vas a copiar y pegar comandos en la terminal; cada episodio los muestra uno por uno y el comando de revisión te dice exactamente qué falta."},{"q":"¿Qué es brew?","a":"Homebrew: un instalador de programas para Mac que se usa desde la terminal. Con él se instala casi todo lo demás de la lista con un solo comando."},{"q":"¿Esto sirve en Windows o Linux?","a":"El taller está armado y probado en Mac. En otro sistema las herramientas existen, pero el comando de revisión y los pasos de instalación son para Mac."},{"q":"¿Me puede instalar algo que no quiero?","a":"No instala nada por su cuenta: revisa y te sugiere comandos, y lo que instales lo decidís vos. Podés correrlo todas las veces que quieras. La única excepción es de macOS: en una Mac nueva, al revisar git puede aparecer una ventana de Apple que ofrece instalar sus herramientas (ver «Verificarlo»)."}],"steps":[{"type":"ask","text":"¿Qué tengo que tener instalado antes del curso de skills?","source":"inferido","notes":"Arrancá contando para qué es este episodio: que nadie llegue al primer episodio y se trabe instalando. Es la pregunta que todos se hacen; dejá que se lea antes de seguir."},{"type":"say","md":"#### Lo que hace falta\n- **brew**: instala todo lo demás con un comando.\n- **git**: baja las skills desde GitHub.\n- **Python 3.9 o más**: varias skills están escritas en Python.\n- **uv**: corre esas skills con lo que necesitan.\n- **tmux**: algunas skills abren sesiones de terminal por su cuenta.\n- **jq**: lee archivos JSON desde la terminal.\n- **Cursor**: donde vas a usar las skills.\n- **Clave SSH en GitHub**: para bajar repos de la org sin contraseña.\n- **Acceso a la org**: para poder clonar los repos de las skills.","source":"inferido","pause":true,"notes":"No leas la lista de corrido: elegí dos o tres y contá para qué sirven en concreto. Remarcá que no hace falta entender cada herramienta, solo tenerla instalada. La clave SSH y el acceso a la org son lo que más se traba: avisá que si alguien no tiene acceso, lo pide a quien organiza."}]},{"id":"verificarlo","title":"Verificarlo","subtitle":"Un comando revisa todo","screen":"terminal","faq":[{"q":"¿Dónde consigo el archivo requisitos.sh y cómo lo corro?","a":"Viene adjunto en la invitación al curso. Guardalo en Descargas, abrí la Terminal (Cmd + Espacio, escribí «Terminal» y Enter), pegá el comando con Cmd + V y apretá Enter."},{"q":"Se guardó como «requisitos (1).sh» o en otra carpeta, ¿qué hago?","a":"No importa el nombre ni la carpeta: en la terminal escribí `bash ` (con el espacio), arrastrá el archivo desde el Finder a la ventana de la terminal y completá con el ` --repo …` de la invitación. Enter y listo."},{"q":"¿Qué es el repo que va después de --repo?","a":"Uno de los repos de la org que usa el curso. Si tu usuario de GitHub puede leerlo, ya tenés el acceso que hace falta."},{"q":"Me apareció una ventana de Apple para instalar herramientas, ¿la acepto?","a":"Sí. En una Mac nueva, revisar git hace que macOS ofrezca instalar sus «herramientas de línea de comandos»; hacen falta para el curso. Aceptá, esperá que termine y volvé a correr el comando."}],"steps":[{"type":"term","cmd":"bash ~/Downloads/requisitos.sh --repo josefigueredo/inherited-audit","out":["✓ Homebrew (brew)","✓ git","✓ Python 3.9 o más (python3)","✓ uv","✓ tmux","✓ jq","✓ Cursor","✓ Clave SSH cargada en GitHub","✓ Acceso al repo josefigueredo/inherited-audit","","Todo listo."],"source":"inferido","pause":true,"notes":"Contá que el archivo viene adjunto en la invitación y que se corre desde Descargas, copiando y pegando. Si el archivo quedó en otro lado o con otro nombre (por ejemplo «requisitos (1).sh»), escribí `bash ` y arrastrá el archivo a la terminal: macOS completa la ruta solo; después va el ` --repo …`. Avisá que en una Mac nueva puede saltar una ventana de Apple para instalar herramientas: se acepta. Mostrá que cada línea es una cosa de la lista anterior: ✓ quiere decir que está. Lo importante es la última línea: «Todo listo.» y ya pueden seguir. Salida inferida: es la del comando real corrido con todo instalado (el test la compara)."}]},{"id":"si-falta-algo","title":"Si falta algo","subtitle":"Cada ✗ trae su arreglo","screen":"terminal","faq":[{"q":"Me dice que falta brew, ¿qué hago?","a":"Entrá a brew.sh, copiá el comando que aparece arriba de todo, pegalo en la terminal y apretá Enter. Te va a pedir la contraseña de tu Mac. Al terminar, el instalador muestra un bloque «Next steps» con uno o dos comandos: copialos y corrélos también, si no la terminal no encuentra brew (el comando de revisión te lo avisa y te da el arreglo)."},{"q":"Me falla la clave SSH, ¿cómo la cargo?","a":"Seguí la guía de GitHub que te indica el ✗ (docs.github.com, «Connecting to GitHub with SSH»). Si te trabás, traé la máquina al curso 15 minutos antes y lo vemos juntos."},{"q":"Me dice que no tengo acceso al repo","a":"Pedile acceso a quien organiza el curso, con tu usuario de GitHub. No es algo que puedas arreglar desde tu máquina."},{"q":"Instalé lo que faltaba y sigue saliendo ✗","a":"Cerrá la terminal, abrí una nueva y volvé a correr el comando: algunas instalaciones recién se ven en una terminal nueva."}],"steps":[{"type":"term","cmd":"bash ~/Downloads/requisitos.sh --repo josefigueredo/inherited-audit","out":["✓ Homebrew (brew)","✓ git","✓ Python 3.9 o más (python3)","✗ uv — Corré: brew install uv","✓ tmux","✓ jq","✓ Cursor","✓ Clave SSH cargada en GitHub","✓ Acceso al repo josefigueredo/inherited-audit","","Falta 1 cosa."],"source":"inferido","pause":true,"notes":"Acá está el caso más común: falta una herramienta. Señalá la línea con ✗: dice qué falta y, después de la raya, el comando exacto para arreglarlo. No hay que buscar nada en internet. Salida inferida: la del comando real sin uv instalado (el test la compara)."},{"type":"term","cmd":"brew install uv","out":["==\u003e Fetching uv","==\u003e Pouring uv","==\u003e Summary"],"source":"inferido","notes":"Copiamos el comando que sugirió el ✗ y listo. Si alguien tiene miedo de romper algo, decí que brew solo agrega ese programa. Salida inferida y recortada: la real trae versiones y rutas que cambian en cada máquina."},{"type":"term","cmd":"bash ~/Downloads/requisitos.sh --repo josefigueredo/inherited-audit","out":["✓ Homebrew (brew)","✓ git","✓ Python 3.9 o más (python3)","✓ uv","✓ tmux","✓ jq","✓ Cursor","✓ Clave SSH cargada en GitHub","✓ Acceso al repo josefigueredo/inherited-audit","","Todo listo."],"source":"inferido","notes":"Remarcá el hábito: arreglo y vuelvo a correr el comando hasta ver «Todo listo.». Es el mismo ciclo que van a usar en todo el curso. Salida inferida: la del comando real con todo instalado (el test la compara)."}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que sigue","screen":"cursor-agent","faq":[{"q":"¿Qué pasa si llego al curso sin «Todo listo.»?","a":"Podés seguir los episodios mirando, pero no vas a poder hacer los pasos en tu máquina. Mejor llegar 15 minutos antes y resolverlo ahí."},{"q":"¿Tengo que instalar las skills ahora?","a":"No. Cada episodio empieza instalando su skill, paso a paso. Antes del curso solo hace falta lo de esta lista."},{"q":"¿Cuál es el primer episodio?","a":"inherited-audit: una skill que audita un sistema heredado, encuentra bugs y los prueba con tests."}],"steps":[{"type":"ask","text":"Ya me dice «Todo listo.». ¿Qué sigue?","source":"inferido","notes":"Cerrá con la idea clave: si el comando dice «Todo listo.», la máquina está preparada para todo el curso. Nadie tiene que instalar nada más por adelantado."},{"type":"say","md":"#### Próximo episodio: cómo funciona inherited-audit (`inherited-audit-como-funciona`)\nUnas diapositivas sobre qué resuelve la skill y cómo lo hace, con sus diagramas de secuencia, antes de verla andar: le pedís al agente que audite un sistema heredado y la skill **fija la base, busca bugs y los prueba con un test** antes de contarte nada.\n\nCada episodio arranca instalando su skill, así que no hace falta nada más.","source":"inferido","notes":"Anticipá el episodio 1 en una frase y cortá. Abajo va el texto de la invitación, listo para pegar en el mail o en Slack; adjuntá tools/requisitos.sh del repo del taller.\n\n--- Invitación ---\n¡Hola! Te anotaste en el taller de skills de team. Para aprovecharlo, antes del primer encuentro necesitás tener en tu Mac:\n\n- brew (Homebrew)\n- git\n- Python 3.9 o más\n- uv\n- tmux\n- jq\n- Cursor\n- Tu clave SSH cargada en GitHub\n- Acceso a los repos de la org (si no lo tenés, pedímelo con tu usuario de GitHub)\n\nPara revisar todo de una vez: guardá el archivo adjunto requisitos.sh en Descargas, abrí la Terminal (Cmd + Espacio, «Terminal») y pegá este comando:\n\nbash ~/Downloads/requisitos.sh --repo josefigueredo/inherited-audit\n\nSi el archivo quedó en otra carpeta o con otro nombre (por ejemplo «requisitos (1).sh»), escribí bash y un espacio, arrastrá el archivo a la ventana de la terminal y completá con --repo josefigueredo/inherited-audit. En una Mac nueva puede aparecer una ventana de Apple ofreciendo instalar herramientas: aceptala y volvé a correr el comando.\n\nCada línea con ✗ te dice qué falta y el comando para arreglarlo. Cuando la última línea diga «Todo listo.», ya estás. Si algo no sale, escribime o llegá 15 minutos antes y lo resolvemos juntos.\n\n¡Nos vemos en el taller!"}]}]},{"id":"inherited-audit-como-funciona","series":"cursor","order":1,"title":"inherited-audit: cómo funciona","pitch":{"ask":"Auditá este sistema antes de que empecemos: el back está en ~/w/api y el front en ~/w/web","does":"Fija el commit de cada repo, mide la suite, pregunta una sola vez qué workers faltan instalar y recorre el checklist hasta los dos reportes."},"skill":{"repo":"inherited-audit","commit":"27458c1","date":"2026-10-22"},"workspace":{"repo":"mi-servicio","model":"GPT-5.6 Terra"},"minutes":[1,5],"chapters":[{"id":"que-resuelve","title":"Qué resuelve","subtitle":"Heredaste un sistema y tenés que saber sobre qué estás parado","screen":"terminal","faq":[],"steps":[{"type":"page","title":"inherited-audit · 1 de 9","source":"inferido","notes":"Arrancá por el dolor, no por la herramienta: heredaste algo y vas a construir encima. Remarcá que sirve para cualquier forma de sistema y cualquier stack; lo que cambia es qué partes aplican.","html":"\u003c!doctype html\u003e\u003chtml lang=\"es\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eHeredaste un sistema que no construiste\u003c/title\u003e\u003cstyle\u003e\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#fff;color:#1d1d1f;\n  font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Helvetica Neue\",Helvetica,Arial,sans-serif}\n.s{height:100%;display:flex;flex-direction:column;padding:34px 56px 22px}\n.k{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#7a4fe0;font-weight:600}\nh1{margin:.25em 0 .1em;font-size:42px;line-height:1.1;letter-spacing:-.01em}\n.lead{margin:0 0 18px;font-size:21px;color:#3a3a3c;max-width:1180px;line-height:1.4}\n.body{flex:1;min-height:0;display:flex;flex-direction:column}\n.foot{display:flex;justify-content:space-between;font-size:12.5px;color:#a0a0a0;padding-top:10px;\n  border-top:1px solid #ececec;margin-top:12px}\ncode,.m{font-family:\"SF Mono\",Menlo,Monaco,monospace;font-size:.88em}\ncode{background:#f2f2f4;border-radius:5px;padding:.08em .35em}\nul{margin:0;padding-left:1.1em}li{margin:.35em 0}\n.grid{display:grid;g rid\" style=\"align-content:start\"\u003e\u003cdiv class=\"card cli\"\u003e\u003ch3\u003eLe decís al agente\u003c/h3\u003e\u003cp\u003e\u003ci\u003e«Auditá mi-servicio antes de que empecemos»\u003c/i\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003ch3\u003eNo es para\u003c/h3\u003e\u003cp\u003eRevisar un diff o un PR: para eso está \u003ccode\u003e/review-bugbot\u003c/code\u003e. Tampoco audita UI o accesibilidad, ni arregla lo que encuentra.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"foot\"\u003e\u003cspan\u003eFuente: \u003ccode\u003eskill/SKILL.md\u003c/code\u003e («When to use»), \u003ccode\u003edocs/showcase.md\u003c/code\u003e\u003c/span\u003e\u003cspan\u003e1 de 9\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/body\u003e\u003c/html\u003e\n"},{"type":"page","title":"inherited-audit · 2 de 9","source":"inferido","notes":"Lo que el equipo dueño recibe son pruebas, no opiniones: un test que falla por hallazgo. Y la fila roja es la que tranquiliza a seguridad: nada sale de tu máquina sin que vos lo decidas.","html":"\u003c!doctype html\u003e\u003chtml lang=\"es\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eQué entrega, y qué no hace nunca\u003c/title\u003e\u003cstyle\u003e\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#fff;color:#1d1d1f;\n  font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Helvetica Neue\",Helvetica,Arial,sans-serif}\n.s{height:100%;display:flex;flex-direction:column;padding:34px 56px 22px}\n.k{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#7a4fe0;font-weight:600}\nh1{margin:.25em 0 .1em;font-size:42px;line-height:1.1;letter-spacing:-.01em}\n.lead{margin:0 0 18px;font-size:21px;color:#3a3a3c;max-width:1180px;line-height:1.4}\n.body{flex:1;min-height:0;display:flex;flex-direction:column}\n.foot{display:fl inal","faq":[{"q":"¿Cuánto cuesta auditar un sistema?","a":"Una pasada sobre un módulo de 1.300 a 6.200 líneas gastó entre 120 y 540 mil tokens en nuestras mediciones; el total depende de cuántos módulos y pasadas tenga el sistema."}],"steps":[{"type":"page","title":"inherited-audit · 8 de 9","source":"inferido","notes":"Datos medidos hoy, no estimados: 14 corridas con GPT-5.6 Terra en Cursor. El costo lo marcan las vueltas del agente, no solo las líneas. Por eso la skill parte el sistema en módulos: entre 1.300 y 6.200 líneas por subagente se paga lo mínimo por línea y se lee todo. Ojo: es una máquina con otras skills globales cargadas, que también suman al piso; y la mayor parte es caché, que se cobra más barata.","html":"\u003c!doctype html\u003e\u003chtml lang=\"es\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eCuántos tokens procesa una pasada, según el tamaño del módulo\u003c/title\u003e\u003cstyle\u003e\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#fff;color:#1d1d1f;\n  font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Helvetica Neue\",Helvetica,Arial,sans-serif}\n.s{height:100%;display:flex;flex-direction:column;padding:34px 56px 22px}\n.k{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#7a4fe0;font-weight:600}\nh1{margin:.25em 0 .1em;font-size:42px;line-height:1.1;letter-spacing:-.01em}\n.lead{margin:0 0 18px;font-size:21px;color:#3a3a3c;max-width:1180px;line-height:1.4}\n.body{flex:1;min-height:0;display:flex;flex-direction:column}\n.foot{display:flex;justify-content:space-between;font-size:12.5px;color:#a0a0a0;padding-top:10px;\n  border-top:1px solid #ececec;margin-top:12px}\ncode,.m{font-family:\"SF Mono\",Menlo,Monaco,monospace;font-size:.88em}\ncode{background:#f2f2f4;border-radius:5px;padding:.08em .35em}\nul{margin:0;padding-left:1.1em}li{margin:.35em 0}\n.grid{display:grid;gap:18px}\n.ca 003c/h3\u003e\u003cp\u003eCada llamada a una herramienta suma ~8.600 tokens (R² 0,90). Muchos archivos chicos cuestan más que pocos grandes.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"card\" style=\"background:#e6f4f1;border-color:#bfe3da\"\u003e\u003ch3 style=\"color:#145246\"\u003e1.300 a 6.200 líneas por subagente\u003c/h3\u003e\u003cp\u003e54 a 123 tokens por línea y el módulo leído entero. Con 12.357, una de dos corridas dejó archivos sin leer.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"foot\"\u003e\u003cspan\u003eFuente: medido el 2026-10-22 con \u003ccode\u003egpt-5.6-terra-medium\u003c/code\u003e en \u003ccode\u003ecursor-agent\u003c/code\u003e, pasada \u003ccode\u003ecorrectness-general\u003c/code\u003e en solo lectura, 2 corridas por tamaño (\u003ccode\u003eworkshop/slides/tokens.json\u003c/code\u003e)\u003c/span\u003e\u003cspan\u003e8 de 9\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/body\u003e\u003c/html\u003e\n"},{"type":"page","title":"inherited-audit · 9 de 9","source":"inferido","notes":"Cerrá con los límites, dichos por la propia skill: protege de publicar sin querer y de citas inventadas; no decide qué le importa a tu equipo.","html":"\u003c!doctype html\u003e\u003chtml lang=\"es\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003eQué te protege y qué no\u003c/title\u003e\u003cstyle\u003e\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#fff;color:#1d1d1f;\n  font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Helvetica Neue\",Helvetica,Arial,sans-serif}\n.s{height:100%;display:flex;flex-direction:column;padding:34px 56px 22px}\n.k{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#7a4fe0;font-weight:600}\nh1{margin:.25em 0 .1em;font-size:42px;line-height:1.1;letter-spacing:-.01em}\n.lead{margin:0 0 18px;font-size:21px;color:#3a3a3c;max-width:1180px;l e\u003epublish\u003c/code\u003e solo deja los comandos escritos\u003c/td\u003e\u003ctd\u003eLas ramas y los reportes quedan en tu máquina: dónde los compartís lo decidís vos\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003einit\u003c/code\u003e y \u003ccode\u003ehygiene\u003c/code\u003e se niegan a dejar la corrida donde git la pueda commitear\u003c/td\u003e\u003ctd\u003eSi copiás un reporte a mano adentro de un repo, nada lo impide\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ecite-check\u003c/code\u003e confirma que cada cita existe en el commit fijado\u003c/td\u003e\u003ctd\u003eQue la cita exista no prueba el hallazgo: eso lo hacen el test rojo, el contraste y la verificación\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ehygiene\u003c/code\u003e busca secretos e ids de 40 caracteres en ramas y salidas\u003c/td\u003e\u003ctd\u003eEs una búsqueda por patrones: un secreto con un formato desconocido puede pasar\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLo \u003ccode\u003eunverified\u003c/code\u003e no entra en los reportes\u003c/td\u003e\u003ctd\u003eEl filtro aplica una regla; no juzga si un hallazgo confirmado le importa a tu equipo\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"foot\"\u003e\u003cspan\u003eFuente: \u003ccode\u003edocs/showcase.md\u003c/code\u003e («Qué te protege y qué no»)\u003c/span\u003e\u003cspan\u003e9 de 9\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/body\u003e\u003c/html\u003e\n"}]},{"id":"cierre","title":"Cierre","subtitle":"Ahora, verla andar","screen":"cursor-agent","steps":[{"type":"say","source":"inferido","md":"#### Próximo episodio: inherited-audit\nLa misma skill, de punta a punta en Cursor: la instalás, le pedís que audite `mi-servicio` y ves **cómo prueba un bug con un test que falla** y arma los dos reportes.","notes":"Pasá a la demo: todo lo que vieron en las diapositivas aparece ahí con salida real."}]}]},{"id":"inherited-audit","series":"cursor","order":1,"title":"inherited-audit","pitch":{"ask":"Auditá este sistema antes de que empecemos: el back está en ~/w/api y el front en ~/w/web","does":"Fija el commit de cada repo, mide la suite, pregunta una sola vez qué workers faltan instalar y recorre el checklist hasta los dos reportes."},"skill":{"repo":"inherited-audit","commit":"79ac771","date":"2026-10-22"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Agregar endpoint de pagos","age":"2d"}],"model":"GPT-5.6 Terra"},"minutes":[6,12],"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina","screen":"terminal","faq":[{"q":"¿Puedo pedirle al agente que la instale?","a":"Sí. En Cursor decile «Instalá la skill inherited-audit desde ~/skills/inherited-audit» y corre el mismo install.sh. Lo mostramos en la terminal para que veas qué hace."},{"q":"¿Por qué el --cursor?","a":"Para que la skill quede en ~/.cursor/skills, la carpeta de skills de Cursor. Va en un solo lugar: si el instalador la encuentra también en otra carpeta que Cursor lee, avisa, porque Cursor la cargaría dos veces."},{"q":"¿Instala algo más en mi máquina?","a":"No. Solo crea un enlace a la carpeta skill/ del clon. Python y git ya los tenés del episodio 0; el resto de las herramientas son opcionales y la skill te pregunta antes."},{"q":"Abrí Cursor y no encuentra la skill","a":"Cerrá el chat (o Cursor) y abrilo de nuevo: una sesión que ya estaba abierta no ve skills nuevas."}],"steps":[{"type":"term","cmd":"git clone git@github.com:josefigueredo/inherited-audit.git skills/inherited-audit","out":["Cloning into 'skills/inherited-audit'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos la skill. Es un git clone común, a la carpeta skills de tu usuario; si ya hiciste el episodio 0, la clave SSH y el acceso a la org ya andan. Paso inferido: necesita red, la salida es la de git."},{"type":"term","cmd":"~/skills/inherited-audit/install.sh --cursor","out":["skill: ~/.cursor/skills/inherited-audit -\u003e ~/skills/inherited-audit/skill"],"source":"real","cwd":"~","notes":"Esta es toda la instalación. Remarcá que no copia nada: deja un enlace a la carpeta skill/ del clon, así que cuando actualizás el clon con git pull, la skill se actualiza sola.","pause":true},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py --help | head -4","out":["usage: ia [-h] \u003ccommand\u003e ...","","ia: pin the base of an inherited-system audit, track a resumable run, check","citations, branches and hygiene, render reports."],"source":"real","cwd":"~","notes":"Comprobamos que quedó instalada. ia.py es la parte mecánica de la skill: fija la base, guarda hallazgos, revisa y arma los reportes. Nunca llama a un modelo. No hace falta aprenderse los comandos: los corre el agente."}]},{"id":"caso-principal","title":"Caso principal","subtitle":"De un pedido a los dos reportes","screen":"cursor-full","faq":[{"q":"¿Cuánto tarda una auditoría de verdad?","a":"Horas, en un sistema real. Lo que ves está comprimido. Como todo el estado vive en la carpeta de la corrida, se puede cortar y retomar al otro día (lo vemos en «Retomar»)."},{"q":"¿Me toca algo el código del sistema?","a":"No. No arregla nada: cada bug confirmado queda en una rama local con un test que falla y la propuesta escrita. Tu rama main queda igual, y nunca hace push, ni PR, ni issues."},{"q":"¿Y el front?","a":"Se suma con otro repo en el pedido («el front está en …»). La skill audita front y back juntos; acá usamos solo la API para que el ejemplo entre en pocos minutos."},{"q":"¿Por qué los reportes no quedan adentro del repo?","a":"Porque pueden tener hallazgos de seguridad. La skill se niega a escribirlos donde git los pueda commitear, para que no terminen en el remoto por accidente."}],"steps":[{"type":"ask","text":"Auditá mi-servicio antes de que empecemos. El back está en ~/mi-servicio/api; dejá la corrida en ~/auditorias/mi-servicio.","source":"inferido","notes":"El pedido entero es una frase, como se la dirías a alguien del equipo. Los comandos y el orden los trae la skill. Esto es lo que queremos que adopten: pedir la auditoría así antes de construir sobre algo heredado. La placa del principio muestra el ejemplo del README (back y front); acá usamos mi-servicio y solo la API, para que entre en pocos minutos."},{"type":"tool","label":"Read · ~/.cursor/skills/inherited-audit/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue un checklist fijo, no improvisa."},{"type":"say","md":"Estoy en **Cursor**, así que uso sus workers.\n\nUna sola pregunta antes de arrancar: ¿querés que al final deje escritos los textos de issues y PRs (`publish`)? Viene apagado, y aunque lo prendas los publicás vos, nunca yo.","source":"inferido","notes":"Remarcá el «nunca yo»: la skill no publica nada en ningún lado.","pause":true},{"type":"ask","text":"No, dejalo apagado.","source":"inferido","notes":"La persona decide; la skill pregunta una vez y no vuelve a preguntar."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py init --system mi-servicio --repo API=~/mi-servicio:api --host cursor --out ~/auditorias/mi-servicio","out":["~/auditorias/mi-servicio","added alias ROOT for the repo root of ~/mi-servicio: cite its root-level files (Dockerfile, .github/...) as ROOT/\u003cpath\u003e"],"source":"real","cwd":"~","notes":"En el chat ves cada comando que corre el agente, con su salida real. init fija el commit: todo lo que se diga después se cita contra ese commit. La corrida queda en ~/auditorias, fuera del repo."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py detect --run mi-servicio","out":["API: python  test: python3 -m unittest discover -s tests  deps: none","API: 1 modules","ROOT: 1 modules","missing workers (never installed without asking):","  [cursor] static: semgrep  -\u003e  brew install semgrep  (fallback: references/passes/supply-chain-container.md)","  [cursor] static: gitleaks  -\u003e  brew install gitleaks  (fallback: references/passes/supply-chain-container.md)","  [cursor] static: osv-scanner  -\u003e  brew install osv-scanner  (fallback: references/passes/supply-chain-container.md)","  [cursor] contrast: agent -p --mode ask --model \u003cother-model\u003e --output-format json  -\u003e  (no install command)  (fallback: references/passes/contrast.md)"],"source":"real","cwd":"~/auditorias","notes":"detect mira qué hay y qué falta. Fijate el título de la lista: «nunca se instalan sin preguntar»."},{"type":"say","md":"Te pregunto **una sola vez**. Faltan estos workers:\n- `brew install semgrep`, `brew install gitleaks` y `brew install osv-scanner`: análisis estático\n- el CLI `agent` de Cursor: el contraste con un modelo de otra familia\n- `/add-plugin superpowers`: tests unitarios\n- `/add-plugin` de wshobson/agents (marketplace de Cursor 2.5+): calidad\n\nLos dos plugins no los puede revisar `detect`; los busqué en esta sesión y no están. Lo que no instales lo cubre una pasada propia de la skill durante toda la corrida. ¿Instalo alguno?","source":"inferido","notes":"Es la única pregunta sobre herramientas en toda la corrida, con el comando exacto de cada una; los plugins de Cursor los revisa el agente, porque detect no puede. Si decís que no, la skill no se traba: usa su propia pasada. Funciona con lo que ya tenés.","pause":true},{"type":"ask","text":"No instales nada. Y los tests nuevos (el paso 1.5) dejalos para otra sesión: hoy quiero los reportes.","source":"inferido","notes":"La persona dirige: puede dejar pasos para después. Este paso pendiente es el que retomamos más adelante."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py baseline --run mi-servicio","out":["API: unittest  passed: 7  failed: 0  total: 7  exit: 0  output: outputs/baseline-API.txt"],"source":"real","cwd":"~/auditorias","notes":"La base: los tests que ya existían, en el commit fijado. 7 de 7 pasan."},{"type":"tool","label":"Ran · /review-bugbot, races-distributed y security · API/mi_servicio","source":"inferido","notes":"Trabajan los workers: el revisor de bugs de Cursor y dos pasadas propias, carreras y seguridad. La skill dirige la obra; los workers la construyen."},{"type":"term","cmd":"for f in candidatos/c-*.json; do python3 ~/.cursor/skills/inherited-audit/ia.py finding add --run mi-servicio \"$f\"; done","out":["C-01","C-02"],"source":"real","cwd":"~/auditorias","notes":"El agente carga lo que devolvieron: C-01 y C-02. Todavía son candidatos, no hallazgos. (En la demo, esos archivos los arma demo/prep/inherited-audit.sh; el comando y la salida son reales.)"},{"type":"tool","label":"Ran · subagente de prueba en su propio worktree · C-01","source":"inferido","notes":"Lo que más distingue a la skill: cada candidato se prueba con un test, en una copia aparte del repo (un worktree), así tu copia de trabajo no se toca."},{"type":"term","cmd":"python3 -m unittest tests.test_discount_cap 2\u003e\u00261 | tee ~/auditorias/mi-servicio/outputs/C-01-red.txt","out":["F","======================================================================","FAIL: test_a_discount_over_100_never_makes_the_total_negative (tests.test_discount_cap.DiscountCapTest.test_a_discount_over_100_never_makes_the_total_negative)","----------------------------------------------------------------------","Traceback (most recent call last):","  File \"~/auditorias/wt-c-01/api/tests/test_discount_cap.py\", line 12, in test_a_discount_over_100_never_makes_the_total_negative","    self.assertGreaterEqual(orders.order_total(\"C1\", discount_pct=150), 0)","    ~~~~~~~~~~~~~~~~~~~~~~~^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^","AssertionError: -50.0 not greater than or equal to 0","","----------------------------------------------------------------------","Ran 1 test in 0.000s","","FAILED (failures=1)"],"source":"real","cwd":"~/auditorias/wt-c-01/api","notes":"El test rojo, en la copia aparte. Señalá AssertionError: con 150% de descuento el total da -50. Falla por una aserción, no por un error de configuración: «rojo por la razón correcta». Un bug probado así no se discute. C-01 queda confirmado con la propuesta de arreglo escrita, sin aplicarla; C-02 no se pudo probar y queda afuera.","pause":true},{"type":"tool","label":"Ran · subagente · quality-lenses · API/mi_servicio","source":"inferido","notes":"Calidad y arquitectura: acá no hay tests, hay sugerencias concretas. Encontró Q-01: la documentación de la paginación dice una cosa y el código hace otra."},{"type":"tool","label":"Ran · subagente nuevo · contraste con Sonnet 5.5 High · solo lectura","source":"inferido","notes":"Segunda mirada: un modelo de otra familia revisa cada hallazgo sin poder tocar nada. Como no está el CLI agent, la skill usa su pasada propia en un subagente nuevo, con Sonnet 5.5 High: de otra familia que GPT-5.6 Terra, que escribió los hallazgos. El reporte dice quién contrastó a quién. La verificación extra es solo para lo de severidad alta, y acá no hay nada alto."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py filter --run mi-servicio","out":["correctness: showing 1 of 2","quality: showing 1 of 1","start here: Q-01"],"source":"real","cwd":"~/auditorias","notes":"El filtro: 1 de 2 en correctitud, 1 de 1 en calidad. Lo no probado no entra, y el reporte lo dice: «se muestran N de M»."},{"type":"tool","label":"Ran · prosa para el equipo dueño","source":"inferido","notes":"Cada hallazgo se reescribe para el equipo dueño: sin jerga y sin culpas."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py hygiene --run mi-servicio","out":["hygiene: clean"],"source":"real","cwd":"~/auditorias","notes":"Higiene: ni secretos ni nada que git pueda commitear. Limpio."},{"type":"term","cmd":"python3 ~/.cursor/skills/inherited-audit/ia.py cite-check --run mi-servicio","out":["all 3 citations resolve"],"source":"real","c ;color:var(--accent)}\n\n/* severity badge */\n.verdict{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.03em;text-transform:uppercase}\n.verdict.high{background:var(--high-bg);color:var(--high)}\n.verdict.medium{background:var(--medium-bg);color:var(--medium)}\n.verdict.low{background:var(--low-bg);color:var(--low)}\n.verdict.na{background:var(--line);color:var(--muted)}\n.sev{margin:-4px 0 10px}\n\n/* finding card */\n.issue{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:20px 0;box-shadow:var(--shadow)}\n.issue header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.issue header h3{margin:0}\n.issue-n{font:700 14px ui-monospace,Menlo,monospace;background:var(--ink);color:var(--panel);border-radius:6px;padding:2px 8px}\n.issue h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 0 6px}\n.meta{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:13px;color:var(--muted);margin:10px 0 0}.meta dt{font-weight:600}.meta dd{margin:0}\nfigure.code{margin:8px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}\nfigure.code figcaption{font:12px ui-monospace,Menlo,monospace;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);background:var(--code-bg);margin:0}\nfigure.code pre{margin:0;padding:8px 0;border:0;border-radius:0;overflow-x:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);color:var(--ink)}\nfigure.code pre span{display:block;padding:0 12px;white-space:pre}pre .ln i{display:inline-block;width:3.5em;color:var(--muted);font-style:normal;user-select:none}\npre .hl{background:var(--hl)}pre .add{background:var(--add)}pre .del{background:var(--del)}pre .hunk{color:var(--muted)}pre .file{font-weight:700;padding-top:6px}\n.out pre{padding:8px 12px;white-space:pre}.out.red figcaption{color:var(--red)}.out.green figcaption{color:var(--green)}\npre.cmd{font:12.5px/1.5 ui-monospace,Menlo,monospace;padding:8px 10px;white-space:pre;overflow-x:auto}\n.nota{font-size:14px;color:var(--muted)}\n.aviso{color:var(--medium)}\n.tests td:first-child{word-break:break-all}\n.issue p,.issue li,.issue dd,.callout{overflow-wrap:anywhere}\n\n@media (max-width:900px){\n  .layout{grid-template-columns:1fr}\n  nav.side{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line)}\n  nav.side ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}\n  nav.side ol ol{display:none}\n  nav.side .side-foot{position:static;margin-top:18px}\n}\n@media (max-width:640px){.meta{grid-template-columns:1fr}.issue{padding:16px 14px}}\n@media print{nav.side{display:none}.layout{display:block}.issue{break-inside:avoid-page}}\n\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"layout\"\u003e\n\u003cnav class=\"side\" aria-label=\"Índice\"\u003e\n  \u003cdiv class=\"brand\"\u003emi-servicio\u003csmall\u003eauditoría de sistema heredado\u003c/small\u003e\u003c/div\u003e\n  \u003col id=\"toc\"\u003e\n    \u003cli\u003e\u003ca href=\"#summary\"\u003eEn una pantalla\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\"#cat-pedidos\"\u003epedidos\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\"#how\"\u003eCómo se hizo\u003c/a\u003e\u003c/li\u003e\n  \u003c/ol\u003e\n  \u003cdiv class=\"side-foot\"\u003e\u003cdiv class=\"foot-row\"\u003e\u003cspan class=\"ver\"\u003eGenerado el 2026-10-22 con ia.py render\u003c/span\u003e\n    \u003cbutton class=\"theme-toggle\" type=\"button\" title=\"Cambiar tema\" aria-label=\"Cambiar tema\"\u003e\u0026#9680;\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\n\u003c/nav\u003e\n\u003cmain\u003e\n\u003cheader class=\"hero\"\u003e\n  \u003ch1\u003eHallazgos de corrección en mi-servicio\u003c/h1\u003e\n  \u003cp\u003eRevisión de API, ROOT sobre la base fijada. Cada hallazgo trae el código afectado en esa base y, cuando se pudo probar, un test que falla en esa base y una propuesta escrita de corrección.\u003c/p\u003e\n\u003c/header\u003e\n\u003csection id=\"summary\"\u003e\n\u003ch2\u003eEn una pantalla\u003c/h2\u003e\n\u003cdiv class=\"cards kpis\"\u003e\n\u003cdiv class=\"card\"\u003e\u003cp class=\"kpi-n\"\u003e1\u003c/p\u003e\u003cp\u003ehallazgos en este informe\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"card\"\u003e\u003cp class=\"kpi-n\"\u003e0\u003c/p\u003e\u003cp\u003ede severidad alta\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"card\"\u003e\u003cp class=\"kpi-n\"\u003e1\u003c/p\u003e\u003cp\u003ecategorías\u003c/p\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cp class=\"lead\"\u003eSe muestran 1 de 2. Los demás quedaron afuera por el filtro del equipo dueño: sin confirmar, refutados por el contraste o fuera de alcance.\u003c/p\u003e\n\u003cdiv class=\"callout info\"\u003e\u003cstrong\u003eCómo leer este informe\u003c/strong\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003eSeveridad\u003c/b\u003e, con un criterio fijo. \u003cb\u003eAlta:\u003c/b\u003e expone datos o credenciales a quien no debería, corrompe datos, o rompe una función entera. \u003cb\u003eMedia:\u003c/b\u003e produce un resultado incorrecto que se nota, o expone información menor. \u003cb\u003eBaja:\u003c/b\u003e robustez, observabilidad o una inconsistencia visible sin pérdida.\u003c/li\u003e\u003cli\u003e\u003cb\u003eTest en rojo:\u003c/b\u003e «falla en la base» dice cuántos casos del test fallan sobre la base fijada; la rama del hallazgo trae solo ese test. Los links llevan a las líneas citadas en la base fijada.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eHallazgo\u003c/th\u003e\u003cth\u003eCategoría\u003c/th\u003e\u003cth\u003eSeveridad\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eC-01\u003c/td\u003e\u003ctd\u003e\u003ca href=\"#f-c-01\"\u003eUn descuento de más del 100% deja el total del pedido negativo\u003c/a\u003e\u003c/td\u003e\u003ctd\u003epedidos\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"verdict medium\"\u003emedia\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003csection id=\"cat-pedidos\" class=\"cat\" data-category=\"pedidos\"\u003e\n\u003ch2\u003epedidos\u003c/h2\u003e\n\u003carticle class=\"issue\" id=\"f-c-01\"\u003e\n\u003cheader\u003e\u003cspan class=\"issue-n\"\u003eC-01\u003c/span\u003e\u003ch3\u003eUn descuento de más del 100% deja el total del pedido negativo\u003c/h3\u003e\u003cspan class=\"verdict medium\"\u003emedia\u003c/span\u003e\u003c/header\u003e\n\u003cdl class=\"meta\"\u003e\u003cdt\u003eCategoría\u003c/dt\u003e\u003cdd\u003epedidos\u003c/dd\u003e\u003cdt\u003eConfianza\u003c/dt\u003e\u003cdd\u003eprobado al ejecutarlo\u003c/dd\u003e\u003cdt\u003eRama\u003c/dt\u003e\u003cdd\u003e\u003ccode\u003efix/c-01-descuento-sin-tope\u003c/code\u003e\u003c/dd\u003e\u003c/dl\u003e\n\u003ch4\u003eQué pasa\u003c/h4\u003e\u003cp\u003eSi un pedido recibe un descuento mayor al 100%, el total queda por debajo de cero.\u003c/p\u003e\n\n\u003ch4\u003eEvidencia en la base\u003c/h4\u003e\n\u003cfigure class=\"code\"\u003e\u003cfigcaption\u003e\u003ccode\u003eAPI/mi_servicio/orders.py:12-16\u003c/code\u003e · no hay tope en discount_pct\u003c/figcaption\u003e\u003cpre\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e9\u003c/i\u003e    return ORDERS[order_id]\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e10\u003c/i\u003e\u003c/span\u003e\u003cspan class=\"ln\"\u003e\u003ci\u003e11\u003c/i\u003e\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e12\u003c/i\u003edef order_total(order_id, discount_pct=0):\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e13\u003c/i\u003e    \u0026quot;\u0026quot;\u0026quot;Total of an order after a percentage discount.\u0026quot;\u0026quot;\u0026quot;\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e14\u003c/i\u003e    order = ORDERS[order_id]\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e15\u003c/i\u003e    gross = sum(price * qty for price, qty in order[\u0026quot;items\u0026quot;])\u003c/span\u003e\u003cspan class=\"ln hl\"\u003e\u003ci\u003e16\u003c/i\u003e    return gross - gross * discount_pct / 100\u003c/span\u003e\u003c/pre\u003e\u003c/figure\u003e\n\u003ch4\u003eReproducción\u003c/h4\u003e\n\u003cp\u003eorder_total() da -50.0 con 150% de descuento\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable class=\"tests\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eArchivo\u003c/th\u003e\u003cth\u003eFalla en la base\u003c/th\u003e\u003cth\u003eNota\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eapi/tests/test_discount_cap.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e1 of 1 fail\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4\u003ePropuesta\u003c/h4\u003e\u003cp\u003eLimitar el descuento entre 0 y 100 antes de calcular el total.\u003c/p\u003e\n\u003c/article\u003e\n\u003c/section\u003e\n\u003csection id=\"how\"\u003e\n\u003ch2\u003eCómo se hizo\u003c/h2\u003e\n\u003cp\u003eSe leyó cada repo en un commit fijo; todo lo citado sale de ese commit, no del árbol de trabajo.\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eRepo\u003c/th\u003e\u003cth\u003eBase\u003c/th\u003e\u003cth\u003eRemoto\u003c/th\u003e\u003cth\u003eCarpeta\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eAPI\u003c/td\u003e\u003ctd\u003e\u003ccode title=\"8151c7c7d1a409a17bdb058f27bc878250be75d1\"\u003e8151c7c\u003c/code\u003e\u003c/td\u003e\u003ctd\u003esin remoto\u003c/td\u003e\u003ctd\u003eapi\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eROOT\u003c/td\u003e\u003ctd\u003e\u003ccode title=\"8151c7c7d1a409a17bdb058f27bc878250be75d1\"\u003e8151c7c\u003c/code\u003e\u003c/td\u003e\u003ctd\u003esin remoto\u003c/td\u003e\u003ctd\u003e-\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eQuién revisó cada paso: las herramientas externas por nombre y, si no hubo, la revisión propia.\u003c/p\u003e\n\u003cp\u003eModelo autor: \u003ccode\u003eGPT-5.6 Terra\u003c/code\u003e\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePaso\u003c/th\u003e\u003cth\u003eQuién lo hizo\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003ecorrección\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"who\"\u003e/review-bugbot\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ecalidad\u003c/td\u003e\u003ctd\u003erevisión propia\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003econtraste\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"who\"\u003eSonnet 5.5 High\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eUn segundo modelo revisó cada hallazgo; si es de la misma familia que el autor, el contraste vale menos y se dice.\u003c/p\u003e\n\u003cdiv class=\"tbl\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eModelo de contraste\u003c/th\u003e\u003cth\u003eFamilia\u003c/th\u003e\u003cth\u003eVeredicto\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ca href=\"#f-c-01\"\u003eC-01\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eSonnet 5.5 High\u003c/code\u003e\u003c/td\u003e\u003ctd\u003emisma familia: no\u003c/td\u003e\u003ctd\u003ecoincide\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eLo que pasó el filtro:\u003c/p\u003e\u003cul\u003e\u003cli\u003eCorrección: se muestran 1 de 2\u003c/li\u003e\u003cli\u003eCalidad: se muestran 1 de 1\u003c/li\u003e\u003c/ul\u003e\n\u003cp class=\"nota\"\u003eLos demás quedaron afuera por el filtro del equipo dueño: sin confirmar, refutados por el contraste o fuera de alcance.\u003c/p\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n(function () {\n  var root = document.documentElement;\n  var btn = document.querySelector(\".theme-toggle\");\n  try { var saved = localStorage.getItem(\"ia-theme\"); if (saved) { root.setAttribute(\"data-theme\", saved); } } catch (e) {}\n  if (btn) {\n    btn.addEventListener(\"click\", function () {\n      var dark = root.getAttribute(\"data-theme\") === \"dark\" ||\n        (!root.getAttribute(\"data-theme\") \u0026\u0026 window.matchMedia(\"(prefers-color-scheme: dark)\").matches);\n      var next = dark ? \"light\" : \"dark\";\n      root.setAttribute(\"data-theme\", next);\n      try { localStorage.setItem(\"ia-theme\", next); } catch (e) {}\n    });\n  }\n  var links = Array.prototype.slice.call(document.querySelectorAll(\"#toc \u003e li \u003e a\"));\n  if (!(\"IntersectionObserver\" in window) || !links.length) { return; }\n  var byId = {};\n  links.forEach(function (a) { byId[a.getAttribute(\"href\").slice(1)] = a; });\n  var obs = new IntersectionObserver(function (entries) {\n    entries.forEach(function (en) {\n      if (en.isIntersecting \u0026\u0026 byId[en.target.id]) {\n        links.forEach(function (a) { a.classList.remove(\"active\"); });\n        byId[en.target.id].classList.add(\"active\");\n      }\n    });\n  }, { rootMargin: \"0px 0px -70% 0px\" });\n  Object.keys(byId).forEach(function (id) { var el = document.getElementById(id); if (el) { obs.observe(el); } });\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"type":"page","title":"~/auditorias/mi-servicio/mi-servicio-quality.html","source":"real","capture":"~/auditorias/mi-servicio/mi-servicio-quality.html","notes":"El de cali
