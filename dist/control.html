decisiones/adr-001.md  'ADR 001: usar colas'","UPDATE    docs/runbook.md  'Runbook de despliegue'","1 update, 4 unchanged","plan written to ctk-plan.json"],"source":"inferido","cwd":"~/mi-servicio","notes":"Este es el comando central. ctk plan lee Confluence, compara con tus archivos y escribe un plan en ctk-plan.json. No escribe nada en Confluence. Cada línea es una acción: UPDATE es una página cuyo origen cambió, UNCHANGED es nada que hacer. Acá una sola página cambia y las otras cuatro siguen igual. Inferido porque lee un Confluence real."},{"type":"term","cmd":"ctk diff","out":["UPDATE docs/runbook.md  'Runbook de despliegue'  (page 5014)","--- confluence","+++ local","@@ -1,2 +1,2 @@"," \u003ch2\u003eDespliegue\u003c/h2\u003e","-\u003cp\u003eCorré el job a mano.\u003c/p\u003e","+\u003cp\u003eCorré el job desde el pipeline.\u003c/p\u003e"],"source":"inferido","cwd":"~/mi-servicio","notes":"El diff es el paso que casi nadie conoce y el que da tranquilidad. Muestra el lado de Confluence contra lo que publicaría tu repo: el signo menos es lo que hoy está en Confluence, el más es lo que va a quedar. Se imprime acá y no se guarda en ningún lado. Lo leés como un control de cambios de un documento."},{"type":"say","md":"Se publicaría **una sola página**: `docs/runbook.md`, que pasa de «Corré el job a mano» a «Corré el job desde el pipeline». Las otras **4 páginas no cambian**.\n\nHasta acá no escribí nada en Confluence. **¿Lo publico?**","source":"inferido","notes":"Mirá cómo cierra el agente: resume en una frase, dice qué no tocó y pregunta. La skill exige mostrar las filas y esperar tu visto bueno antes de aplicar. Tu sí en el chat habilita el comando, pero todavía no aprueba nada."},{"type":"ask","text":"Dale, publicalo.","source":"inferido","notes":"Ese es el visto bueno. Recién ahora el agente puede ir al comando que escribe."},{"type":"say","md":"Voy a correr el comando que **escribe en Confluence**. **Se va a abrir una ventana** con la página que se actualiza y los botones **Cancelar** y **Apruebo 1**.\n\nLa aprobación es tu clic en esa ventana: mi pregunta de recién no cuenta, y yo no puedo tocarla. Si cancelás o la cerrás, no lo vuelvo a correr salvo que me lo pidas.","source":"inferido","notes":"Este aviso es parte de la regla de la skill: antes de lanzar ctk apply, el agente avisa que se abre una ventana y qué va a aprobarse. Y que vos tenés que estar adelante de la pantalla. Si no estás, deja el comando listo para que lo corras vos. Remarcá la última frase: si cancelás, no insiste.","pause":true},{"type":"approve","title":"Publicar en Confluence","lines":["docs/runbook.md · 'Runbook de despliegue' · UPDATE · página 5014, título actual en Confluence: Runbook de despliegue","Aprobás con un clic en Apruebo 1. Escape, Return o Cancelar no escriben nada. Se cancela sola a los 100 s."],"button":"Apruebo 1","source":"inferido","notes":"La ventana nativa de macOS, con una tarjeta por página: ruta, título y el cambio. Para una página que ya existe, además, muestra su id y su título actual leídos justo antes de abrirla, para que un plan que nombra una página y apunta a otra no pueda pasar como inocente. Es lo que tenés que mirar antes de hacer clic, y recordá que Return no aprueba: solo el clic. Inferida: no se puede capturar sin una persona.","pause":true},{"type":"term","cmd":"ctk apply ctk-plan.json","out":["UNCHANGED docs/arquitectura/index.md  'Arquitectura del servicio'","UNCHANGED docs/arquitectura/componentes.md  'Componentes'","UNCHANGED docs/arquitectura/decisiones  'Decisiones'","UNCHANGED docs/arquitectura/decisiones/adr-001.md  'ADR 001: usar colas'","UPDATE    docs/runbook.md  'Runbook de despliegue'","1 update, 4 unchanged","done    UPDATE docs/runbook.md"],"source":"inferido","cwd":"~/mi-servicio","notes":"Con tu clic, apply ejecuta exactamente ese plan y dice qué hizo con cada página. Antes de escribir vuelve a comprobar que la página sigue siendo de este repo y que nadie la editó después del plan; si algo cambió, esa acción falla y hay que planificar de nuevo. Inferido: escribe en Confluence."},{"type":"worked","seconds":27,"source":"inferido","notes":"El tiempo del agente, sin contar lo que tardaste vos en revisar y aprobar."},{"type":"say","md":"Listo: **`docs/runbook.md` ya está actualizado en Confluence**, con el cambio que revisamos.\n\n#### Qué quedó\n- **En Confluence:** la página nueva versión, con el estado de la sincronización guardado en la propia página\n- **En tu repo:** solo `ctk-plan.json`, el plan; conviene ignorarlo en git\n\nPara comprobar, pedime otro plan: tiene que decir **`5 unchanged`**.","source":"inferido","notes":"Cerrá con lo que queda y por qué importa: el estado vive en Confluence y no en tu repo, así que no hay archivos de estado que se desincronicen. Y la prueba de que todo cerró es un segundo plan que dice todo igual.","pause":true}]},{"id":"otro-caso","title":"Otro caso","subtitle":"Alguien editó la página en Confluence: el drift","screen":"cursor-agent","faq":[{"q":"¿Qué es el drift?","a":"Que alguien editó la página directo en Confluence después de tu última publicación, y vos también cambiaste el archivo. Publicar pisaría su edición, así que ctk frena y avisa."},{"q":"¿Qué pasa con on_drift en su valor por defecto?","a":"Con repo_wins el repo es la fuente de verdad y pisa la edición, pero solo si estás en la última versión de la rama por defecto; el plan lo avisa en la propia fila. Si no estás al día, bloquea y dice por qué: la salida es ponerte al día, nunca cambiar on_drift. Con on_drift: fail no se pisa nunca."},{"q":"¿Cómo traigo lo que escribió la otra persona?","a":"A mano: ctk detecta que la página cambió y muestra el diff, pero no fusiona. Copiás el cambio al .md y planificás de nuevo. El plan puede seguir diciendo DRIFT, porque compara con la página de Confluence; con repo_wins y al día no se pierde nada, y publicar sigue pidiendo tu aprobación."},{"q":"¿Y si el plan sale BLOCKED?","a":"Es que la página ancla no tiene dueño, o es de otro repo. No es un error tuyo: Plataforma tiene que correr ctk grant, que también abre su ventana de aprobación. El agente no lo arregla creando la página por su cuenta."}],"steps":[{"type":"ask","text":"Alguien tocó el runbook directo en Confluence. ¿Qué pasa si publico?","source":"inferido","notes":"Otro pedido típico, y mucho más delicado: no es publicar, es no pisar a nadie. Es la razón de ser de ctk. Fijate que no le decís qué comando usar; la skill lo sabe."},{"type":"term","cmd":"ctk plan","out":["UNCHANGED docs/arquitectura/index.md  'Arquitectura del servicio'","UNCHANGED docs/arquitectura/componentes.md  'Componentes'","UNCHANGED docs/arquitectura/decisiones  'Decisiones'","UNCHANGED docs/arquitectura/decisiones/adr-001.md  'ADR 001: usar colas'","DRIFT     docs/runbook.md  'Runbook de despliegue'  -- remote page was edited since the last sync; repo wins: this checkout is the latest version of the default branch, so the Confluence edit is overwritten","1 drift, 4 unchanged","plan written to ctk-plan.json"],"source":"inferido","cwd":"~/mi-servicio","notes":"Ahora la fila dice DRIFT: alguien editó la página en Confluence y vos también cambiaste el archivo. Fijate el final de la línea: este repo usa el valor por defecto, repo_wins, y como estás en la última versión de la rama por defecto el plan no bloquea y avisa que la edición de Confluence se pisaría. Sale con código 0 y todavía no escribió nada: publicar es otro comando, con ventana. Inferido: el texto sale de plan.py, el resto es ilustrativo."},{"type":"term","cmd":"ctk diff --key docs/runbook.md","out":["DRIFT docs/runbook.md  'Runbook de despliegue'  (page 5014)","--- confluence","+++ local","@@ -1,3 +1,3 @@"," \u003ch2\u003eDespliegue\u003c/h2\u003e","-\u003cp\u003eAvisá en el canal antes de correr el job.\u003c/p\u003e","+\u003cp\u003eCorré el job desde el pipeline.\u003c/p\u003e"," \u003cp\u003eRevertí con el botón de rollback.\u003c/p\u003e"],"source":"inferido","cwd":"~/mi-servicio","notes":"El diff dice exactamente qué pasó. Alguien agregó en Confluence un aviso de «avisá en el canal» que tu archivo no tiene; y vos cambiaste otra línea. Solo lee, imprime acá y no guarda nada. Es lo que la skill pide mirar antes de decidir."},{"type":"say","md":"La página tiene una línea que **tu archivo no tiene**: alguien agregó «Avisá en el canal antes de correr el job». Si publico, el plan lo dice claro: **el repo gana y esa línea se pisa**.\n\n**¿Qué lado gana?**\n- **Recomendado:** traigo esa línea a `docs/runbook.md`, planifico de nuevo y recién ahí publicamos, sin perder nada\n- **Si gana tu versión tal cual:** lo decidís vos; yo **no toco Confluence ni cambio `on_drift`**\n\nHasta que me digas, no publico nada.","source":"inferido","notes":"Acá se ve el criterio de la skill. Aunque el plan permitiría pisar, el agente no elige un lado por vos: te muestra qué se perdería y te pregunta. Y se cuida de dos atajos prohibidos: resolver el drift borrando la página o editando Confluence por su cuenta. Lo seguro es traer el cambio al archivo y volver a planificar."},{"type":"ask","text":"Traé la línea al archivo.","source":"inferido","notes":"Una decisión humana, en una frase. El agente edita tu archivo, que es tuyo, y no Confluence."},{"type":"tool","label":"Edit · docs/runbook.md","source":"inferido","notes":"Edita el runbook para sumar la línea de la otra persona. Es un cambio en tu repo que ves en el diff de Cursor y podés deshacer."},{"type":"tool","label":"Ran · ctk plan","source":"inferido","notes":"Planifica de nuevo con la línea ya en el archivo. Ojo, que es lo contraintuitivo: la fila sigue diciendo DRIFT. ctk compara la página de Confluence con lo que publicaría tu repo, no fusiona, y la página todavía no coincide con tu archivo. Pero ahora el repo gana sin perder nada: lo único que se pisa es la versión vieja de Confluence, porque la línea de la otra persona ya está en tu archivo. Sale con código 0."},{"type":"say","md":"Hecho: la línea de la otra persona **ya está en `docs/runbook.md`**. El plan sigue marcando **DRIFT**, pero ahora **el repo gana sin perder nada**: solo se reemplaza la versión vieja de la página.\n\n**¿Lo publico?** Se abre la misma ventana de aprobación que antes.","source":"inferido","notes":"Terminó donde terminan todos los casos de escritura: pregunta y espera. Si decís que sí, se repite el aviso previo y la ventana que ya viste. Remarcá que el plan dijo DRIFT a propósito: es el aviso, no un error, y lo que protege es que primero trajimos el cambio ajeno al archivo.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores más comunes y cómo salir","screen":"terminal","faq":[{"q":"El agente no usa la skill y habla de otra herramienta de Confluence.","a":"Revisá que el enlace de la skill exista y apunte al clon: el readlink de este capítulo. La skill dice que Confluence se toca solo con ctk, nunca con otro conector."},{"q":"«error: missing environment». ¿Qué falta?","a":"Las tres variables de Confluence. Si ya las guardaste, casi seguro Cursor se abrió antes de que existieran: cerralo del todo y abrilo de nuevo."},{"q":"Cancelé la ventana sin querer. ¿Cómo sigo?","a":"Nada se escribió. Pedile al agente que lo vuelva a intentar: no lo hace solo, a propósito, y te va a preguntar."},{"q":"«cannot tell which repo this is».","a":"El repo no tiene remoto origin. Pasá --repo org/nombre a ctk plan."}],"steps":[{"type":"term","cmd":"readlink ~/.cursor/skills/confluence-team-kit","out":["~/skills/confluence-team-kit/skills/confluence-team-kit"],"source":"real","cwd":"~","notes":"Si el agente no parece conocer la skill, mirá primero si el enlace está. Acá apunta al clon, o sea que la instalación anduvo: lo que falta es reiniciar Cursor."},{"type":"term","cmd":"ctk plan","out":["error: missing environment: CONFLUENCE_BASE_URL, CONFLUENCE_EMAIL, CONFLUENCE_TOKEN","# exit 1"],"source":"inferido","cwd":"~/mi-servicio","notes":"El segundo error típico: faltan las credenciales y ctk lo dice con las tres variables que busca. Casi siempre es que Cursor se abrió antes de guardarlas, así que cerralo del todo y abrilo. Inferido: esta captura no puede correr ctk, la salida es la de la documentación."},{"type":"term","cmd":"ctk plan","out":["BLOCKED   docs/arquitectura/  'docs/arquitectura/'  -- anchor 5001 has no owner; ask the platform team to run `ctk grant 5001 --owner tu-empresa/demo-servicio`","1 blocked","plan written to ctk-plan.json","# exit 2"],"source":"inferido","cwd":"~/mi-servicio","notes":"El tercero no es un error tuyo ni del agente: la página ancla todavía no tiene dueño, y ctk no escribe bajo un ancla sin dueño. La salida está en la propia fila: Plataforma corre ctk grant, que también abre una ventana. Lo único que podés hacer vos es pedírselo.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Tengo que instalar el MCP para usar la skill?","a":"No. Sin el MCP el agente corre ctk en la terminal; con él, usa tres herramientas (page, publish, anchor) con las mismas reglas y la misma ventana."},{"q":"¿Qué tan seguro es el dueño de una página?","a":"Es un guardrail ante errores, no una frontera de seguridad: el token de Confluence es compartido, así que cualquiera con él puede escribir sin pasar por ctk."},{"q":"¿Qué sigue?","a":"El episodio 4: product-brain-mcp, otra herramienta con MCP y con la misma ventana de aprobación."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Primero el plan, después el diff, después la escritura:** `ctk plan` y `ctk diff` solo leen; publicar es un paso aparte.\n- **Nada se escribe sin tu clic:** el agente avisa que se abre la ventana, vos aprobás, y si cancelás no insiste.\n- **No se pisa a nadie:** si alguien editó la página, hay drift y primero se trae el cambio al archivo, antes de publicar.\n\n#### Próximo episodio: product-brain-mcp\nCómo armar una iniciativa completa (el PRD, el RFC y las épicas) desde una conversación y exportarla a Jira, con otro MCP y otra ventana de aprobación.","source":"inferido","notes":"Las tres ideas son el producto: plan antes de escribir, tu clic como única puerta, y no pisar a nadie. Anticipá el próximo en una frase: es el mismo patrón, con un MCP, pero para pasar de una conversación a una iniciativa completa.","pause":true}]}]},{"id":"product-brain-mcp","series":"cursor","order":4,"title":"product-brain-mcp","pitch":{"ask":"Quiero armar la iniciativa «Autogestión de devoluciones», con su PRD, su RFC y sus épicas","does":"Te hace las preguntas de a una, redacta el documento entero, lo abre en tu editor para que lo revises y, con tu «listo» y un clic tuyo, lo escribe. Después exporta las épicas a Jira con tu aprobación."},"skill":{"repo":"product-brain-mcp","commit":"64d7721","date":"2026-10-20"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: la herramienta, el MCP, la configuración y tu token","screen":"terminal","faq":[{"q":"¿Por qué pide Python 3.12 y yo no lo tengo?","a":"No tenés que instalarlo vos. uv, el ayudante que usamos, trae el Python 3.12 que la herramienta necesita y lo guarda aparte, sin tocar el Python de tu máquina. Lo que sí necesitás es uv: si hiciste el episodio 0, ya lo tenés."},{"q":"¿Qué es el MCP y por qué aparece un archivo mcp.json?","a":"Es el enchufe que le da al agente seis herramientas para hablar con tu espacio de trabajo. El mcp.json es la lista de enchufes que Cursor arranca: ahí le decís qué programa correr. Lo escribe el instalador y no lleva ningún secreto."},{"q":"¿Puedo pedirle al agente que instale todo?","a":"Casi: «Instalá product-brain-mcp: cloná el repo y corré ./install.sh». Lo que no le pedís es el token: es tu sesión, lo copiás y lo guardás vos, y nunca pasa por el chat."},{"q":"¿Funciona en Windows o Linux?","a":"No. Cada escritura se aprueba en una ventana nativa de macOS, y sin ella el servidor se niega a escribir."}],"steps":[{"type":"term","cmd":"git clone \u003crepo\u003e skills/product-brain-mcp","out":["Cloning into 'skills/product-brain-mcp'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo: trae la skill y el servidor juntos. En \u003crepo\u003e va la dirección que te da tu equipo; necesita red y acceso, que dejó listo el episodio 0. Paso inferido."},{"type":"term","cmd":"uv --version","out":["uv 0.5.0"],"source":"inferido","cwd":"~","notes":"Acá aparece uv, lo único que tenés que tener antes. Pensalo como un ayudante que arma un cuarto aparte con el Python 3.12 y las piezas que hacen falta, sin tocar nada del resto de tu máquina. Si no existe, brew install uv, como en el episodio 0. Salida inferida."},{"type":"term","cmd":"cd ~/skills/product-brain-mcp \u0026\u0026 ./install.sh","out":["skill: product-brain -\u003e ~/skills/product-brain-mcp/skill/product-brain (Claude Code, Codex, Cursor)","MCP server product-brain: Claude Code: skipped (claude is not on PATH); Cursor: registered","next: put base_url in ~/.config/product-brain/config.toml, copy the token and run: uv run --project ~/skills/product-brain-mcp pbmcp token paste"],"source":"inferido","cwd":"~","notes":"Un solo comando hace dos cosas. Enlaza la skill, que le enseña al agente cuándo y cómo usar las herramientas, y escribe el servidor en el mcp.json de Cursor. No copia nada: son accesos directos a tu clon."},{"type":"term","cmd":"cat ~/.cursor/mcp.json","out":["{","  \"mcpServers\": {","    \"product-brain\": {","      \"command\": \"uv\",","      \"args\": [\"run\", \"--project\", \"/RUTA/A/product-brain-mcp\", \"pbmcp\"]","    }","  }","}"],"source":"inferido","cwd":"~","notes":"Esto dejó el instalador: le dice a Cursor que arranque el servidor con uv desde tu clon. Ojo con la ruta de --project: si movés el clon, hay que corregirla a mano, es la causa más común de un servidor con error. No lleva ningún secreto."},{"type":"term","cmd":"mkdir -p ~/.config/product-brain","out":[],"source":"real","cwd":"~","notes":"Ahora la configuración. Todo vive en una carpeta tuya, fuera del repo. Primero la creamos, si no existe."},{"type":"term","cmd":"cat ~/.config/product-brain/config.toml","out":["base_url = \"https://\u003cel backend de tu equipo\u003e\"","deletes_enabled = false"],"source":"real","cwd":"~","notes":"Nada secreto: es la dirección del backend de tu equipo. Esta línea la escribió el agente a pedido, y la dirección real está en la documentación de tu equipo. Sin este archivo, cualquier herramienta falla con config_missing y dice qué ruta falta."},{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token paste","out":["saved 107 characters to ~/.config/product-brain/token"],"source":"inferido","cwd":"~","notes":"Lo único que no hace el agente, a propósito: el token es tu sesión. Lo copiás del navegador (Local Storage, okta-token-storage, accessToken.accessToken) y corrés este comando, que lo guarda con permisos solo tuyos. Nunca en el chat. Dura unas 8 horas. Inferido.","pause":true},{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': True, 'valid': True, 'minutes_left': 464, 'warn': False, 'error': None}"],"source":"inferido","cwd":"~","notes":"La prueba de que quedó bien, sin red. Mirá minutes_left; con menos de 30, el agente te avisa. Y a mano, allowed_projects: los proyectos donde se puede escribir. Los que creás desde la skill se suman solos; uno existente lo sumás vos."}]},{"id":"caso-principal","title":"Caso principal","subtitle":"De una idea a la iniciativa y su PRD, con una ventana de aprobación por cada escritura","screen":"cursor-full","faq":[{"q":"¿Escribe algo antes de que yo diga «listo»?","a":"No. El borrador es un archivo privado en tu máquina que se abre en el editor. Recién con tu «listo» el agente pide escribirlo, y ahí se abre la ventana."},{"q":"¿Qué es el {{pendiente}}?","a":"Es la marca de un dato que nadie dio, o que no cumple las metas del documento anterior. El sistema lo cuenta como campo vacío, así que el hueco se ve. Si el agente escribiera «a definir», contaría como completo y escondería el problema."},{"q":"¿Y si cancelo la ventana o no hago nada?","a":"No se escribe nada. Cancelar, Escape, cerrarla o dejar pasar 100 segundos es un rechazo, y el agente te pregunta qué cambiar. Editás el mismo borrador y decís «listo» otra vez."},{"q":"¿Cuándo uso workflow y cuándo documentos sueltos?","a":"Lo decide un número que el agente cuenta con vos: cuántos equipos entregan. Con uno, workflow: PRD, RFC y una épica encadenados. Con dos o más, una épica por equipo, sueltas."}],"steps":[{"type":"ask","text":"Quiero armar la iniciativa «Autogestión de devoluciones» con su PRD, su RFC y sus épicas. Hoy las devoluciones las resuelve soporte a mano y tardan 9 días. La meta es bajar a 3 días para el 01/03, y que el cliente pueda iniciarlas desde la web y la app. Las hace un solo equipo, en dos entregas: 15/01 y 27/02. Para la primera entrega pensaba hacer solo la web. Afuera queda el reembolso a otros medios de pago.","source":"inferido","notes":"Un pedido normal, con mucho contexto de entrada, a propósito: cuanto más le contás en un solo mensaje, menos preguntas te hace. Fijate lo que dice: el problema con su número, la meta, el plazo, cuántos equipos entregan, qué queda afuera, y una propuesta suya: primero solo la web."},{"type":"tool","label":"Read · ~/.cursor/skills/product-brain/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue sus reglas: preguntar de a una cosa, armar el documento entero, chequear contra las metas y escribir solo con tu clic."},{"type":"tool","label":"Ran · session(action=\"token_status\")","source":"inferido","notes":"Lo primero que hace siempre: mirar que tu token valga y cuánto le queda. Es solo lectura y no sale a la red."},{"type":"tool","label":"Ran · session(action=\"whoami\")","source":"inferido","notes":"Segunda lectura: quién sos en el sistema, para saludarte y para que todo quede a tu nombre."},{"type":"tool","label":"Ran · project(action=\"list\")","source":"inferido","notes":"Mira qué proyectos hay para elegir uno, o crear uno nuevo. Otra lectura."},{"type":"say","md":"Hola, **Persona del equipo**. Tu token vale por **464 minutos** más.\n\n#### Resumen a aprobar\n- **Problema:** las devoluciones se resuelven a mano en soporte y tardan **9 días**\n- **Usuarios:** clientes que devuelven y el equipo de soporte\n- **Éxito:** bajar a **3 días** para el **01/03**, con inicio desde la **web y la app**\n- **Afuera:** reembolso a otros medios de pago\n- **Restricciones:** un solo equipo, dos entregas (**15/01** y **27/02**)\n\n¿Está bien? Con tu sí creo el proyecto, y **se abre una ventana** con lo que se va a crear: **Cancelar** y **Aprobar**. La aprobación es tu clic, no mi pregunta.","source":"inferido","notes":"Mirá cómo cierra el agente: resume en cinco líneas lo decidido, que es el contrato de lo que sigue. Y avisa que se abre una ventana antes de lanzar el comando que escribe."},{"type":"ask","text":"Sí, creá el proyecto.","source":"inferido","notes":"El visto bueno del resumen. Todavía no es la aprobación de la escritura: esa es la que viene.","pause":true},{"type":"tool","label":"Ran · project(action=\"create\")","source":"inferido","notes":"Esta llamada es la que abre la ventana: el agente no escribe nada por su cuenta, pide la escritura y el sistema espera tu clic."},{"type":"approve","title":"Crear proyecto","lines":["Proyecto nuevo: «Autogestión de devoluciones»","Se agrega a tus proyectos permitidos para que la herramienta pueda escribir en él.","Aprobás con un clic en Aprobar. Cancelar, Escape o cerrar la ventana no escriben nada. Se cancela sola a los 100 s."],"button":"Aprobar","source":"inferido","notes":"La primera ventana nativa de macOS, el único camino para escribir. Muestra el plan en claro, qué se va a crear, no un resumen del agente. Crear un proyecto lo suma además a la lista de proyectos permitidos. Si cancelás, cerrás o esperás, no pasa nada.","pause":true},{"type":"tool","label":"Ran · workflow(action=\"list\")","source":"inferido","notes":"Antes de preguntar el modo, mira si hay un workflow sin terminar para ofrecerte retomarlo."},{"type":"say","md":"Proyecto creado y habilitado.\n\nAntes de escribir, el modo. **Equipos que entregan: 1 → workflow**: el PRD, el RFC y **una** épica encadenados, con las dos entregas como historias en orden. Con dos equipos o más serían épicas sueltas.\n\n¿Vamos con workflow?","source":"inferido","notes":"Acá se ve la regla de decisión de la skill, en una línea: cuenta los equipos que entregan y recomienda. Una entrega o varias en secuencia no cambia la cuenta. Lo que cambia es cuántos equipos. Y en los dos modos se escribe una iniciativa, un PRD y un RFC."},{"type":"ask","text":"Dale, workflow.","source":"inferido","notes":"Una decisión humana, en dos palabras."},{"type":"tool","label":"Ran · workflow(action=\"steps\")","source":"inferido","notes":"Lee los pasos del workflow en orden y los recorre así, nunca de memoria. En modo workflow, la primera aprobación arranca el workflow y escribe el primer documento en una sola ventana."},{"type":"tool","label":"Ran · template(action=\"get\")","source":"inferido","notes":"Lee los campos del PRD, que son más de cien. Por eso no te pregunta sección por sección: arma el documento entero con lo que ya sabe."},{"type":"tool","label":"Ran · document(action=\"draft\")","source":"inferido","notes":"Este es el paso que escribe el borrador en un archivo privado, lo abre en tu editor y devuelve la completitud prevista."},{"type":"say","md":"Armé el PRD entero y lo abrí en tu editor. Todavía **no escribí nada**.\n\n#### Metas de la iniciativa\n- Resolver en **3 días** para el **01/03**\n- Entregas 15/01 y 27/02 ≤ plazo 01/03 ✓\n- Primera entrega solo web → objetivo «web y app» ✗\n\nPor el ✗ dejé **`{{pendiente}}`** en ese campo, aunque lo hayas propuesto: proponerlo no es aceptarlo. ¿Alcanza con la web en la primera entrega?\n\n**Completitud prevista: 88%.** Quedan parciales los riesgos y las dependencias.\n\nEditá el borrador, guardalo y decime **listo**.","source":"inferido","notes":"Esta es la parte que distingue a la skill. Cada valor que propusiste se compara con las metas, y lo que no cumple, o no se sabe, queda pendiente y no como un texto que parezca completo: acá, tu propia idea de la web primero.","pause":true},{"type":"ask","text":"Listo. Dejé la app para la segunda entrega.","source":"inferido","notes":"Tu «listo» es el que habilita el siguiente paso, y acá además contás un cambio que hiciste."},{"type":"tool","label":"Ran · session(action=\"token_status\")","source":"inferido","notes":"Vuelve a mirar el token, porque mientras editabas pudo vencer. Si venció, pide uno nuevo y sigue desde el mismo borrador."},{"type":"say","md":"Voy a correr el comando que **escribe**: arranca el workflow y crea el PRD. **Se va a abrir una ventana** con tus cambios y los botones **Cancelar** y **Aprobar**.\n\nSi cancelás o la cerrás, no lo reintento: te pregunto qué cambiar.","source":"inferido","notes":"El mismo aviso de antes, y a propósito: antes de cada escritura el agente dice que se abre una ventana y qué va a aprobarse. Remarcá la última frase: si cancelás, no insiste y no vuelve a intentarlo tal cual.","pause":true},{"type":"approve","title":"Crear documento","lines":["PRD · «Autogestión de devoluciones» · se arranca el workflow y se escribe el primer paso","Tus cambios sobre el borrador: objetivo web y app → web en la 1.ª entrega, app en la 2.ª","Aprobás con un clic en Aprobar. Cancelar, Escape o cerrar la ventana no escriben nada. Se cancela sola a los 100 s."],"button":"Aprobar","source":"inferido","notes":"Esta ventana muestra lo que cambiaste vos, no el documento entero: es lo que tenés que mirar antes del clic. Una sola aprobación hace las dos cosas, arrancar el workflow y escribir el primer documento. Inferida: no se puede capturar sin una persona.","pause":true},{"type":"tool","label":"Ran · document(action=\"create\")","source":"inferido","notes":"Con tu clic, el servidor escribe. Un borrador se usa una sola vez: después deja de valer, así que reintentar no escribe dos veces."},{"type":"worked","seconds":41,"source":"inferido","notes":"El tiempo del agente, sin contar lo que tardaste vos en editar y aprobar."},{"type":"say","md":"Listo: el **PRD está escrito** y el workflow arrancó.\n\n#### Qué quedó\n- **Completitud:** **94%**; lo que pediste (web primero, app en la segunda entrega) ya está en el documento\n- **Parciales:** los **riesgos** y las **dependencias**\n- **Siguiente paso:** completar esos dos campos, y después el RFC con el mismo camino: borrador, tu «listo» y tu clic\n\n¿Completamos los riesgos y las dependencias?","source":"inferido","notes":"Cerrá con lo que queda: el documento escrito, su completitud y lo que falta de verdad. Mirá que el hueco de la web y la app ya no está: lo resolviste vos en el borrador.","pause":true}]},{"id":"otro-caso","title":"Otro caso","subtitle":"Exportar una épica a Jira, con el chequeo previo y la ventana","screen":"cursor-agent","faq":[{"q":"¿Qué hace falta para exportar?","a":"Que la integración de Atlassian esté conectada en los ajustes de integraciones de la plataforma. Eso lo hacés vos ahí, no el agente."},{"q":"¿Qué es el aviso de la ventana?","a":"Si un campo quedó como {{pendiente}}, a Jira ese texto llega literal. La ventana te dice cuántos issues lo llevarían. Avisa, no bloquea: cancelás vos y completás el campo antes."},{"q":"¿Se puede deshacer una exportación?","a":"No. La herramienta no tiene acciones para borrar ni deshacer: lo que se crea en Jira se crea de verdad. Por eso el chequeo previo y la ventana."},{"q":"¿Y si solo quiero saber cómo viene la iniciativa?","a":"Pedilo así: «¿Cómo viene la iniciativa?». Una sola lectura arma una tabla con cada documento, su completitud y lo que le falta, sin escribir nada."}],"steps":[{"type":"ask","text":"Exportá la épica «Portal de devoluciones» a Jira, proyecto PLAT.","source":"inferido","notes":"Otro pedido típico, y mucho más delicado: acá se crean issues de verdad. Fijate que no le decís cómo ni con qué."},{"type":"tool","label":"Ran · jira(action=\"status\")","source":"inferido","notes":"Primero mira que Atlassian esté conectado. Es solo lectura. Si no lo está, te manda a las integraciones y no sigue."},{"type":"tool","label":"Ran · jira(action=\"preflight\")","source":"inferido","notes":"El chequeo previo: qué le falta a la épica para exportarse bien, como componentes, prioridades o campos obligatorios. Solo lectura. Es la regla de la skill: nunca exporta sin mostrarte esto y resolverlo con vos."},{"type":"say","md":"A la épica le falta el **componente** de dos historias. Eso lo completás **vos** en el sistema (no lo edito yo): cuando lo tengas, decime y vuelvo a revisar antes de exportar.","source":"inferido","notes":"Acá el agente solo pregunta y señala el hueco; arreglarlo es una escritura sobre la épica y queda en tus manos. No exporta nada hasta que el chequeo previo salga limpio: es la regla de la skill."},{"type":"ask","text":"Ya les puse el componente.","source":"inferido","notes":"Lo resolviste vos, fuera del chat."},{"type":"tool","label":"Ran · jira(action=\"preflight\")","source":"inferido","notes":"Vuelve a correr el chequeo, y ahora no tiene huecos."},{"type":"say","md":"Sin huecos. Ahora la exportación: **se abre una ventana** con los issues que se crearían, **Cancelar** y **Aprobar**. Yo no puedo hacer ese clic.","source":"inferido","notes":"El aviso previo de siempre, antes de la escritura que crea issues de verdad.","pause":true},{"type":"tool","label":"Ran · jira(action=\"preview\")","source":"inferido","notes":"Pide la vista previa de lo que se crearía. Todavía no escribe: el export vuelve a pedir una vista fresca justo antes de abrir la ventana, para que lo que ves sea lo que se crea."},{"type":"approve","title":"Exportar a Jira","lines":["Épica «Portal de devoluciones» · proyecto PLAT","Se crearían 4 issues: 1 épica y 3 historias","Sin avisos: ningún campo quedó como {{pendiente}}","Aprobás con un clic en Aprobar. Cancelar, Escape o cerrar la ventana no escriben nada. Se cancela sola a los 100 s."],"button":"Aprobar","source":"inferido","notes":"La ventana del export muestra los issues que se crearían, no un resumen. Mirá la línea de avisos: si un campo quedó pendiente, dice cuántos issues llevarían ese texto a Jira, y lo sano es cancelar y completarlo. Inferida.","pause":true},{"type":"tool","label":"Ran · jira(action=\"export\")","source":"inferido","notes":"Con tu clic se crean los issues, a través del servidor product-brain-mcp y con tu usuario. Si cancelás, no se exporta nada y el agente te pregunta."},{"type":"say","md":"Listo: se crearon **4 issues** en el proyecto **PLAT**.\n\n#### Qué quedó\n- **Épica:** `PLAT-123`\n- **Historias:** `PLAT-124`, `PLAT-125` y `PLAT-126`\n\nTodo quedó a tu nombre. No hay forma de deshacerlo desde acá: si algo no va, se corrige en Jira.","source":"inferido","notes":"Cerrá con lo que se creó y con una advertencia honesta: no hay deshacer. Las claves son inventadas para la demo. Es la razón de tanto chequeo antes.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores más comunes y cómo salir","screen":"terminal","faq":[{"q":"El servidor aparece con error en Cursor.","a":"Casi siempre es la ruta de --project en el mcp.json: si moviste o volviste a clonar el repo, quedó vieja y el instalador no la actualiza. Corregila a mano, o probá el comando en una terminal."},{"q":"La ventana de aprobación no aparece.","a":"Es una ventana nativa de macOS: sin macOS o sin sesión gráfica no hay forma de aprobar, y el servidor no escribe. Es una barrera, no un error."},{"q":"«declined». ¿Qué pasó?","a":"No aprobaste: cancelaste, cerraste la ventana o pasaron 100 segundos. No se escribió nada. Pedile al agente que siga: no reintenta solo."},{"q":"«duplicate». ¿Se escribió dos veces?","a":"No: el documento ya existe, porque una llamada cortada pudo haberlo escrito. El agente lo lee en vez de crearlo otra vez."}],"steps":[{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': True, 'valid': False, 'minutes_left': None, 'warn': True, 'error': 'token_permissions: ~/.config/product-brain/token must be readable only by you: chmod 600 ~/.config/product-brain/token'}"],"source":"inferido","cwd":"~","notes":"El primer error típico: el archivo del token tiene permisos de más y la herramienta lo rechaza a propósito, porque un secreto no tiene que poder leerlo otra persona. La salida dice el comando: chmod 600. Inferido: necesita uv y un token."},{"type":"term","cmd":"uv run --project ~/skills/product-brain-mcp pbmcp token status","out":["{'present': False, 'valid': False, 'minutes_left': None, 'warn': True, 'error': 'token_missing: no token at ~/.config/product-brain/token; copy the token and run: pbmcp token paste'}"],"source":"inferido","cwd":"~","notes":"El segundo: no hay token o venció, y dura unas 8 horas. Se repite el paso de copiarlo del navegador y pegarlo con token paste. No hay forma de renovarlo desde el agente, y es a propósito. Si el error dice token_expired es lo mismo. Inferido."},{"type":"term","cmd":"# lo que ve el agente al escribir en un proyecto fuera de la lista","out":["project proj-demo-0002 is not in ~/.config/product-brain/allowed_projects; add its id there to let pbmcp write to it"],"source":"inferido","cwd":"~","notes":"Este es el error en sí: not_allowed, con el id que falta. Es un texto de la herramienta, inferido; el comando de abajo es la lista de verdad."},{"type":"term","cmd":"cat ~/.config/product-brain/allowed_projects","out":["proj-demo-0001"],"source":"real","cwd":"~","notes":"El tercero es not_allowed: el proyecto no está en esta lista, un id por línea, y el error dice qué id agregar. Lo agregás vos con un editor; no se le pide al agente.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Tengo que instalar la skill y el servidor por separado?","a":"No: el mismo ./install.sh deja las dos piezas. Y solo andan juntas: la skill no escribe por sí sola, usa las herramientas del servidor."},{"q":"¿Qué tan seguro es esto?","a":"La ventana frena al agente, pero no es una frontera de seguridad total: el token sirve para todo lo que tu usuario puede hacer. Lo que sí limita la herramienta es dónde escribe, con la lista de proyectos permitidos."},{"q":"¿Qué sigue?","a":"El episodio 5: auditing-repos, para revisar un repo y convertir los hallazgos en issues y pull requests, con Jira como vínculo opcional."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Una conversación en vez de cien campos:** el agente arma el documento entero, vos lo revisás en tu editor y los datos que no se saben quedan `{{pendiente}}`, no escondidos.\n- **Nada se escribe sin tu clic:** el agente avisa que se abre la ventana, vos aprobás, y si cancelás no insiste.\n- **El token es tuyo:** lo guardás vos, dura unas 8 horas y nunca pasa por el chat.\n\n#### Próximo episodio: auditing-repos\nCómo pedirle al agente que revise un repo, mida su calidad y su seguridad, y convierta los hallazgos en issues y pull requests, que podés vincular a un ticket de Jira.","source":"inferido","notes":"Las tres ideas son el producto: una conversación guiada, tu clic como única puerta y un secreto que no sale de tu máquina. Anticipá el próximo en una frase: cambiamos de plano, de armar un documento a mirar un repo que ya existe y ordenar lo que está mal.","pause":true}]}]},{"id":"auditing-repos","series":"cursor","order":5,"title":"auditing-repos","pitch":{"ask":"Auditá este repo","does":"Analiza ocho dimensiones, verifica ejecutando cada hallazgo y escribe un informe local con su nivel de confianza. Frena y espera tu respuesta: recién entonces publica un issue por hallazgo y los pull requests que los cierran."},"skill":{"repo":"teamwayofwork","commit":"a0bc150","date":"2026-10-17"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: clonar, enlazar y autenticar gh","screen":"terminal","faq":[{"q":"¿Por qué enlazar y no copiar?","a":"Porque así hay una sola fuente de verdad: tu clon. Cuando lo actualizás, la skill se actualiza sola. Una copia se queda vieja en silencio."},{"q":"¿Qué son ~/.agents y ~/.claude?","a":"Son las carpetas donde cada agente busca skills. Cursor lee la primera; Claude Code lee la segunda, por eso hay dos enlaces. Si solo usás Cursor, alcanza con el primero."},{"q":"¿Puedo instalarla sin enlaces?","a":"Sí: con npx skills add, desde tu clon, y necesitás Node. Pero instala una copia: no se actualiza con git pull, hay que repetir el comando. Y si ya la habías enlazado, te cambia el enlace por la copia."},{"q":"El clone dice «Permission denied», ¿qué hago?","a":"Falta acceso a este repo, que es de otra organización. Pedíselo al equipo dueño; la clave SSH del episodio 0 sirve en cuanto te lo den. Y sobre gh y Jira: son opcionales; sin gh la skill solo escribe el informe local, y sin Jira el resto anda igual."}],"steps":[{"type":"term","cmd":"git clone \u003crepo\u003e ~/skills/teamwayofwork","out":["Cloning into '~/skills/teamwayofwork'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo del equipo. Ojo: es un repo con varias skills adentro, y la que vamos a usar vive en la carpeta skill un borrador hasta que lo aprobás. Con un git add -A se subiría al historial antes de la compuerta."}],"steps":[{"type":"ask","text":"Auditá este repo","source":"inferido","notes":"Dos palabras alcanzan. Lo que cambia con esta skill es que no hace falta explicarle el método: se activa sola con «auditá», «revisá este código» o «chequeá seguridad». Parado en el repo que querés revisar, no en el de la skill."},{"type":"tool","label":"Read · ~/.agents/skills/auditing-repos/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue un orden fijo: preflight, analizar, verificar, informe local, compuerta, publicar, responder la review. También lee dos referencias obligatorias: verificación y atribución."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/preflight.sh","out":["── repository ──","git repo                   yes (main)","working tree               clean","default branch             unknown","","── github ──","gh auth                    yes","repo permission            WRITE","issues enabled             true","","── jira (optional) ──","jira                       skipped (missing: JIRA_BASE_URL JIRA_EMAIL JIRA_API_TOKEN)","","── audit report safety ──","AUDIT-REPORT.md            NOT IGNORED in this repo","  →                      the report holds detailed security findings and is a draft until","                           approved. A git add -A would publish it to history before the gate.","  fix                      echo 'AUDIT-REPORT.md' \u003e\u003e .gitignore   (or write to the scratchpad)","","── verification tooling ──","docker                     no — some claims cannot be verified by running them","uv                         yes","rg                         yes","fd                         yes","","ok=1 warnings=2 blocking=0"],"source":"inferido","cwd":"~/mi-servicio","notes":"Primero el preflight: qué hay y qué falta. No escribe nada. Fijate en dos cosas. Una, el aviso de AUDIT-REPORT.md: el ue F-03 dice «unverified»: se muestra, pero no sale. Recordá el límite: la compuerta es una instrucción de la skill, no un bloqueo técnico; por eso conviene leer el informe vos.","pause":true},{"type":"ask","text":"Publicá F-01 y F-02. F-03 no.","source":"inferido","notes":"Esta es la decisión humana, en una frase y en el chat. La skill no sigue hasta que contestás. Si hubieras dicho «ninguno», el informe se queda local y listo."},{"type":"tool","label":"Ran · sweep.sh main","source":"inferido","notes":"Antes de pushear la skill corre el sweep: 40 caracteres, tooling local, atribución y SHAs de actions. Vamos a verlo con detalle en el próximo capítulo, con un caso que falla."},{"type":"tool","label":"Ran · gh issue create · F-01 y F-02","source":"inferido","notes":"Un issue por hallazgo, con el comando y su salida como evidencia. Es el agente, con gh, quien publica; la skill le indica frenar y preguntar antes, y eso ya pasó."},{"type":"tool","label":"Ran · gh pr create · fix/descuento-sin-tope y fix/paginacion-desde-1","source":"inferido","notes":"Los PRs se agrupan por cambio que se puede mergear y revertir solo. Acá F-01 y F-02 tocan archivos distintos, así que son dos PRs. Si compartieran archivo, irían juntos. Los arreglos van en una rama por PR; no se muestran."},{"type":"say","md":"#### Listo\n- **Issues:** #21 (F-01) y #22 (F-02), uno por hallazgo.\n- **PRs:** #23 cierra #21 y #24 cierra #22; cada uno abre con `Closes #…` y nombra los archivos que comparte con el otro, o que no comparte ninguno.\n- **F-03** quedó en el informe, sin publicar.\n- Nada de lo que escribí menciona que lo hizo un asistente: todo sale a tu nombre.","source":"inferido","notes":"Leé el cierre: cuántos issues y PRs, y qué quedó afuera. Remarcá la última línea: la regla de atribución es absoluta; no hay pie de página ni trailer de co-autor en nada. Eso ya está decidido por la skill y no se discute en cada corrida.","pause":true}]},{"id":"el-sweep","title":"Otro caso: el sweep","subtitle":"Antes de pushear, chequeos que cuestan menos que descubrirlos en CI","screen":"cursor-agent","faq":[{"q":"¿Por qué marca un nombre de test como secreto?","a":"Porque el detector de TruffleHog toma cualquier palabra de 40 caracteres alfanuméricos como un secreto verificado y rompe el CI. Hay nombres de test que justo miden 40."},{"q":"¿Qué es el tooling local?","a":"Carpetas de herramientas del editor o del agente, como .serena o .idea. Un git add -A las mete en el PR de otra persona sin que te des cuenta."},{"q":"¿Cuándo dice «limpio»?","a":"Solo cuando pudo comparar y no encontró nada. Si no puede comparar, por ejemplo con una rama base que no existe, se niega a decir limpio."},{"q":"¿Puedo correrlo yo, sin el agente?","a":"Sí: son scripts sueltos. Parado en tu repo, corrés sweep.sh con la rama base. Lo mismo con check-attribution.sh."}],"steps":[{"type":"ask","text":"Voy a pushear: pasá el sweep y chequeá que nada indique que lo hizo un LLM","source":"inferido","notes":"Dos pedidos en una frase. La skill los resuelve con dos scripts: el sweep y el chequeo de atribución. Es un segundo push: ya hay PRs abiertos y la persona vuelve a pedir el chequeo antes de empujar un cambio nuevo."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/sweep.sh main","out":["── sweeping fix/descuento-sin-tope against main ──","✗ 40-char identifiers (TruffleHog Lob false positive):","    api/tests/test_orders.py:test_discount_above_100_keeps_total_zero","✗ local tooling in the diff:","    .serena/project.yml","✓ no LLM attribution (commits, diff, branch, GitHub, Jira)","· no pinned action SHAs to verify","✓ no mutable action refs","","sweep found problems — fix before pushing","# exit 1"],"source":"inferido","cwd":"~/mi-servicio","notes":"Dos problemas, y los dos son de los que no se ven a simple vista. Un nombre de test de exactamente 40 caracteres, que TruffleHog tomaría por un secreto, y un archivo de .serena dentro del diff, que se coló con un git add -A. Inferido: el sweep usa rg, que no está en la captura; la salida sigue la de la documentación."},{"type":"say","md":"No pusheo. El sweep encontró dos problemas:\n- Un nombre de test de 40 caracteres en `api/tests/test_orders.py`: el detector de TruffleHog lo marcaría como secreto.\n- Un archivo de `.serena/` en el diff.\n\nLos saco, enmiendo el commit y vuelvo a correr el sweep.","source":"inferido","notes":"El agente se frena solo y dice por qué. No empuja «y vemos en CI». Es el valor del sweep: el error cuesta un minuto acá y una tarde en un PR ajeno."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/sweep.sh main","out":["── sweeping fix/descuento-sin-tope against main ──","✓ no 40-char identifiers","✓ no local tooling files","✓ no LLM attribution (commits, diff, branch, GitHub, Jira)","· no pinned action SHAs to verify","✓ no mutable action refs","","sweep clean","# exit 0"],"source":"inferido","cwd":"~/mi-servicio","notes":"Después de arreglar, el mismo comando. Fijate el punto en «no pinned action SHAs»: no es un tilde, es un punto. Significa que no había nada para chequear, no que se chequeó y estaba bien. La skill distingue las dos cosas a propósito."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/check-attribution.sh main","out":["── attribution sweep: fix/descuento-sin-tope vs main ──","✓ commits clean (author, committer, body, trailers)","✓ diff contents clean","✓ branch name clean","✓ GitHub clean (4 items, 0 with own comments)","· skipped Jira (env vars not set)","","no attribution found on any reachable surface","# exit 0"],"source":"inferido","cwd":"~/mi-servicio","notes":"El segundo pedido: que nada indique que lo hizo un asistente. Mira los commits, el diff, la rama, los PRs y issues de GitHub y, si hay credenciales, Jira. Fijate la última línea: dice «en cualquier superficie alcanzable», no «sin atribución». Lo que no pudo leer figura como salteado con un punto, nunca como limpio."}]},{"id":"jira-y-review","title":"Otro caso: Jira y la review","subtitle":"Vincular los PRs a un ticket y contestar al revisor automático","screen":"cursor-agent","faq":[{"q":"¿Crea tickets en Jira por cada hallazgo?","a":"No. Los hallazgos van a issues de GitHub. Con Jira la skill solo comenta en tickets que ya existen y vincula PRs."},{"q":"¿Por qué no renombra la rama?","a":"Porque, según la documentación de GitHub, si renombrás la rama de un PR abierto, el PR se cierra. Para PRs que ya existen, la clave va en el título."},{"q":"¿Por qué la clave va al final del título?","a":"Para no romper el prefijo de los conventional commits, como fix:. Jira escanea el título entero, así que lo encuentra igual. Y la clave va en mayúsculas."}],"steps":[{"type":"ask","text":"Vinculá estos PRs al ticket PLAT-123","source":"inferido","notes":"Un pedido corto. Jira vincula un PR cuando la clave aparece en el nombre de la rama, en un commit o en el título del PR."},{"type":"say","md":"Los PRs #23 y #24 ya existen, así que **no renombro sus ramas**: GitHub cierra un PR si se renombra su rama.\n\nLes agrego la clave al final del título: `fix: … (PLAT-123)`.","source":"inferido","notes":"Esta es la regla que más cuesta aprender a las malas. La rama de un PR abierto no se toca. El título sí, y es no destructivo. Si ya sabías el ticket antes de empezar, la clave se pone en el nombre de la rama desde el principio."},{"type":"tool","label":"Ran · gh pr edit 23 y gh pr edit 24 · título con (PLAT-123)","source":"inferido","notes":"Dos comandos, uno por PR. Escribe en GitHub, pero sobre PRs que la persona ya aprobó publicar en esta misma conversación."},{"type":"ask","text":"Contestá los comentarios del revisor automático","source":"inferido","notes":"Después de publicar, llegan los comentarios de un revisor automático. Son útiles, pero no tienen la última palabra."},{"type":"say","md":"Verifiqué cada comentario antes de contestar:\n- **Comentario 1: tiene razón.** El borde de la página 0 también falla; lo arreglo.\n- **Comentario 2: no tiene razón.** Muestro la prueba: el test pasa con el valor que él propone.\n\nRespondo en cada hilo con la evidencia, en las dos direcciones.","source":"inferido","notes":"Verificar en las dos direcciones es la idea: ni aceptar todo ni rechazar por reflejo. Si el comentario está mal por la razón que da pero bien en el efecto, la skill dice exactamente eso: es lo más útil para quien lee.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los tres tropiezos más comunes","screen":"terminal","faq":[{"q":"El agente no ofrece la skill, ¿qué hago?","a":"Casi siempre abriste la sesión antes de crear los enlaces. Abrí una sesión nueva y verificá a dónde apunta el enlace."},{"q":"¿Anda en Cursor pero no en Claude Code?","a":"Falta el segundo enlace, el de ~/.claude/skills. Pedile al agente que lo cree, o corrélo vos."},{"q":"¿Qué significa un 401 de Jira?","a":"Que el token venció o se revocó. No es un problema de permisos. Creá otro token y cambiá la variable."},{"q":"¿Se puede forzar la skill?","a":"Sí: escribí /auditing-repos en el chat. Pero normalmente se activa sola cuando pedís una auditoría."}],"steps":[{"type":"term","cmd":"readlink ~/.agents/skills/auditing-repos","out":["~/skills/teamwayofwork/skills/auditing-repos"],"source":"real","cwd":"~","notes":"Primer síntoma: el agente no ofrece la skill. Esto muestra a dónde apunta el enlace: tiene que ser la carpeta skills/auditing-repos de tu clon. Si no sale nada, el enlace no existe; si apunta a otro lado, el clon se movió. Y abrí una sesión nueva."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/sweep.sh nope","out":["✗ base ref 'nope' does not resolve — cannot diff, refusing to report clean","  available: main ","  pass one explicitly: sweep.sh \u003cbase-ref\u003e","# exit 2"],"source":"real","cwd":"~/mi-servicio","notes":"Segundo síntoma: la rama base no existe. El sweep se niega a decir limpio y sale con código 2. Muestra qué ramas hay y cómo pasarla explícita. Un chequeo que pasa en silencio cuando no pudo correr es peor que no tener chequeo."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/preflight.sh | grep -A2 '^jira auth'","out":["jira auth                  HTTP 401 — token expired or revoked, NOT a permissions problem","  note                     an unauthenticated Jira returns 404 for real tickets. Never conclude","                           'the ticket does not exist' from a 404 while /myself returns 401."],"source":"inferido","cwd":"~/mi-servicio","notes":"Tercer síntoma, con Jira: un 401 es un token vencido, no un tema de permisos. Lo importante es la nota: una Jira sin autenticar devuelve 404 para tickets que sí existen, así que jamás se concluye «el ticket no existe» mientras el 401 siga. Inferido: necesita credenciales y red."}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Cuándo la uso?","a":"Cuando vas a entregar un repo a otro equipo, antes de clonar una plantilla muchas veces, o cuando querés que los hallazgos terminen en issues y PRs."},{"q":"¿Sirve para revisar un PR?","a":"No. Para un diff puntual usá el revisor de tu host, por ejemplo /code-review. Esta skill es para un repositorio entero."},{"q":"¿Qué necesito para el próximo episodio?","a":"Lo mismo del episodio 0. Cada episodio empieza instalando su skill."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Un hallazgo sin verificar no es un hallazgo:** cada cosa que se publica salió de ejecutar algo, y lo que no, se reporta pero no sale.\n- **Una compuerta antes de publicar:** el agente frena con el informe y espera tu respuesta. Es una instrucción, no un candado: leé el informe.\n- **Nada indica que lo hizo un asistente:** ni en commits ni en issues ni en PRs, y el sweep lo comprueba.\n\n#### Próximo episodio: local-board-skill\nCómo mantener un tablero de tra it clone \u003crepo\u003e ~/skills/teamwayofwork","out":["Cloning into '~/skills/teamwayofwork'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo del equipo. Ojo: es un repo con varias skills adentro, y la que vamos a usar vive en la carpeta skills/local-board-skill. En \u003crepo\u003e va la dirección que te da tu equipo. Necesita red y acceso por SSH. La clave SSH sale del episodio 0, pero el acceso a este repo, que es de otra organización, se lo pedís al equipo dueño: si no te lo dieron, git clone responde «Permission denied» y no es un error tuyo. Paso inferido."},{"type":"term","cmd":"mkdir -p ~/.agents/skills ~/.claude/skills","out":[],"source":"real","cwd":"~","notes":"Creamos las dos carpetas donde los agentes buscan skills, por si no existen. Si ya existen, no pasa nada: el -p lo tolera."},{"type":"term","cmd":"cd ~/skills/teamwayofwork \u0026\u0026 ln -s \"$PWD/skills/local-board-skill\" ~/.agents/skills/local-board-skill","out":[],"source":"real","cwd":"~","notes":"El enlace para Cursor. Es un acceso directo a la carpeta de la skill dentro de tu clon, no una copia. Cursor busca en ~/.agents/skills."},{"type":"term","cmd":"ln -s ../../.agents/skills/local-board-skill ~/.claude/skills/local-board-skill","out":[],"source":"real","cwd":"~","notes":"El segundo enlace es para Claude Code, que busca en ~/.claude/skills. Si solo usás Cursor podrías saltearlo, pero conviene dejarlo: es gratis y la serie siguiente usa Claude Code. Apunta al primer enlace, así hay un solo camino hasta tu clon."},{"type":"term","cmd":"head -4 ~/.claude/skills/local-board-skill/SKILL.md","out":["---","name: local-board-skill","description: \"Use when bootstrapping a local work board, analyzing commits since its last sync, relating specs and tickets, reconciling historical Git evidence, or preparing and applying an approved Jira sync.\"","compatibility: \"Requires python3 (standard library only) and git. Syncing with Jira also needs the JIRA_EMAIL and JIRA_API_TOKEN environment variables plus JIRA_BASE_URL or JIRA_CLOUD_ID.\""],"source":"real","cwd":"~","notes":"Comprobamos leyendo la cabecera del SKILL.md a través del enlace: si se ve, el enlace anda. Fijate en la línea compatibility: pide python3 y git, y avisa que las credenciales de Jira hacen falta solo para sincronizar. Todo lo demás es local."},{"type":"term","cmd":"python3 -m unittest discover -s ~/.agents/skills/local-board-skill/tests -p 'test*.py' 2\u003e\u00261 | grep -E '^(Ran |OK$|FAILED)'","out":["Ran 39 tests in 0.143s","OK"],"source":"real","cwd":"~","notes":"La comprobación que trae la skill: sus tests. Corren sin red y sin Jira, con Jira falso adentro. Tiene que terminar en OK. El número de tests puede cambiar entre versiones: lo que importa es el OK. Si ves FAILED, frená acá y no sigas: lo que venga después se apoya en esto. Las credenciales de Jira no se piden ahora: el archivo donde van lo crea la skill junto con el board, y lo vemos en el caso principal.","pause":true}]},{"id":"caso-principal","title":"Caso principal","subtitle":"Armar el board, traer la evidencia y sincronizar con un plan","screen":"cursor-full","faq":[{"q":"¿El board reemplaza a Jira?","a":"No. El board vive en archivos Markdown junto al código y Jira es la última etapa: se llega ahí recién con un plan revisado."},{"q":"¿Por qué cada hijo exige su padre?","a":"Porque la jerarquía es épica, historia, tarea y subtarea, y cada nivel cuelga del anterior. Si el padre no existe o es de otro tipo, el script no crea nada y te dice por qué."},{"q":"¿Qué es la evidencia?","a":"Los commits, specs y PRs que sustentan cada tarea. Un grafo las relaciona, y los scripts rechazan nodos sueltos antes de que algo llegue a Jira."},{"q":"¿Quién aprueba el plan?","a":"Vos, leyéndolo. No hay ventana ni candado: la aprobación es una práctica de la skill, guardar el plan, revisarlo y aplicar ese mismo plan."}],"steps":[{"type":"ask","text":"Armame un board local para este proyecto: una épica «Devoluciones de pedidos», una historia de cajero y una tarea que limite el descuento","source":"inferido","notes":"Una frase alcanza: no le explicamos el método ni los scripts, la skill se activa sola con «armame un board» o «preparame el plan de sync». Parado en el repo del proyecto, no en el de la skill."},{"type":"tool","label":"Read · ~/.agents/skills/local-board-skill/SKILL.md","source":"inferido","notes":"Cursor carga la skill. Su SKILL.md está en inglés a propósito: lo lee el modelo, no vos. Define tres modos: armar desde cero, analizar desde el último sync y reconciliar la historia. Esto es el primero."},{"type":"term","cmd":"python3 ~/.agents/skills/local-board-skill/scripts/init_board.py --board-dir board --name 'Servicio DEMO' --jira-project-key PLAT --jira-label mi-servicio --entity-id-prefix SRV","out":["Initialized ~/mi-servicio/board"],"source":"real","cwd":"~/mi-servicio","notes":"Crea la estructura: un Board.md con la configuración, una carpeta _meta con documentación y una carpeta sync con el grafo y el estado. Todavía no habla con Jira: el proyecto y la etiqueta solo se anotan en el índice."},{"type":"term","cmd":"python3 ~/.agents/skills/local-board-skill/scripts/create_asset.py --board-dir board --type epic --summary 'Devoluciones de pedidos'","out":["Created SRVE01: SRVE01-devoluciones-de-pedidos/SRVE01.md"],"source":"real","cwd":"~/mi-servicio","notes":"Crea la épica. El identificador lo genera la skill desde el prefijo: SRV, más E de épica, más un número. El siguiente paso lo usa como padre."},{"type":"term","cmd":"python3 ~/.agents/skills/local-board-skill/scripts/create_asset.py --board-dir board --type story --parent SRVE01 --summary 'Como cajero, devuelvo un pedido'","out":["Created SRVS01: SRVE01-devoluciones-de-pedidos/SRVS01-como-cajero-devuelvo-un-pedido/SRVS01.md"],"source":"real","cwd":"~/mi-servicio","notes":"La historia cuelga de la épica con --parent. Cada hijo valida a su padre: una historia solo puede colgar de una épica."},{"type":"term","cmd":" <script>
// Pure navigation over an episode: the global index is the flattened list of
// (chapter card + its steps). No DOM, no state.
// keyAction(KeyboardEvent.key) -> "right" | "left" | "space" | "b" | null: the presenter
// keys, shared by the control and the stage. PageDown/PageUp act as the arrows because
// presentation clickers send them.
var Nav = (function () {
  function flatten(ep) {
    var out = [];
    (ep.chapters || []).forEach(function (ch, i) {
      out.push({chapter: i, step: -1, kind: "card"});
      (ch.steps || []).forEach(function (st, j) {
        out.push({chapter: i, step: j, kind: st.type});
      });
    });
    return out;
  }

  function clamp(ep, i) {
    var last = flatten(ep).length - 1;
    return Math.max(0, Math.min(Math.floor(i) || 0, Math.max(last, 0)));
  }

  function nextChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    for (var k = i + 1; k < flat.length; k++) {
      if (flat[k].step === -1) return k;
    }
    return Math.max(flat.length - 1, 0);
  }

  function prevChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var cur = i;
    while (cur > 0 && flat[cur].step !== -1) cur--;
    if (cur < i) return cur;
    for (var k = i - 1; k >= 0; k--) {
      if (flat[k].step === -1) return k;
    }
    return 0;
  }

  function keyAction(key) {
    if (key === "ArrowRight" || key === "PageDown") return "right";
    if (key === "ArrowLeft" || key === "PageUp") return "left";
    if (key === " " || key === "Spacebar") return "space";
    if (key === "b" || key === "B") return "b";
    return null;
  }

  function position(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var e = flat[i] || {chapter: 0, step: -1};
    var ch = (ep.chapters || [])[e.chapter] || {};
    return {chapter: e.chapter, step: e.step, total: flat.length, chapterTitle: ch.title};
  }

  return {flatten: flatten, clamp: clamp, nextChapter: nextChapter,
          prevChapter: prevChapter, position: position, keyAction: keyAction};
})();

</script>
<script>
// Static render of the stage: Render.step(container, episode, index) replaces the
// container's content with the FINISHED state of global index `index` (see nav.js).
// Pure function of (episode, index): nothing is kept between calls.
//
// Screens are laid out for a fixed 1600x900 canvas (.ws-screen); the stage scales it.
// All episode text goes through textContent / createTextNode; `say` markdown is parsed
// into DOM nodes, never assigned as HTML.
//
// Animation hooks (for animate.js, which renders the finished state, hides, reveals):
//   data-step="<j>"      on the root node of every applied step (j = index of the step
//                        inside its chapter). Nothing else carries data-step. Steps may
//                        live in different areas (a cursor-full term with `in: "zsh"`
//                        sits in the zsh panel, approve is an overlay at the end of the
//                        screen root), so document order is not step order: select by value.
//   data-anim="type"     the element holding exactly the text that gets typed
//                        (ask text, term command).
//   data-anim="line"     an output line, a say paragraph / heading / list item; revealed
//                        one at a time.
//   data-anim="node"     tool, worked and approve nodes (and the "▸ Ran · cmd" chip and
//                        the "⏺ Bash(cmd)" line); revealed whole.
//   hidden               an approve step that is not the current index keeps its node
//                        (so the step count holds) but is hidden: the window closed.
//   data-anim="idle"     the wrapper of the waiting prompt (prompt line + "❯ █") at the
//                        end of the terminal and of the cursor-full zsh panel. It is not
//                        a step: hide it while a term step animates, show it at the end.
//
// Prompt clock: every prompt shows Render.now() as HH:MM:SS (local time) in a
// .ws-time span. Render.now defaults to `new Date()`; tests and render-preview replace it
// with a fixed date so the output stays deterministic. The stage refreshes only the idle
// prompt's .ws-time every second (Stage.tickClock); steps are never re-rendered for it.
// Prompt icons (folder, house, clock) are inline SVG built with createElementNS.
// Unmarked descendants of a step root appear with the root; hooks inside one root are
// revealed in document order. Chapter cards carry no hooks and appear whole.
//
// Term placement on cursor-full: by default a term step is the agent's command and
// renders in the conversation exactly as on cursor-agent ("▸ Ran · cmd" chip + output
// block). With `in: "zsh"` it is a command the person types and renders in the
// integrated zsh (prompt, typed command, output lines).
// The first chapter card also shows the episode pitch («Le decís al agente…» /
// «Y la skill…») under its title; it is part of the card, not a separate index.
var Render = (function () {
  var USER = "Persona del equipo";
  var TEAM = "Equipo";
  var MODEL = "Sonnet 5.5";
  var BRANCH = "main";

  // ---- DOM helpers (text only) ----
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }
  function stepNode(tag, cls, j, anim) {
    var n = el(tag, cls);
    n.setAttribute("data-step", String(j));
    if (anim) n.setAttribute("data-anim", anim);
    return n;
  }
  function anim(node, kind) { node.setAttribute("data-anim", kind); return node; }
  function dots() {
    return add(el("div", "ws-dots"), el("i", "ws-dot ws-dot-r"), el("i", "ws-dot ws-dot-y"),
               el("i", "ws-dot ws-dot-g"));
  }
  // A bottom-anchored area: short content sits on top, long content shows its newest part.
  function scroller(cls) {
    var outer = el("div", "ws-scroll " + cls);
    var flow = el("div", "ws-flow");
    outer.appendChild(flow);
    return {outer: outer, flow: flow};
  }

  // ---- tiny markdown: **b**, `code`, "- " lists, "#### " heading, blank line = paragraph ----
  function inline(parent, text) {
    String(text).split(/(\*\*[^*]+?\*\*|`[^`]+`)/).forEach(function (part) {
      if (!part) return;
      if (/^\*\*[^*]+?\*\*$/.test(part)) parent.appendChild(el("strong", null, part.slice(2, -2)));
      else if (/^`[^`]+`$/.test(part)) parent.appendChild(el("code", null, part.slice(1, -1)));
      else parent.appendChild(document.createTextNode(part));
    });
    return parent;
  }
  function markdown(md) {
    var frag = document.createDocumentFragment();
    var para = [], list = null;
    function flushPara() {
      if (para.length) frag.appendChild(anim(inline(el("p"), para.join(" ")), "line"));
      para = [];
    }
    String(md || "").split("\n").forEach(function (raw) {
      var line = raw.replace(/\s+$/, "");
      if (/^- /.test(line)) {
        flushPara();
        if (!list) { list = el("ul"); frag.appendChild(list); }
        list.appendChild(anim(inline(el("li"), line.slice(2)), "line"));
        return;
      }
      list = null;
      if (/^#### /.test(line)) {
        flushPara();
        frag.appendChild(anim(inline(el("h4"), line.slice(5)), "line"));
      } else if (!line) {
        flushPara();
      } else {
        para.push(line);
      }
    });
    flushPara();
    return frag;
  }

  // ---- shared pieces ----
  function workedText(st) { return "Worked for " + (st.seconds || 0) + "s"; }
  function inRepo(cwd, repo) {
    var home = "~/" + repo;
    return cwd === home || cwd.indexOf(home + "/") === 0;
  }
  // ---- prompt clock and icons ----
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function clockText(d) {
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }
  function nowText() { return clockText(api.now()); }
  var SVG_NS = "http://www.w3.org/2000/svg";
  // Each icon: list of [tag, attributes] on a 16x16 viewBox; colour comes from currentColor.
  var ICONS = {
    folder: [["path", {d: "M1.5 3.5a1 1 0 0 1 1-1H6l1.5 1.5h6a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z",
                        fill: "currentColor"}]],
    house: [["path", {d: "M8 1.5 15 7.5h-2V14H9.5v-4h-3v4H3V7.5H1z", fill: "currentColor"}]],
    clock: [["circle", {cx: "8", cy: "8", r: "6.25", fill: "none", stroke: "currentColor", "stroke-width": "1.5"}],
            ["path", {d: "M8 4.5V8l2.5 1.5", fill: "none", stroke: "currentColor", "stroke-width": "1.5",
                      "stroke-linecap": "round", "stroke-linejoin": "round"}]]
  };
  function icon(name) {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "ws-ico ws-ico-" + name);
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("aria-hidden", "true");
    ICONS[name].forEach(function (spec) {
      var n = document.createElementNS(SVG_NS, spec[0]);
      Object.keys(spec[1]).forEach(function (k) { n.setAttribute(k, spec[1][k]); });
      svg.appendChild(n);
    });
    return svg;
  }
  // "~/a/b" -> "~/a/" + <b>b</b>: the last path component in bold, like the real prompt.
  function pathText(seg, cwd) {
    var s = String(cwd), cut = s.lastIndexOf("/") + 1;
    if (cut > 0 && cut === s.length) cut = s.lastIndexOf("/", s.length - 2) + 1;
    if (cut > 0) seg.appendChild(document.createTextNode(s.slice(0, cut)));
    seg.appendChild(el("b", "ws-path-last", s.slice(cut)));
    return seg;
  }
  // Two-line zsh prompt, first line: apple, folder, branch, dotted fill, system, time.
  function promptLine(cwd, repo) {
    var p = el("div", "ws-prompt");
    add(p, el("span", "ws-seg ws-seg-apple", ""),
        pathText(add(el("span", "ws-seg ws-seg-path"), icon("folder")), cwd));
    if (inRepo(cwd, repo)) p.appendChild(el("span", "ws-seg ws-seg-git", "on ⑂ " + BRANCH));
    add(p, el("span", "ws-seg-fill"),
        add(el("span", "ws-seg ws-seg-sys", "system"), icon("house")),
        add(el("span", "ws-seg ws-seg-time", "at "), el("span", "ws-time", nowText()), icon("clock")));
    return p;
  }
  function cmdLine(cmd) {
    var l = el("div", "ws-cmdline");
    add(l, el("span", "ws-caret-prompt", "❯ "), anim(el("span", "ws-cmd", cmd), "type"));
    return l;
  }
  function idlePrompt(flow, cwd, repo) {
    var l = el("div", "ws-cmdline");
    add(l, el("span", "ws-caret-prompt", "❯ "), el("span", "ws-caret", " "));
    flow.appendChild(add(anim(el("div", "ws-idle"), "idle"), promptLine(cwd, repo), l));
  }
  // A shell term step: prompt, typed command, output lines.
  function shellStep(st, j, cwd, repo) {
    var n = stepNode("div", "ws-shell-step", j);
    add(n, promptLine(cwd, repo), cmdLine(st.cmd));
    (st.out || []).forEach(function (o) { n.appendChild(anim(el("div", "ws-out", o), "line")); });
    return n;
  }
  function approveOverlay(st, j, current) {
    var ov = stepNode("div", "ws-approve", j, "node");
    if (j !== current) ov.setAttribute("hidden", "");
    var win = el("div", "ws-approve-win");
    add(win, el("div", "ws-approve-icon"), el("div", "ws-approve-title", st.title));
    var body = el("div", "ws-approve-lines");
    (st.lines || []).forEach(function (l) { body.appendChild(el("div", "ws-approve-line", l)); });
    var btns = add(el("div", "ws-approve-btns"), el("button", "ws-btn ws-btn-cancel", "Cancelar"),
                   el("button", "ws-btn ws-btn-ok", st.button));
    add(win, body, btns);
    ov.appendChild(win);
    return ov;
  }
  function chapterSteps(ch, last) { return (ch.steps || []).slice(0, last + 1); }

  // ---- card ----
  function card(ep, ci) {
    var ch = ep.chapters[ci];
    var root = el("div", "ws-screen ws-card");
    var inner = el("div", "ws-card-inner");
    add(inner, el("div", "ws-card-kicker", cardSkill(ep) + " · " + (ci + 1) + " de " + ep.chapters.length),
        el("h1", "ws-card-title", ch.title),
        ch.subtitle ? el("p", "ws-card-sub", ch.subtitle) : null,
        ci === 0 ? pitch(ep) : null);
    root.appendChild(inner);
    return root;
  }
  function pitch(ep) {
    var p = ep.pitch;
    if (!p || (!p.ask && !p.does)) return null;
    var box = el("div", "ws-card-pitch");
    if (p.ask) add(box, el("div", "ws-card-pitch-k", "Le decís al agente…"), el("div", "ws-card-pitch-ask", p.ask));
    if (p.does) add(box, el("div", "ws-card-pitch-k", "Y la skill…"), el("div", "ws-card-pitch-does", p.does));
    return box;
  }
  // Kicker name: the episode title (equals skill.repo for skill episodes; episode 0 has
  // its own title).
  function cardSkill(ep) { return ep.title || (ep.skill && ep.skill.repo) || ""; }

  // ---- Cursor (full and agent-only) ----
  function cursorSidebar(ep, ch) {
    var ws = ep.workspace || {};
    var sb = el("div", "ws-sb");
    sb.appendChild(dots());
    ["✎ New Chat", "⌕ Search", "◷ Automations", "⚙ Customize"].forEach(function (t) {
      sb.appendChild(el("div", "ws-sb-nav", t));
    });
    add(sb, el("div", "ws-sb-sec", "Repositories"), el("div", "ws-sb-repo", "▭ " + (ws.repo || "")));
    var cur = add(el("div", "ws-sb-chat ws-on"), el("span", "ws-sb-chat-t", ch.title), el("b", null, "now"));
    sb.appendChild(cur);
    (ws.chats || []).forEach(function (c) {
      sb.appendChild(add(el("div", "ws-sb-chat"), el("span", "ws-sb-chat-t", c.title), el("b", null, c.age)));
    });

<script>
// Forward animation of ONE step, plus the playback policy as pure functions.
//
// Animate.run(container, episode, index, opts) -> {cancel(), done: Promise}
//   Renders the finished state with Render.step(container, episode, index), hides the
//   current step's hooks (see render.js header) and reveals them in document order on
//   the injected scheduler, so it looks like the step at `index` playing on top of
//   Render.step(index - 1). Both completion and cancel() end with a fresh
//   Render.step(container, episode, index): the final DOM is identical by construction.
//   `done` resolves in both cases (never rejects). A new run on the same container
//   cancels the previous one first, and a reveal that throws ends the run in the final
//   state too.
// Animate.stop(container): cancels the active run on `container` without rendering
//   (call it before a static Render.step, e.g. on a back-step).
//   opts: {speed = 1 (clamped to >= 0.1), schedule(fn, ms) -> id = setTimeout,
//          unschedule(id) = clearTimeout, now() = Date.now (accepted, not used: every
//          wait goes through schedule)}.
//
// Timing (every value is divided by speed):
//   type  28 ms per character (code points), the text grows one character per tick
//   line  120 ms per line / say block
//   node  250 ms, then the node appears whole (tool, worked, chips)
//   fade  250 ms for a card and an approve window: opacity 0 until the tick
//   autoplay delay between steps 900 ms
// Animate.stepDuration walks the same plan the animation schedules, so the estimate
// and the playback cannot drift apart.
var Animate = (function () {
  var CHAR_MS = 28;
  var LINE_MS = 120;
  var NODE_MS = 250;
  var FADE_MS = 250;
  var AUTOPLAY_MS = 900;
  var MIN_SPEED = 0.1;

  function speedOf(s) {
    s = Number(s);
    if (!(s > 0)) s = MIN_SPEED;
    return Math.max(s, MIN_SPEED);
  }
  function chars(text) { return Array.from(String(text || "")); }
  function hide(n) { n.style.display = "none"; }
  function show(n) { n.style.display = ""; }

  // Render the finished state into `container`, hide what the step at `index` adds and
  // return the reveal plan: [{ms, fn}] in order (ms already divided by speed).
  function prepare(container, ep, index, speed) {
    Render.step(container, ep, index);
    var flat = Nav.flatten(ep);
    if (!flat.length) return [];
    var e = flat[Nav.clamp(ep, index)];
    var plan = [];
    var screen = container.firstChild;
    if (e.step === -1) {
      screen.style.opacity = "0";
      plan.push({ms: FADE_MS / speed, fn: function () { screen.style.opacity = "1"; }});
      return plan;
    }
    var root = container.querySelector('[data-step="' + e.step + '"]');
    if (!root) return plan;
    var step = ep.chapters[e.chapter].steps[e.step];
    // The idle prompt lives in the zsh panel (cursor-full) and on the terminal screen: hide
    // it only when this step plays in that same flow, not for a chat-placed agent command.
    if (step.type === "term" && (step["in"] === "zsh" || ep.chapters[e.chapter].screen === "terminal")) {
      var idle = container.querySelector('[data-anim="idle"]');
      if (idle) hide(idle);
    }
    var hooks = [];
    if (root.hasAttribute("data-anim")) hooks.push(root);
    Array.prototype.forEach.call(root.querySelectorAll("[data-anim]"), function (n) { hooks.push(n); });
    hooks.forEach(function (n) {
      var kind = n.getAttribute("data-anim");
      if (kind === "type") {
        var cs = chars(n.textContent);
        n.textContent = "";
        cs.forEach(function (_, k) {
          plan.push({ms: CHAR_MS / speed, fn: function () { n.textContent = cs.slice(0, k + 1).join(""); }});
        });
      } else if (kind === "line") {
        hide(n);
        plan.push({ms: LINE_MS / speed, fn: function () { show(n); }});
      } else if (kind === "node" && step.type === "approve" && n === root) {
        n.style.opacity = "0";
        plan.push({ms: FADE_MS / speed, fn: function () { n.style.opacity = "1"; }});
      } else if (kind === "node") {
        hide(n);
        plan.push({ms: NODE_MS / speed, fn: function () { show(n); }});
      }

  var active = typeof WeakMap === "function" ? new WeakMap() : null;
  function getActive(c) { return active ? active.get(c) : c.__wsAnimRun; }
  function setActive(c, r) { if (active) active.set(c, r); else c.__wsAnimRun = r; }
  function clearActive(c, r) {

    if (active) active.delete(c); else delete c.__wsAnimRun;

  // Cancel any active run on `container` without rendering (its `done` resolves).
  function stop(container) {
    var r = getActive(container);
    if (r) r.abort();
  }

  function run(container, ep, index, opts) {

    var speed = speedOf(opts.speed === undefined ? 1 : opts.speed);
    var schedule = opts.schedule || function (fn, ms) { return setTimeout(fn, ms); };
    var unschedule = opts.unschedule || function (id) { clearTimeout(id); };

    var done = new Promise(function (resolve) { resolveDone = resolve; });

    setActive(container, handle);

    function end(render) {
      if (finished) return;
      finished = true;
      if (timer !== null) { unschedule(timer); timer = null; }
      clearActive(container, handle);
      if (render) Render.step(container, ep, index);
      resolveDone();
    }
    function next(k) {
      if (finished) return;
      if (k >= plan.length) { end(true); return; }
      timer = schedule(function () {
        timer = null;
        if (finished) return;
        try {
          plan[k].fn();
        } catch (err) {
          // A broken reveal must not stall playback: jump to the final state.
          if (typeof console !== "undefined") console.error("Animate: reveal failed", err);

        next(k + 1);
