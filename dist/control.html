o de la skill: son dos ln -s, uno para Cursor y otro para Claude Code. A diferencia del script, ln -s no borra nada: si el destino existe, falla."},{"q":"El clone dice «Permission denied», ¿qué hago?","a":"Falta acceso a este repo, que es de otra organización. Pedíselo al equipo dueño; la clave SSH del episodio 0 sirve en cuanto te lo den."},{"q":"El instalador pide usuario y contraseña de GitHub, ¿qué hago?","a":"El script trae la skill por HTTPS desde un repo interno de otra organización. Si no tenés credenciales de git para HTTPS, corré gh auth login (elegí HTTPS) o gh auth setup-git, y volvé a correr el instalador. Si dice «not found», te falta el acceso: pedíselo al equipo dueño."}],"steps":[{"type":"term","cmd":"git clone \u003crepo\u003e ~/skills/teamwayofwork","out":["Cloning into '~/skills/teamwayofwork'..."],"source":"inferido","notes":"Primero bajamos el repo del equipo. En \u003crepo\u003e va la dirección que te da tu equipo. Necesita red y acceso por SSH. La clave SSH sale del episodio 0, pero el acceso a este repo, que es de otra organización, se lo pedís al equipo dueño: si no te lo dieron, git clone responde «Permission denied» y no es un error tuyo. Paso inferido.","cwd":"~"},{"type":"term","cmd":"ls ~/skills/teamwayofwork/skills/install-unified-ci","out":["README.md","docs","scripts"],"source":"real","notes":"Mirá bien lo que hay en esta carpeta: un README, la documentación y un script. No hay SKILL.md. Esta es la particularidad de la skill de hoy: el repo trae solo el instalador, y la skill de verdad vive en otro repo. Por eso no hacemos un enlace nosotros: lo hace el script. Y una aclaración sobre las versiones: la skill sale de la rama main de ese otro repo, y este episodio la sigue tal como estaba el 16 de octubre de 2026; si cambió desde entonces, puede haber diferencias.","cwd":"~"},{"type":"term","cmd":"grep -nE 'rm -rf|reset --hard' ~/skills/teamwayofwork/skills/install-unified-ci/scripts/install.sh","out":["22:  git -C \"${CACHE_DIR}\" reset --hard FETCH_HEAD","34:rm -rf \"${TARGET_DIR}\"","40:rm -rf \"${CLAUDE_DIR}/install-unified-ci\"","46:  rm -rf \"${HOME}/.omp/skills/install-unified-ci\""],"source":"real","notes":"Antes de correr un script que no escribiste, leelo. Acá filtramos las líneas que importan: los rm -rf, uno por cada destino, y el reset --hard. El script borra lo que haya en los destinos antes de enlazar, y descarta cambios locales de su cache. Si tenías una copia tuya de esta skill en esas carpetas, se pierde. Decilo en voz alta: es la advertencia más importante del capítulo.","cwd":"~"},{"type":"term","cmd":"cd ~/skills/teamwayofwork \u0026\u0026 ./skills/install-unified-ci/scripts/install.sh","out":["=== Instalador de skill: install-unified-ci ===","Obteniendo la skill desde https://github.com/\u003corg\u003e/core-architecture-gh-workflows.git (main)...","✓ Enlazado a ~/.agents/skills/install-unified-ci -\u003e ~/.cache/core-architecture-gh-workflows/skills/install-unified-ci","✓ Enlazado a ~/.claude/skills/install-unified-ci","","✅ Skill install-unified-ci instalada correctamente desde origin/main.","Probá ejecutar en tu agente: /install-unified-ci o 'revisá si este repo puede usar el CI unificado'."],"source":"inferido","notes":"Un solo comando hace todo: baja la skill a una cache en tu carpeta personal y crea los enlaces para Cursor y para Claude Code. Es el mismo comando para instalar y para actualizar. Necesita red, así que el paso es inferido; en tu pantalla la dirección sale completa y las rutas son las tuyas. Fijate que termina con el mensaje de «instalada correctamente»: si no lo ves, algo falló.","cwd":"~"},{"type":"term","cmd":"ls -l ~/.agents/skills/install-unified-ci/SKILL.md","out":["-rw-r--r--  1 demo  staff  3412 17 oct 11:00 ~/.agents/skills/install-unified-ci/SKILL.md"],"source":"inferido","notes":"La comprobación de la instalación: ahora sí aparece el SKILL.md, a través del enlace. Después abrí una sesión nueva del agente: una que estaba abierta antes de instalar no se entera. Salida inferida: el tamaño y la fecha son de ejemplo.","cwd":"~","pause":true}]},{"id":"caso-principal","title":"Caso principal","subtitle":"Pedir la migración: la skill arma la rama, el PR y el resumen","screen":"cursor-full","faq":[{"q":"¿Por qué no me pregunta antes de cambiar nada?","a":"Porque pedir «adoptá el CI unificado» ya es la confirmación: la skill no hace una pregunta más. Lo que te protege es que trabaja en su propia rama, nunca en la principal, que se frena sola si el repo es incompatible, y que el cambio llega como un PR que revisás vos."},{"q":"¿Quién hace el push y el PR?","a":"La skill, sola: pushea su rama y abre el PR sin pedirte permiso. Vos revisás y mergeás. Por eso conviene pedir la migración solo en un repo donde eso está bien. Si solo querés mirar, pedí una evaluación: no toca nada."},{"q":"¿Y si el CI del PR falla?","a":"La skill mira el resultado. Si es un error de configuración suyo, lo corrige y vuelve a probar, hasta dos intentos. Si es deuda que ya tenía el repo (tests rotos, un escaneo de seguridad), no la esconde: la anota en el PR."},{"q":"¿Qué stacks entiende?","a":"Node, Go, Maven, Gradle, Python, Docker, Flutter y Kong. Si el repo mezcla dos lenguajes o no encaja en ninguno, frena y lo dice."}],"steps":[{"type":"ask","text":"Adoptá el CI unificado acá.","source":"inferido","notes":"El pedido es una frase, como se la dirías a una compañera. Para la skill es una migración: pediste instalar, no un juicio. Dos cosas para decir en voz alta: el árbol de trabajo tiene que estar limpio fuera de .github/workflows, y en esta modalidad la skill crea la rama, pushea y abre el PR sola. Y una aclaración: la skill escribe ci.yml, y publish.yml solo para librerías de Node, Maven o Gradle; el pitch lo simplifica."},{"type":"tool","label":"Read · ~/.agents/skills/install-unified-ci/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Primero clasifica el pedido en un modo: evaluación, migración o fuera de alcance. Después sigue un flujo de ocho pasos: perfilar, auditar, generar, podar, validar, abrir el PR, mirar el CI y reportar."},{"type":"term","cmd":"ls api","out":["mi_servicio","pyproject.toml","requirements.txt","tests"],"source":"real","notes":"Paso 1, perfilar el repo. Mira los manifiestos para reconocer el stack. Acá hay un requirements.txt y un pyproject.toml dentro de api: sin manifiesto en la raíz, la skill toma esa carpeta como el proyecto Python, y con pip el requirements.txt es obligatorio. Lectura pura.","cwd":"~/mi-servicio"},{"type":"term","cmd":"ls .github/workflows","out":["lint.yml","test.yml"],"source":"real","notes":"Paso 2, auditar el CI que hay hoy: dos workflows propios, uno de tests y otro de lint. Los compara con lo que el CI unificado ya hace. También es lectura pura.","cwd":"~/mi-servicio"},{"type":"say","md":"Es un pedido de **migración**.\n\n- **Stack:** Python. Detecté `api/requirements.txt` y `api/pyproject.toml`, y no hay manifiesto en la raíz: el proyecto es `api` y el gestor es `pip`.\n- **CI actual:** `test.yml` y `lint.yml`. No hay deploys directos a la nube, ni matrices multi-OS, ni migraciones en el runner.\n- **Gate:** **Parcial**. `test.yml` corre la suite unitaria que el CI unificado ya ejecuta; `lint.yml` es un chequeo propio y lo conservo.\n\nSigo con la migración.","source":"inferido","notes":"Esta es la parte que hay que mirar despacio. El agente dice el modo, el stack con la evidencia, y la clasificación del gate: completo, parcial o incompatible. Solo incompatible frena. Acá no pregunta si sigue: dice «sigo». Fijate también que el lint no se borra: la skill borra solo lo que puede demostrar que el unificado ya cubre. Respuesta inferida, con datos ficticios.","pause":true},{"type":"tool","label":"Ran · git switch -C chore/migrate-to-unified-ci origin/main","source":"inferido","notes":"Paso 3: crea su propia rama desde la principal del remoto. Antes comprobó que el árbol esté limpio y que no haya ya un PR abierto de esa migración. Si hay uno, frena. Todo este tramo es inferido."},{"type":"tool","label":"Wrote · .github/workflows/ci.yml","source":"inferido","notes":"Genera el ci.yml canónico para el stack. Como el repo no despliega, lo escribe sin el deploy a Platform. El contenido lo define la skill en su repo."},{"type":"tool","label":"Deleted · .github/workflows/test.yml","source":"inferido","notes":"Paso 4, podar: borra solo lo que el unificado reemplaza, y solo lo que estaba antes de escribir. El lint queda."},{"type":"tool","label":"Ran · validación local (YAML, secrets: inherit, sin \u003cPLACEHOLDER\u003e)","source":"inferido","notes":"Paso 5: antes de commitear revisa que el YAML sea válido, que tenga secrets: inherit y que no quede ningún campo sin completar."},{"type":"tool","label":"Ran · git commit, git push -u origin chore/migrate-to-unified-ci, gh pr create","source":"inferido","notes":"Paso 6. Remarcalo: acá la skill commitea, pushea y abre el PR, sin preguntarte. Necesita gh instalado y con sesión iniciada. Es el momento que más tiene que ver con tu decisión de pedir la migración."},{"type":"tool","label":"Ran · gh run watch","source":"inferido","notes":"Paso 7: mira la corrida del pull request. Corre tests, Sonar y los escaneos de seguridad; no corre el deploy ni publica nada. Si falla por configuración, corrige y reintenta, hasta dos veces; si es deuda previa del repo, no la esconde."},{"type":"say","md":"#### Resumen de la migración\n- **Stack y herramientas:** Python con `pip` (`api/requirements.txt`)\n- **Entrypoint:** el workflow reutilizable de Python del CI unificado, llamado desde `ci.yml` con `secrets: inherit`\n- **Parámetros en `with:`:** `package-manager: pip`, `python-version: '3.11'`, `python-project-directory: 'api'` y `skip-platform: true`\n- **Borrado:** `test.yml`\n- **Conservado:** `lint.yml`\n- **CI:** `PR checks passed`. `deploy not exercised`: el deploy no corre en esta rama.\n- **Deuda previa:** ninguna detectada\n\nAgregué este resumen on\n- Stack: Python (`pyproject.toml` en la raíz)\n- Gate: Incompatible\n- Blockers: `.github/workflows/deploy-ecs.yml` (deploy directo a AWS ECS); `.github/workflows/test.yml` (matriz con macOS y Windows); `.github/workflows/migrate-db.yml` (migraciones de base de datos en el runner)\n- Would delete: none\n- Would keep: todos los workflows\n- Would write: none","source":"inferido","notes":"Este es el formato fijo de la skill para una evaluación: stack, gate, bloqueos con el archivo y la regla, qué borraría, qué conservaría y qué escribiría. Una lista vacía se escribe «none». Y la skill se detiene ahí: no ofrece aplicar. Es el principio «cero roturas»: prefiere decirte los gaps antes que romper el CI. En pantalla el título se ve con dos numerales. Respuesta inferida, con datos ficticios.","pause":true}]},{"id":"actualizar","title":"Otro caso: mantenerla al día","subtitle":"Volver a correr el instalador, con sus advertencias","screen":"cursor-agent","faq":[{"q":"¿Cada cuánto actualizo?","a":"Cuando el equipo te avise de un cambio, o si algo se comporta distinto. Como siempre baja main, correrlo de nuevo te deja en lo último."},{"q":"¿Puedo fijar una versión?","a":"No: el script siempre baja la rama main del repo de la skill. Si la skill cambia, cambia para vos sin aviso."},{"q":"¿Pierdo algo si la actualizo?","a":"Los cambios locales en la cache, sí: el script hace reset --hard. Si editaste algo ahí, copialo antes."}],"steps":[{"type":"ask","text":"Volvé a correr ./skills/install-unified-ci/scripts/install.sh para actualizar la skill.","source":"inferido","notes":"Actualizar es el mismo comando que instalar: se lo podés pedir al agente. Es el cuarto paso de la guía de instalación. Ojo: el script borra cosas (rm -rf), así que decidir si se lo dejás correr al agente es tuyo."},{"type":"tool","label":"Ran · ./skills/install-unified-ci/scripts/install.sh","source":"inferido","notes":"El script ve que la cache ya existe y toma otro camino: fetch y reset --hard, en lugar de clonar. Después rehace los enlaces."},{"type":"say","md":"Listo, actualicé la skill: traje lo último de `main` y rehice los enlaces.\n\n- **Ojo:** el script siempre baja `main` y no fija una versión.\n- **Y:** abrí una sesión nueva del agente para que tome la versión nueva.","source":"inferido","notes":"Dos cosas para llevarse. Una: sin versión fija, la skill puede cambiar sin avisarte. Dos: sesión nueva. Mensaje del agente inferido.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los tres tropiezos más comunes","screen":"terminal","faq":[{"q":"¿El script dejó algo a medias?","a":"Si falla el clon o el fetch, el script corta con set -e antes de enlazar nada. Si lo corrés de nuevo, rehace todo."},{"q":"¿Cómo recupero una copia mía que se borró?","a":"Desde tu respaldo o tu repo: el script no guarda copia de lo que borra. Por eso conviene leerlo antes y avisarle al agente si tenías una."},{"q":"¿Y si la skill misma se detiene al migrar?","a":"Tiene dos frenos comunes: el árbol de trabajo tiene cambios fuera de .github/workflows, o ya hay un PR abierto de la migración. En ambos casos no sigue y lo dice. Necesita además gh instalado y con sesión."},{"q":"¿Cómo sé que quedó bien instalada?","a":"Con el ls -l del SKILL.md. Si aparece, el agente lo va a encontrar en una sesión nueva."}],"steps":[{"type":"term","cmd":"cd ~/skills/teamwayofwork \u0026\u0026 ./skills/install-unified-ci/scripts/install.sh","out":["=== Instalador de skill: install-unified-ci ===","Obteniendo la skill desde https://github.com/\u003corg\u003e/core-architecture-gh-workflows.git (main)..."],"source":"inferido","notes":"Primer tropiezo: el script termina sin el mensaje de «instalada correctamente». Pasa cuando falla el clon o el fetch, casi siempre por acceso al repo de la skill. El script usa set -e, así que corta ahí sin enlazar nada. Git imprime su propio error; revisá tu acceso y corrélo de nuevo. Salida inferida.","cwd":"~"},{"type":"term","cmd":"cd ~/skills/teamwayofwork \u0026\u0026 ./skills/install-unified-ci/scripts/install.sh","out":["=== Instalador de skill: install-unified-ci ===","Obteniendo la skill desde https://github.com/\u003corg\u003e/core-architecture-gh-workflows.git (main)...","❌ Error: no se encontró un SKILL.md válido en ~/.cache/core-architecture-gh-workflows/skills/install-unified-ci."],"source":"inferido","notes":"Segundo tropiezo: la descarga llegó pero sin SKILL.md. El script lo valida antes de tocar los enlaces y sale con error: no se enlazó nada. Lo que corresponde es avisarle al equipo dueño del repo de la skill. Salida inferida.","cwd":"~"},{"type":"term","cmd":"ls -l ~/.agents/skills/install-unified-ci/SKILL.md","out":["ls: ~/.agents/skills/install-unified-ci/SKILL.md: No such file or directory"],"source":"inferido","notes":"Tercer tropiezo: el agente no ofrece la skill. Primero comprobá que el archivo exista; si existe, casi seguro abriste la sesión antes de instalar. Cerrá el chat y abrí una nueva. Si no existe, repetí el instalador. Salida inferida.","cwd":"~"}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Cuándo la uso?","a":"Al sumar un servicio nuevo, al estandarizar un repo heredado con workflows propios o antes de decidir si un repo puede migrar."},{"q":"¿Puedo evaluar sin cambiar nada?","a":"Sí: pedí un juicio, por ejemplo «revisá si este repo puede usar el CI unificado». La evaluación termina con el reporte y no crea rama, ni edita archivos, ni abre un PR."},{"q":"¿Sirve para arreglar un ci.yml que ya existe?","a":"No. Corregir un caller existente o borrar workflows sin instalar el CI unificado queda fuera de alcance: la skill lo dice y se detiene."},{"q":"¿Qué necesito para el próximo episodio?","a":"Lo mismo del episodio 0. Cada episodio empieza instalando su skill."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Dos repos:** este trae el instalador y la skill vive en otro; el script baja la última `main` y enlaza, y borra lo que haya en los destinos.\n- **Migrar es pedir el PR:** la skill crea su rama, pushea y abre el PR sola. Vos revisás y mergeás.\n- **Para solo mirar, evaluá:** el reporte no cambia nada. Y si el repo no entra, frena y lista los bloqueos.\n\n#### Próximo episodio: arq-review\nCómo se revisa un pedido de proyecto con Arquitectura: se registra, se analiza contra las restricciones, se proponen opciones y queda un veredicto propuesto que firma una persona.","source":"inferido","notes":"Las tres ideas: la skill y su instalador viven separados; migrar abre el PR sola y lo revisás vos; evaluar no toca nada. Anticipá el próximo en una frase: pasamos del CI de un repo a la revisión de arquitectura de un proyecto entero, donde el agente prepara y los comandos que escriben en Jira los corrés vos, sin ventana de aprobación.","pause":true}]}]},{"id":"arq-review","series":"cursor","order":8,"title":"arq-review","pitch":{"ask":"Registrá el PRY-2026-0042: te pego la captura del pedido.","does":"Lleva la revisión de Arquitectura de un pedido de proyecto de punta a punta: lo registra tal cual desde la captura, te propone el triage para que lo confirmes vos, abre el ticket del requirente en el help desk y la épica en el board de trabajo, analiza con opciones y deja un veredicto propuesto. Escribe en Jira solo con un comando que corrés vos."},"skill":{"repo":"arq-review","commit":"acd5d98","date":"2026-10-12"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una vez por máquina: clonar, instalar y preparar el repo de reviews","screen":"terminal","faq":[{"q":"¿Qué necesito instalado?","a":"python3 3.9 o más y git. arq usa solo la biblioteca estándar: no hay nada que bajar con pip. Y acceso por SSH al repo de la herramienta, que es privado: la clave sale del episodio 0."},{"q":"¿Qué pasa si ya tengo una skill con el mismo nombre?","a":"El instalador no pisa nada que no sea un enlace: avisa cuál es y termina con error. Lo movés de lugar y lo corrés de nuevo. Repetirlo, en cambio, es seguro."},{"q":"¿Por qué hay dos repos, el de la herramienta y el de reviews?","a":"Porque arq trabaja sobre la carpeta donde estás parado. La herramienta no guarda reviews: los guarda el repo de reviews de tu equipo, junto con el registro de todo lo que se escribió en Jira."},{"q":"¿Y las credenciales de Jira?","a":"Solo hacen falta para los comandos con --apply y para arq ver. Creás un token de API sin alcance, lo guardás con un editor en un archivo .env fuera del repo de reviews y nunca lo pegás en el chat."}],"steps":[{"type":"term","cmd":"git clone git@github.com:josefigueredo/arch-review.git ~/skills/arq-review","out":["Cloning into '~/skills/arq-review'..."],"source":"inferido","notes":"Bajamos la herramienta. Es privada y va por SSH: «Permission denied» es falta de acceso (episodio 0). Inferido: necesita red.","cwd":"~"},{"type":"term","cmd":"cd ~/skills/arq-review \u0026\u0026 ./install.sh","out":["note: add ~/.local/bin to PATH to use arq","skills: arq-manager, arq-architect (Claude Code, Codex, Cursor) -\u003e ~/skills/arq-review/skills","cli: arq -\u003e ~/skills/arq-review/arq.py"],"source":"real","notes":"Un comando deja las dos skills y arq, con enlaces a tu clon. Fijate en el aviso: sin ~/.local/bin en el PATH, arq no se encuentra. Es el fallo más común.","cwd":"~"},{"type":"term","cmd":"~/.local/bin/arq --help | head -2","out":["usage: arq [-h]","           {init,path,new,show,triage,set,state,timebox,lint,jira,jsm,seguimiento,ver,link,eval} ..."],"source":"real","notes":"arq responde. Va la ruta completa porque la terminal de la grabación no tiene esa carpeta en el PATH; en tu máquina alcanza con arq.","cwd":"~"},{"type":"term","cmd":"ls ~/.agents/skills","out":["arq-architect","arq-manager"],"source":"real","notes":"Las dos skills quedaron donde Cursor las lee: arq-manager coordina y arq-architect revisa lo técnico. Cada una mira el estado del pedido y sabe si le toca. Abrí una sesión nueva del agente.","cwd":"~"},{"type":"term","cmd":"git clone \u003crepo-de-reviews\u003e ~/arq-reviews","out":["Cloning into '~/arq-reviews'..."],"source":"inferido","notes":"Ahora el repo de reviews de tu equipo: ahí vas a trabajar de acá en adelante. Se commitea, por eso el token no puede vivir adentro. Inferido: necesita red.","cwd":"~"},{"type":"term","cmd":"~/.local/bin/arq init","out":["creado .arq/config.json","creado reviews/"],"source":"real","notes":"arq init crea la configuración y la carpeta de reviews, sin pisar lo que existe. En el config.json van los dos proyectos de Jira: el board de trabajo y el help desk del requirente.","cwd":"~/arq-reviews"},{"type":"term","cmd":"ls -l ~/.config/arq","out":["total 8","-rw-------  1 persona  staff  138 19 oct 09:00 .env"],"source":"inferido","notes":"Las tres variables de Jira viven en un .env fuera del repo de reviews. El token sale de «Create API token» a secas. Lo escribís vos, nunca por el chat. Salida inferida.","cwd":"~","pause":true}]},{"id":"caso-principal","title":"Caso principal","subtitle":"De la captura de un pedido al Jira armado","screen":"cursor-full","faq":[{"q":"¿Por qué el agente no corre el --apply?","a":"Porque la skill lo prohíbe: lo que escribe en Jira siempre te lo da armado con un signo de exclamación para que lo corras vos. Tu control es el dry run que viste antes. Fijate que acá no aparece ninguna ventana de aprobación: es una diferencia con otras herramientas del taller."},{"q":"¿Quién contesta el triage?","a":"La persona que coordina, no el modelo. El agente propone sí o no citando la frase del pedido, y espera tu confirmación. Ante la duda, sí. Un solo sí da nivel complejo."},{"q":"¿Y si me equivoqué en el triage?","a":"Se puede repetir mientras no exista la épica. Con \nTranscribí la captura tal cual y leí `contract/triage.md`. Cada sí o no lleva el campo del pedido que lo justifica:\n- `multi_cuenta`: **sí**, Descripción: «de la cuenta de Producto a la cuenta de Datos»\n- `migracion`: **sí**, Tipo de trabajo: «Migración»\n- `fecha_comprometida`: **sí**, Fecha deseada: «No, no es negociable»\n- `otros_equipos`: **sí**, Equipos involucrados: «Finanzas y Soporte consumen los reportes»\n- `datos_sensibles_o_ia`: **sí**, Problema / mejora: «incluye facturación de clientes»\n- `larga_o_productiva`: **sí**, el pedido no dice cuánto dura y, ante la duda, el triage dice sí\n\nLas respuestas las confirmás vos, no yo. ¿Las dejo así?","source":"inferido","notes":"Cada propuesta cita un campo del formulario. La última: no hay campo de duración, y la regla es «ante la duda, sí»; así salió complejo un pedido real. Termina en pregunta: el agente espera a quien coordina."},{"type":"ask","text":"Casi todo bien. En otros_equipos es no: Finanzas y Soporte solo leen los reportes, no participan.","source":"inferido","notes":"La persona corrige al agente, y eso es lo esperado. Con un solo sí el nivel ya es complejo."},{"type":"term","cmd":"~/.local/bin/arq triage PRY-2026-0042 --answers \"multi_cuenta=si,migracion=si,fecha_comprometida=si,otros_equipos=no,datos_sensibles_o_ia=si,larga_o_productiva=si\"","out":["nivel: complejo"],"source":"real","notes":"Con las respuestas confirmadas, el nivel queda fijado. Se puede repetir mientras no exista la épica. Salida real.","cwd":"~/arq-reviews"},{"type":"ask","text":"Armá el Jira del PRY-2026-0042","source":"inferido","notes":"Segundo pedido, el que más se usa: abrir la épica de la revisión y el ticket donde conversa el requirente."},{"type":"term","cmd":"~/.local/bin/arq jira PRY-2026-0042 --html ~/PRY-2026-0042.html","out":["épica     [PRY-2026-0042] Migración del servicio de reportes  [pry:2026-0042 nivel:complejo]","  story   Intake y triage","    sub-task Normalizar pedido  [track:coordinacion]","    sub-task Triage  [track:coordinacion]","    sub-task Abrir ticket del requirente y plazo  [track:coordinacion]","  story   Análisis y opciones","    sub-task Gap check de input mínimo  [track:tecnica]","    sub-task Análisis vs constraints  [track:tecnica]","    sub-task Opciones y recomendación  [track:tecnica]","  story   Decisión y comunicación","    sub-task Revisión y firma  [track:tecnica]","    sub-task Publicar devolución  [track:coordinacion]","vista previa: ~/PRY-2026-0042.html","dry run: no se escribió nada. Para ejecutarlo, el usuario corre el mismo comando con --apply (en Claude Code, con !)."],"source":"real","notes":"Es el dry run: muestra el árbol de lo que se crearía y deja una vista previa. No necesita red ni credenciales. Fijate en la última línea: no se escribió nada. Salida real.","cwd":"~/arq-reviews"},{"type":"say","md":"#### Esto es lo que se crearía\nNo escribí nada en Jira. En el board de trabajo, una **épica**, **tres historias** (intake y triage, análisis y opciones, decisión y comunicación) y **ocho sub-tasks**; en el help desk, el ticket del requirente. Abrí `PRY-2026-0042.html` para verlo con su descripción.\n\nComo el nivel es `complejo`, te pregunto: ¿hace falta la historia opcional de **validación técnica**?","source":"inferido","notes":"El agente muestra y pregunta. Como es complejo, ofrece una cuarta historia opcional. No sigue sin un sí explícito."},{"type":"ask","text":"No hace falta. Seguí.","source":"inferido","notes":"El sí explícito que la skill espera antes de pasar a escribir."},{"type":"say","md":"#### El comando lo corrés vos\nPara crear la épica y el ticket del requirente (a su nombre, buscándolo por email), corré esto en la terminal de Cursor (sin el `!` del principio, que es de Claude Code):\n\n`set -a \u0026\u0026 source ~/.config/arq/.env \u0026\u0026 set +a \u0026\u0026 arq jira PRY-2026-0042 --apply`\n\nYo no lo corro: el `--apply` es tuyo. Si algo falla a mitad de camino, repetilo tal cual; retoma sin duplicar.","source":"inferido","notes":"El momento clave, decilo despacio: el agente nunca corre un --apply. Lo deja armado, con el .env cargado en la misma línea porque arq lee el entorno. Tu control es el dry run y que el comando lo corrés vos."},{"type":"term","cmd":"set -a \u0026\u0026 source ~/.config/arq/.env \u0026\u0026 set +a \u0026\u0026 arq jira PRY-2026-0042 --apply","out":["épica: PLAT-123 (creados 12, existentes 0; descripciones actualizadas: 0; tareas movidas a Done: 2, a En curso: 1)","jsm: PLATHD-7 (creado; labels, participantes y link al día)"],"source":"inferido","notes":"La persona lo corre en la terminal de Cursor y escribe en Jira: inferido, nunca lo ejecutamos. Claves y números inventados; el formato sale del código. Se verifica el conteo «creados» y el ticket.","pause":true,"in":"zsh"},{"type":"term","cmd":"~/.local/bin/arq timebox PRY-2026-0042","out":["vence: 2026-11-04 (en plazo)"],"source":"real","cwd":"~/arq-reviews","notes":"Arranca el plazo: diez días hábiles. Si la fecha comprometida cayera antes, la skill avisa que la revisión está en el camino crítico. Salida real; la fecha depende del día de la captura."},{"type":"tool","label":"Ran · git commit -m \"feat: PRY-2026-0042 registrado, triado y con Jira\"","source":"inferido","notes":"La skill commitea el repo de reviews tras cada paso que cambia el review o escribe en Jira. Es local; el push es de la persona."},{"type":"say","md":"#### Listo\nVerifiqué la salida: la épica **PLAT-123** con 12 issues creados y el ticket del requirente **PLATHD-7**. El review está `triado`, nivel `complejo`, y el plazo quedó fijado.\n\nCada vez que el review cambie (gap check, análisis, firma, cierre) te voy a volver a dar este mismo comando: así Jira muestra lo mismo que git, y las tareas cumplidas pasan a Done. La de abrir el ticket y el plazo pasa en el próximo. Las descripciones no se editan a mano en Jira, se pisan; las notas van en comentarios.\n\nSiguiente: la revisión técnica la hace `arq-architect`.","source":"inferido","notes":"Idea del ciclo: cada cambio del review vuelve a Jira con el mismo comando. Y ahora le toca a la otra skill. Los números son de ejemplo."}]},{"id":"board-de-trabajo","title":"Otro caso: el board de trabajo","subtitle":"Dos boards, y la épica como kanban del equipo con jira-team-kit","screen":"cursor-agent","faq":[{"q":"¿Por qué dos proyectos de Jira y no uno?","a":"Porque son dos conversaciones distintas. El help desk es donde el requirente pregunta y recibe respuestas; el board de trabajo es donde el equipo reparte la revisión. Se configuran en .arq/config.json: jira_project es el board de trabajo y helpdesk_project, el del requirente."},{"q":"¿Dónde queda el kanban local?","a":"En .jira-team-kit/ de la carpeta donde corrés jtk, una carpeta por issue. Con jtk pull se refresca desde Jira."}],"steps":[{"type":"ask","text":"¿Dónde quedó cada cosa en Jira? Y bajame la épica PLAT-123 para repartir las tareas del equipo.","source":"inferido","notes":"La pregunta típica después del primer --apply: hay dos proyectos de Jira, y cada uno tiene su función."},{"type":"say","md":"#### Dos boards, dos funciones\n- **PLATHD, el help desk:** el ticket **PLATHD-7** es la conversación con el requirente. Está a su nombre, el head lo sigue, y ahí van el pedido de información y la devolución.\n- **PLAT, el board de trabajo:** la épica **PLAT-123** divide la revisión en tres historias y ocho sub-tasks para el equipo.\n\nLos une un link «Relates». Para el board de trabajo uso `jira-team-kit`.","source":"inferido","notes":"Así funciona un caso real: un help desk para hablar con quien pide y un board para repartir el trabajo. Claves inventadas."},{"type":"tool","label":"Read · ~/.cursor/skills/jira-team-kit/SKILL.md","source":"inferido","notes":"Entra la skill de Jira del equipo, la del episodio 2. arq-review no la llama: el agente las combina."},{"type":"term","cmd":"jtk pull PLAT-123 --project .","out":["PLAT-123: 12 issues -\u003e ~/arq-reviews/.jira-team-kit/PLAT-123"],"source":"inferido","cwd":"~/arq-reviews","notes":"Solo lee Jira: no abre ventana. Baja la épica, sus historias y sus sub-tasks, una carpeta por issue. Inferido: necesita Jira; el formato sale del código de jtk."},{"type":"say","md":"#### El kanban es del equipo\nQuedó en `.jira-team-kit/PLAT-123/`. Desde ahí se mueven estados, se asignan tareas y se agregan sub-tasks. Vuelven a Jira con `jtk push PLAT-123`: primero el dry run, después la ventana de aprobación.\n\nDos reglas para no pisarse con arq:\n- Las descripciones de la revisión las escribe arq desde el review: las notas van en comentarios.\n- arq no borra lo que no creó: las sub-tasks que agregue el equipo se quedan.","source":"inferido","notes":"arq reconoce sus issues por un ID estable y nunca borra. Cada herramienta escribe con su propio control: arq con tu comando, jira-team-kit con su ventana.","pause":true}]},{"id":"gap-check","title":"Otro caso: el gap check","subtitle":"Qué falta del pedido, y cómo se lo pedimos al requirente","screen":"cursor-agent","faq":[{"q":"¿Cómo decide qué falta?","a":"Contrasta el pedido contra el input mínimo del nivel. El test es simple: cada afirmación tiene que apuntar a un número, un componente, un diagrama o una métrica. Si no, es prosa y cuenta como faltante."},{"q":"¿Por qué no da un veredicto todavía?","a":"Porque con input faltante el CLI se niega a registrarlo. Primero hay que pedir la información; recién con el input completo hay análisis y veredicto."},{"q":"¿Quién le escribe al requirente?","a":"arq-architect redacta el mensaje desde una plantilla, pero publicarlo le toca a arq-manager, con dry run y un comando que corrés vos."},{"q":"¿Y si el requirente no contesta?","a":"El plazo es de 10 días hábiles por defecto. Si vence en esperando-info, el camino es la propuesta de rechazo: el pedido se cierra como rechazado, pero el click en la plataforma lo hace una persona."}],"steps":[{"type":"ask","text":"Hacé el gap check del PRY-2026-0042","source":"inferido","notes":"Un pedido corto que se resuelve con otra skill. Fijate que no mencionamos a arq-architect: el pedido y el estado del review deciden qué skill actúa."},{"type":"tool","label":"Read · ~/.agents/skills/arq-architect/SKILL.md","source":"inferido","notes":"Se carga la skill técnica. Su regla de arranque: trabaja solo en triado, esperando-info o en-analisis. En otro estado lo dice y no avanza."},{"type":"term","cmd":"~/.local/bin/arq show PRY-2026-0042 | head -6","out":["pry: PRY-2026-0042","nombre: Migración del servicio de reportes","contacto: contacto@example.com","head: head@example.com","estado: triado","nivel: complejo"],"source":"real","notes":"Primero el estado: triado, nivel complejo. Es el estado donde le toca a la revisión técnica. Cortamos la salida a seis líneas, con lo que importa acá. Salida real.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq lint","out":["ok: ~/skills/arq-review/contract/constraints.md"],"source":"real","notes":"Antes de revisar, la skill valida el contrato de constraints: las reglas de Arquitectura. arq lo lee, nunca lo reescribe. Salida real.","cwd":"~/arq-reviews"},{"type":"say","md":"#### Gap check\nLeí el pedido, los documentos adjuntos y `minimum-input.md` del nivel `complejo`. **Faltan tres datos**:\n- `cuentas_entornos`: el pedido dice «Producto» y «Datos», pero no qué cuentas y entornos son\n- `flujos_datos`: no hay flujos ni clasificación de la facturación de clientes\n- `rollback`: no hay plan de vuelta atrás ni criterio para activarlo\n\nLo anoto y paso el review a `esperando-info`.","source":"inferido","notes":"Esto es juicio técnico, y por eso lo hace esta skill y no la que coordina. Cada faltante sale del input mínimo, con su ID. Contenido ilustrativo: depende del pedido."},{"type":"term","cmd":"~/.local/bin/arq set PRY-2026-0042 faltantes=cuentas_entornos,flujos_datos,rollback","out":["actualizado: faltantes"],"source":"real","notes":"Solo acepta IDs que existen en el nivel: uno inventado se rechaza ut":["respuesta pública al requirente en PLATHD-7:","","Hola equipo de Producto, gracias por el pedido PRY-2026-0042 (Migración del servicio de reportes).","","Para poder evaluarlo desde Arquitectura necesitamos completar esta información:","","Para llegar al 2026-11-30, primero lo que bloquea esa fecha:","","- Rollback: ¿cómo se vuelve atrás si falla el corte del 30 de noviembre, y qué criterio lo activa?","- Cuentas y entornos: ¿qué cuenta de Producto y qué cuenta de Datos, y en qué entornos se hace el corte?","- Flujos de datos: ¿qué datos de facturación mueve el servicio y cómo están clasificados?","","Por qué lo pedimos: sin estos datos no podemos evaluar el corte entre cuentas ni el tratamiento de la facturación de clientes.","","Pueden responder en este mismo ticket. Mantenemos el pedido abierto hasta el 2026-11-04; si para esa fecha no tenemos la información, lo vamos a cerrar como incompleto y se podrá volver a cargar cuando esté lista.","","Equipo de Arquitectura","","dry run: no se escribió nada. Para ejecutarlo, el usuario corre el mismo comando con --apply (en Claude Code, con !)."],"source":"inferido","cwd":"~/arq-reviews","notes":"El dry run muestra el mensaje exacto. Antes, el CLI controla la plantilla, el PRY y el estado. Inferido: en la demo no existe PLATHD-7 y el comando real se frena antes. El formato sale del código."},{"type":"say","md":"#### Los dos comandos los corrés vos\nSi el mensaje está bien, corré esto en la terminal de Cursor: publica el mensaje y después vuelve a sincronizar la épica, para que muestre los faltantes y pase a Done las tareas cumplidas.\n\n`set -a \u0026\u0026 source ~/.config/arq/.env \u0026\u0026 set +a \u0026\u0026 arq jsm PRY-2026-0042 --file reviews/PRY-2026-0042.jsm.md --public --template jsm-pedido-info.md --apply \u0026\u0026 arq jira PRY-2026-0042 --apply`\n\nEl mismo mensaje no se publica dos veces: si lo repetís, el CLI lo rechaza.","source":"inferido","notes":"Mismo patrón que con la épica. En un pedido real es el paso que más se repite: el requirente contesta y, si falta algo, sale otro pedido.","pause":true}]},{"id":"analisis","title":"Otro caso: el análisis","subtitle":"Con el input completo: opciones, señales y veredicto propuesto","screen":"cursor-agent","faq":[{"q":"¿Por qué solo dos opciones y solo para un componente?","a":"Porque si el original es viable, la Opción 0 es el original y las dos alternativas son solo para el componente más débil. No se reescribe todo el pedido. Si el original no es viable, sí hay dos alternativas completas."},{"q":"¿Puede el agente aprobar o rechazar?","a":"No. Propone un veredicto: aprobar, aprobar con condiciones o rechazar. Lo firma una persona, y el click de Aprobar o Rechazar en la plataforma también."},{"q":"¿Qué son las señales?","a":"Avisos para Cloud, Seguridad y FinOps, del estilo «FinOps podría observar tal cosa, porque tal otra». Nunca un veredicto sobre esos sectores."},{"q":"¿Y si quien firma pide cambios?","a":"El review vuelve a en-analisis, la firma se anula y hay que firmar de nuevo. El veredicto solo se puede cambiar desde en-analisis."}],"steps":[{"type":"ask","text":"El requirente respondió en su ticket con los tres datos. Revisá de nuevo y analizá el PRY-2026-0042","source":"inferido","notes":"Pasaron unos días. El requirente contestó en su ticket, y el agente retoma desde esperando-info, un estado desde el que la skill puede trabajar."},{"type":"term","cmd":"~/.local/bin/arq state PRY-2026-0042 --to en-analisis","out":["estado: en-analisis"],"source":"real","notes":"Con el input completo, el review pasa a en-analisis. Salida real.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq set PRY-2026-0042 faltantes=","out":["actualizado: faltantes"],"source":"real","notes":"Se deja la lista de faltantes vacía: ya no falta nada. Sin esto, el CLI no deja pasar a firma.","cwd":"~/arq-reviews"},{"type":"tool","label":"Edit · reviews/PRY-2026-0042.md","source":"inferido","notes":"Acá se escribe el análisis, siguiendo la plantilla de la skill. Es un archivo de texto del repo de reviews, y se puede leer completo antes de firmar."},{"type":"say","md":"#### Análisis completo\nSeguí el método de la skill. El original es **viable**: ninguna constraint bloqueante queda sin solución.\n- **Componente más débil:** `datos`. El cruce entre cuentas exige un rol asumible [C-IAM-02] y declarar la clasificación de la facturación [C-DAT-01]\n- **Opción 0:** el original, con corte en una ventana el 30 de noviembre\n- **Opción 1:** replicación continua hasta el corte, con ventana mínima y mayor costo\n- **Opción 2:** instantánea cifrada compartida entre cuentas, con ventana más larga y menos esfuerzo\n- **Recomendación:** Opción 1, con condiciones verificables\n- **Señales:** seguridad, cloud y finops, sin veredicto\n\nVeredicto propuesto: **aprobar con condiciones**.","source":"inferido","notes":"Cada afirmación lleva una etiqueta: [pedido], [C-XXX-NN], [supuesto] o [verificar]; ningún número sin etiqueta. Contenido ilustrativo; lo real es el método."},{"type":"term","cmd":"~/.local/bin/arq set PRY-2026-0042 componente_debil=datos senales=seguridad,cloud,finops veredicto=aprobar-con-condiciones","out":["actualizado: componente_debil, senales, veredicto"],"source":"real","notes":"Se registran el componente más débil, las señales y el veredicto propuesto. Si quedara input faltante, el CLI rechazaría el veredicto. Salida real.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq state PRY-2026-0042 --to en-firma","out":["estado: en-firma"],"source":"real","notes":"Pasa a firma. El CLI exige veredicto y nada faltante. Nótese que acá termina el trabajo del agente: no firma.","cwd":"~/arq-reviews"},{"type":"say","md":"#### Listo para firma\nEl review quedó en `en-firma`. Quien firma el nivel `complejo` (el Sr Expert) lo lee completo en `reviews/PRY-2026-0042.md`. Redacté también el mensaje de devolución y el comentario corto para pegar en la plataforma PRY.\n\nLas condiciones están en el review, una por bullet: `arq-manager` crea una sub-task de seguimiento por cada una.","source":"inferido","notes":"Cerrá con el límite: el agente prepara, una persona firma y otra hace el click en la plataforma. La devolución y los seguimientos siguen el mismo patrón de dry run y comando tuyo; están en el showcase de la skill."}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Las guardas de arq: errores que te protegen","screen":"terminal","faq":[{"q":"El agente dice que arq no existe, ¿qué hago?","a":"Es el PATH: ~/.local/bin no está. Pedile que lo agregue a tu ~/.zshrc y abrí una terminal nueva."},{"q":"Creé el token y no entra, ¿por qué?","a":"Casi seguro lo creaste con alcance. Creá otro con el botón «Create API token» a secas."},{"q":"Me dice «el help desk no tiene notas internas»","a":"Estás en el canal software: ahí todo comentario lo ve el requirente. El debate técnico va en la épica, no en el ticket."},{"q":"¿Puedo saltearme un estado para ir más rápido?","a":"No: la máquina de estados no lo permite, y es a propósito. El mensaje te lista las transiciones válidas."}],"steps":[{"type":"term","cmd":"~/.local/bin/arq show PRY-2026-0042","out":["error: no existe ~/reviews/PRY-2026-0042.md: correr `arq new PRY-2026-0042` primero","# exit 1"],"source":"real","notes":"El error más común: estás parado en otra carpeta. arq trabaja sobre la carpeta actual y busca ahí la carpeta de reviews. Se arregla parándote en el repo de reviews, o abriendo Cursor ahí. Salida real.","cwd":"~"},{"type":"term","cmd":"~/.local/bin/arq state PRY-2026-0042 --to cerrado --resultado aprobado","out":["error: transición inválida: en-firma → cerrado; válidas: en-analisis, publicado","# exit 1"],"source":"real","notes":"Saltearse un estado: del estado en que está el review no se puede cerrar. El mensaje lista las transiciones válidas. Pedile al agente arq show para que te diga en cuál está y qué sigue. Salida real.","cwd":"~/arq-reviews"},{"type":"term","cmd":"~/.local/bin/arq state PRY-2026-0042 --to publicado","out":["error: no se puede publicar sin firmante: una persona tiene que firmar la revisión","# exit 1"],"source":"real","notes":"Publicar sin firma: el CLI lo rechaza. Firmar es de una persona. Salida real. El texto menciona el ! de Claude Code; en Cursor, sin el !.","cwd":"~/arq-reviews"},{"type":"term","cmd":"set -a \u0026\u0026 source ~/.config/arq/.env \u0026\u0026 set +a \u0026\u0026 arq jira PRY-2026-0042 --apply","out":["error: faltan variables de entorno: JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN"],"source":"inferido","notes":"Sin credenciales, el comando no escribe nada y lo dice. Que existan no prueba que entren: la prueba es arq ver, de solo lectura. Salida inferida, de la guía de instalación.","cwd":"~/arq-reviews"}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás y lo que sigue","screen":"cursor-agent","faq":[{"q":"¿Esto reemplaza a la plataforma PRY?","a":"No. La plataforma sigue siendo el lugar donde una persona aprueba o rechaza. arq-review lleva la revisión y deja todo en git y en Jira."},{"q":"¿Qué pasa con las skills que me quedaron de la serie?","a":"Siguen instaladas. La serie de Cursor tiene un episodio más, cursor-budget, para cuidar lo que gastás en Cursor; después viene la serie de Claude Code."},{"q":"¿Dónde veo el recorrido completo, con la firma y el cierre?","a":"En el showcase de la skill, que muestra cada etapa. En este episodio vimos las primeras etapas."}],"steps":[{"type":"ask","text":"¿Qué me llevo de arq-review y qué sigue?","source":"inferido","notes":"Cerramos el episodio. La serie de Cursor sigue con uno más: cursor-budget."},{"type":"say","md":"#### Lo que te llevás\n- **Dos skills y un CLI:** `arq-manager` coordina (registro, triage, Jira, plazo, publicación) y `arq-architect` revisa lo técnico. Se instalan juntas y trabajan sobre tu repo de reviews.\n- **Dos boards:** el help desk para hablar con el requirente y el board de trabajo para el equipo, que lo lleva con `jira-team-kit`.\n- **El `--apply` es tuyo:** el agente muestra el dry run y te da el comando para que lo corras vos. No hay ventana de aprobación: tu control es lo que ves antes.\n- **Decide una persona:** el triage, la firma y el click de Aprobar o Rechazar no son del agente.\n\n#### Próximo episodio: cursor-budget\nCuánto estás gastando en Cursor mientras trabajás: un aviso en cada turno y un freno antes de que un modelo caro o un chat largo se coman el ciclo.","source":"inferido","notes":"Las tres ideas de hoy, con la regla que se repite en toda la serie: el agente prepara y la persona aprueba, con una ventana de macOS, un comando tuyo o tu OK en el chat. Anticipá el próximo en una frase: después de tanto agente trabajando, cuánto cuesta y cómo frenarlo a tiempo.","pause":true}]}]},{"id":"cursor-budget","series":"cursor","order":9,"title":"cursor-budget","minutes":[6,12],"pitch":{"ask":"Cargá mi CSV de uso de Cursor y explicame mis settings","does":"Estima el costo de cada turno, te avisa con una notificación cuando un chat, el día, el ciclo o un modelo pasan su límite, y frena el prompt antes de que llegue al modelo si ya llegaste al tope o el modelo está bloqueado."},"skill":{"repo":"cursor-budget","commit":"0530a0a","date":"2026-10-25"},"workspace":{"repo":"mi-servicio","files":["api","web","docs","README.md"],"chats":[{"title":"Revisar el alcance de devoluciones","age":"1d"}]},"chapters":[{"id":"instalar","title":"Instalar","subtitle":"Una línea, una vez por máquina","screen":"terminal","faq":[{"q":"¿Necesito gh?","a":"Sí, o acceso por SSH a GitHub: el repo es interno. brew install gh y gh auth login, una vez."},{"q":"¿Toca mis otros hooks?","a":"No. Suma los suyos y deja los demás; antes de cambiar el archivo guarda una copia .bak."},{"q":"¿Cómo lo actualizo?","a":"Con la misma línea. Reemplaza el programa y respeta tus límites y tu registro."},{"q":"¿Anda en Windows o Linux?","a":"Está hecho para macOS: los avisos son notificaciones de macOS. En Linux registra y frena, pero no avisa."}],"steps":[{"type":"term","cmd":"gh api repos/josefigueredo/cursor-budget/contents/bootstrap.sh -H \"Accept: application/vnd.github.raw\" | bash","out":["copiado en ~/.cursor/budget/app","hook instalado","alias agregado en ~/.zshrc; abrí otra terminal o corré: source ~/.zshrc","statusLine de cursor-agent apuntada a cbudget; cerrá y volvé a abrir cursor-agent para verla","skill: cursor-budget (Cursor, Claude Code, Codex) -\u003e ~/.cursor/budget/app","extensión de Cursor instalada: el gasto aparece en la barra de estado del editor (IDE ↗; si no, Developer: Reload Window)","Mandé una notificación de prueba. Si no la viste, los avisos no te van a llegar: abrí Configuración del Sistema → Notificaciones → Script Editor, activá «Permitir notificaciones» y probá de nuevo con `cbudget notify-test`.","Listo. Abrí una terminal nueva y probá: cbudget report"],"source":"inferido","callouts":[{"kind":"box","match":"hook instalado","text":"dos hooks globales de Cursor"},{"kind":"box","match":"statusLine de cursor-agent apuntada a cbudget","text":"el pie de cursor-agent"},{"kind":"box","match":"extensión de Cursor instalada","text":"la barra del editor"},{"kind":"box","match":"Mandé una notificación de prueba.","text":"¿la viste?"}],"notes":"Una sola línea. gh pone tu sesión de GitHub porque el repo es interno: un curl suelto recibe 404. El instalador copia el programa a su propia carpeta, suma dos hooks a Cursor sin tocar los que ya tenías, agrega el alias cbudget y deja la skill a mano de Cursor, Claude Code y Codex. Además instala dos cosas para ver el gasto sin preguntar: una extensión que lo muestra en la barra de estado del editor de Cursor (en Cursor 3, el botón IDE; la ventana de Agentes no tiene barra), y el pie de cursor-agent, si lo usás. No hay que instalar nada aparte. Al final manda una notificación de prueba: preguntá si la vieron, porque todos los avisos llegan así. Paso inferido: necesita red; la salida es la del instalador real."},{"type":"term","cmd":"python3 -m json.tool ~/.cursor/hooks.json","out":["{","    \"version\": 1,","    \"hooks\": {","        \"stop\": [","            {","                \"command\": \"/usr/bin/python3 ~/.cursor/budget/app/cbudget.py hook\",","                \"timeout\": 10","            }","        ],","        \"beforeSubmitPrompt\": [","            {","                \"command\": \"/usr/bin/python3 ~/.cursor/budget/app/cbudget.py hook\",","                \"timeout\": 10","            }","        ]","    }","}"],"source":"real","cwd":"~","callouts":[{"kind":"box","match":"beforeSubmitPrompt","text":"antes de mandar: puede frenar"},{"kind":"note","text":"**Dos momentos.** Después de cada turno cuenta; antes de cada prompt, decide si pasa."}],"notes":"Esto es todo lo que cambia en Cursor: dos entradas en hooks.json. stop corre al terminar cada turno y anota cuánto costó. beforeSubmitPrompt corre antes de mandar el prompt y puede frenarlo: si frena, no llega al modelo y no cuesta nada. Después de instalar, reiniciá Cursor para que los lea."}]},{"id":"caso-principal","title":"Caso principal","subtitle":"Cargar lo gastado una sola vez, entender las settings y ajustarlas desde el chat","screen":"cursor-full","faq":[{"q":"¿Tengo que bajar el CSV todos los meses?","a":"No. Una sola vez, el día que lo instalás. Después los hooks cuentan cada turno solos, también en los meses que vienen."},{"q":"¿Y si elijo más días de los del mes?","a":"No pasa nada: lo que es de antes del día 1 se ignora."},{"q":"¿Es exacto?","a":"Es una estimación con precios de lista: en lo medido dio ±5% contra la factura. El número que se paga es el de Cursor."},{"q":"¿Puede el agente subirse el presupuesto?","a":"La skill tiene prohibido cambiar algo que no pediste. Igual, cada cambio te llega como notificación y queda anotado con quién lo hizo."},{"q":"¿Por qué no veo la barra con el gasto?","a":"Porque estás en la ventana de Agentes de Cursor 3, que no tiene barra de estado. Tocá IDE, arriba a la derecha: en el editor está abajo a la derecha. Si recién instalaste, recargá la ventana."}],"steps":[{"type":"page","title":"cursor.com/dashboard/usage","source":"inferido","callouts":[{"kind":"note","text":"**Paso 1 de 3.** Abrí `cursor.com/dashboard/usage` en el navegador, con tu cuenta de Cursor."}],"notes":"Esto se hace una sola vez, el día que lo instalás. cursor-budget cuenta desde que lo instalaste y no sabe lo que gastaste antes este mes, así que se lo pasamos desde la página de uso de Cursor. Abrí cursor.com/dashboard/usage en el navegador, con la misma cuenta con la que usás Cursor. La pantalla es una maqueta con datos inventados.","html":"\u003c!doctype html\u003e\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003ctitle\u003ecursor.com/dashboard/usage\u003c/title\u003e\u003cstyle\u003e\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#f6f6f5;color:#1f1f1f;\n font:14px/1.45 -apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Helvetica Neue\",Arial,sans-serif;-webkit-font-smoothing:antialiased}\n.app{display:flex;height:100%}\nnav{width:270px;flex:none;background:#efefee;border-right:1px solid #e3e3e1;padding:14px 10px;display:flex;flex-direction:column;gap:2px}\nnav .back{color:#555;padding:4px 10px 14px;font-size:13.5px}\nnav a{display:block;padding:6px 10px;border-radius:7px;color:#2b2b2b;text-decoration:none;font-size:13.5px}\nnav a.on{background:#e2e2e0;font-weight:500}\nnav .gap{height:14px}\nnav .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;font-size:13px;color:#333}\nnav .av{width:28px;height:28px;border-radius:50%;background:#c9c9c6;display:grid;place-items:center;font-weight:600;color:#fff}\nmain{flex:1;overflow:hidden;padding:34px 60px 0;position:relative}\n.wrap{max-width:1075px}\nh1{font-size:21px;font-weight:500;margin:6px 0 22px}\n.card{background:#fff;border:1px solid #e6e6e4;border-radius:10px;padding:18px 16px}\n.muted{color:#777;font-size:13px}\n.big{font-size:20px;ma extra y, excepcionalmente, otro. Cuando te lo den, decime «me otorgaron el extra» y lo sumo al tope.\n- `cycle_day` **1**: el día en que Cursor reinicia el mes.\n\n**Por modelo**\n- **Presupuesto por modelo:** ninguno todavía.\n- `model_warn` **80%**: cuando un modelo con presupuesto llega al 80%, te aviso.\n- **Modelos bloqueados:** Opus High, xhigh y max, los más caros. Un prompt con ellos no se manda.\n\n**Avisos**\n- `notify_each_turn` **sí**: después de cada turno, una notificación con lo que costó.\n\n**Si un bloqueo te frena y lo necesitás igual:** `cbudget allow --minutes 30` te deja usar Cursor sin los bloqueos del hook durante esos minutos: lo corrés vos, la skill nunca lo corre sola.","source":"inferido","callouts":[{"kind":"underline","match":"cbudget allow --minutes 30"}],"notes":"Recorrelas de arriba abajo. Por chat: el chat largo es lo que más encarece, por eso el aviso a los 2 dólares. Por día: un freno diario. Por mes: el tope del plan, que solo avisa, y el extra que te pueden otorgar. Por modelo: los más caros vienen bloqueados. Y la salida de emergencia: allow --minutes te deja usar Cursor sin los bloqueos del hook un rato, siempre decidido por vos."},{"type":"ask","text":"Subí el tope diario 2 dólares","source":"inferido","notes":"Un cambio, dicho como se lo dirías a una persona."},{"type":"tool","label":"Ran Set block_day to 17 outside sandbox","source":"inferido","callouts":[{"kind":"note","text":"**Fuera del sandbox:** escribe en `~/.cursor/budget`, así que Cursor te pide permiso."}],"notes":"Cursor corre los comandos del agente en un sandbox. Escribir en tu carpeta personal lo saca de ahí y te pide permiso. Es esperable: aceptalo."},{"type":"term","cmd":"python3 ~/.cursor/budget/app/cbudget.py limits set block_day 17","out":["block_day = $17.00"],"source":"real","cwd":"~/mi-servicio","color":true,"notes":"El tope diario era 15: más 2, 17. La skill calcula el valor nuevo y cambia solo ese."},{"type":"term","cmd":"python3 ~/.cursor/budget/app/c tualizá cursor-budget»."},{"kind":"box","match":"el hook ya estaba instalado","text":"tus límites y tu registro no se tocan"}]},{"type":"term","cmd":"python3 ~/.cursor/budget/app/cbudget.py allow --minutes 30","out":["bloqueos levantados hasta las 18:04"],"source":"real","cwd":"~","color":true,"notes":"La salida de emergencia, también desde acá: cbudget allow --minutes 30 te deja usar Cursor sin los bloqueos del hook durante esos minutos: lo corrés vos, la skill nunca lo corre sola.","callouts":[{"kind":"note","text":"**Sin bloqueos del hook por 30 minutos.** Lo decidís vos."}]}]},{"id":"cuando-te-frena","title":"Otro caso: cuando te frena","subtitle":"Comprobaciones determinísticas avanzadas: un modelo bloqueado no llega a costar nada","screen":"terminal","faq":[{"q":"¿Qué frena, además de los modelos bloqueados?","a":"Un modelo que agotó su presupuesto del ciclo, un chat que llegó a $5 y un día que llegó a su tope."},{"q":"¿Y si el hook se rompe?","a":"Deja pasar el prompt. Un freno roto no puede dejarte sin Cursor."},{"q":"¿Por qué el chat caro se frena?","a":"Porque lo que más encarece cada turno es el contexto largo que se reenvía. Un chat nuevo cuesta mucho menos."}],"steps":[{"type":"term","cmd":"echo '{\"hook_event_name\":\"beforeSubmitPrompt\",\"model\":\"claude-opus-5-5-high\",\"conversation_id\":\"c1\"}' | python3 ~/.cursor/budget/app/cbudget.py hook","out":["{\"continue\": false, \"user_message\": \"cursor-budget: el modelo claude-opus-5-5-high est\\u00e1 bloqueado; eleg\\u00ed otro o corr\\u00e9 `cbudget allow`\"}"],"source":"real","cwd":"~","callouts":[{"kind":"box","match":"\"continue\": false","text":"el prompt no se manda"}],"notes":"Esto es una comprobación determinística avanzada de un caso de uso: le damos al hook el mismo evento que le manda Cursor y miramos qué contesta. No hay un modelo de por medio: el resultado es siempre el mismo y no gasta tokens. Esto es lo que pasa por dentro cuando mandás un prompt con Opus High. Cursor le pregunta al hook, y el hook contesta continue false. En el IDE se ve un aviso, «Submission blocked by hook», con este mensaje. El prompt no llega al modelo: costo cero.","color":true},{"type":"term","cmd":"tail -n 1 ~/.cursor/budget/blocks.jsonl","out":["{\"t\": 1792960486, \"conversation_id\": \"c1\", \"model\": \"claude-opus-5-5-high\", \"reason\": \"el modelo claude-opus-5-5-high está bloqueado; elegí otro o corré `cbudget allow`\"}"],"source":"real","cwd":"~","notes":"Cada bloqueo queda anotado, con el modelo y el motivo. Y sale una notificación, porque en la terminal de cursor-agent el mensaje no se ve."},{"type":"term","cmd":"python3 ~/.cursor/budget/app/cbudget.py allow --minutes 30","out":["bloqueos levantados hasta las 18:04"],"source":"real","cwd":"~","callouts":[{"kind":"note","text":"**Lo levantás vos.** La skill nunca corre `allow` por su cuenta."}],"notes":"allow --minutes te deja usar Cursor sin los bloqueos del hook durante esos minutos: modelos bloqueados, tope del chat, tope del día y presupuestos por modelo. Los avisos siguen llegando. Desde el chat: «levantá el bloqueo media hora». Es tu decisión, no la del agente.","color":true},{"type":"term","cmd":"echo '{\"hook_event_name\":\"beforeSubmitPrompt\",\"model\":\"claude-opus-5-5-high\",\"conversation_id\":\"c1\"}' | python3 ~/.cursor/budget/app/cbudget.py hook","out":["{}"],"source":"real","cwd":"~","notes":"Mismo prompt, ahora pasa: el hook contesta vacío y Cursor sigue.","color":true}]},{"id":"presupuesto-por-modelo","title":"Otro caso: presupuesto por modelo","subtitle":"Comprobaciones determinísticas avanzadas: usar Opus a conciencia","screen":"cursor-agent","faq":[{"q":"¿Puedo poner varios?","a":"Sí, uno por patrón: claude-opus-*, auto*, gpt-*. Gana el primero que coincide."},{"q":"¿Cuenta lo que gasté antes?","a":"Con el CSV de Cursor sí, por modelo. Con el monto solo, cuenta desde ese momento."},{"q":"¿Cómo lo quito?","a":"«Sacale el presupuesto a Opus». Corre limits model con --remove."}],"steps":[{"type":"ask","text":"Poné un presupuesto de 40 dólares para Opus en este ciclo","source":"inferido","notes":"Un tope por modelo: avisa al 80% y, al agotarlo, bloquea ese modelo hasta el próximo ciclo. Es otra comprobación determinística avanzada: el tope por modelo se decide con cuentas sobre lo registrado, sin un modelo de por medio."},{"type":"term","cmd":"python3 ~/.cursor/budget/app/cbudget.py limits model 'claude-opus-*' 40","out":["claude-opus-* = $40.00 por ciclo"],"source":"real","cwd":"~/mi-servicio","color":true},{"type":"term","cmd":"python3 ~/.cursor/budget/app/cbudget.py limits check","out":["warning: El patrón 'claude-opus-*' no coincide con ningún modelo usado este ciclo","1 problema(s)"],"source":"real","cwd":"~/mi-servicio","callouts":[{"kind":"box","match":"no coincide con ningún modelo usado este ciclo","text":"un aviso, no un error"}],"notes":"El chequeo avisa que el patrón todavía no coincide con nada usado este ciclo. No es un error: en este ciclo de demo nadie usó Opus. Sirve para atrapar un patrón mal escrito.","color":true},{"type":"say","md":"Listo: **Opus tiene $40 para el ciclo**. Te aviso al 80% y, si lo agota, lo bloqueo hasta el 1 de nov.\n\nEl chequeo da un aviso: todavía no usaste Opus este ciclo, así que `claude-opus-*` no coincide con nada. Si el nombre está bien, no hace falta hacer nada.\n\nSi un día lo necesitás igual: `cbudget allow --minutes 30` te deja usar Cursor sin los bloqueos del hook durante esos minutos: lo corrés vos, la skill nunca lo corre sola.","source":"inferido","callouts":[{"kind":"underline","match":"lo bloqueo hasta el 1 de nov"}],"notes":"Para qué sirve: decidir de antemano cuánto querés gastar en el modelo caro, en vez de enterarte a fin de mes.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los tres tropiezos más comunes","screen":"terminal","faq":[{"q":"Instalé y Cursor no frena ni avisa","a":"Reiniciá Cursor: los hooks se leen al arrancar."},{"q":"El total no coincide con Cursor","a":"Es una estimación. Volvé a cargar el monto de la página de uso."},{"q":"cbudget: command not found","a":"Abrí una terminal nueva: el alias se carga al abrirla."}],"steps":[{"type":"term","cmd":"curl -fsSL https://raw.githubusercontent.com/josefigueredo/cursor-budget/main/bootstrap.sh | bash","out":["curl: (22) The requested URL returned error: 404"],"source":"inferido","callouts":[{"kind":"box","match":"404","text":"el repo es interno: usá gh"}],"notes":"El clásico: copiar un curl de otro lado. El repo es interno y curl no lleva tu sesión, así que da 404. La línea con gh api sí. Paso inferido."},{"type":"term","cmd":"python3 ~/.cursor/budget/app/cbudget.py limits set block_day doce","out":["block_day: esperaba un número, llegó 'doce'","# exit 2"],"source":"real","cwd":"~","notes":"Un valor que no es un número: no cambia nada y dice por qué. Acepta 12, 12,5 o $12.","color":true},{"type":"term","cmd":"python3 ~/.cursor/budget/app/cbudget.py notify-test","out":["Mandé una notificación de prueba. Si no la viste, los avisos no te van a llegar: abrí Configuración del Sistema → Notificaciones → Script Editor, activá «Permitir notificaciones» y probá de nuevo con `cbudget notify-test`."],"source":"real","cwd":"~","callouts":[{"kind":"note","text":"**Sin notificaciones no hay avisos.** Se habilitan una vez, para Script Editor."}],"notes":"notify-test manda una notificación de prueba. Si no la ves, macOS tiene bloqueadas las de Script Editor, que es la app con la que se muestran los avisos.","color":true},{"type":"page","title":"Configuración del Sistema → Notificaciones","source":"inferido","callouts":[{"kind":"note","text":"**Script Editor → Permitir notificaciones**, con **Escritorio** tildado."}],"notes":"Abrí Configuración del Sistema, Notificaciones, y buscá Script Editor. Activá Permitir notificaciones y dejá tildado Escritorio. Después probá otra vez con cbudget notify-test. Captura real de la pantalla de macOS.","pause":true,"html":"\u003c!doctype html\u003e\u0 // Pure navigation over an episode: the global index is the flattened list of
// (chapter card + its steps). No DOM, no state.
// keyAction(KeyboardEvent.key) -> "right" | "left" | "space" | "b" | null: the presenter
// keys, shared by the control and the stage. PageDown/PageUp act as the arrows because
// presentation clickers send them.
var Nav = (function () {
  function flatten(ep) {
    var out = [];
    (ep.chapters || []).forEach(function (ch, i) {
      out.push({chapter: i, step: -1, kind: "card"});
      (ch.steps || []).forEach(function (st, j) {
        out.push({chapter: i, step: j, kind: st.type});
      });
    });
    return out;
  }

  function clamp(ep, i) {
    var last = flatten(ep).length - 1;
    return Math.max(0, Math.min(Math.floor(i) || 0, Math.max(last, 0)));
  }

  function nextChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    for (var k = i + 1; k < flat.length; k++) {
      if (flat[k].step === -1) return k;
    }
    return Math.max(flat.length - 1, 0);
  }

  function prevChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var cur = i;
    while (cur > 0 && flat[cur].step !== -1) cur--;
    if (cur < i) return cur;
    for (var k = i - 1; k >= 0; k--) {
      if (flat[k].step === -1) return k;
    }
    return 0;
  }

  function keyAction(key) {
    if (key === "ArrowRight" || key === "PageDown") return "right";
    if (key === "ArrowLeft" || key === "PageUp") return "left";
    if (key === " " || key === "Spacebar") return "space";
    if (key === "b" || key === "B") return "b";
    return null;
  }

  function position(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var e = flat[i] || {chapter: 0, step: -1};
    var ch = (ep.chapters || [])[e.chapter] || {};
    return {chapter: e.chapter, step: e.step, total: flat.length, chapterTitle: ch.title};
  }

  return {flatten: flatten, clamp: clamp, nextChapter: nextChapter,
          prevChapter: prevChapter, position: position, keyAction: keyAction};
})();

<script>
// Static render of the stage: Render.step(container, episode, index) replaces the
// container's content with the FINISHED state of global index `index` (see nav.js).
// Pure function of (episode, index): nothing is kept between calls.
//
// Screens are laid out for a fixed 1600x900 canvas (.ws-screen); the stage scales it.
// All episode text goes through textContent / createTextNode; `say` markdown is parsed
// into DOM nodes, never assigned as HTML.
//
// Animation hooks (for animate.js, which renders the finished state, hides, reveals):
//   data-step="<j>"      on the root node of every applied step (j = index of the step
//                        inside its chapter). Nothing else carries data-step. Steps may
//                        live in different areas (a cursor-full term with `in: "zsh"`
//                        sits in the zsh panel, approve is an overlay at the end of the
//                        screen root), so document order is not step order: select by value.
//   data-anim="type"     the element holding exactly the text that gets typed
//                        (ask text, term command).
//   data-anim="line"     an output line, a say paragraph / heading / list item; revealed
//                        one at a time.
//   data-anim="node"     tool, worked and approve nodes (and the "▸ Ran · cmd" chip and
//                        the "⏺ Bash(cmd)" line); revealed whole.
//   hidden               an approve step that is not the current index keeps its node
//                        (so the step count holds) but is hidden: the window closed.
//   data-anim="idle"     the wrapper of the waiting prompt (prompt line + "❯ █") at the
//                        end of the terminal and of the cursor-full zsh panel. It is not
//                        a step: hide it while a term step animates, show it at the end.
//
// Prompt clock: every prompt shows Render.now() as HH:MM:SS (local time) in a
// .ws-time span. Render.now defaults to `new Date()`; tests and render-preview replace it
// with a fixed date so the output stays deterministic. The stage refreshes only the idle
// prompt's .ws-time every second (Stage.tickClock); steps are never re-rendered for it.
// Prompt icons (folder, house, clock) are inline SVG built with createElementNS.
// Unmarked descendants of a step root appear with the root; hooks inside one root are
// revealed in document order. Chapter cards carry no hooks and appear whole.
//
// Term placement on cursor-full: by default a term step is the agent's command and
// renders in the conversation exactly as on cursor-agent ("▸ Ran · cmd" chip + output
// block). With `in: "zsh"` it is a command the person types and renders in the
// integrated zsh (prompt, typed command, output lines).
// Callouts: a step's optional `callouts` show only while it is the current index, so they
// leave with the next step. "note" adds a bubble (inline markdown) at the end of the step;
// "box" and "underline" wrap the first text node holding `match` inside the step (with
// `text`, a small tag after it). A `match` that is not found renders nothing.
// The first chapter card also shows the episode pitch («Le decís al agente…» /
// «Y la skill…») under its title; it is part of the card, not a separate index.
// It also shows, under the pitch and as wide as it, the two arrow keys that move between screens: whoever opens
// the episode from its link learns how to move before the first step.
var Render = (function () {
  var USER = "Persona del equipo";
  var TEAM = "Equipo";
  var MODEL = "Sonnet 5.5";  // the chat's model chip, unless the episode names one (workspace.model)
  var BRANCH = "main";

  // ---- DOM helpers (text only) ----
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }
  function stepNode(tag, cls, j, anim) {
    var n = el(tag, cls);
    n.setAttribute("data-step", String(j));
    if (anim) n.setAttribute("data-anim", anim);
    return n;
  }
  function anim(node, kind) { node.setAttribute("data-anim", kind); return node; }
  function dots() {
    return add(el("div", "ws-dots"), el("i", "ws-dot ws-dot-r"), el("i", "ws-dot ws-dot-y"),
               el("i", "ws-dot ws-dot-g"));
  }

                add(el("div", "ws-cc-md"), markdown(st.md)));
      } else if (st.type === "worked") {
        n = add(stepNode("div", "ws-cc-line ws-cc-worked", j, "node"), el("span", "ws-cc-g", "✻ "),
                document.createTextNode(workedText(st)));
      } else if (st.type === "approve") {
        overlays.push(n = approveOverlay(st, j, last));
      } else if (st.type === "page") {
        overlays.push(n = pageOverlay(st, j, last));
      }
      applyCallouts(n, st, j, last);
      if (n && !n.classList.contains("ws-approve") && !n.classList.contains("ws-page")) body.flow.appendChild(n);

    overlays.forEach(function (o) { root.appendChild(o); });
    return root;
  }

  function build(ep, index) {
    var flat = Nav.flatten(ep);
    if (!flat.length) return el("div", "ws-screen ws-empty");
    var e = flat[Nav.clamp(ep, index)];
    if (e.step === -1) return card(ep, e.chapter);
    var ch = ep.chapters[e.chapter];
    if (ch.screen === "cursor-full") return cursorScreen(ep, ch, e.step, true);
    if (ch.screen === "cursor-agent") return cursorScreen(ep, ch, e.step, false);
    if (ch.screen === "claude-code") return claudeCodeScreen(ep, ch, e.step);

  function step(container, ep, index) {
    while (container.firstChild) container.removeChild(container.firstChild);
    container.appendChild(build(ep, index));
    return container.firstChild;
  }

  var api = {step: step, markdown: markdown, clockText: clockText,

  return api;
})();

<script>
// Forward animation of ONE step, plus the playback policy as pure functions.
//
// Animate.run(container, episode, index, opts) -> {cancel(), done: Promise}
//   Renders the finished state with Render.step(container, episode, index), hides the
//   current step's hooks (see render.js header) and reveals them in document order on
//   the injected scheduler, so it looks like the step at `index` playing on top of
//   Render.step(index - 1). Both completion and cancel() end with a fresh
//   Render.step(container, episode, index): the final DOM is identical by construction.
//   `done` resolves in both cases (never rejects). A new run on the same container
//   cancels the previous one first, and a reveal that throws ends the run in the final
//   state too. A page or approve step is the exception: its window holds an iframe that a
//   fresh render would rebuild (blank until it loads again), so when it completes on its
//   own the run only clears the inline styles it set, which leaves the same DOM.
// Animate.stop(container): cancels the active run on `container` without rendering
//   (call it before a static Render.step, e.g. on a back-step).
//   opts: {speed = 1 (clamped to >= 0.1), schedule(fn, ms) -> id = setTimeout,
//          unschedule(id) = clearTimeout, now() = Date.now (accepted, not used: every
//          wait goes through schedule)}.
//
// Timing (every value is divided by speed):
//   type  28 ms per character (code points), the text grows one character per tick
//   line  120 ms per line / say block
//   node  250 ms, then the node appears whole (tool, worked, chips)
//   fade  250 ms for a card, an approve window and a page: opacity 0 until the tick.
//         A page right after a page (or an approve right after an approve) keeps the window
//         on screen and only waits: the browser does not blink between them (continuesWindow).
//   autoplay delay between steps 900 ms
// Animate.stepDuration walks the same plan the animation schedules, so the estimate
// and the playback cannot drift apart.
var Animate = (function () {
  var CHAR_MS = 28;
  var LINE_MS = 120;
  var NODE_MS = 250;
  var FADE_MS = 250;
  var AUTOPLAY_MS = 900;
  var MIN_SPEED = 0.1;

  function speedOf(s) {
    s = Number(s);
    if (!(s > 0)) s = MIN_SPEED;
    return Math.max(s, MIN_SPEED);
  }
  function chars(text) { return Array.from(String(text || "")); }
  function hide(n) { n.style.display = "none"; }
  function show(n) { n.style.display = ""; }

  // True when the step at `index` is a page or approve right after another of the same type
  // in its chapter: the window was already on screen, so it does not fade in again.
  function continuesWindow(ep, index) {
    var flat = Nav.flatten(ep);
    var e = flat[Nav.clamp(ep, index)];
    if (!e || e.step < 1 || (e.kind !== "page" && e.kind !== "approve")) return false;
    return ep.chapters[e.chapter].steps[e.step - 1].type === e.kind;

  // Render the finished state into `container`, hide what the step at `index` adds and
  // return the reveal plan: [{ms, fn}] in order (ms already divided by speed).
  function prepare(container, ep, index, speed) {
    Render.step(container, ep, index);
    var flat = Nav.flatten(ep);
    if (!flat.length) return [];
    var e = flat[Nav.clamp(ep, index)];
    var plan = [];
    var screen = container.firstChild;
    if (e.step === -1) {
      screen.style.opacity = "0";
      plan.push({ms: FADE_MS / speed, fn: function () { screen.style.opacity = "1"; }});
      return plan;
    }
    var root = container.querySelector('[data-step="' + e.step + '"]');
    if (!root) return plan;
    var step = ep.chapters[e.chapter].steps[e.step];
    // The idle prompt lives in the zsh panel (cursor-full) and on the terminal screen: hide
    // it only when this step plays in that same flow, not for a chat-placed agent command.
    // On claude-code, `in: "zsh"` is the person's `!` line and there is no idle prompt, so
    // the lookup below finds nothing.
    if (step.type === "term" && (step["in"] === "zsh" || ep.chapters[e.chapter].screen === "terminal")) {
      var idle = container.querySelector('[data-anim="idle"]');
      if (idle) hide(idle);
    }
    var hooks = [];
    if (root.hasAttribute("data-anim")) hooks.push(root);
    Array.prototype.forEach.call(root.querySelectorAll("[data-anim]"), function (n) { hooks.push(n); });

      var kind = n.getAttribute("data-anim");
      if (kind === "type") {
        var cs = chars(n.textContent);
        n.textContent = "";
        cs.forEach(function (_, k) {
          plan.push({ms: CHAR_MS / speed, fn: function () { n.textContent = cs.slice(0, k + 1).join(""); }});
        });
      } else if (kind === "line") {
        hide(n);
        plan.push({ms: LINE_MS / speed, fn: function () { show(n); }});
      } else if (kind === "node" && (step.type === "approve" || step.type === "page") && n === root) {
        if (continuesWindow(ep, index)) {
          plan.push({ms: FADE_MS / speed, fn: function () {}});
        } else {
          n.style.opacity = "0";
          plan.push({ms: FADE_MS / speed, fn: function () { n.style.opacity = ""; }});
        }
      } else if (kind === "node") {
        hide(n);
        plan.push({ms: NODE_MS / speed, fn: function () { show(n); }});
      }

    if (step.type === "approve" || step.type === "page") {
      plan.finish = function () {
        hooks.forEach(function (n) { if (n.getAttribute("style") === "") n.removeAttribute("style"); });
      };

  var active = typeof WeakMap === "function" ? new WeakMap() : null;
  function getActive(c) { return active ? active.get(c) : c.__wsAnimRun; }
  function setActive(c, r) { if (active) active.set(c, r); else c.__wsAnimRun = r; }
  function clearActive(c, r) {
    if (getActive(c) !== r) return;
    if (active) active.delete(c); else delete c.__wsAnimRun;
  }

  // Cancel any active run on `container` without rendering (its `done` resolves).
  function stop(container) {
    var r = getActive(container);
    if (r) r.abort();
  }

  function run(container, ep, index, opts) {
    opts = opts || {};
    stop(container);
    var speed = speedOf(opts.speed === undefined ? 1 : opts.speed);
    var schedule = opts.schedule || function (fn, ms) { return setTimeout(fn, ms); };
    var unschedule = opts.unschedule || function (id) { clearTimeout(id); };

    var done = new Promise(function (resolve) { resolveDone = resolve; });
    var handle = {cancel: function () { end(true); }, done: done, abort: function () { end(false); }};
    setActive(container, handle);
    var plan = prepare(container, ep, index, speed);

    function end(render) {
      if (finished) return;
      finished = true;
      if (timer !== null) { unschedule(timer); timer = null; }
      clearActive(container, handle);
      if (render) Render.step(container, ep, index);
      resolveDone();
    }
    function next(k) {
      if (finished) return;
      if (k >= plan.length) {
        if (plan.finish) { plan.finish(); end(false); } else end(true);
        return;
      }
      timer = schedule(function () {
        timer = null;
        if (finished) return;
        try {
          plan[k].fn();
        } catch (err) {
          // A broken reveal must not stall playback: jump to the final state.
          if (typeof console !== "undefined") console.error("Animate: reveal failed", err);
          end(true);

  // Sum of the ms the animation of `index` schedules (same plan, detached container).
  function stepDuration(ep, index, speed) {
    var plan = prepare(document.createElement("div"), ep, index, speedOf(speed));

  // What autoplay does after `index` finished animating.
  function autoplay(ep, index, speed) {
    var flat = Nav.flatten(ep);
    var i = Nav.clamp(ep, index);
    if (!flat.length || i >= flat.length - 1) return {stop: true, delay: 0};
    var e = flat[i];
    var steps = ep.chapters[e.chapter].steps || [];
    if (e.step === steps.length - 1) return {stop: true, delay: 0};  // also an empty chapter's card
    if (e.step >= 0 && steps[e.step].pause) return {stop: true, delay: 0};
    return {stop: false, delay: AUTOPLAY_MS / speedOf(speed)};
  }

  // Estimated length: step animations plus autoplay delays (none after a stop).
  function episodeDuration(ep, speed) {
    var flat = Nav.flatten(ep);

    var total = 0;
    flat.forEach(function (e, i) {
      var a = autoplay(ep, i, speed);
      var ms = stepDuration(ep, i, speed) + (a.stop ? 0 : a.delay);

      total += ms;
    });
    return {total: total, chapters: chapters};
  }

  return {run: run, stop: stop, continuesWindow: continuesWindow, stepDuration: stepDuration, autoplay: autoplay, episodeDuration: episodeDuration,

})();
